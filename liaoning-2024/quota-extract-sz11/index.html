":"二、本定额的适用范围:我省行政区域城镇范围内的国有投资或国有投资为主的新建、扩建、改建的市政工程项目以及厂区、庭院内的道路、园林绿化工程。","tables":null,"tables_fixed":null},{"section_id":"GS-003","block_type":"总说明","chapter_code":null,"seq":3,"page":6,"print_page":1,"text":"三、本定额的作用:是国有投资或国有投资为主的建设项目,编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据;是评定投标报价合理性的依据;是调解处理工程造价争议和纠纷、审计和司法鉴定的依据:是编制投资估算指标、概算指标等文件的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","tables":null,"tables_fixed":null},{"section_id":"GS-004","block_type":"总说明","chapter_code":null,"seq":4,"page":6,"print_page":1,"text":"四、本定额是按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-005","block_type":"总说明","chapter_code":null,"seq":5,"page":6,"print_page":1,"text":"五、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"GS-006","block_type":"总说明","chapter_code":null,"seq":6,"page":7,"print_page":2,"text":"六、本定额消耗量和价格的确定:(一)人工工日:1. 本定额人工工日以综合工日表现,是按8 小时工作制编制的,人工等级分普通工(简称普工)、技术工(简称技工)和高级技术工(简称高级工),消耗量包括基本用工、超运距用工、人工幅度差、辅助用工和生产班组组织者用工。2. 本定额人工工日单价分别为:普工110 元,技工170 元,高级工330 元。3. 定额人工费,是指本定额项目综合单价中的人工费、按章节说明规定按系数调整的人工费以及定额中规定调整人工工日数量的人工费。按人工工日数量调整的人工费除章节有规定的工种外,均按普工工资标准调整人工费。(二)材料:1. 本定额采用的建筑材料、成品、半成品均按国家质量标准和相应的设计要求的合格产品考虑的;材料消耗量包括施工中消耗的主要材料、辅助材料、周转性材料和零星材料;材料消耗量包括净用量和损耗量,损耗量包括了施工操作损耗和场内运输、堆放损耗,规范(设计文件) 规定的预留量、搭接量不包括在损耗率中;用量很少、占材料比重很小的零星材料合并为其他材料费,以“元”表示。2. 本定额材料的场内搬运距离按300m 考虑的:设备场内搬运距离为150m。3. 本定额材料价格包括材料供应价(原价)、运杂费、运输损耗、采购保管费。本定额项目中的材料单价均为不含增值税的税前价格。4. 本定额中的周转性材料按不同施工方法、不同材质,计算出摊销量进入定额消耗量。5. 本定额的砂子用量是按含水率为零的干砂计算的。(三)施工机械台班:1. 本定额施工机械台班消耗量是按正常合理的机械配备、机械施工功效确定的,并已考虑了机械幅度差因素。2. 本定额施工机械原值在2000 元以内、使用年限在一年以内的不构成固定资产的小型机械,未列入机械台班消耗量,其费用包括在辽宁省《建设工程费用标准》的工具用具使用费中,其燃料动力消耗量包括在相应定额项目的材料项目内。3. 本定额加工机械、泵类机械、焊接机械及动力机械的操作人工均含在相应定额项目的人工消耗量中。4. 本定额施工机械台班单价是按现行的《施工机械台班费用标准》确定的。","tables":null,"tables_fixed":null},{"section_id":"GS-007","block_type":"总说明","chapter_code":null,"seq":7,"page":8,"print_page":3,"text":"七、本定额砂浆、混凝土除另有规定外,均按预拌或成品编制的,如果采用现场搅拌,拌制增加费按第九册《钢筋工程》相应项目调整。","tables":null,"tables_fixed":null},{"section_id":"GS-008","block_type":"总说明","chapter_code":null,"seq":8,"page":8,"print_page":3,"text":"八、本定额未考虑施工与生产同时进行、有害身体健康的环境中施工时降效增加费,发生时按各册规定计算。","tables":null,"tables_fixed":null},{"section_id":"GS-009","block_type":"总说明","chapter_code":null,"seq":9,"page":8,"print_page":3,"text":"九、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"GS-010","block_type":"总说明","chapter_code":null,"seq":10,"page":8,"print_page":3,"text":"十、本说明未尽事宜,详见各册及章节说明。","tables":null,"tables_fixed":null},{"section_id":"CS-011","block_type":"册说明","chapter_code":null,"seq":11,"page":14,"print_page":1,"text":"一、第十一册《措施项目》(以下简称本册定额) 包括脚手架工程、桥涵工程措施项目、市政管网措施项目、水处理措施项目、特(大)型机械设备进出场及安拆、井点降水排水工程、围堰工程、打拔工具桩、支撑工程、临时设施、冬季施工措施项目共十一章。","tables":null,"tables_fixed":null},{"section_id":"CS-012","block_type":"册说明","chapter_code":null,"seq":12,"page":14,"print_page":1,"text":"二、本册定额中脚手架工程、特(大)型机械设备进出场及安拆、井点降水排水工程、围堰工程、打拔工具桩、支撑工程、临时设施、冬季施工措施项目八章适用于市政各专业工程;桥涵工程措施项目、市政管网措施项目、水处理措施项目三章为专用措施项目。","tables":null,"tables_fixed":null},{"section_id":"CS-013","block_type":"册说明","chapter_code":null,"seq":13,"page":14,"print_page":1,"text":"三、本册定额编制依据:50857-2013;1. 《市政工程工程量计算规范》GB2. 《市政工程消耗量》ZYA1-31-2021第十一册《措施项目》;3. 《建设工程工程量清单计价规范》(GB50500-2013);4. 《辽宁省建设工程计价依据市政工程定额》(2017);5. 国家法律、法规,国家设计规范;6. 有代表性的工程设计施工资料,现行设计规范、施工验收规范、操作规程及标准图集;7. 国家及省、市有关的计价依据、补充定额及有关资料。","tables":null,"tables_fixed":null},{"section_id":"CS-014","block_type":"册说明","chapter_code":null,"seq":14,"page":14,"print_page":1,"text":"四、混凝土发生蒸汽养生时,按实计算。","tables":null,"tables_fixed":null},{"section_id":"CS-015","block_type":"册说明","chapter_code":null,"seq":15,"page":15,"print_page":2,"text":"五、本册说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"ZS-016","block_type":"章说明","chapter_code":"1101","seq":16,"page":18,"print_page":5,"text":"一、本章中木、钢管脚手架已包括斜道及拐弯平台的搭设。","tables":null,"tables_fixed":null},{"section_id":"ZS-017","block_type":"章说明","chapter_code":"1101","seq":17,"page":18,"print_page":5,"text":"二、砌筑物高度超过1.2m可计算脚手架搭拆费用。","tables":null,"tables_fixed":null},{"section_id":"ZS-018","block_type":"章说明","chapter_code":"1101","seq":18,"page":18,"print_page":5,"text":"三、仓面脚手架不包括斜道,若发生另行计算;但采用井字架或吊扒杆运转施工材料时,不再计算斜道费用。无筋或单层布筋的基础和垫层不计算仓面脚手架费。","tables":null,"tables_fixed":null},{"section_id":"ZS-019","block_type":"章说明","chapter_code":"1101","seq":19,"page":18,"print_page":5,"text":"四、仓面脚手架斜道、满堂脚手架执行《房屋建筑与装饰工程定额》相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-020","block_type":"计算规则","chapter_code":"1101","seq":20,"page":19,"print_page":6,"text":"一、脚手架工程量按墙面水平边线长度乘以墙面砌筑高度以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-021","block_type":"计算规则","chapter_code":"1101","seq":21,"page":19,"print_page":6,"text":"二、柱形砌体按图示柱结构外围周长另加3.6m 乘以砌筑高度以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-022","block_type":"计算规则","chapter_code":"1101","seq":22,"page":19,"print_page":6,"text":"三、浇筑混凝土用仓面脚手架按仓面的水平面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-023","block_type":"计算规则","chapter_code":"1101","seq":23,"page":19,"print_page":6,"text":"四、井字架区分材质和搭设高度按搭设数量计算,每座井计算一次。","tables":null,"tables_fixed":null},{"section_id":"JR-024","block_type":"计算规则","chapter_code":"1101","seq":24,"page":20,"print_page":7,"text":"一、　脚手架(编码:041101)1. 　木脚手架计量单位:100m2工作内容:清理场地、搭脚手架,拆除、堆放、材料场内运输。","tables":null,"tables_fixed":null},{"section_id":"ZS-025","block_type":"章说明","chapter_code":"1102","seq":25,"page":30,"print_page":17,"text":"一、本章定额桩基工作平台适用于陆上、支架上打桩及钻孔灌注桩。支架平台分陆上平台与水上平台二类。","tables":null,"tables_fixed":null},{"section_id":"ZS-026","block_type":"章说明","chapter_code":"1102","seq":26,"page":30,"print_page":17,"text":"二、本章项目不包括桩基施工中遇到障碍必须清除的工作,发生时另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-027","block_type":"章说明","chapter_code":"1102","seq":27,"page":30,"print_page":17,"text":"三、组装、拆卸船排项目未包括压舱费用。压舱材料取定为大石块,并按船排总吨位的30%计取(包括装、卸在内150m 的二次运输费)。","tables":null,"tables_fixed":null},{"section_id":"ZS-028","block_type":"章说明","chapter_code":"1102","seq":28,"page":30,"print_page":17,"text":"四、打桩工作平台根据相应的打桩项目打桩机的锤重进行选择。钻孔灌注桩工作平台按孔径ϕ≤1000mm 套用锤重≤2500kg 打桩工作平台;ϕ>1000mm 套用锤重≤5000kg 打桩工作平台。","tables":null,"tables_fixed":null},{"section_id":"ZS-029","block_type":"章说明","chapter_code":"1102","seq":29,"page":30,"print_page":17,"text":"五、搭、拆水上工作平台项目已综合考虑了组装、拆卸船排及组装、拆卸打拔桩机工作内容,不得重复计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-030","block_type":"章说明","chapter_code":"1102","seq":30,"page":30,"print_page":17,"text":"六、陆上、支架上、船上打桩项目均未包括运桩。","tables":null,"tables_fixed":null},{"section_id":"ZS-031","block_type":"章说明","chapter_code":"1102","seq":31,"page":30,"print_page":17,"text":"七、打桩机械场外运输费另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-032","block_type":"章说明","chapter_code":"1102","seq":32,"page":30,"print_page":17,"text":"八、现浇混凝土构件措施项目包括基础、承台、墩(台)帽、墩(台)身、支撑梁及横梁、墩(台)盖梁、拱桥、梁、板、挡墙、小型构件、桥面铺装、桥头搭板、挂篮等。","tables":null,"tables_fixed":null},{"section_id":"ZS-033","block_type":"章说明","chapter_code":"1102","seq":33,"page":30,"print_page":17,"text":"九、现浇混凝土构件措施项目适用于桥涵工程现浇各种混凝土构筑物。","tables":null,"tables_fixed":null},{"section_id":"ZS-034","block_type":"章说明","chapter_code":"1102","seq":34,"page":30,"print_page":17,"text":"十、本章项目均未包括预埋铁件,如设计要求预埋铁件时,执行其他分册相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-035","block_type":"章说明","chapter_code":"1102","seq":35,"page":31,"print_page":18,"text":"十一、承台分有底模及无底模二种,应按不同的施工方法执行本章相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-036","block_type":"章说明","chapter_code":"1102","seq":36,"page":31,"print_page":18,"text":"十二、本章项目模板按部位取定了木模、工具式钢模(除防撞护栏采用定型模外),并结合桥梁实际情况综合了不分部位的复合模板与定型钢模项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-037","block_type":"章说明","chapter_code":"1102","seq":37,"page":31,"print_page":18,"text":"十三、定型钢模板数量包括配件在内,接缝的橡胶板费用已摊入定型钢模板单价中。","tables":null,"tables_fixed":null},{"section_id":"ZS-038","block_type":"章说明","chapter_code":"1102","seq":38,"page":31,"print_page":18,"text":"十四、现浇梁、板等模板项目均已包括铺筑底模内容,但不包括支架部分,如发生时执行本章有关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-039","block_type":"章说明","chapter_code":"1102","seq":39,"page":31,"print_page":18,"text":"十五、挂篮与0 号块扇形支架场外运输费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-040","block_type":"章说明","chapter_code":"1102","seq":40,"page":31,"print_page":18,"text":"十六、桥梁支架不包括底模及地基加固。","tables":null,"tables_fixed":null},{"section_id":"ZS-041","block_type":"章说明","chapter_code":"1102","seq":41,"page":31,"print_page":18,"text":"十七、预制混凝土构件措施定额包括预制梁、柱、板、拱桥构件及小型构件等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-042","block_type":"章说明","chapter_code":"1102","seq":42,"page":31,"print_page":18,"text":"十八、构件预制措施项目适用于现场制作的预制构件。","tables":null,"tables_fixed":null},{"section_id":"ZS-043","block_type":"章说明","chapter_code":"1102","seq":43,"page":31,"print_page":18,"text":"十九、预制构件项目未包括胎、地模,需要时执行本章有关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-044","block_type":"章说明","chapter_code":"1102","seq":44,"page":31,"print_page":18,"text":"二十、预应力桁架梁预制套用桁架拱拱片项目。","tables":null,"tables_fixed":null},{"section_id":"JR-045","block_type":"计算规则","chapter_code":"1102","seq":45,"page":32,"print_page":19,"text":"一、搭拆打桩工作平台面积计算:F =N1F1+N2F21. 桥梁打桩:F1 =(5.5+A+2.5)×(6.5+D)每座桥台(桥墩):F2 = 6.5×[L-(6.5+D)]每条通道:F =N1F1+N2F22. 钻孔灌注桩:F1 =(A+6.5)×(6.5+D)每座桥台(桥墩):F2 = 6.5×[L-(6.5+D)]每条通道:式中:F工作平台总面积;每座桥台(桥墩)工作平台面积;F1桥台至桥墩间或桥墩至桥墩间通道工作平台面积;F2桥台和桥墩总数量;N1通道总数量;N2二排桩之间距离(m);D桥梁跨径或护岸的第一根桩中心至最后一根桩中心之间的距离(m);L桥台(桥墩)每排桩的第一根桩中心至最后一根桩中心之间的距离(m)。A工作平台面积计算示意图","tables":null,"tables_fixed":null},{"section_id":"JR-046","block_type":"计算规则","chapter_code":"1102","seq":46,"page":33,"print_page":20,"text":"二、台与墩或墩与墩之间不能连续施工时(如不能断航、断交通或拆迁工作不能配合),每个墩、台可计一次组装、拆卸柴油打桩架及设备运输费。","tables":null,"tables_fixed":null},{"section_id":"JR-047","block_type":"计算规则","chapter_code":"1102","seq":47,"page":33,"print_page":20,"text":"三、现浇混凝土模板工程量按模板接触混凝土的面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-048","block_type":"计算规则","chapter_code":"1102","seq":48,"page":33,"print_page":20,"text":"四、现浇混凝土墙、板上单孔面积在0.3m2 以内的孔洞洞侧壁模板面积亦不再计算;单孔面积在0.3m2以上时,应予扣除,洞侧壁模板面积并入墙、板模板工程量之内计算。","tables":null,"tables_fixed":null},{"section_id":"JR-049","block_type":"计算规则","chapter_code":"1102","seq":49,"page":33,"print_page":20,"text":"五、桥涵拱盔、支架空间体积计算:1. 桥涵拱盔体积按起拱线以上弓形侧面积乘以(桥宽+2m)计算;2. 桥涵支架体积为结构底到原地面(水上支架为水上支架平台顶面)平均高度乘以纵向距离再乘以(桥宽+2m)计算。","tables":null,"tables_fixed":null},{"section_id":"JR-050","block_type":"计算规则","chapter_code":"1102","seq":50,"page":34,"print_page":21,"text":"六、支架堆载预压按设计要求计算,设计未规定时按支架承载的梁体设计重量乘以系数1.1 计算。","tables":null,"tables_fixed":null},{"section_id":"JR-051","block_type":"计算规则","chapter_code":"1102","seq":51,"page":34,"print_page":21,"text":"七、装配式钢支架定额只含万能杆件摊销量,其使用费(4.00 元/ 吨·天),工程量按每立方米空间体积125kg 计算。","tables":null,"tables_fixed":null},{"section_id":"JR-052","block_type":"计算规则","chapter_code":"1102","seq":52,"page":34,"print_page":21,"text":"八、满堂式钢管支架定额只含搭拆,使用费(4.00 元/ 吨·天),工程量按每立方米空间体积50kg 计算(包括扣件等)。","tables":null,"tables_fixed":null},{"section_id":"JR-053","block_type":"计算规则","chapter_code":"1102","seq":53,"page":34,"print_page":21,"text":"九、0 号块扇形支架安拆工程量按顶面梁宽计算。边跨采用挂篮施工时,其合拢段扇形支架的安拆工程量按梁宽的50%计算。","tables":null,"tables_fixed":null},{"section_id":"JR-054","block_type":"计算规则","chapter_code":"1102","seq":54,"page":34,"print_page":21,"text":"十、挂篮形式为自锚式无压重钢挂篮,钢挂篮重量按设计要求确定。推移工程量按挂篮重量乘以推移距离以吨·米计算。","tables":null,"tables_fixed":null},{"section_id":"JR-055","block_type":"计算规则","chapter_code":"1102","seq":55,"page":34,"print_page":21,"text":"十一、预制混凝土构件模板工程量计算:1. 预制构件中预应力混凝土构件及T 形梁、I 形梁、双曲拱、桁架拱等构件均按模板接触混凝土的面积(包括侧模、底模)计算。2. 灯柱、端柱、栏杆等小型构件按最大平面投影面积计算。3. 预制构件中非预应力构件按模板接触混凝土的面积计算,不包括胎、地模。4. 空心板梁中空心部分,本定额均采用橡胶囊抽拔,其摊销量已包括在项目,不再计算空心部分模板工程量。5. 空心板中空心部分,按模板接触混凝土的面积计算工程量。","tables":null,"tables_fixed":null},{"section_id":"JR-056","block_type":"计算规则","chapter_code":"1102","seq":56,"page":35,"print_page":22,"text":"十二、驳船不包括进出场费。按实结算。","tables":null,"tables_fixed":null},{"section_id":"JR-057","block_type":"计算规则","chapter_code":"1102","seq":57,"page":36,"print_page":23,"text":"一、　桩基1. 　搭、拆桩基础支架平台工作内容:1. 平整场地;2. 铺碎石;3. 碾压等。计量单位:100m2","tables":null,"tables_fixed":null},{"section_id":"ZS-058","block_type":"章说明","chapter_code":"1102","seq":58,"page":86,"print_page":73,"text":"一、本章定额包括现浇混凝土模板工程、预制混凝土模板工程项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-059","block_type":"章说明","chapter_code":"1102","seq":59,"page":86,"print_page":73,"text":"二、模板定额已包括了钢筋垫块和第一层底浆的人工、材料及看模工日,使用时不应重复计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-060","block_type":"章说明","chapter_code":"1102","seq":60,"page":86,"print_page":73,"text":"三、地、胎模和砖、石拱圈的拱盔、支架执行本册第二章“桥涵工程措施项目”相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-061","block_type":"章说明","chapter_code":"1102","seq":61,"page":86,"print_page":73,"text":"四、模板安拆以槽(坑)深3m 为准,超过3m 时,人工乘以系数1.08,其他不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-062","block_type":"章说明","chapter_code":"1102","seq":62,"page":86,"print_page":73,"text":"五、现浇混凝土梁、板、柱、墙的支模高度按3.6m 考虑,支模高度大于3.6m 时,执行本章相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-063","block_type":"章说明","chapter_code":"1102","seq":63,"page":86,"print_page":73,"text":"六、小型构件系指单件体积在0.05m3 以内定额未列出的构件。","tables":null,"tables_fixed":null},{"section_id":"ZS-064","block_type":"章说明","chapter_code":"1102","seq":64,"page":86,"print_page":73,"text":"七、墙帽分矩形墙帽和异形墙帽,矩形墙帽按圈梁考虑,异形墙帽按异形梁考虑。","tables":null,"tables_fixed":null},{"section_id":"JR-065","block_type":"计算规则","chapter_code":"1102","seq":65,"page":87,"print_page":74,"text":"现浇及预制混凝土构件模板按模板与混凝土构件的接触面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-066","block_type":"计算规则","chapter_code":"1102","seq":66,"page":88,"print_page":75,"text":"一、　现浇混凝土模板工程1. 　管、渠道及其他计量单位:100m2工作内容:模板安装、拆除、涂刷隔离剂、清杂物、场内运输等。","tables":null,"tables_fixed":null},{"section_id":"ZS-067","block_type":"章说明","chapter_code":"1102","seq":67,"page":108,"print_page":95,"text":"一、本章定额包括构筑物现浇混凝土与预制混凝土等模板项目。模板分别按钢模钢撑、复合木模木撑、木模木撑区分不同材质分别列项,其中钢模模数差部分采用木模。","tables":null,"tables_fixed":null},{"section_id":"ZS-068","block_type":"章说明","chapter_code":"1102","seq":68,"page":108,"print_page":95,"text":"二、本章定额现浇、预制项目中,均已包括了钢筋垫块或第一层底浆的工、料,及看模工日,套用时不得重复计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-069","block_type":"章说明","chapter_code":"1102","seq":69,"page":108,"print_page":95,"text":"三、池盖板、平板、走道板、悬空板的模板已含模板支架,消耗量综合取定,但当模板支架承重量因现场条件、特殊要求等不能满足模板上部混凝土重量或其它荷载组合时,可根据批准的施工组织设计调整支架消耗量。","tables":null,"tables_fixed":null},{"section_id":"ZS-070","block_type":"章说明","chapter_code":"1102","seq":70,"page":108,"print_page":95,"text":"四、有盖池体(封闭池体)(包括池内壁、隔墙、池盖、无梁盖柱)模板、支架拆除若需通过特定部位预留孔洞运出池外,增加模板、支架的池内及出洞口运输时,可根据批准的施工组织设计另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-071","block_type":"章说明","chapter_code":"1102","seq":71,"page":108,"print_page":95,"text":"五、预制构件模板中未包括地、胎模,发生时执行本册相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-072","block_type":"章说明","chapter_code":"1102","seq":72,"page":108,"print_page":95,"text":"六、模板安拆按槽(坑)深3m 编制的,超过3m 时,人工乘以系数1.08,其他不变。现浇混凝土池壁(隔墙)、池盖、柱、梁、板的模板,支模高度按池底表面以上3.6m 编制,超过3.6m 时,超出部分的工程量另按相应超高项目执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-073","block_type":"章说明","chapter_code":"1102","seq":73,"page":108,"print_page":95,"text":"七、小型构件是指单个体积在0.05m3 以内的构件。地沟盖板模板项目适用于单块体积在0.3m3 内的矩形板;井盖模板项目适用于井口盖板;井室盖板按矩形板项目执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-074","block_type":"章说明","chapter_code":"1102","seq":74,"page":109,"print_page":96,"text":"八、折线池壁按直形池壁和圆形池壁相应项目的平均值计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-075","block_type":"章说明","chapter_code":"1102","seq":75,"page":109,"print_page":96,"text":"九、扶壁柱、小型矩形柱、小梁执行本章“小型构件”项目。","tables":null,"tables_fixed":null},{"section_id":"JR-076","block_type":"计算规则","chapter_code":"1102","seq":76,"page":109,"print_page":96,"text":"一、现浇混凝土构件模板按构件混凝土与模板的接触面以面积计算。不扣除单孔面积0.3m2 以内预留孔洞的面积,洞侧壁模板亦不另行增加。","tables":null,"tables_fixed":null},{"section_id":"JR-077","block_type":"计算规则","chapter_code":"1102","seq":77,"page":109,"print_page":96,"text":"二、预制混凝土构件模板,按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-078","block_type":"计算规则","chapter_code":"1102","seq":78,"page":109,"print_page":96,"text":"三、池壁、池盖后浇带模板工程量按后浇部分混凝土体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-079","block_type":"计算规则","chapter_code":"1102","seq":79,"page":109,"print_page":96,"text":"四、井底流槽按浇筑的混凝土流槽与模板的接触面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-080","block_type":"计算规则","chapter_code":"1102","seq":80,"page":110,"print_page":97,"text":"一、　现浇混凝土模板工程1. 　垫层、基础模板计量单位:100m2工作内容:模板制作、安装、拆除,清理杂物、刷隔离剂、整理堆放、场内运输。","tables":null,"tables_fixed":null},{"section_id":"ZS-081","block_type":"章说明","chapter_code":"1103","seq":81,"page":142,"print_page":129,"text":"一、本章定额适用于人工筑、拆的围堰项目。机械筑、拆的围堰执行第一册《土石方工程》相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-082","block_type":"章说明","chapter_code":"1103","seq":82,"page":142,"print_page":129,"text":"二、本章围堰定额未包括施工期内发生潮汛冲刷后所需的养护工料,如遇特大潮汛发生人力所不能抗拒的损失时,应根椐实际情况,另行处理。","tables":null,"tables_fixed":null},{"section_id":"ZS-083","block_type":"章说明","chapter_code":"1103","seq":83,"page":142,"print_page":129,"text":"三、围堰工程50m 范围以内取土、砂、砂砾,均不计土方、砂、砂砾的材料价格。取50m范围以外的土方、砂、砂砾,应计算土方、砂、砂砾材料的挖、运或外购费用,但应扣除消耗量中土方现场挖运的人工:17.5 工日/ 100m3。消耗量括号中所列黏土数量为取自然土方数量,结算中可按取土的实际情况调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-084","block_type":"章说明","chapter_code":"1103","seq":84,"page":142,"print_page":129,"text":"四、本章定额中的各种木桩、钢桩的打、拔均执行本册相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-085","block_type":"章说明","chapter_code":"1103","seq":85,"page":142,"print_page":129,"text":"五、草袋围堰如使用麻袋、尼龙袋装土围筑,应根据麻袋、尼龙袋的规格调整材料的消耗量,但人工、机械应按规定执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-086","block_type":"章说明","chapter_code":"1103","seq":86,"page":142,"print_page":129,"text":"六、围堰施工中若未使用驳船,而是搭设了栈桥,则应扣除定额中驳船费用而执行相应的脚手架项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-087","block_type":"章说明","chapter_code":"1103","seq":87,"page":142,"print_page":129,"text":"七、围堰尺寸的取定:1. 土草围堰的堰顶宽为1~2m,堰高为4m 以内。2. 土石混合围堰的堰顶宽为2m,堰高为6m 以内。3. 圆木桩围堰的堰顶宽为2~2.5m,堰高5m 以内。4. 钢桩围堰的堰顶宽为2.5~3m,堰高6m 以内。5. 钢板桩围堰的堰顶宽为2.5~3m,堰高6m 以内。6. 竹笼围堰竹笼间粘土填心的宽度为2~2.5m,堰高5m 以内。7. 木笼围堰的堰顶宽度为2.4m,堰高为4m 以内。","tables":null,"tables_fixed":null},{"section_id":"ZS-088","block_type":"章说明","chapter_code":"1103","seq":88,"page":143,"print_page":130,"text":"八、筑岛填心项目是指在围堰围成的区域内填土、砂及砂砾石。","tables":null,"tables_fixed":null},{"section_id":"ZS-089","block_type":"章说明","chapter_code":"1103","seq":89,"page":143,"print_page":130,"text":"九、双层竹笼围堰竹笼间黏土填心的宽度超过2.5m,则超出部分执行筑岛填心项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-090","block_type":"章说明","chapter_code":"1103","seq":90,"page":143,"print_page":130,"text":"十、施工围堰的尺寸按有关设计施工规范确定。堰内坡脚至堰内基坑边缘距离根椐河床土质及基坑深度而定,但不得小于1m。","tables":null,"tables_fixed":null},{"section_id":"JR-091","block_type":"计算规则","chapter_code":"1103","seq":91,"page":143,"print_page":130,"text":"一、围堰工程分别按体积和长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-092","block_type":"计算规则","chapter_code":"1103","seq":92,"page":143,"print_page":130,"text":"二、以体积计算的围堰,工程量按围堰的施工断面乘以围堰中心线的长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-093","block_type":"计算规则","chapter_code":"1103","seq":93,"page":143,"print_page":130,"text":"三、以长度计算的围堰,工程量按围堰中心线的长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-094","block_type":"计算规则","chapter_code":"1103","seq":94,"page":143,"print_page":130,"text":"四、围堰高度按施工期内的最高临水面加0.5m 计算。","tables":null,"tables_fixed":null},{"section_id":"JR-095","block_type":"计算规则","chapter_code":"1103","seq":95,"page":144,"print_page":131,"text":"一、　土草围堰工作内容:清理基底,50m 范围内的取、装、运土,草袋装土、封包运输,堆筑、填土夯实,拆除清理。计量单位:100m3","tables":null,"tables_fixed":null},{"section_id":"ZS-096","block_type":"章说明","chapter_code":"1106","seq":96,"page":154,"print_page":141,"text":"一、特、大型机械设备安拆费包括施工机械、设备在现场进行安装拆卸所需人工、材料、机械和试运转费用以及机械辅助设施的折旧、搭设、拆除等费用。1. 机械安拆费是安装、拆卸的一次性费用。2. 机械安拆费中包括机械安装完毕后的试运转费用。3. 柴油打桩机的安拆费中,已包括轨道的安拆费用。","tables":null,"tables_fixed":null},{"section_id":"ZS-097","block_type":"章说明","chapter_code":"1106","seq":97,"page":154,"print_page":141,"text":"二、特、大型机械设备进出场费包括施工机械、设备整体或分体自停放地点往返施工现场的运输、装卸、辅助材料等费用。1. 进出场费中包括往返一次的费用。2. 起重量10t 以内汽车式起重机,不计取场外开行费;10t 以外汽车式起重机,每进出场一次的场外开行费按其台班单价的25%计算。3. 机械运输路途中的台班费,不另计取。","tables":null,"tables_fixed":null},{"section_id":"JR-098","block_type":"计算规则","chapter_code":"1106","seq":98,"page":155,"print_page":142,"text":"一、特、大型机械设备安拆费按台次计算。","tables":null,"tables_fixed":null},{"section_id":"JR-099","block_type":"计算规则","chapter_code":"1106","seq":99,"page":155,"print_page":142,"text":"二、特、大型机械设备进出场费按台次计算。","tables":null,"tables_fixed":null},{"section_id":"JR-100","block_type":"计算规则","chapter_code":"1106","seq":100,"page":156,"print_page":143,"text":"一、　特、大型机械每安装、拆卸一次费用工作内容:拆除:自使用状态逐件拆下并整理堆放成运输状态。安装:将运至现场各部件组装成整体,试运转至使用状态。计量单位:台次","tables":null,"tables_fixed":null},{"section_id":"ZS-101","block_type":"章说明","chapter_code":"1107","seq":101,"page":164,"print_page":151,"text":"一、本章定额适用于地下水位较高的粉砂土、砂质粉土、粘质粉土或淤泥质夹薄层砂性土的地层。","tables":null,"tables_fixed":null},{"section_id":"ZS-102","block_type":"章说明","chapter_code":"1107","seq":102,"page":164,"print_page":151,"text":"二、井点降水:轻型井点、喷射井点、大口径井点、深井井点的采用由施工组织设计确定。一般情况下,降以内采用相应的喷射井点,特殊情况下可选用大口径井点及深水深度6m 以内采用轻型井点,6m 以上30m井井点。井点使用时间按施工组织设计确定。喷射井点消耗量包括两根观察孔制作,喷射井管包括了内管和外管,井点材料使用摊销量中已包括井点拆除时的材料损耗量。井点(管)间距根椐地质和降水要求由施工组织设计确定。","tables":null,"tables_fixed":null},{"section_id":"ZS-103","block_type":"章说明","chapter_code":"1107","seq":103,"page":164,"print_page":151,"text":"三、井点降水过程中,如需提供资料,则水位监测和资料整理费用另计。","tables":null,"tables_fixed":null},{"section_id":"ZS-104","block_type":"章说明","chapter_code":"1107","seq":104,"page":164,"print_page":151,"text":"四、井点降水成孔过程中产生的泥浆水处理及挖沟排水工作应另行计算。遇有天然水源可用时,不计水费。","tables":null,"tables_fixed":null},{"section_id":"ZS-105","block_type":"章说明","chapter_code":"1107","seq":105,"page":164,"print_page":151,"text":"五、井点降水必须保证连续供电,在电源无保证的情况下,使用备用电源的费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-106","block_type":"章说明","chapter_code":"1107","seq":106,"page":164,"print_page":151,"text":"六、抽水结束时回填大口井的人工和材料未包括在消耗量内,实际发生时应另行计算。","tables":null,"tables_fixed":null},{"section_id":"JR-107","block_type":"计算规则","chapter_code":"1107","seq":107,"page":165,"print_page":152,"text":"一、轻型井点、喷射井点、大口径井点:轻型井点50 根为一套,喷射井点30 根为一套,大口径井点以10根为一套;井点的安装、拆除以“10 根”计算;井点使用的单位为“套·天”,累计根数不足一套按一套计算。","tables":null,"tables_fixed":null},{"section_id":"JR-108","block_type":"计算规则","chapter_code":"1107","seq":108,"page":165,"print_page":152,"text":"二、深井井点:井点的安装、拆除以“座”计算,井点使用的计量单位为“座·天”。","tables":null,"tables_fixed":null},{"section_id":"JR-109","block_type":"计算规则","chapter_code":"1107","seq":109,"page":165,"print_page":152,"text":"三、井点使用一天按24h 计算。","tables":null,"tables_fixed":null},{"section_id":"JR-110","block_type":"计算规则","chapter_code":"1107","seq":110,"page":166,"print_page":153,"text":"一、　轻型井点工作内容:安装:井管装配,地面试管,铺总管,装、拆水泵,钻机安、拆,钻孔沉管,灌砂封口,连接,试抽。计量单位:见表拆除:拔管,拆管,灌砂,清洗整理,堆放。使用:抽水,值班,井管堵漏。","tables":null,"tables_fixed":null},{"section_id":"ZS-111","block_type":"章说明","chapter_code":"1110","seq":111,"page":182,"print_page":169,"text":"一、本章定额适用于市政各专业册的打、拔工具桩。","tables":null,"tables_fixed":null},{"section_id":"ZS-112","block_type":"章说明","chapter_code":"1110","seq":112,"page":182,"print_page":169,"text":"二、本章所指的水上作业,是以距岸线1.5m 以外或者水深在2m 以上的打拔桩。距岸线1.5m 以内时,水深在1m 以内者,按陆上作业考虑;如水深在1m 以上2m 以内者,其工程量则按水、陆各50%计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-113","block_type":"章说明","chapter_code":"1110","seq":113,"page":182,"print_page":169,"text":"三、水上打拔工具桩按二艘驳船捆扎成船台作业,驳船捆扎和拆除费用按本册相应项目执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-114","block_type":"章说明","chapter_code":"1110","seq":114,"page":182,"print_page":169,"text":"四、打拔工具桩均以直桩为准,如遇打斜桩(斜度≤1:6,包括俯打、仰打)按相应项目人工、机械乘以系数1.35。","tables":null,"tables_fixed":null},{"section_id":"ZS-115","block_type":"章说明","chapter_code":"1110","seq":115,"page":182,"print_page":169,"text":"五、导桩及导桩夹木的制作、安装、拆除,已包括在相应项目中。","tables":null,"tables_fixed":null},{"section_id":"ZS-116","block_type":"章说明","chapter_code":"1110","seq":116,"page":182,"print_page":169,"text":"六、圆木桩按疏打编制。钢板桩按密打编制,如钢板桩需要疏打时,执行相应人工乘以系数1.05。","tables":null,"tables_fixed":null},{"section_id":"ZS-117","block_type":"章说明","chapter_code":"1110","seq":117,"page":182,"print_page":169,"text":"七、打拔桩架90 度调面及超运距移动已综合考虑。","tables":null,"tables_fixed":null},{"section_id":"ZS-118","block_type":"章说明","chapter_code":"1110","seq":118,"page":182,"print_page":169,"text":"八、竖、拆柴油打桩机架费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-119","block_type":"章说明","chapter_code":"1110","seq":119,"page":182,"print_page":169,"text":"九、钢板桩和木桩的防腐费用等,已包括在其它材料费用中。","tables":null,"tables_fixed":null},{"section_id":"ZS-120","block_type":"章说明","chapter_code":"1110","seq":120,"page":182,"print_page":169,"text":"十、打桩根椐桩入土深度不同土壤类别所占比例,分别执行相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-121","block_type":"章说明","chapter_code":"1110","seq":121,"page":182,"print_page":169,"text":"十一、水上打拔工具桩如发生水上短驳,另行计算。","tables":null,"tables_fixed":null},{"section_id":"JR-122","block_type":"计算规则","chapter_code":"1110","seq":122,"page":183,"print_page":170,"text":"一、圆木桩:按设计桩长L(检尺长)查《木材、立木材积速算表》以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-123","block_type":"计算规则","chapter_code":"1110","seq":123,"page":183,"print_page":170,"text":"二、钢板桩:打、拔桩按设计图纸数量或施工组织设计数量以质量计算,钢板桩使用费= 设计使用量×使用天数×使用费标准(4.00 元/ (吨·天))。","tables":null,"tables_fixed":null},{"section_id":"JR-124","block_type":"计算规则","chapter_code":"1110","seq":124,"page":183,"print_page":170,"text":"三、凡打断、打弯的桩,均需拔除重打,但不重复计算工程量。","tables":null,"tables_fixed":null},{"section_id":"JR-125","block_type":"计算规则","chapter_code":"1110","seq":125,"page":183,"print_page":170,"text":"四、如需计算竖、拆打拔桩架费用,竖、拆打拔桩架次数,按施工组织设计规定计算。如无规定时,按打桩的进行方向:双排桩每100 延长米、单排桩每200 延长米计算一次,不足一次者均计算一次。","tables":null,"tables_fixed":null},{"section_id":"JR-126","block_type":"计算规则","chapter_code":"1110","seq":126,"page":184,"print_page":171,"text":"一、　竖、拆简易打拔桩架计量单位:架次工作内容:准备工作,安、拆桩架及配套机具,打、拔缆风桩,铺走道板,埋拆地垄。","tables":null,"tables_fixed":null},{"section_id":"ZS-127","block_type":"章说明","chapter_code":"1111","seq":127,"page":200,"print_page":187,"text":"一、本章定额适用于沟槽、基坑、工作坑、检查井及大型基坑的支撑。","tables":null,"tables_fixed":null},{"section_id":"ZS-128","block_type":"章说明","chapter_code":"1111","seq":128,"page":200,"print_page":187,"text":"二、挡土板间距不同时,不作调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-129","block_type":"章说明","chapter_code":"1111","seq":129,"page":200,"print_page":187,"text":"三、除槽钢挡土板外,本章定额均按横板、竖撑计算;如采用竖板、横撑时,其人工工日乘以系数1.20。","tables":null,"tables_fixed":null},{"section_id":"ZS-130","block_type":"章说明","chapter_code":"1111","seq":130,"page":200,"print_page":187,"text":"四、本章定额中挡土板支撑按槽坑两侧同时支撑挡土板考虑,支撑面积为两侧挡土板面积之和,支撑宽度为4.1m 以内。如槽坑宽度超过4.1m 时,其两侧均按一侧支挡土板考虑,按槽坑一侧支撑挡土板面积计算时,工日数乘系数1.33,除挡土板外,其它材料乘以系数2.0。","tables":null,"tables_fixed":null},{"section_id":"ZS-131","block_type":"章说明","chapter_code":"1111","seq":131,"page":200,"print_page":187,"text":"五、放坡开挖不得再计算挡土板,如遇上层放坡、下层支撑则按实际支撑面积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-132","block_type":"章说明","chapter_code":"1111","seq":132,"page":200,"print_page":187,"text":"六、钢桩挡土板中的槽钢桩按设计数量以质量计算,执行本册相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-133","block_type":"章说明","chapter_code":"1111","seq":133,"page":200,"print_page":187,"text":"七、如采用井字支撑时,按疏撑乘以系数0.61。","tables":null,"tables_fixed":null},{"section_id":"JR-134","block_type":"计算规则","chapter_code":"1111","seq":134,"page":201,"print_page":188,"text":"一、大型基坑支撑安装及拆除工程量按质量计算,其余支撑工程按支撑面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-135","block_type":"计算规则","chapter_code":"1111","seq":135,"page":201,"print_page":188,"text":"二、大型基坑支撑使用费=设计使用量×使用天数×使用费标准(4.00 元/ (吨·天))。","tables":null,"tables_fixed":null},{"section_id":"JR-136","block_type":"计算规则","chapter_code":"1111","seq":136,"page":202,"print_page":189,"text":"一、　木挡土板计量单位:100m2工作内容:制作、运输、安装、拆除,堆放指定地点。","tables":null,"tables_fixed":null},{"section_id":"ZS-137","block_type":"章说明","chapter_code":"1112","seq":137,"page":210,"print_page":197,"text":"一、本章定额包括措施项目中的地面硬覆盖,现场临时围挡、大门,临时建筑,临时管线四个部分。","tables":null,"tables_fixed":null},{"section_id":"ZS-138","block_type":"章说明","chapter_code":"1112","seq":138,"page":210,"print_page":197,"text":"二、本章定额均为临时性建筑设施,不适合永久性建筑设施。","tables":null,"tables_fixed":null},{"section_id":"ZS-139","block_type":"章说明","chapter_code":"1112","seq":139,"page":210,"print_page":197,"text":"三、本定额临时建筑包括办公用房、库房、宿舍、食堂、卫生间等,临时建筑含电气照明系统。","tables":null,"tables_fixed":null},{"section_id":"ZS-140","block_type":"章说明","chapter_code":"1112","seq":140,"page":210,"print_page":197,"text":"四、本定额未含临时设施的基础、地面及抹灰工程,如发生,套用其它章节相应定额。","tables":null,"tables_fixed":null},{"section_id":"ZS-141","block_type":"章说明","chapter_code":"1112","seq":141,"page":210,"print_page":197,"text":"五、临时围挡面板采用彩钢板,如采用不同材料,材料可以代换,人工、机械不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-142","block_type":"章说明","chapter_code":"1112","seq":142,"page":210,"print_page":197,"text":"六、临时围挡项目可选用整体围挡,也可将围挡柱、支撑及面板分别计算工程量,按本节相应项目执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-143","block_type":"章说明","chapter_code":"1112","seq":143,"page":210,"print_page":197,"text":"七、临时钢柱定额适用于施工现场临时大门的钢柱及门上钢横梁。","tables":null,"tables_fixed":null},{"section_id":"ZS-144","block_type":"章说明","chapter_code":"1112","seq":144,"page":210,"print_page":197,"text":"八、本定额材料使用量为摊销量。","tables":null,"tables_fixed":null},{"section_id":"ZS-145","block_type":"章说明","chapter_code":"1112","seq":145,"page":210,"print_page":197,"text":"九、本定额人工、材料费含安装脚手架及摊销材料周转维护费。","tables":null,"tables_fixed":null},{"section_id":"JR-146","block_type":"计算规则","chapter_code":"1112","seq":146,"page":211,"print_page":198,"text":"一、地面硬覆盖,按覆盖面积乘以覆盖厚度以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-147","block_type":"计算规则","chapter_code":"1112","seq":147,"page":211,"print_page":198,"text":"二、现场整体临时围挡,按安装垂直投影以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-148","block_type":"计算规则","chapter_code":"1112","seq":148,"page":211,"print_page":198,"text":"三、分解计算的临时围挡及临时大门,钢结构柱、支撑部分按整体用钢量以重量计算;砖柱部分按砌筑量以体积计算;围挡面板、门扇按垂直投影以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-149","block_type":"计算规则","chapter_code":"1112","seq":149,"page":211,"print_page":198,"text":"四、临时建筑按安装尺寸以建筑面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-150","block_type":"计算规则","chapter_code":"1112","seq":150,"page":211,"print_page":198,"text":"五、临时管线,按敷设长度按延长米计算;临时配电箱以台计算。","tables":null,"tables_fixed":null},{"section_id":"JR-151","block_type":"计算规则","chapter_code":"1112","seq":151,"page":212,"print_page":199,"text":"一、　地面硬覆盖计量单位:10m3工作内容:铺设(摊铺)、找平、碾压;浇筑、捣固、养护、抹平。","tables":null,"tables_fixed":null},{"section_id":"ZS-152","block_type":"章说明","chapter_code":"1113","seq":152,"page":230,"print_page":217,"text":"一、工程冬期施工措施项目是根据冬期施工常规施工方法、施工方案综合确定的。","tables":null,"tables_fixed":null},{"section_id":"ZS-153","block_type":"章说明","chapter_code":"1113","seq":153,"page":230,"print_page":217,"text":"二、本章适用连续5 天平均气温低于5℃搭设暖棚法施工的建筑、市政桥梁工程,采用临时锅炉或暖风机供热方式进行供暖,添加外加剂施工方法。","tables":null,"tables_fixed":null},{"section_id":"ZS-154","block_type":"章说明","chapter_code":"1113","seq":154,"page":230,"print_page":217,"text":"三、暖棚搭设的骨料按摊销量进入定额,保温材料及辅助材料按实际使用量一次性摊销。","tables":null,"tables_fixed":null},{"section_id":"ZS-155","block_type":"章说明","chapter_code":"1113","seq":155,"page":230,"print_page":217,"text":"四、供暖系统安装与拆除:锅炉购置按5 次摊销,供热管道以摊销量进入定额;管道保温按一次摊销量进入定额;散热设备按光排管散热器现场制作安装一次性摊销进入。","tables":null,"tables_fixed":null},{"section_id":"ZS-156","block_type":"章说明","chapter_code":"1113","seq":156,"page":230,"print_page":217,"text":"五、供热设施运行费:按照暖棚实际面积每100m2 每天消耗的燃料、动力用电、人工用量进入。","tables":null,"tables_fixed":null},{"section_id":"ZS-157","block_type":"章说明","chapter_code":"1113","seq":157,"page":230,"print_page":217,"text":"六、本章定额包括的工作内容:1. 暖棚搭设:暖棚骨架搭设,保温材料与保护材料绑扎,上述设施的拆除。2. 供暖系统:临时锅炉场内搬运与安装,临时管道安装与保温,散热设备安装,临时锅炉附属设备安装,上述设施拆除。3. 锅炉运行:上煤,除灰,暖棚温度检查,监视锅炉运行压力等。4. 照明系统:临时照明灯具安装,临时电力电缆、电线安装,以及拆除。5. 人工、机械降效:适用于暖棚法施工工程运输机械产生降效,以及暖棚内材料二次搬运等。","tables":null,"tables_fixed":null},{"section_id":"ZS-158","block_type":"章说明","chapter_code":"1113","seq":158,"page":230,"print_page":217,"text":"七、本章定额未包括内容:低温环境中施工发生的人工与机械降效、除雪、冬期施工增加的劳保用品,混凝土增加的覆盖物,砂石加热。上述费用包括在《建设工程费用标准》的冬季施工费中。","tables":null,"tables_fixed":null},{"section_id":"ZS-159","block_type":"章说明","chapter_code":"1113","seq":159,"page":231,"print_page":218,"text":"八、在建筑围护结构已封闭的建筑物内施工与建筑工程配套的室内装饰装修工程、采暖工程、给排水工程、电气工程、通风空调工程、消防工程等不受室外温度影响,不计取冬期施工增加费。","tables":null,"tables_fixed":null},{"section_id":"ZS-160","block_type":"章说明","chapter_code":"1113","seq":160,"page":231,"print_page":218,"text":"九、钢结构工程与机电设备安装工程在冬期施工,如需焊缝加热,执行通用安装工程相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-161","block_type":"计算规则","chapter_code":"1113","seq":161,"page":231,"print_page":218,"text":"一、暖棚搭设:分暖棚墙体搭设与棚顶搭设,按实际搭设暖棚墙与棚顶的外表面积以面积计算工程量。","tables":null,"tables_fixed":null},{"section_id":"JR-162","block_type":"计算规则","chapter_code":"1113","seq":162,"page":231,"print_page":218,"text":"二、混凝土外加剂:根据确定的施工方案,混凝土需要加入的外加剂种类,实际温度,执行相应定额项目,按每立方米混凝土为计量单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-163","block_type":"计算规则","chapter_code":"1113","seq":163,"page":231,"print_page":218,"text":"三、供热系统安装与拆除:临时锅炉、暖风机安装与拆除费用按套为计量单位,其设备价值分5 次摊销另计;供热管道、光排管散热器以“10m”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-164","block_type":"计算规则","chapter_code":"1113","seq":164,"page":231,"print_page":218,"text":"四、供热设施费:按暖棚搭设的底面积,以“100 天”为计量单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-165","block_type":"计算规则","chapter_code":"1113","seq":165,"page":231,"print_page":218,"text":"五、照明设施安装与拆除:按暖棚搭设的底面积,以“100m2”为计量单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-166","block_type":"计算规则","chapter_code":"1113","seq":166,"page":231,"print_page":218,"text":"六、人工、机械降效:按冬期施工实际完成的工程量的人工和机械费分别乘以相应的降效系数计算。","tables":null,"tables_fixed":null},{"section_id":"JR-167","block_type":"计算规则","chapter_code":"1113","seq":167,"page":232,"print_page":219,"tex const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => (v==null||v==="") ? "—" : (typeof v==="number" ? v.toLocaleString("zh-CN",{maximumFractionDigits:4}) : v);
const num2 = v => (v==null) ? "—" : Number(v).toFixed(2);
const H3B = {pass:["b-green","通过"], fail:["b-red","超差"], skip_unmatched:["b-amber","未匹配"], unmatched:["b-amber","未匹配"], skip_nomat:["b-gray","免核"], nomat:["b-gray","免核"]};
const h3badge = st => { const b=H3B[st]||H3B.nomat; return `<span class="badge ${b[0]}">${b[1]}</span>`; };

// 已放大章注册：items 表章码 -> 区块表章码（须先于顶部统计卡定义）
const AMP_SEC = Object.fromEntries(DATA.chapters.filter(c=>c.six_layer_status==="全六层已放大").map(c=>[c.chapter_code, c.chapter_code.slice(2)]));

const pageImgUrl = p => "pages/P" + p + ".jpg";

/* ---------------- 人工核对清单（四类待办，行可点击看子目详情） ---------------- */
const REVIEW = (() => {
  const it = c => DATA.items.find(x=>x.item_code===c);
  const fail = [], unmatched = [], units = [], mids = [];
  (DATA.h3_review||[]).forEach(h=>{
    const d = JSON.parse(h.detail||"{}");
    if(h.status==="fail")
      fail.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:`书印材料费 ${num2(d.declared)} ≠ 价格库反推 ${num2(d.calc)}（差 ${num2(d.diff)}）`, act:"需人工对价"});
    else if(h.status==="skip_unmatched")
      unmatched.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:(d.note||"材料未匹配")+"："+(d.missing||[]).map(m=>`${m.name}(${m.unit||""})`).join("、"), act:"需补价格库"});
  });
  (DATA.issues||[]).forEach(i=>{
    if(i.review_status==="confirmed") return; // 人工已确认（out/manual_confirm.json overlay）
    const m = (i.descr||"").match(/子目\s*(\d+-\d+)/);
    const code = m && it(m[1]) ? m[1] : null;
    if(i.itype==="单位存疑")
      units.push({code, page:i.page, text:i.descr, act:"单位待确认", src:i.source, itype:i.itype});
    else if(i.severity==="mid")
      mids.push({code, page:i.page, text:(i.itype?`[${i.itype}] `:"")+(i.descr||""), act:i.source==="toc"?"目录层":(i.source+"章抽取"), src:i.source, itype:i.itype||null});
  });
  return {fail, unmatched, units, mids};
})();
const REVIEW_TOTAL = REVIEW.fail.length + REVIEW.unmatched.length + REVIEW.units.length + REVIEW.mids.length;

/* ---------------- 风险核销（localStorage 持久化 + 导出 manual_confirm 兼容 JSON） ---------------- */
const rkey = (cat, r) => cat + "|" + (r.code||"") + "|" + (r.page??"") + "|" + String(r.text||"").length + "|" + String(r.text||"").slice(0,16);
const DONE = (()=>{ try{ return JSON.parse(localStorage.getItem("qtx_done_v1")||"{}"); }catch(e){ return {}; } })();
const KEY2REC = {};
const saveDone = () => { try{ localStorage.setItem("qtx_done_v1", JSON.stringify(DONE)); }catch(e){} };
// 人工定价记录（缺价反推工作台）：{ "材料名|单位": {build_price, note, date} }
const PCONF = (()=>{ try{ return JSON.parse(localStorage.getItem("qtx_price_v1")||"{}"); }catch(e){ return {}; } })();
const savePConf = () => { try{ localStorage.setItem("qtx_price_v1", JSON.stringify(PCONF)); }catch(e){} };
const pk = (m,u) => m+"|"+(u||"");
function doneStats(){
  const c = {fail:0, unmatched:0, unit:0, mid:0};
  Object.values(DONE).forEach(v=>{ if(c[v.cat]!=null) c[v.cat]++; });
  return c;
}
function refreshCounts(){
  const ds = doneStats();
  const left = {fail:REVIEW.fail.length-ds.fail, unmatched:REVIEW.unmatched.length-ds.unmatched,
    unit:REVIEW.units.length-ds.unit, mid:REVIEW.mids.length-ds.mid};
  const totalLeft = left.fail+left.unmatched+left.unit+left.mid;
  const card = $("#cards").children[3];
  if(card){
    card.querySelector(".n").textContent = totalLeft;
    card.querySelector(".t").innerHTML = `待人工核对<br>H3超差${left.fail} · 未匹配${left.unmatched} · 单位存疑${left.unit} · 疑点${left.mid}`;
  }
  const tn = document.querySelector('.tnode[data-id="review"] .cnt');
  if(tn) tn.textContent = totalLeft;
}
function reviewCount(code){
  const pre = itemPrefix(code);
  return REVIEW.fail.concat(REVIEW.unmatched, REVIEW.units, REVIEW.mids).filter(r=>r.code && r.code.startsWith(pre)).length;
}

const S = {
  sec: d => d ? JSON.parse(d) : null,
  sectionsBy(type, ch){ return DATA.sections.filter(s=>s.block_type===type && (ch===undefined || (s.chapter_code||null)===ch)); },
  tocBy(code){ return DATA.toc.filter(t=>t.chapter_code===code); },
  itemsByNode(nodeId){ return DATA.items.filter(i=>i.node_id===nodeId); },
  chapter(code){ return DATA.chapters.find(c=>c.chapter_code===code); },
};
/* 册级说明块类型卷自适应：房建卷为「总说明」，安装卷为「册说明」 */
const GS_TYPE = DATA.sections.some(s=>s.block_type==="总说明") ? "总说明" : "册说明";

/* ---------------- 章节树 ---------------- */
const CH13="0113", CH17="0117";
const secChToCode = k => Object.keys(AMP_SEC).find(c=>AMP_SEC[c]===k);
const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：sz11=11-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

/* ---------------- 内容渲染 ---------------- */
const main = () => $("#main");
function show(id){
  if(id.startsWith("item:")){ return openItem(id.slice(5)); }
  if(id==="gs"){ return viewSections(GS_TYPE, S.sectionsBy(GS_TYPE), extraGS); }
  if(id==="mj"){ return viewSections("建设工程建筑面积计算规范", S.sectionsBy("规范")); }
  if(id==="toc"){ return viewToc(); }
  if(id==="price"){ return viewPrice(); }
  if(id==="mix"){ return viewMix(); }
  if(id==="derive"){ return viewDerive(); }
  if(id==="errata"){ return viewErrata(); }
  if(id==="findings"){ return viewFindings(); }
  if(id==="issues"){ return viewIssues(); }
  if(id==="review"){ return viewReview(); }
  if(id==="fb17"){ return viewSections("第十七章 附表（样板）", S.sectionsBy("附表").filter(s=>!s.chapter_code)); }
  if(id.startsWith("ch:")){ return viewChapter(id.slice(3)); }
  if(id.startsWith("layer:")){ const p=id.split(":"); return viewLayer(p[1], p[2]); }
}

function secBlock(s, open){
  const tb = S.sec(s.tables), tbf = S.sec(s.tables_fixed);
  let tbs = "";
  if(tb){
    tbs += `<table class="tbl">${tb.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>
    <div class="sec-bd">${esc(s.text)}${tbs}</div></div>`;
}
function bindSecs(){ document.querySelectorAll(".sec-hd").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open"))); }

  const r = DATA.rules;
  const lt = r.labor_tiers, daj = r.day_adjust_default;
  let tierHtml;
  if(lt){
    tierHtml = `<div class="it"><div class="k">人工三档（元/工日）</div><div class="v">普工 ${lt["普工"]} · 技工 ${lt["技工"]} · 高级工 ${lt["高级工"]}</div></div>
      <div class="it"><div class="k">溯源</div><div class="v">${esc(r.labor_tiers_src)}（总说明第六条）</div></div>`;
  } else {
    tierHtml = `<div class="it"><div class="k">人工三档</div><div class="v">${esc(r.labor_tiers_note||"本册册说明未设人工三档条款")}</div></div>`;
  }
  let dajHtml;
  if(daj){
    dajHtml = `<div class="it"><div class="k">工日调整默认档</div><div class="v">${esc(daj.tier)} ${daj.price} 元</div></div>
      <div class="it"><div class="k">例外</div><div class="v">${esc(daj.exception)}</div></div>`;

  }
  return `<div class="panel"><h2>计价口径（官方溯源）</h2>
    <div class="kv">${tierHtml}${dajHtml}</div></div>`;
}
function viewSections(title, list, pre){
  main().innerHTML = (pre?pre():"") + `<div class="panel"><h2>${esc(title)}（${list.length} 条）</h2>${list.map(s=>secBlock(s)).join("")}</div>`;
  bindSecs();
}

function viewToc(){
  const rows = DATA.toc.map(t=>{
    const lv = t.level==="章行" ? `<span class="badge b-blue">章</span>` : t.level==="规则行" ? `<span class="badge b-gray">规则</span>` : "";
    return `<tr><td class="num">${t.seq}</td><td>${lv}</td><td>${esc(t.raw_line)}</td>
      <td>${esc(t.ref_kind||"—")}</td><td class="num">${t.ref_print_page??"—"}</td><td class="num">${t.ref_physical_page??"—"}</td><td class="num">${t.toc_page}</td></tr>`;
  }).join("");
  main().innerHTML = `<div class="panel"><h2>目录（P${DATA.meta.toc_pages[0]}-${DATA.meta.toc_pages[1]}，共 ${DATA.toc.length} 行 · ${DATA.chapters.length} 章 · ${DATA.toc.filter(t=>t.level==="规则行").length} 规则行）</h2>
    <div class="note">目录区页脚印独立起号；目录行引用页码为正文印刷页（物理页 = 印刷页 + ${DATA.meta.offset}）。附录材料价格见「价格库 · 附表」。</div>
    <div class="filter"><input id="tq" placeholder="过滤目录行…" style="width:260px"></div>
    <table class="tbl" id="tocT"><thead><tr><th class="num">seq</th><th>级</th><th>原文行</th><th>指向</th><th class="num">印刷页</th><th class="num">物理页</th><th class="num">所在页</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $("#tq").addEventListener("input", e=>{
    const kw = e.target.value.trim();
    document.querySelectorAll("#tocT tbody tr").forEach(tr=>{
      tr.style.display = !kw || tr.innerText.includes(kw) ? "" : "none";
    });

function viewChapter(code){
  const c = S.chapter(code);
  const toc = S.tocBy(code);
  const secCh = AMP_SEC[code];
  const its = DATA.items.filter(i=>i.chapter_code===code);
  const info = `<div class="panel"><h2>${esc(c.chapter_no||"")} ${esc(c.name)}（${code}）</h2>
    <div class="kv">
      <div class="it"><div class="k">起始物理页 / 印刷页</div><div class="v">P${c.start_page} / ${c.start_print}</div></div>
      <div class="it"><div class="k">目录·说明页</div><div class="v">${c.toc_ref_sm?`印 ${c.toc_ref_sm} → P${c.toc_ref_sm+DATA.meta.offset}`:"—"}</div></div>
      <div class="it"><div class="k">目录·计算规则页</div><div class="v">${c.toc_ref_rule?`印 ${c.toc_ref_rule} → P${c.toc_ref_rule+DATA.meta.offset}`:"—"}</div></div>
      <div class="it"><div class="k">六层状态</div><div class="v"><span class="badge ${secCh?"b-green":"b-gray"}">${secCh?"全六层已放大":"目录已定位·待放大"}</span></div></div>
      ${secCh?`<div class="it"><div class="k">本章待人工核对</div><div class="v"><span data-go="review" style="cursor:pointer;color:var(--accent);text-decoration:underline">${reviewCount(code)} 条 · 点击查看清单</span></div></div>`:""}
      ${c.note?`<div class="it"><div class="k">结构备注</div><div class="v">${esc(c.note)}</div></div>`:""}
    </div>
    ${secCh?`<div class="note">本层内容见左侧六层子节点：<b>章节说明 / 计算规则 / 附表 / 定额子目 / 子目附注</b>。子目 ${its.length} 条已过 H1~H4 恒等式校验。</div>`:
      `<div class="note">待放大章。下方为该章目录预览（节/子目行含正文印刷页引用），供逐章放大时定位。</div>`}
  </div>`;
  const rows = toc.map(t=>{

      <td>${esc(t.ref_kind||"—")}</td><td class="num">${t.ref_print_page??"—"}</td><td class="num">${t.ref_physical_page??"—"}</td><td class="num">${t.toc_page}</td></tr>`;

    <table class="tbl"><thead><tr><th class="num">seq</th><th>原文行</th><th>指向</th><th class="num">印刷页</th><th class="num">物理页</th><th class="num">所在页</th></tr></thead><tbody>${rows||'<tr><td colspan="6">无</td></tr>'}</tbody></table></div>`;
  main().querySelectorAll("[data-go='review']").forEach(el=>el.addEventListener("click",()=>show("review")));
}

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

function viewNotes(secCh){
  const pre = itemPrefix(secChToCode(secCh));
  const rows = [];
  Object.entries(DATA.details).forEach(([code,d])=>{
    if(!code.startsWith(pre)) return;
    (d.notes||[]).forEach(n=>{
      rows.push({code, n, rules:(n.rules||[])});
    });
  });
  main().innerHTML = `<div class="panel"><h2>子目附注（${rows.length} 条 · 已解析为换算规则）</h2>

function openItem(code){
  const i = DATA.items.find(x=>x.item_code===code);
  const d = DATA.details[code]||{};
  const v = d.validate||{};
  const hd = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent)">${esc(i.item_code)}</span>
    <b style="font-size:16px">${esc(i.name)}</b><span class="badge b-gray">${esc(i.category||"")}</span>
    <span class="badge b-blue">单位 ${esc(i.unit)}</span>
    <span class="badge b-gray">P${i.page}/印${i.print_page}</span>
    ${PAGEIMG.has(i.page)?`<span class="rbtn" id="ibimg" title="弹出原文页面图核对">🖼 原文页</span>`:""}
    <span class="badge ${v.H1&&v.H1.ok?"b-green":"b-red"}">H1 基价恒等</span>
    <span class="badge ${v.H2&&v.H2.ok?"b-green":"b-red"}">H2 人工三档</span>
    ${h3badge(i.h3_status)}
    <span class="badge ${v.H4&&v.H4.ok?"b-green":"b-gray"}">H4 ${v.H4&&v.H4.ok?"通过":"不适用"}</span>
    ${i.errata_status==="hit"?`<span class="badge b-blue" title="该子目被官方勘误覆盖，erratas 表双值留痕">勘误覆盖</span>`:""}
    <button class="x" id="mx">✕</button></div>`;
  const p4 = `<div class="price4">
    <div class="it total"><div class="k">基价</div><div class="v">${num2(i.base_price)}</div></div>
    <div class="it"><div class="k">人工费</div><div class="v">${num2(i.labor_cost)}</div></div>
    <div class="it"><div class="k">材料费</div><div class="v">${num2(i.material_cost)}</div></div>
    <div class="it"><div class="k">机械费</div><div class="v">${num2(i.machine_cost)}</div></div>
    <div class="it"><div class="k">综合费用</div><div class="v">${num2(i.combined_cost)}</div></div></div>`;
  const tbl = (title, rows, cols) => rows.length ? `<h3>${title}（${rows.length}）</h3>
    <table class="tbl"><thead><tr>${cols.map(c=>`<th${c.n?' class="num"':''}>${c.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td${c.n?' class="num"':''}>${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
  const h2d = v.H2 && v.H2.ok ? `<div class="note">H2 对账：${v.H2.days} 工日 × 三档配比 → ${num2(v.H2.calc)} 元（三档配比 ${JSON.stringify(v.H2.tiers||{})}，当期人工单价 ${v.H2.rate} 元/工日）</div>` : "";
  let h3d = "";
  if(d.h3){
    const dt = d.h3.detail||{};
    if(d.h3.status==="fail") h3d = `<div class="warn">H3 超差：书印材料费 ${num2(dt.declared)} ≠ 价格库反推 ${num2(dt.calc)}（差 ${num2(dt.diff)}）。<b>需人工对价</b>——左侧「🔍 人工核对」清单可定位同类条目。</div>`;
    if(d.h3.status==="skip_unmatched"||d.h3.status==="unmatched") h3d = `<div class="warn">H3 跳过·未匹配：${esc(dt.note||"")}。缺价材料：${(dt.missing||[]).map(m=>`${esc(m.name)}(${esc(m.unit||"")})`).join("、")||"—"}，需补价格库后自动复检转通过。</div>`;
    if(d.h3.status==="skip_nomat"||d.h3.status==="nomat") h3d = `<div class="note">H3 跳过·免核：${esc(dt.note||"")}（不含材料子目）。</div>`;
  }
  const wcBlk = i.work_content
    ? `<div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa)"><b>工作内容</b>（计价主要参考）：${esc(i.work_content)}</div>`
    : "";
  const notes = (d.notes||[]).map(n=>`<div class="note">▪ ${esc(n.text)}</div>`).join("");
  let errd = "";
  if(i.errata_status==="hit"){
    const es = (DATA.erratas||[]).filter(e=>{
      try{ return (JSON.parse(e.item_codes||"[]")||[]).includes(code); }catch(_){ return false; }

    if(es.length) errd = `<div class="warn">⚠ <b>官方勘误覆盖</b>（库内保留原文值，overlay 双值留痕）：${es.map(e=>`${esc(e.errata_type||"")} ${esc(e.wrong_text||"")} → <b>${esc(e.correct_text||"")}</b>（勘误号 ${esc(e.errata_id)}，印${e.printed_page??"?"}）`).join("<br>")}</div>`;
  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("材料消耗", d.materials||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("机械消耗", d.machines||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));
}

function viewDerive(){
  const G = DATA.price_derive||[], IT = DATA.price_derive_items||[], FL = DATA.price_derive_fails||[];
  const badge = g => {
    const mine = PCONF[pk(g.material, g.unit)];
    if(g.review_status==="confirmed") return `<span class="badge b-green">✅已确认${g.build_price!=null?" "+num2(g.build_price):""}</span>`;
    if(mine) return mine.materialize
      ? `<span class="badge b-green">⚡已入库 ${num2(mine.build_price)}·${mine.source==="官方配比"?"官方配比":"反推"}</span>`
      : `<span class="badge b-green">✍已定价 ${num2(mine.build_price)}（待导出）</span>`;
    if((g.conclusion||"").includes("待人工确认")) return `<span class="badge b-amber">待人工确认</span>`;
    if((g.conclusion||"").includes("离散")) return `<span class="badge b-red">离散·须分条</span>`;
    return `<span class="badge b-blue">可直接建库</span>`;
  };
  const catOf = g => g.review_status==="confirmed" ? "confirmed"
    : (g.conclusion||"").includes("离散") ? "multi"
    : (g.conclusion||"").includes("待人工确认") ? "round" : "single";
  const stTxt = {ambiguous:"同名多价行·匹配器拒判", multi:"同子目缺价材料≥2项，差额无法唯一拆分",
    no_qty:"缺价行无消耗量", negative:"已知合计>书印材料费（疑似匹配误命中）",
    no_material_cost:"子目无书印材料费", no_missing:"无未匹配行（状态不一致，留痕）"};
  const nConf = G.filter(g=>g.review_status==="confirmed").length;
  const nPriced = G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; }).length;
  const nMat = G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize).length;
  const cats = [["all","全部",G.length],["cand","库内有近似",G.filter(g=>(g.candidates||[]).length).length],
    ["single","单一价",G.filter(g=>catOf(g)==="single").length],
    ["round","舍入级·待确认",G.filter(g=>catOf(g)==="round").length],
    ["multi","离散分条",G.filter(g=>catOf(g)==="multi").length],
    ["priced","已定价待导出",nPriced],["mat","⚡已入库反推",nMat],
    ["confirmed","已确认回库",nConf],["fails","无法反推",FL.length]];
  main().innerHTML = `<div class="panel"><h2>💰 缺价反推 · 定价工作台（${G.length} 种材料 · 子目溯源 ${IT.length} 条 · 无法反推 ${FL.length} 条）</h2>
    <div class="note"><b>未匹配为何这么多（查验结论）</b>：全书价格附表共 ${DATA.stats.mat_prices} 条，半成品混合料（水泥砂浆/胶泥/灰土/玛蹄脂…）与市场化材料（龙骨/亚克力字/窗帘…）为选择性收录——属实、非漏配；匹配器带防误伤设计（单位一致门、同名多价拒判）${DATA.manual_findings&&DATA.manual_findings.some(f=>/玛蹄脂/.test(f.subject||""))?`，如石油沥青玛蹄脂库内为 kg 与消耗 m³ 不一致而正确拒配（已立案 manual_findings）`:""}。<br>
    <b>审核通路</b>：① 每组点 <b>✍ 定价</b>（弹窗内可比对<b>库内近似候选</b>与反推溯源明细，单位错配标红）→ ② 顶部 <b>⬇ 导出核价记录</b> 下载 JSON → ③ 将 rules 数组 merge 进 <code>out/price_confirm.json</code> 重跑 build_db → 组状态转 ✅已确认、build_price 覆盖 → ④ 向 material_prices 补录该价后相关子目 H3 自动复检转 pass。</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-d="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <input id="dqq" placeholder="过滤：材料/子目编号…" style="width:200px">
      <span class="rbtn" id="export-price" title="下载 price_confirm.json 兼容格式，merge 回 out/price_confirm.json 后重跑 build_db 生效">⬇ 导出核价记录（${nPriced}）</span></div>
    <div id="dbody"></div></div>`;
  const candBadge = g => {
    const cs = g.candidates||[];
    if(!cs.length) return `<span class="badge b-gray">无近似</span>`;
    const um = cs.some(c=>c.unit_match);
    return `<span class="rbtn" data-cand="${esc(g.material)}" data-cu="${esc(g.unit||"")}" title="${esc(cs.map(c=>c.name+"("+c.unit+") "+num2(c.price)).join("； "))}">🔍近似 ${cs.length}${um?"":""}</span>`;
  };
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{d:"all"}}).dataset.d;
    const kw = $("#dqq").value.trim();
    let list = cat==="all"||cat==="fails" ? G.slice() : cat==="cand" ? G.filter(g=>(g.candidates||[]).length)
      : cat==="priced" ? G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; })
      : cat==="mat" ? G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize)
      : G.filter(g=>catOf(g)===cat);
    if(kw) list = list.filter(g => g.material.includes(kw) || (JSON.parse(g.item_codes||"[]")).some(c=>c.includes(kw)));
    const body = list.map((g,i)=>{
      const rng = g.price_min===g.price_max ? num2(g.price_min) : num2(g.price_min)+" ~ "+num2(g.price_max);
      const sug = g.review_status==="confirmed" && g.build_price!=null ? num2(g.build_price)+"（人工定价）" : num2(g.suggested_price);
      const det = IT.filter(r=>r.material===g.material && r.unit===g.unit);
      const detRows = det.map(r=>`<tr class="clickable" data-item="${esc(r.item_code)}">
        <td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
        <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc(r.item_name||"")}</td>
        <td>${esc((S.chapter(r.chapter_code)||{}).name||r.chapter_code||"—")}</td>
        <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td>
        <td class="num">${num2(r.known)}</td><td class="num">${num2(r.remain)}</td></tr>`).join("");
      const priced = PCONF[pk(g.material,g.unit)];

      const v = parseFloat($("#pd-price").value);

      PCONF[pk(g.material,g.unit)] = {"build_price":v, "materialize":!!mat,
        "note":$("#pd-note").value.trim() || (mat?"一键入库·反推价":""), "date":new Date().toISOString().slice(0,10)};
      savePConf(); $("#mask").classList.remove("show"); paint(); refreshCounts();
    };

    $("#pd-mat").addEventListener("click",()=>doSave(true));
    $("#pd-clear").addEventListener("click",()=>{ $("#mask").classList.remove("show"); });
  };
  $("#export-price").addEventListener("click",()=>{
    const rules = Object.entries(PCONF).map(([k,v])=>{
      const i=k.lastIndexOf("|"); return {"material":k.slice(0,i), "unit":k.slice(i+1),
        "build_price":v.build_price, "materialize":!!v.materialize, "note":v.note||"",
        "confirmed_by":"爪哥（前端定价工作台）", "date":v.date||""};
    });
    if(!rules.length){ alert("尚未定价——先在各组「✍定价」录入后再导出。"); return; }
    const blob = new Blob([JSON.stringify({"rules":rules}, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "price_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });

    document.querySelectorAll("#main .chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));

  paint();
}

  const nConf = (DATA.issues||[]).filter(i=>i.review_status==="confirmed").length;
  main().innerHTML = `<div class="panel"><h2>🔍 待人工核对清单（${REVIEW_TOTAL} 条）</h2>
    <div class="note"><b>H3超差</b>=材料费书印值与价格库反推不符，须人工对价；<b>材料未匹配</b>=缺价材料，补价格库后自动复检转通过；<b>单位存疑</b>=抽取单位与常规口径不符，须回看原文；<b>其他中风险</b>=抽取过程登记的中风险疑点。<b>点击行</b>弹出子目详情；<b>🖼 原文</b>弹出该页书页图直接比对；核对无误点 <b>核销</b>（单位存疑可在核销时直接改单位值）。${nConf?`<br>✅ 另有 <b>${nConf}</b> 条已人工确认（记录于 out/manual_confirm.json overlay）。`:""}</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-c="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <span class="chip on" id="hdchip" title="已核销行默认隐藏，点此切换显示">隐藏已核销</span>
      <input id="rq" placeholder="过滤：编号/关键字…" style="width:200px">
      <span class="rbtn" id="expbtn" title="导出已核销记录（manual_confirm.json 兼容格式，merge 后重跑 build_db 生效 overlay）">⬇ 导出核销记录</span></div>
    <div id="rbody"></div></div>`;
  let hideDone = true;
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{c:"all"}}).dataset.c;
    const kw = $("#rq").value.trim();
    const pick = {fail:REVIEW.fail, unmatched:REVIEW.unmatched, unit:REVIEW.units, mid:REVIEW.mids};
    let list = cat==="all"
      ? [...REVIEW.fail.map(r=>["fail",r]), ...REVIEW.unmatched.map(r=>["unmatched",r]),
         ...REVIEW.units.map(r=>["unit",r]), ...REVIEW.mids.map(r=>["mid",r])]
      : pick[cat].map(r=>[cat,r]);
    if(kw) list = list.filter(([c,r]) => (r.code||"").includes(kw) || (r.text||"").includes(kw));
    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;
    const shown = list.filter(([c,r]) => !(hideDone && DONE[rkey(c,r)])).slice(0,500);
    KEY2REC_CLEAR();
    const row = (cat, r) => {
      const key = rkey(cat, r);
      KEY2REC[key] = {cat, r};
      const done = DONE[key];
      const clk = r.code ? ` data-item="${esc(r.code)}"` : "";
      const imgBtn = (r.page && PAGEIMG.has(r.page))
        ? `<span class="rbtn" data-img="${r.page}" data-code="${esc(r.code||"")}">🖼 原文</span>`
        : `<span class="note" style="font-size:11px">无图</span>`;
      const act = done
        ? `<span class="rdone-mark">✅已核销</span> <span class="rbtn" data-undo="${esc(key)}">撤销</span>`
        : `<span class="rbtn" data-done="${esc(key)}" data-cat="${cat}">核销</span>`;
      return `<tr${clk} class="${done?"rdone":""}"><td><span class="badge ${badge[cat]}">${label[cat]}</span></td>
        <td style="font-family:var(--mono)">${esc(r.code||"—")}</td>
        <td class="num">${r.page??"—"}</td><td>${esc(r.text)}</td><td>${esc(r.act||"")}</td>
        <td style="white-space:nowrap">${imgBtn}</td><td style="white-space:nowrap">${act}</td></tr>`;
    };
    $("#rbody").innerHTML = `<table class="tbl"><thead><tr><th>类别</th><th>子目</th><th class="num">物理页</th><th>详情</th><th>处置</th><th>原文</th><th>操作</th></tr></thead><tbody>
      ${shown.map(([c,r])=>row(c,r)).join("") || '<tr><td colspan="7">无匹配</td></tr>'}</tbody></table>
      <div class="note">命中 ${list.length} 条 · 待核销 ${hidden} 条${list.length>500?"（仅渲染前 500，请用过滤缩小范围）":""}。核销记录存于浏览器 localStorage（键 qtx_done_v1），「⬇ 导出核销记录」可下载 JSON 供回库。</div>`;
    document.querySelectorAll("#rbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{
        if(ev.target.closest("[data-done],[data-undo],[data-img]")) return;
        openItem(tr.dataset.item);
      });
    });
    document.querySelectorAll("#rbody [data-img]").forEach(el=>{
      el.addEventListener("click", ()=>showPageImg(+el.dataset.img, el.dataset.code||""));
    });
    document.querySelectorAll("#rbody [data-undo]").forEach(el=>{
      el.addEventListener("click", ()=>{ delete DONE[el.dataset.undo]; saveDone(); paint(); refreshCounts(); });
    });
    document.querySelectorAll("#rbody [data-done]").forEach(el=>{
      el.addEventListener("click", ()=>openDoneDialog(el.dataset.done, el.dataset.cat));
    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){
    const rec = KEY2REC[key]; if(!rec) return;
    const r = rec.r;
    const it = r.code ? DATA.items.find(x=>x.item_code===r.code) : null;
    const isUnit = cat==="unit" && it;
    $("#modal").innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:15px">核销确认</b><span class="badge ${badge[cat]}">${label[cat]}</span>
        <span style="font-family:var(--mono);color:var(--accent)">${esc(r.code||"—")}</span>
        <button class="x" id="dx">✕</button></div>
      <div class="note" style="margin-top:8px">${esc(r.text)}</div>
      ${r.page&&PAGEIMG.has(r.page)?`<div style="margin-top:10px"><span class="rbtn" id="dimg">🖼 弹出原文 P${r.page} 比对</span></div>`:""}
      <div class="done-form">
        ${isUnit?`<label>单位（核对原文后如需修正直接改，改值随核销记录导出）</label><input id="du" value="${esc(it.unit||"")}">`:""}
        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;
    $("#mask").classList.add("show");
    const close = ()=>$("#mask").classList.remove("show");
    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});

/* ---------------- 启动 ---------------- */
buildTree();
bindTree();
show("gs");
const first = document.querySelector('.tnode[data-id="gs"]');
first && first.classList.add("on");
refreshCounts();
</script>
</body>
</html>
