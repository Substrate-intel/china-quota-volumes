9-0904-12","name":"十二、　火灾报警系统控制主机安装","page":113},{"id":"AZ09-0904-13","name":"十三、　联动控制主机安装","page":117},{"id":"AZ09-0904-14","name":"十四、　消防广播及电话主机(柜)安装","page":119},{"id":"AZ09-0904-15","name":"十五、　火灾报警控制微机安装","page":122},{"id":"AZ09-0904-16","name":"十六、　备用电源、电池主机(柜)安装","page":123},{"id":"AZ09-0904-17","name":"十七、　报警联动一体机安装","page":124},{"id":"AZ09-0904-18","name":"十八、　空气采样型探测器安装","page":128},{"id":"AZ09-0904-19","name":"十九、　应急照明装置","page":129}],"030905":[{"id":"AZ09-0905-01","name":"一、　自动报警系统调试","page":136},{"id":"AZ09-0905-02","name":"二、　水灭火控制装置调试","page":140},{"id":"AZ09-0905-03","name":"三、　防火控制装置调试","page":141},{"id":"AZ09-0905-04","name":"四、　气体灭火系统装置调试","page":143},{"id":"AZ09-0905-05","name":"五、　消防智能应急照明及疏散指示系统调试","page":145}],"030906":[{"id":"AZ09-0906-01","name":"其他项目","page":150}]},"ch13_nodes":[],"sections":[{"section_id":"GS-001","block_type":"总说明","chapter_code":null,"seq":1,"page":6,"print_page":1,"text":"一、辽宁省建设工程计价依据《通用安装工程定额》(以下简称本定额),是依据国家《建设工程工程量清单计价规范》(GB50500-2013)、《建设工程工程量清单计算规范》(GB50855-2013)、《通用安装工程消耗量定额》(TY02-31-2021)及国家有关现行产品标准、设计规范、施工及验收规范、技术操作规程、质量评定标准、安全操作规程以及新技术、新材料、新工艺在施工中的应用编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-002","block_type":"总说明","chapter_code":null,"seq":2,"page":6,"print_page":1,"text":"二、本定额的适用范围:我省行政区域内的国有投资或国有投资为主的工业与民用建筑的新建、扩建、改建通用安装工程项目。","tables":null,"tables_fixed":null},{"section_id":"GS-003","block_type":"总说明","chapter_code":null,"seq":3,"page":6,"print_page":1,"text":"三、本定额的作用:是国有投资或国有投资为主的建设项目,编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据;是评定投标报价合理性的依据;是调解处理工程造价争议和纠纷、审计和司法鉴定的依据;是编制投资估算指标、概算指标和概算定额的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","tables":null,"tables_fixed":null},{"section_id":"GS-004","block_type":"总说明","chapter_code":null,"seq":4,"page":6,"print_page":1,"text":"四、本定额是按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-005","block_type":"总说明","chapter_code":null,"seq":5,"page":6,"print_page":1,"text":"五、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个定额项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"GS-006","block_type":"总说明","chapter_code":null,"seq":6,"page":7,"print_page":2,"text":"六、本定额消耗量和价格的确定:(一)人工工日:1. 本定额人工工日以综合工日表现,是按八小时工作制编制的,人工等级分普通工(简称普工)、技术工(简称技工)和高级技术工(简称高级工),消耗量包括基本用工、超运距用工、人工幅度差、辅助用工和生产班组组织者用工。2. 本定额人工工日单价分别为:普工110 元,技工170 元,高级工330 元。3. 定额人工费,是指本定额项目综合单价中的人工费、按章节说明规定按系数调整的人工费以及定额中规定调整人工工日数量的人工费。按人工工日数量调整的人工费除章节有规定的工种外,均按普工工资标准调整人工费。(二)材料:1. 本定额采用的建筑材料、成品、半成品均按国家质量标准和相应的设计要求的合格产品考虑的;材料消耗量包括施工中消耗的主要材料、辅助材料、周转性材料和零星材料;定额中的材料消耗量包括净用量和损耗量,损耗量包括了施工操作损耗和场内运输、堆放损耗,规范(设计文件)规定的预留量、搭接量不包括在损耗率中;用量很少、占材料比重很小的零星材料合并为其他材料费,以“元”表示。2. 本定额材料的场内搬运距离按300m 考虑的;设备场内搬运距离为150m。3. 本定额材料价格包括材料供应价(原价)、运杂费、运输损耗、采购保管费。本定额项目中的材料单价均为不含增值税的税前价格。4. 本定额中的周转性材料按不同施工方法、不同材质,计算出摊销量进入定额消耗量。(三)施工机械台班:1. 本定额施工机械台班消耗量是按正常合理的机械配备、机械施工功效确定的,并已考虑了机械幅度差因素。2. 本定额施工机械原值在2000 元以内、使用年限在一年以内的不构成固定资产的小型机械,未列入本定额机械台班消耗量,其费用包括在辽宁省《建设工程费用标准》的工具用具使用费中,其燃料动力消耗量包括在相应定额项目的材料项目内。3. 本定额加工机械、泵类机械、焊接机械及动力机械的操作人工均含在相应定额项目的人工消耗量中。4. 本定额施工机械台班单价是按现行的《施工机械台班费用标准》确定的。(四)仪器仪表1. 本定额的仪器仪表台班是按正常施工功效综合确定的。2. 单位价值在2000 元以内、使用年限在一年以内的不构成固定资产的仪器仪表,未列入本定额仪器仪表台班消耗量。","tables":null,"tables_fixed":null},{"section_id":"GS-007","block_type":"总说明","chapter_code":null,"seq":7,"page":8,"print_page":3,"text":"七、本定额未考虑施工与生产同时进行、有害身体健康的环境中施工时降效增加费,发生时按各册规定计算。","tables":null,"tables_fixed":null},{"section_id":"GS-008","block_type":"总说明","chapter_code":null,"seq":8,"page":8,"print_page":3,"text":"八、由供货商负责安装的设备,不执行本定额的相应安装项目,按供货合同税前价格增加3%的综合费用单独列项计入材料费。","tables":null,"tables_fixed":null},{"section_id":"GS-009","block_type":"总说明","chapter_code":null,"seq":9,"page":8,"print_page":3,"text":"九、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"GS-010","block_type":"总说明","chapter_code":null,"seq":10,"page":8,"print_page":3,"text":"十、本说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"CS-011","block_type":"册说明","chapter_code":null,"seq":11,"page":14,"print_page":1,"text":"一、第九册《消防工程》(以下简称本册定额)适用于工业与民用建筑工程中的消防工程。","tables":null,"tables_fixed":null},{"section_id":"CS-012","block_type":"册说明","chapter_code":null,"seq":12,"page":14,"print_page":1,"text":"二、本册定额编制的主要技术依据有:1. 《自动喷水灭火系统设计规范》GB50084-2017;2. 《自动喷水灭火系统施工及验收规范》GB50261-2017;3. 《固定消防炮灭火系统设计规范》GB50338-2003;4. 《固定消防炮灭火系统施工与验收规范》GB50498-2009;5. 《自动消防炮灭火系统技术规程》CECS245:2016;6. 《沟槽式连接管道工程技术规程》CECS151-2003;7. 《火灾自动报警系统设计规范》GB50116-2013;8. 《火灾自动报警系统施工及验收规范》GB50166-2019;9. 《气体灭火系统设计规范》GB50370-2005;10. 《气体灭火系统施工及验收规范》GB50263-2007;11. 《二氧化碳灭火系统设计规范》GB50193-2010;12. 《泡沫灭火系统设计规范》GB50151-2010;13. 《泡沫灭火系统施工及验收规范》GB50281-2006;14. 《消防联动控制系统》GB16806-2006;15. 《通用安装工程工程量计算规范》GB50586-2013;16. 《全国统一安装工程预算定额》GYD-2000;17. 《全国统一安装工程基础定额》GJD-201-92006;18. 《通用安装工程消耗量》第九册《消防安装工程》TY02-31-2021。","tables":null,"tables_fixed":null},{"section_id":"CS-013","block_type":"册说明","chapter_code":null,"seq":13,"page":15,"print_page":2,"text":"三、界限划分:1. 消防系统室内外管道以入口处阀门为界;无入口处阀门时以建筑物(构筑物)外墙皮1.5m 为界。2. 厂区范围内的装置、站、罐区的架空消防管道执行本册定额相应项目。3. 与市政给水管道的界限:以与市政给水管道碰头点(井)为界。","tables":null,"tables_fixed":null},{"section_id":"CS-014","block_type":"册说明","chapter_code":null,"seq":14,"page":15,"print_page":2,"text":"四、执行说明:1. 阀门、气压罐安装,消防水箱、套管、支架制作安装(注明者除外),执行第十册《给排水、采暖、燃气安装工程》相应项目;室外埋地消防管道执行第十册《给排水、采暖、燃气安装工程》中室外给水管道安装相应项目。2. 各种消防泵、稳压泵安装,执行第一册《机械设备安装工程》相应项目。3. 不锈钢管、铜管管道安装,执行第八册《工业管道安装工程》相应项目。4. 刷油、防腐蚀、绝热工程,执行第十二册《刷油、防腐蚀、绝热工程》相应项目。5. 电缆敷设、桥架安装、配管配线、接线盒、电动机检查接线、防雷接地装置等安装,执行第四册《电气设备与线缆安装工程》相应项目。6. 各种仪表的安装及带电讯号的阀门、水流指示器、压力开关、驱动装置及泄漏报警开关的接线、校线等执行第六册《自动化控制仪表安装工程》相应项目。7. 剔槽、凿洞及恢复执行第十册《给排水、采暖、燃气安装工程》相应项目。8. 凡涉及管沟、基坑及井类的土方开挖、回填、运输、垫层、基础、砌筑、地沟盖板预制安装、路面开挖及修复、管道混凝土支墩的项目,执行《房屋建筑与装饰工程定额》相应项目,缺项部分执行《市政工程定额》相应项目。","tables":null,"tables_fixed":null},{"section_id":"CS-015","block_type":"册说明","chapter_code":null,"seq":15,"page":16,"print_page":3,"text":"五、下列费用可按系数分别计取:1. 脚手架搭拆费按定额人工费的3.5%计算,其费用中人工费占40%、材料费占53%、机械费占7%。2. 操作高度增加费:本册定额操作物高度是按距离操作基准面(楼地面)6m 以内考虑的,超过6m 时,超过部分工程量按定额人工费乘以下列系数计算操作高度增加费,其费用中人工费占70%、材料费占18%、机械费占12%。3. 建筑超高增加费:高度在6 层或20m 以上的工业与民用建筑上进行安装时增加的费用,按下表计算,其费用中人工费占36.5%、机械费占63.5%。","tables":null,"tables_fixed":null},{"section_id":"ZS-016","block_type":"章说明","chapter_code":"0901","seq":16,"page":20,"print_page":7,"text":"一、本章内容包括水喷淋钢管、消火栓钢管、水喷淋(雾)喷头、报警装置、水流指示器、温感式水幕装置、减压孔板、末端试水装置、集热板、消火栓、消防水泵结合器、灭火器、消防水炮等安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-017","block_type":"章说明","chapter_code":"0901","seq":17,"page":20,"print_page":7,"text":"二、本章适用于工业和民用建(构)筑物设置的水灭火系统的管道、各种组件、消火栓、消防水炮等安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-018","block_type":"章说明","chapter_code":"0901","seq":18,"page":20,"print_page":7,"text":"三、管道安装相关规定:1. 钢管(法兰连接)定额中包括管件及法兰安装,管件、法兰主材数量另计,螺栓按设计用量加3%损耗计算。2. 若设计或规范要求钢管需要镀锌,其镀锌及场外运输另行计算。3. 管道安装(沟槽连接)已包括管道沟槽卡箍件安装,如沟槽卡箍件(含胶圈)实际发生数量与定额不同时,可按实计算,其他不变;沟槽管件安装另行执行相关项目。4. 消火栓管道采用无缝钢管焊接时,定额中包括管件安装,管件主材数量另计,其它不变。5. 消火栓管道采用钢管(沟槽连接)时,执行水喷淋钢管(沟槽连接)相关项目。6. 镀锌钢管(螺纹连接)中镀锌钢管接头零件品种、数量与定额不同时,可按时调整,其他不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-019","block_type":"章说明","chapter_code":"0901","seq":19,"page":20,"print_page":7,"text":"四、有关说明1. 沟槽式法兰阀门安装执行第十册《给排水、采暖、燃气安装工程》相应项目。2. 报警装置安装项目,定额中已包括装配管、泄放试验管及水力警铃出水管安装,水力警铃进水管按图示尺寸执行管道安装相应项目;其他报警装置适用于雨淋、干湿两用及预作用报警装置。3. 水流指示器(马鞍型连接)项目,主材中包括胶圈、U 型卡;若设计要求水流指示器采用丝接时,执行第十册《给排水、采暖、燃气安装工程》丝接阀门相应项目。4. 喷头、报警装置及水流指示器安装定额均按管网系统试压、冲洗合格后安装考虑的,定额中已包括丝堵、临时短管的安装、拆除及摊销。5. 温感式水幕装置安装定额中已包括给水三通至喷头、阀门间的管道、管件、阀门、喷头等全部安装内容,但管道的主材数量按设计管道中心长度另加损耗计算;喷头数量按设计数量另加损耗计算。6. 集热罩安装项目,主材中应包括所配备的成品支架。7. 落地组合式消防柜安装,执行室内消火栓(明装)定额项目。8、室外消火栓、消防水泵接合器安装,定额中包括法兰接管及弯管底座(消火栓三通) 等配套安装,管(配)件的规格、数量设计有特殊要求的,主材可以调整,其它不变。9. 消防水炮及模拟末端装置项目,定额中仅包括本体安装,不包括型钢底座制作安装和混凝土基础砌筑;型钢底座制作安装执行第十册《给排水、采暖、燃气安装工程》设备支架制作安装相应项目,混凝土基础执行《房屋建筑与装饰工程定额》相应项目。10. 设置于管道间、管廊内的管道,其定额人工、机械乘以系数1.2。11. 管道安装工序内包括一次水压试验,如果施工工艺或设计要求进行多次水压试验,第二次及以上水压试验执行第八册《工业管道安装工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-020","block_type":"计算规则","chapter_code":"0901","seq":20,"page":22,"print_page":9,"text":"一、管道安装按设计图示管道中心线长度以“10m” 为计量单位。不扣除阀门、管件及各种组件所占长度。","tables":null,"tables_fixed":null},{"section_id":"JR-021","block_type":"计算规则","chapter_code":"0901","seq":21,"page":22,"print_page":9,"text":"二、管件连接分规格以“10 个”为计量单位。沟槽管件主材包括卡箍及密封圈以“套”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-022","block_type":"计算规则","chapter_code":"0901","seq":22,"page":22,"print_page":9,"text":"三、喷头、水流指示器、减压孔板、集热板按设计图示数量计算。按安装部位、方式、分规格以“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-023","block_type":"计算规则","chapter_code":"0901","seq":23,"page":22,"print_page":9,"text":"四、报警装置、室内消火栓、室外消火栓、消防水泵接合器均按设计图示数量计算。报警装置、室内外消火栓、消防水泵接合器分形式,按成套产品以“组”为计量单位;成套产品包括的内容详见附表。","tables":null,"tables_fixed":null},{"section_id":"JR-024","block_type":"计算规则","chapter_code":"0901","seq":24,"page":22,"print_page":9,"text":"五、末端试水装置按设计图示数量计算,分规格以“组”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-025","block_type":"计算规则","chapter_code":"0901","seq":25,"page":22,"print_page":9,"text":"六、温感式水幕装置安装以“组”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-026","block_type":"计算规则","chapter_code":"0901","seq":26,"page":22,"print_page":9,"text":"七、灭火器按设计图示数量计算,分形式以“具、组”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-027","block_type":"计算规则","chapter_code":"0901","seq":27,"page":22,"print_page":9,"text":"八、消防水炮按设计图示数量计算,分规格以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-028","block_type":"计算规则","chapter_code":"0901","seq":28,"page":24,"print_page":11,"text":"一、　水喷淋钢管1. 　镀锌钢管(螺纹连接)工作内容:检查及清扫管材、切管、套丝、调直、管道及管件安装、丝口刷漆、水压试验、水冲洗。计量单位:10m","tables":null,"tables_fixed":null},{"section_id":"ZS-029","block_type":"章说明","chapter_code":"0902","seq":29,"page":62,"print_page":49,"text":"一、本章内容包括无缝钢管、气体驱动装置管道、选择阀、气体喷头、贮存装置、称重检漏装置、无管网气体灭火装置、管网系统试验等安装工程。","tables":null,"tables_fixed":null},{"section_id":"ZS-030","block_type":"章说明","chapter_code":"0902","seq":30,"page":62,"print_page":49,"text":"二、本章适用于工业和民用建筑中设置的七氟丙烷、IG541、二氧化碳灭火系统中的管道、管件、系统装置及组件等的安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-031","block_type":"章说明","chapter_code":"0902","seq":31,"page":62,"print_page":49,"text":"三、定额中的无缝钢管、钢制管件、选择阀安装及系统组件试验等适用于七氟丙烷、IG541 灭火系统;高压二氧化碳灭火系统执行本章定额,人工、机械乘以系数1.20。","tables":null,"tables_fixed":null},{"section_id":"ZS-032","block_type":"章说明","chapter_code":"0902","seq":32,"page":62,"print_page":49,"text":"四、管道及管件安装定额:1. 中压加厚无缝钢管(法兰连接)定额包括管件及法兰安装,管件、法兰主材数量另计,螺栓按设计用量加3%损耗计算。2. 若设计或规范要求钢管需要镀锌,其镀锌及场外运输另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-033","block_type":"章说明","chapter_code":"0902","seq":33,"page":62,"print_page":49,"text":"五、有关说明1. 气体灭火系统管道若采用不锈钢管、铜管时,管道及管件安装执行第八册《工业管道安装工程》相应项目。2. 贮存装置安装定额,包括灭火剂贮存容器和驱动瓶的安装固定支框架、系统组件(集流管,容器阀,气、液单向阀,高压软管)、安全阀等贮存装置和驱动装置的安装及氮气增压。二氧化碳贮存装置安装不需增压,执行定额时应扣除高纯氮气,其余不变。称重装置价值含在贮存装置设备价中。3. 二氧化碳称重检漏装置包括泄漏报警开关、配重及支架安装。4. 管网系统包括管道、选择阀、气液单向阀、高压软管等组件。管网系统试验工作内容包括充氮气,但氮气消耗量另行计算。5. 气体灭火系统调试费执行第五章相应项目。6. 本章阀门安装按设计压力不同,执行第八册《工业管道安装工程》相应项目;阀驱动装置与泄漏报警开关的电气接线执行第六册《自动化控制仪表安装工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-034","block_type":"计算规则","chapter_code":"0902","seq":34,"page":63,"print_page":50,"text":"一、管道安装按设计图示管道中心线长度,以“10m”为计量单位。不扣除阀门、管件及各种组件所占长度。","tables":null,"tables_fixed":null},{"section_id":"JR-035","block_type":"计算规则","chapter_code":"0902","seq":35,"page":63,"print_page":50,"text":"二、钢制管件连接分规格,以“10 个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-036","block_type":"计算规则","chapter_code":"0902","seq":36,"page":63,"print_page":50,"text":"三、气体驱动装置管道按设计图示管道中心线长度计算,以“10m”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-037","block_type":"计算规则","chapter_code":"0902","seq":37,"page":63,"print_page":50,"text":"四、选择阀、喷头安装按设计图示数量计算,分规格、连接方式以“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-038","block_type":"计算规则","chapter_code":"0902","seq":38,"page":63,"print_page":50,"text":"五、贮存装置、称重检漏装置、无管网气体灭火装置安装按设计图示数量计算,以“套”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-039","block_type":"计算规则","chapter_code":"0902","seq":39,"page":63,"print_page":50,"text":"六、管网系统试验按贮存装置数量,以“套”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-040","block_type":"计算规则","chapter_code":"0902","seq":40,"page":64,"print_page":51,"text":"一、　无缝钢管1. 　中压加厚无缝钢管(螺纹连接)工作内容:检查及清扫管材、切管、套丝、调直、管道预安装、拆卸、二次安装、吹扫、水压试验。计量单位:10m","tables":null,"tables_fixed":null},{"section_id":"ZS-041","block_type":"章说明","chapter_code":"0903","seq":41,"page":82,"print_page":69,"text":"一、本章内容包括泡沫发生器、泡沫比例混合器等安装工程。","tables":null,"tables_fixed":null},{"section_id":"ZS-042","block_type":"章说明","chapter_code":"0903","seq":42,"page":82,"print_page":69,"text":"二、有关说明1. 本章定额适用于高、中、低倍数固定式或半固定式泡沫灭火系统的发生器及泡沫比例混合器安装。2. 泡沫发生器及泡沫比例混合器安装中包括整体安装、焊法兰、单体调试及配合管道试压时隔离本体所消耗的人工和材料。3. 本章设备安装工作内容中不包括支架的制作、安装和二次灌浆,上述工作另行计算。4. 泡沫灭火系统的管道、管件、法兰、阀门、管道支架等的安装及管道系统试压及冲(吹)洗,执行第八册《工业管道安装工程》相应项目。5. 泡沫发生器、泡沫比例混合器安装定额中不包括泡沫液充装,泡沫液充装另行计算。6. 泡沫灭火系统的调试另行计算。","tables":null,"tables_fixed":null},{"section_id":"JR-043","block_type":"计算规则","chapter_code":"0903","seq":43,"page":83,"print_page":70,"text":"泡沫发生器、泡沫比例混合器安装按设计图示数量计算,均按不同型号以“台”为计量单位,法兰和螺栓根据设计图纸要求另行计算。","tables":null,"tables_fixed":null},{"section_id":"JR-044","block_type":"计算规则","chapter_code":"0903","seq":44,"page":84,"print_page":71,"text":"一、　泡沫发生器工作内容:开箱检查、整体吊装、安装固定、法兰连接、紧螺栓、调试。计量单位:台","tables":null,"tables_fixed":null},{"section_id":"ZS-045","block_type":"章说明","chapter_code":"0904","seq":45,"page":94,"print_page":81,"text":"一、本章内容包括点型探测器、线型探测器、按钮、消防警铃、声光报警器、空气采样型探测器、消防报警电话插孔(电话)、消防广播(扬声器)、消防专用模块(模块箱)、区域报警控制箱、联动控制箱、远程控制箱(柜)、火灾报警系统控制主机、联动控制主机、消防广播及电话主机(柜)、火灾报警控制微机、备用电源、电池主机柜、报警联动控制一体机、应急照明装置的安装工程。","tables":null,"tables_fixed":null},{"section_id":"ZS-046","block_type":"章说明","chapter_code":"0904","seq":46,"page":94,"print_page":81,"text":"二、本章适用于工业和民用建(构)筑物设置的火灾自动报警系统的安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-047","block_type":"章说明","chapter_code":"0904","seq":47,"page":94,"print_page":81,"text":"三、本章均包括以下工作内容1. 设备和箱、机及元件的搬运,开箱检查,清点,杂物回收,安装就位,接地,密封,箱、机内的校线、接线、压接端头(挂锡)、编码,测试、清洗,记录整理等。2. 本体调试。","tables":null,"tables_fixed":null},{"section_id":"ZS-048","block_type":"章说明","chapter_code":"0904","seq":48,"page":94,"print_page":81,"text":"四、有关说明1. 安装定额中箱、机是以成套装置编制的;柜式及琴台式均执行落地式安装相应项目。2. 闪灯执行声光报警器。3. 电气火灾监控系统(1)报警控制器按点数执行火灾自动报警控制器安装。(2)探测器模块按输入回路数量执行多输入模块安装。(3)剩余电流互感器执行第四册《电气设备与线缆安装工程》相应项目。4. 应急照明装置包括应急照明控制器安装和应急电源分配电装置安装。急照明控制器箱、机是以成套装置编制的,柜式及琴台式均执行落地式安装相应项目;消防应急照明器具、消防应急灯具专用电源执行第四册《电气设备与线缆安装工程》相应项目。5. 火灾报警控制微机安装中不包括消防系统应用软件开发内容。6. 消防广播及对讲电话主机包括功放、录音机、分配器、控制柜等设备。","tables":null,"tables_fixed":null},{"section_id":"JR-049","block_type":"计算规则","chapter_code":"0904","seq":49,"page":96,"print_page":83,"text":"一、火灾报警系统按设计图示数量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-050","block_type":"计算规则","chapter_code":"0904","seq":50,"page":96,"print_page":83,"text":"二、点型探测器按设计图示数量计算,不分规格、型号、安装方式与位置,以“个”\" 对\" 为计量单位。探测器安装包括了探头和底座的安装及本体调试。红外光速探测器是成对使用的,在计算时一对为两只。","tables":null,"tables_fixed":null},{"section_id":"JR-051","block_type":"计算规则","chapter_code":"0904","seq":51,"page":96,"print_page":83,"text":"三、线型探测器依据探测器长度、信号转换装置数量、报警终端电阻数量按设计图示数量计算,分别以“m”“台”“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-052","block_type":"计算规则","chapter_code":"0904","seq":52,"page":96,"print_page":83,"text":"四、空气采样管依据图示设计长度计算,以“m”为计量单位;极早期空气采样报警器依据探测回路数按设计图示计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-053","block_type":"计算规则","chapter_code":"0904","seq":53,"page":96,"print_page":83,"text":"五、区域报警控制箱、联动控制箱、火灾报警系统控制主机、联动控制主机、报警联动一体机按设计图示数量计算,区分不同点数、安装方式,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-054","block_type":"计算规则","chapter_code":"0904","seq":54,"page":96,"print_page":83,"text":"六、智能应急及疏散系统按设计图示数量计算。智能应急照明控制器、应急电源分配电装置按图示以“台”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-055","block_type":"计算规则","chapter_code":"0904","seq":55,"page":98,"print_page":85,"text":"一、　点型探测器安装工作内容:底座安装、校线、接头、压接冷压端头、底座压线、编码、探头安装、测试、防护罩安拆等。计量单位:见表","tables":null,"tables_fixed":null},{"section_id":"ZS-056","block_type":"章说明","chapter_code":"0905","seq":56,"page":134,"print_page":121,"text":"一、本章内容包括自动报警系统调试、水灭火控制装置调试、防火控制装置调试、气体灭火系统装置调试等工程。","tables":null,"tables_fixed":null},{"section_id":"ZS-057","block_type":"章说明","chapter_code":"0905","seq":57,"page":134,"print_page":121,"text":"二、本章适用于工业与民用建筑项目中的消防工程系统调试。","tables":null,"tables_fixed":null},{"section_id":"ZS-058","block_type":"章说明","chapter_code":"0905","seq":58,"page":134,"print_page":121,"text":"三、有关说明1. 系统调试是指消防报警和防火控制装置灭火系统安装完毕且联通,并达到国家有关消防施工验收规范、标准,进行的全系统检测、调整和试验。2. 定额中不包括气体灭火系统调试试验时采取的安全措施,应另行计算。3. 自动报警系统装置包括各种探测器、手动报警按钮和报警控制器;灭火系统控制装置包括消火栓、自动喷水、七氟丙烷、二氧化碳等固定灭火系统的控制装置。4. 切断非消防电源的点数以执行切断非消防电源的模块数量确定点数。","tables":null,"tables_fixed":null},{"section_id":"JR-059","block_type":"计算规则","chapter_code":"0905","seq":59,"page":135,"print_page":122,"text":"一、自动报警系统调试区分不同点数根据集中报警器台数按系统计算。自动报警系统包括各种探测器、报警器、报警按钮、报警控制器组成的报警系统,其点数按具有地址编码的器件数量计算。火灾事故广播、消防通信系统调试按消防广播喇叭及音箱、电话插孔和消防通信的电话分机的数量分别以“10 只”或“部”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-060","block_type":"计算规则","chapter_code":"0905","seq":60,"page":135,"print_page":122,"text":"二、自动喷水灭火系统调试按水流指示器数量以“系统”为计量单位;消火栓灭火系统按消火栓启泵按钮数量以“系统”为计量单位;消防水炮控制装置系统调试按水炮数量以“系统”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-061","block_type":"计算规则","chapter_code":"0905","seq":61,"page":135,"print_page":122,"text":"三、防火控制装置调试按设计图示数量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-062","block_type":"计算规则","chapter_code":"0905","seq":62,"page":135,"print_page":122,"text":"四、气体灭火系统装置调试按调试、检验和验收所消耗的试验容量总数计算,以“点”为计量单位。气体灭火系统调试,是由七氟丙烷、IG541、二氧化碳等组成的灭火系统:按气体灭火系统装置的瓶头阀以点计算。","tables":null,"tables_fixed":null},{"section_id":"JR-063","block_type":"计算规则","chapter_code":"0905","seq":63,"page":135,"print_page":122,"text":"五、电气火灾监控系统调试按模块点数执行自动报警系统调试相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-064","block_type":"计算规则","chapter_code":"0905","seq":64,"page":135,"print_page":122,"text":"六、电梯为消防用电梯、一般客用电梯与控制中心间的控制调试,电梯以“部”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-065","block_type":"计算规则","chapter_code":"0905","seq":65,"page":135,"print_page":122,"text":"七、应急照明系统按应急照明控制器所连接的应急分配电装置台数确定点位,以“系统”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-066","block_type":"计算规则","chapter_code":"0905","seq":66,"page":136,"print_page":123,"text":"一、　自动报警系统调试1. 　自动报警系统调试工作内容:技术和器具准备、检查接线、绝缘检查、程序装载或校对检查、功能测试、系统试验、记录整理等。计量单位:系统","tables":null,"tables_fixed":null},{"section_id":"ZS-067","block_type":"章说明","chapter_code":"0906","seq":67,"page":148,"print_page":135,"text":"下列费用可按系数分别计取:1. 脚手架搭拆费按定额人工费的3.5%计算,其费用中人工费占40%、材料费占53%、机械费占7%。2. 操作高度增加费:本册定额操作物高度是按距离操作基准面(楼地面)6m 以内考虑的,超过6m 时,超过部分工程量按定额人工费乘以下列系数计算操作高度增加费,其费用中人工费占70%、材料费占18%、机械费占12%。","tables":null,"tables_fixed":null},{"section_id":"FB-068","block_type":"附表","chapter_code":"0906","seq":68,"page":154,"print_page":141,"text":"材料预算价格取定表（附录）： ⁃ 1｜镀锌铁丝φ4.0~2.8｜kg｜6.16｜15｜尼龙线卡｜个｜0.11 ⁃ 2｜扁钢60 以内｜kg｜3.57｜16｜白绸｜m2｜12.92 ⁃ 3｜镀锌扁钢综合｜kg｜4.28｜17｜棉纱头｜kg｜7.06 ⁃ 4｜镀锌扁钢40×4｜kg｜4.28｜18｜线麻｜kg｜9.35 ⁃ 5｜热轧薄钢板δ3.5~4.0｜kg｜3.70｜19｜镀锌螺钉M2~5×4~50｜个｜0.05 ⁃ 6｜热轧厚钢板δ8.0~20｜kg｜3.62｜20｜镀锌木螺钉d2~5×4~50｜10 个｜0.40 ⁃ 7｜热轧厚钢板δ12~20｜kg｜3.56｜21｜木螺钉d2~4×6~65｜10 个｜0.51 ⁃ 8｜热轧厚钢板δ20｜kg｜3.55｜22｜木螺钉d4.5~6×15~100｜10 个｜0.51 ⁃ 9｜镀铬钢板δ2.5｜m2｜90.00｜23｜半圆头镀锌螺栓M6~12×22~80｜10 个｜12.80 ⁃ 10｜接地编织铜线｜m｜13.00｜24｜镀锌六角螺栓带螺母2 垫圈M16× 85 ~ 140｜10 套｜21.25 ⁃ 11｜橡胶板δ4｜kg｜7.28｜25｜镀锌六角螺栓带螺母2 平垫1 弹垫M8× 100 以内｜10 套｜10.20 ⁃ 12｜橡胶垫δ2｜m2｜17.76｜26｜镀锌六角螺栓带螺母2 平垫1 弹垫M10 ×100 以内｜10 套｜12.75 ⁃ 13｜塑料布｜m2｜5.38｜27｜镀锌六角螺栓带螺母2 平垫1 弹垫M10 ×50 以内｜10 套｜10.20 ⁃ 14｜聚四氟乙烯垫｜个｜2.88｜28｜镀锌六角螺栓带螺母$ 2 平垫1 弹垫 M16×100 以内｜10 套｜17.00 ⁃ 序号｜材料名称｜单位｜单价(元)｜序号｜材料名称｜单位｜单价(元) ⁃ 29｜镀锌六角螺栓带螺母2 平垫1 弹垫M16 ×150 以内｜10 套｜21.25｜46｜铜锁母10#｜个｜3.12 ⁃ 30｜镀锌六角螺栓带螺母$ 2 平垫1 弹垫 M20×100 以内｜10 套｜46.75｜47｜铜锁母14#｜个｜3.14 ⁃ 31｜膨胀螺栓M8｜10 套｜5.95｜48｜卵石｜m3｜75.00 ⁃ 32｜膨胀螺栓M10｜10 套｜7.20｜49｜道木｜m3｜1600.00 ⁃ 33｜膨胀螺栓M12｜10 套｜8.50｜50｜调和漆｜kg｜11.00 ⁃ 34｜膨胀螺栓M16｜10 套｜23.50｜51｜铅油(厚漆)｜kg｜7.23 ⁃ 35｜塑料胀管φ6~8｜个｜0.10｜52｜防锈漆｜kg｜10.75 ⁃ 36｜金刚石砂轮片φ400｜片｜8.50｜53｜银粉漆｜kg｜8.50 ⁃ 37｜尼龙砂轮片φ100｜片｜5.00｜54｜聚四氟乙烯生料带宽20｜m｜2.04 ⁃ 38｜尼龙砂轮片φ400｜片｜14.00｜55｜汽油70#~90#｜kg｜9.97 ⁃ 39｜尼龙砂轮片φ500×25×4｜片｜14.54｜56｜机油｜kg｜10.63 ⁃ 40｜低碳钢焊条J427φ3.2｜kg｜5.60｜57｜ /* ---------------- 章节树 ---------------- */
const CH13="0113", CH17="0117";
const secChToCode = k => Object.keys(AMP_SEC).find(c=>AMP_SEC[c]===k);
const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：az09=9-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

/* ---------------- 内容渲染 ---------------- */
const main = () => $("#main");
function show(id){
  if(id.startsWith("item:")){ return openItem(id.slice(5)); }
  if(id==="gs"){ return viewSections(GS_TYPE, S.sectionsBy(GS_TYPE), extraGS); }
  if(id==="mj"){ return viewSections("建设工程建筑面积计算规范", S.sectionsBy("规范")); }
  if(id==="toc"){ return viewToc(); }
  if(id==="price"){ return viewPrice(); }
  if(id==="mix"){ return viewMix(); }
  if(id==="derive"){ return viewDerive(); }
  if(id==="errata"){ return viewErrata(); }
  if(id==="findings"){ return viewFindings(); }
  if(id==="issues"){ return viewIssues(); }
  if(id==="review"){ return viewReview(); }
  if(id==="fb17"){ return viewSections("第十七章 附表（样板）", S.sectionsBy("附表").filter(s=>!s.chapter_code)); }
  if(id.startsWith("ch:")){ return viewChapter(id.slice(3)); }
  if(id.startsWith("layer:")){ const p=id.split(":"); return viewLayer(p[1], p[2]); }
}

function secBlock(s, open){

    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

    <span class="badge ${v.H4&&v.H4.ok?"b-green":"b-gray"}">H4 ${v.H4&&v.H4.ok?"通过":"不适用"}</span>
    ${i.errata_status==="hit"?`<span class="badge b-blue" title="该子目被官方勘误覆盖，erratas 表双值留痕">勘误覆盖</span>`:""}
    <button class="x" id="mx">✕</button></div>`;
  const p4 = `<div class="price4">
    <div class="it total"><div class="k">基价</div><div class="v">${num2(i.base_price)}</div></div>
    <div class="it"><div class="k">人工费</div><div class="v">${num2(i.labor_cost)}</div></div>
    <div class="it"><div class="k">材料费</div><div class="v">${num2(i.material_cost)}</div></div>
    <div class="it"><div class="k">机械费</div><div class="v">${num2(i.machine_cost)}</div></div>
    <div class="it"><div class="k">综合费用</div><div class="v">${num2(i.combined_cost)}</div></div></div>`;
  const tbl = (title, rows, cols) => rows.length ? `<h3>${title}（${rows.length}）</h3>
    <table class="tbl"><thead><tr>${cols.map(c=>`<th${c.n?' class="num"':''}>${c.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td${c.n?' class="num"':''}>${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
  const h2d = v.H2 && v.H2.ok ? `<div class="note">H2 对账：${v.H2.days} 工日 × 三档配比 → ${num2(v.H2.calc)} 元（三档配比 ${JSON.stringify(v.H2.tiers||{})}，当期人工单价 ${v.H2.rate} 元/工日）</div>` : "";
  let h3d = "";
  if(d.h3){
    const dt = d.h3.detail||{};
    if(d.h3.status==="fail") h3d = `<div class="warn">H3 超差：书印材料费 ${num2(dt.declared)} ≠ 价格库反推 ${num2(dt.calc)}（差 ${num2(dt.diff)}）。<b>需人工对价</b>——左侧「🔍 人工核对」清单可定位同类条目。</div>`;
    if(d.h3.status==="skip_unmatched"||d.h3.status==="unmatched") h3d = `<div class="warn">H3 跳过·未匹配：${esc(dt.note||"")}。缺价材料：${(dt.missing||[]).map(m=>`${esc(m.name)}(${esc(m.unit||"")})`).join("、")||"—"}，需补价格库后自动复检转通过。</div>`;
    if(d.h3.status==="skip_nomat"||d.h3.status==="nomat") h3d = `<div class="note">H3 跳过·免核：${esc(dt.note||"")}（不含材料子目）。</div>`;
  }
  const wcBlk = i.work_content
    ? `<div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa)"><b>工作内容</b>（计价主要参考）：${esc(i.work_content)}</div>`
    : "";
  const notes = (d.notes||[]).map(n=>`<div class="note">▪ ${esc(n.text)}</div>`).join("");
  let errd = "";
  if(i.errata_status==="hit"){
    const es = (DATA.erratas||[]).filter(e=>{
      try{ return (JSON.parse(e.item_codes||"[]")||[]).includes(code); }catch(_){ return false; }
    });
    if(es.length) errd = `<div class="warn">⚠ <b>官方勘误覆盖</b>（库内保留原文值，overlay 双值留痕）：${es.map(e=>`${esc(e.errata_type||"")} ${esc(e.wrong_text||"")} → <b>${esc(e.correct_text||"")}</b>（勘误号 ${esc(e.errata_id)}，印${e.printed_page??"?"}）`).join("<br>")}</div>`;
  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("材料消耗", d.materials||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("机械消耗", d.machines||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));
}

function viewPrice(){
  const N_REV = DATA.mat_prices.filter(p=>p.source==="反推").length;
  const N_OFF = DATA.mat_prices.filter(p=>p.source==="官方配比").length;
  const N_ATT = DATA.stats.mat_prices - N_REV - N_OFF;
  main().innerHTML = `<div class="panel"><h2>价格库</h2>
    <div class="filter"><span class="chip on" data-p="m">材料 ${DATA.stats.mat_prices}</span><span class="chip" data-p="j">机械 ${DATA.stats.mach_prices}</span>
    <span id="psrc" class="filter"><span class="chip on" data-s="all">全部 ${DATA.stats.mat_prices}</span><span class="chip" data-s="rev">⚡反推 ${N_REV}</span><span class="chip" data-s="off">官方配比 ${N_OFF}</span><span class="chip" data-s="att">附表 ${N_ATT}</span></span>
    <input id="pq" placeholder="名称搜索…" style="width:220px"></div>
    <div id="pbody"></div></div>`;
  let src = "all";
  const srcFn = p => src==="all" || (src==="rev" ? p.source==="反推" : src==="off" ? p.source==="官方配比" : (p.source!=="反推" && p.source!=="官方配比"));
  const renderM = kw => {
    const hits = DATA.mat_prices.filter(p=>srcFn(p)&&(!kw||p.name.includes(kw)));
    const rows = hits.slice(0,300);
    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">序</th><th>名称</th><th>单位</th><th class="num">单价(元)</th><th class="num">页</th><th>来源</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${p.seq}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="num">${num2(p.price)}</td><td class="num">${p.page??"—"}</td>
      <td>${p.source==="反推"?'<span class="badge b-amber">⚡反推入库</span>':p.source==="官方配比"?'<span class="badge b-green">官方配比</span>':'<span class="badge b-gray">附表</span>'}</td></tr>`).join("")}</tbody></table>
      ${kw||src!=="all"?`<div class="note">命中 ${hits.length} 条${kw?"（按名称）":""}${src!=="all"?"（按来源）":""}${hits.length>300?"，最多显示 300。":"。"}</div>`:""}`;
  };
  const renderJ = kw => {
    const rows = DATA.mach_prices.filter(p=>!kw||(p.name||"").includes(kw)).slice(0,300);
    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">编码</th><th>名称</th><th>规格</th><th class="num">台班单价(元)</th><th class="num">页</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.spec||"")}</td><td class="num">${num2(p.unit_price)}</td><td class="num">${p.page}</td></tr>`).join("")}</tbody></table>
      ${kw?`<div class="note">命中 ${DATA.mach_prices.filter(p=>(p.name||"").includes(kw)).length} 条，最多显示 300。</div>`:""}`;
  };
  let mode = "m";
  const paint = () => { const kw=$("#pq").value.trim(); mode==="m"?renderM(kw):renderJ(kw); };
  document.querySelectorAll(".chip[data-p]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll(".chip[data-p]").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
    mode = ch.dataset.p;
    $("#psrc").style.display = mode==="m" ? "" : "none";
    paint();
  }));
  document.querySelectorAll("#psrc .chip").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#psrc .chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
    src = ch.dataset.s; paint();
  }));
  $("#pq").addEventListener("input", paint);
  paint();
}

function viewDerive(){
  const G = DATA.price_derive||[], IT = DATA.price_derive_items||[], FL = DATA.price_derive_fails||[];
  const badge = g => {
    const mine = PCONF[pk(g.material, g.unit)];
    if(g.review_status==="confirmed") return `<span class="badge b-green">✅已确认${g.build_price!=null?" "+num2(g.build_price):""}</span>`;
    if(mine) return mine.materialize
      ? `<span class="badge b-green">⚡已入库 ${num2(mine.build_price)}·${mine.source==="官方配比"?"官方配比":"反推"}</span>`
      : `<span class="badge b-green">✍已定价 ${num2(mine.build_price)}（待导出）</span>`;
    if((g.conclusion||"").includes("待人工确认")) return `<span class="badge b-amber">待人工确认</span>`;
    if((g.conclusion||"").includes("离散")) return `<span class="badge b-red">离散·须分条</span>`;
    return `<span class="badge b-blue">可直接建库</span>`;
  };
  const catOf = g => g.review_status==="confirmed" ? "confirmed"
    : (g.conclusion||"").includes("离散") ? "multi"
    : (g.conclusion||"").includes("待人工确认") ? "round" : "single";
  const stTxt = {ambiguous:"同名多价行·匹配器拒判", multi:"同子目缺价材料≥2项，差额无法唯一拆分",
    no_qty:"缺价行无消耗量", negative:"已知合计>书印材料费（疑似匹配误命中）",
    no_material_cost:"子目无书印材料费", no_missing:"无未匹配行（状态不一致，留痕）"};
  const nConf = G.filter(g=>g.review_status==="confirmed").length;
  const nPriced = G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; }).length;
  const nMat = G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize).length;
  const cats = [["all","全部",G.length],["cand","库内有近似",G.filter(g=>(g.candidates||[]).length).length],
    ["single","单一价",G.filter(g=>catOf(g)==="single").length],
    ["round","舍入级·待确认",G.filter(g=>catOf(g)==="round").length],
    ["multi","离散分条",G.filter(g=>catOf(g)==="multi").length],
    ["priced","已定价待导出",nPriced],["mat","⚡已入库反推",nMat],
    ["confirmed","已确认回库",nConf],["fails","无法反推",FL.length]];
  main().innerHTML = `<div class="panel"><h2>💰 缺价反推 · 定价工作台（${G.length} 种材料 · 子目溯源 ${IT.length} 条 · 无法反推 ${FL.length} 条）</h2>
    <div class="note"><b>未匹配为何这么多（查验结论）</b>：全书价格附表共 ${DATA.stats.mat_prices} 条，半成品混合料（水泥砂浆/胶泥/灰土/玛蹄脂…）与市场化材料（龙骨/亚克力字/窗帘…）为选择性收录——属实、非漏配；匹配器带防误伤设计（单位一致门、同名多价拒判）${DATA.manual_findings&&DATA.manual_findings.some(f=>/玛蹄脂/.test(f.subject||""))?`，如石油沥青玛蹄脂库内为 kg 与消耗 m³ 不一致而正确拒配（已立案 manual_findings）`:""}。<br>
    <b>审核通路</b>：① 每组点 <b>✍ 定价</b>（弹窗内可比对<b>库内近似候选</b>与反推溯源明细，单位错配标红）→ ② 顶部 <b>⬇ 导出核价记录</b> 下载 JSON → ③ 将 rules 数组 merge 进 <code>out/price_confirm.json</code> 重跑 build_db → 组状态转 ✅已确认、build_price 覆盖 → ④ 向 material_prices 补录该价后相关子目 H3 自动复检转 pass。</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-d="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <input id="dqq" placeholder="过滤：材料/子目编号…" style="width:200px">
      <span class="rbtn" id="export-price" title="下载 price_confirm.json 兼容格式，merge 回 out/price_confirm.json 后重跑 build_db 生效">⬇ 导出核价记录（${nPriced}）</span></div>
    <div id="dbody"></div></div>`;
  const candBadge = g => {
    const cs = g.candidates||[];
    if(!cs.length) return `<span class="badge b-gray">无近似</span>`;
    const um = cs.some(c=>c.unit_match);
    return `<span class="rbtn" data-cand="${esc(g.material)}" data-cu="${esc(g.unit||"")}" title="${esc(cs.map(c=>c.name+"("+c.unit+") "+num2(c.price)).join("； "))}">🔍近似 ${cs.length}${um?"":""}</span>`;
  };
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{d:"all"}}).dataset.d;
    const kw = $("#dqq").value.trim();
    let list = cat==="all"||cat==="fails" ? G.slice() : cat==="cand" ? G.filter(g=>(g.candidates||[]).length)
      : cat==="priced" ? G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; })
      : cat==="mat" ? G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize)
      : G.filter(g=>catOf(g)===cat);
    if(kw) list = list.filter(g => g.material.includes(kw) || (JSON.parse(g.item_codes||"[]")).some(c=>c.includes(kw)));
    const body = list.map((g,i)=>{
      const rng = g.price_min===g.price_max ? num2(g.price_min) : num2(g.price_min)+" ~ "+num2(g.price_max);
      const sug = g.review_status==="confirmed" && g.build_price!=null ? num2(g.build_price)+"（人工定价）" : num2(g.suggested_price);
      const det = IT.filter(r=>r.material===g.material && r.unit===g.unit);
      const detRows = det.map(r=>`<tr class="clickable" data-item="${esc(r.item_code)}">
        <td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
        <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc(r.item_name||"")}</td>
        <td>${esc((S.chapter(r.chapter_code)||{}).name||r.chapter_code||"—")}</td>
        <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td>
        <td class="num">${num2(r.known)}</td><td class="num">${num2(r.remain)}</td></tr>`).join("");
      const priced = PCONF[pk(g.material,g.unit)];
      const matOn = priced && priced.materialize;
      return `<tr class="clickable" data-g="${i}">
        <td><b>${esc(g.material)}</b>${priced?` <span class="badge b-green">${matOn?"⚡"+num2(priced.build_price):"✍"+num2(priced.build_price)}</span>`:""}</td><td>${esc(g.unit)}</td>
        <td class="num" style="font-weight:700;color:var(--accent)">${sug}</td>
        <td class="num">${rng}</td><td class="num">${g.n_prices}</td><td class="num">${g.n_items}</td>
        <td>${candBadge(g)}</td>
        <td>${esc(g.conclusion)}</td><td>${badge(g)}
        <span class="rbtn" data-price="${esc(g.material)}" data-pu="${esc(g.unit||"")}" data-pp="${g.suggested_price!=null?g.suggested_price:""}">✍定价</span>
        <span class="rbtn" data-mat="${esc(g.material)}" data-mu="${esc(g.unit||"")}" data-pp="${g.suggested_price!=null?g.suggested_price:""}" title="以建议反推价直接入库，标注来源=反推；导出回库后参与H3复检">${matOn?"⚡已入库":"⚡入库"}</span></td></tr>
        <tr class="d-det" data-for="${i}" style="display:none"><td colspan="9" style="background:#fbfcfe">
          <div class="note" style="margin-bottom:4px">子目溯源明细（按反推价分组；溯源=书印材料费−已匹配合计=缺口额，÷消耗量=反推价）：</div>
          <table class="tbl"><thead><tr><th class="num">反推单价</th><th>子目</th><th>名称</th><th>章</th>
            <th class="num">消耗量</th><th class="num">书印材料费</th><th class="num">已匹配合计</th><th class="num">缺口额</th></tr></thead>
          <tbody>${detRows||'<tr><td colspan="8">无</td></tr>'}</tbody></table></td></tr>`;
    }).join("");
    const failRows = FL.map(f=>{
      const it = DATA.items.find(x=>x.item_code===f.item_code)||{};
      const rn = JSON.parse(f.rows_json||"[]").map(r=>`${r.name}(${r.unit||""})`).join("、")||"—";
      return `<tr class="clickable" data-item="${esc(f.item_code)}"><td style="font-family:var(--mono)">${esc(f.item_code)}</td>
        <td>${esc(it.name||"")}</td><td>${esc((S.chapter(f.chapter_code)||{}).name||f.chapter_code||"—")}</td>
        <td>${esc(stTxt[f.status]||f.status)}</td><td>${esc(rn)}</td></tr>`;
    }).join("");
    $("#dbody").innerHTML =
      (cat!=="fails" && list.length ? `<table class="tbl"><thead><tr><th>材料</th><th>单位</th><th class="num">建议建库价</th>
        <th class="num">反推价区间</th><th class="num">价种类</th><th class="num">子目数</th><th>库内近似</th><th>结论</th><th>状态/操作</th></tr></thead>
        <tbody>${body}</tbody></table>
        <div class="note">命中 ${list.length} 组材料。<b>点击材料行</b>展开子目溯源，<b>🔍近似</b>看库内候选，<b>✍定价</b>打开定价弹窗，<b>点击子目行</b>弹出完整详情。</div>` : "") +
      (cat==="fails"||cat==="all" ? (FL.length && (cat==="fails"||!kw) ?
        `<h3>无法唯一反推的子目（须回原文补价，双缺材料差额无法拆分）</h3>
        <table class="tbl"><thead><tr><th>子目</th><th>名称</th><th>章</th><th>原因</th><th>涉及缺价行</th></tr></thead>
        <tbody>${failRows}</tbody></table>` : "") : "") +
      (!list.length && (cat!=="fails"||!FL.length) ? '<div class="note">无匹配。</div>' : "");
    document.querySelectorAll("#dbody tr[data-g]").forEach(tr=>tr.addEventListener("click",()=>{
      const det = document.querySelector(`#dbody .d-det[data-for="${tr.dataset.g}"]`);
      det.style.display = det.style.display==="none" ? "" : "none";
    }));
    document.querySelectorAll("#dbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{ ev.stopPropagation(); openItem(tr.dataset.item); });
    });
    document.querySelectorAll("#dbody [data-cand]").forEach(el=>el.addEventListener("click",ev=>{
      ev.stopPropagation(); const g=G.find(x=>x.material===el.dataset.cand && (x.unit||"")===el.dataset.cu); openPriceDialog(g);
    }));
    document.querySelectorAll("#dbody [data-price]").forEach(el=>el.addEventListener("click",ev=>{
      ev.stopPropagation(); const g=G.find(x=>x.material===el.dataset.price && (x.unit||"")===el.dataset.pu); openPriceDialog(g);
    }));
    document.querySelectorAll("#dbody [data-mat]").forEach(el=>el.addEventListener("click",ev=>{
      ev.stopPropagation();

    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;

    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){

        <span style="font-family:var(--mono);color:var(--accent)">${esc(r.code||"—")}</span>
        <button class="x" id="dx">✕</button></div>
      <div class="note" style="margin-top:8px">${esc(r.text)}</div>
      ${r.page&&PAGEIMG.has(r.page)?`<div style="margin-top:10px"><span class="rbtn" id="dimg">🖼 弹出原文 P${r.page} 比对</span></div>`:""}
      <div class="done-form">
        ${isUnit?`<label>单位（核对原文后如需修正直接改，改值随核销记录导出）</label><input id="du" value="${esc(it.unit||"")}">`:""}
        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;
    $("#mask").classList.add("show");
    const close = ()=>$("#mask").classList.remove("show");
    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});

/* ---------------- 启动 ---------------- */
buildTree();
bindTree();
show("gs");
const first = document.querySelector('.tnode[data-id="gs"]');
first && first.classList.add("on");
refreshCounts();
</script>
</body>
</html>
