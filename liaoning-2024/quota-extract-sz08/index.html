林绿化工程。","tables":null,"tables_fixed":null},{"section_id":"GS-003","block_type":"总说明","chapter_code":null,"seq":3,"page":6,"print_page":1,"text":"三、本定额的作用:是国有投资或国有投资为主的建设项目,编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据;是评定投标报价合理性的依据;是调解处理工程造价争议和纠纷、审计和司法鉴定的依据:是编制投资估算指标、概算指标等文件的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","tables":null,"tables_fixed":null},{"section_id":"GS-004","block_type":"总说明","chapter_code":null,"seq":4,"page":6,"print_page":1,"text":"四、本定额是按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-005","block_type":"总说明","chapter_code":null,"seq":5,"page":6,"print_page":1,"text":"五、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"GS-006","block_type":"总说明","chapter_code":null,"seq":6,"page":7,"print_page":2,"text":"六、本定额消耗量和价格的确定:(一)人工工日:1. 本定额人工工日以综合工日表现,是按8 小时工作制编制的,人工等级分普通工(简称普工)、技术工(简称技工)和高级技术工(简称高级工),消耗量包括基本用工、超运距用工、人工幅度差、辅助用工和生产班组组织者用工。2. 本定额人工工日单价分别为:普工110 元,技工170 元,高级工330 元。3. 定额人工费,是指本定额项目综合单价中的人工费、按章节说明规定按系数调整的人工费以及定额中规定调整人工工日数量的人工费。按人工工日数量调整的人工费除章节有规定的工种外,均按普工工资标准调整人工费。(二)材料:1. 本定额采用的建筑材料、成品、半成品均按国家质量标准和相应的设计要求的合格产品考虑的;材料消耗量包括施工中消耗的主要材料、辅助材料、周转性材料和零星材料;材料消耗量包括净用量和损耗量,损耗量包括了施工操作损耗和场内运输、堆放损耗,规范(设计文件) 规定的预留量、搭接量不包括在损耗率中;用量很少、占材料比重很小的零星材料合并为其他材料费,以“元”表示。2. 本定额材料的场内搬运距离按300m 考虑的:设备场内搬运距离为150m。3. 本定额材料价格包括材料供应价(原价)、运杂费、运输损耗、采购保管费。本定额项目中的材料单价均为不含增值税的税前价格。4. 本定额中的周转性材料按不同施工方法、不同材质,计算出摊销量进入定额消耗量。5. 本定额的砂子用量是按含水率为零的干砂计算的。(三)施工机械台班:1. 本定额施工机械台班消耗量是按正常合理的机械配备、机械施工功效确定的,并已考虑了机械幅度差因素。2. 本定额施工机械原值在2000 元以内、使用年限在一年以内的不构成固定资产的小型机械,未列入机械台班消耗量,其费用包括在辽宁省《建设工程费用标准》的工具用具使用费中,其燃料动力消耗量包括在相应定额项目的材料项目内。3. 本定额加工机械、泵类机械、焊接机械及动力机械的操作人工均含在相应定额项目的人工消耗量中。4. 本定额施工机械台班单价是按现行的《施工机械台班费用标准》确定的。","tables":null,"tables_fixed":null},{"section_id":"GS-007","block_type":"总说明","chapter_code":null,"seq":7,"page":8,"print_page":3,"text":"七、本定额砂浆、混凝土除另有规定外,均按预拌或成品编制的,如果采用现场搅拌,拌制增加费按第九册《钢筋工程》相应项目调整。","tables":null,"tables_fixed":null},{"section_id":"GS-008","block_type":"总说明","chapter_code":null,"seq":8,"page":8,"print_page":3,"text":"八、本定额未考虑施工与生产同时进行、有害身体健康的环境中施工时降效增加费,发生时按各册规定计算。","tables":null,"tables_fixed":null},{"section_id":"GS-009","block_type":"总说明","chapter_code":null,"seq":9,"page":8,"print_page":3,"text":"九、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"GS-010","block_type":"总说明","chapter_code":null,"seq":10,"page":8,"print_page":3,"text":"十、本说明未尽事宜,详见各册及章节说明。","tables":null,"tables_fixed":null},{"section_id":"CS-011","block_type":"册说明","chapter_code":null,"seq":11,"page":14,"print_page":1,"text":"一、第八册《路灯工程》(以下简称本册定额),包括变配电设备工程、架空线路工程、电缆工程、配线配管工程、照明器具安装工程、防雷接地装置工程,共六章。","tables":null,"tables_fixed":null},{"section_id":"CS-012","block_type":"册说明","chapter_code":null,"seq":12,"page":14,"print_page":1,"text":"二、本册定额适用于新建、扩建的城镇道路、市政地下通道的照明工程,不适用于维修改造及庭院(园)内的照明工程。","tables":null,"tables_fixed":null},{"section_id":"CS-013","block_type":"册说明","chapter_code":null,"seq":13,"page":14,"print_page":1,"text":"三、本册定额编制依据:50857-2013;1. 《市政工程工程量计算规范》GB1-31-2021第八册《路灯工程》;2. 《市政工程消耗量》ZYA3. 《辽宁省建设工程计价依据市政工程》(2017);4. 《建筑电气工程施工质量验收规范》GB50303-2015;5. 《电气装置安装工程电气设备交接试验标准》GB50150-2016;6. 《电气装置安装工程电缆线路施工及验收规范》GB50168-2018;7. 《电气装置安装工程35kV 及以下架空电力线路施工及验收规范》GB50173-2012;8. 《电气装置安装工程电力变压器、油浸电抗器、互感器施工及验收规范》GB50148-2010;50149-2010;9. 《电气装置安装工程母线装置施工验收规范》GB10. 《电气装置安装工程高压电器施工及验收规范》GB50147-2010;50601-2010;11. 《建筑物防雷工程施工与质量验收规范》GB12. 国家法律、法规,国家设计规范;13. 有代表性的工程设计施工资料,现行设计规范、施工验收规范、操作规程及标准图集;14. 国家及省、市有关的计价依据、补充定额及有关资料。","tables":null,"tables_fixed":null},{"section_id":"CS-014","block_type":"册说明","chapter_code":null,"seq":14,"page":15,"print_page":2,"text":"四、本册定额与通用安装工程相关项目的界线划分,以路灯系统与城市供电系统相交为界,界限以内执行本册定额。","tables":null,"tables_fixed":null},{"section_id":"CS-015","block_type":"册说明","chapter_code":null,"seq":15,"page":15,"print_page":2,"text":"五、本册定额不包括线路参数的测定、运行和系统调试工作。","tables":null,"tables_fixed":null},{"section_id":"CS-016","block_type":"册说明","chapter_code":null,"seq":16,"page":15,"print_page":2,"text":"六、本册定额电压等级按10kV 以下考虑的。","tables":null,"tables_fixed":null},{"section_id":"CS-017","block_type":"册说明","chapter_code":null,"seq":17,"page":15,"print_page":2,"text":"七、本册定额除另有说明外,均不含土石方项目,如发生执行第一册《土石方工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"CS-018","block_type":"册说明","chapter_code":null,"seq":18,"page":15,"print_page":2,"text":"八、路灯设施迁移、迁改的保护性拆除费用按相应新建定额子目人工费加机械费之和乘以系数0.5。","tables":null,"tables_fixed":null},{"section_id":"CS-019","block_type":"册说明","chapter_code":null,"seq":19,"page":15,"print_page":2,"text":"九、本册说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"ZS-020","block_type":"章说明","chapter_code":"0801","seq":20,"page":18,"print_page":5,"text":"一、本章定额包括杆上安装变压器、地上安装变压器、组合型成套箱式变电站安装、高压成套配电柜安装、成套低压路灯控制柜安装、落地式控制箱安装、杆上控制箱安装、杆上配电设备安装、成套配电箱安装、控制继电器保护屏安装、控制台安装、电力电容器安装、熔断器安装、限位开关安装、控制器、启动器安装等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-021","block_type":"章说明","chapter_code":"0801","seq":21,"page":18,"print_page":5,"text":"二、变压器安装用枕木、绝缘导线、石棉布是按折旧率摊销计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-022","block_type":"章说明","chapter_code":"0801","seq":22,"page":18,"print_page":5,"text":"三、变压器油按设备带来考虑,但施工中变压器油的过滤损耗及操作损耗已包括在有关子目中。","tables":null,"tables_fixed":null},{"section_id":"ZS-023","block_type":"章说明","chapter_code":"0801","seq":23,"page":18,"print_page":5,"text":"四、地埋变压器安装执行组合型成套箱式变电站安装子目。","tables":null,"tables_fixed":null},{"section_id":"ZS-024","block_type":"章说明","chapter_code":"0801","seq":24,"page":18,"print_page":5,"text":"五、干式变压器安装执行《通用安装工程定额》第四册《电气设备安装工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-025","block_type":"章说明","chapter_code":"0801","seq":25,"page":18,"print_page":5,"text":"六、高压成套配电柜安装是综合考虑编制的,执行中不做调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-026","block_type":"章说明","chapter_code":"0801","seq":26,"page":18,"print_page":5,"text":"七、配电及控制设备安装,均不包括支架制作和基础型钢制作安装,也不包括设备元器件安装及端子板外部接线,应另按相应项目执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-027","block_type":"章说明","chapter_code":"0801","seq":27,"page":18,"print_page":5,"text":"八、铁构件制作安装适用于本册范围内的各种支架制作安装,但铁构件制作安装均不包括无损探伤、除锈、防腐工程,如发生执行《通用安装工程定额》相应项目。轻型铁构件是指厚度在3mm 以内的构件。","tables":null,"tables_fixed":null},{"section_id":"ZS-028","block_type":"章说明","chapter_code":"0801","seq":28,"page":18,"print_page":5,"text":"九、各项设备安装均未包括接线端子及二次接线。","tables":null,"tables_fixed":null},{"section_id":"ZS-029","block_type":"章说明","chapter_code":"0801","seq":29,"page":18,"print_page":5,"text":"十、配电箱、控制箱按功能分别列项编制,如实际上配电、控制在同一箱中,执行配电箱项目。配电箱、控制箱是按设备整体供货考虑的,如现场配置控制元器件,执行本章相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-030","block_type":"章说明","chapter_code":"0801","seq":30,"page":19,"print_page":6,"text":"十一、开关扩展模块、智能照明控制器在9 路以上时,人工乘以系数1.15。","tables":null,"tables_fixed":null},{"section_id":"ZS-031","block_type":"章说明","chapter_code":"0801","seq":31,"page":19,"print_page":6,"text":"十二、本章中涉及信号传输配线,执行《通用安装工程定额》第五册《建筑智能化工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-032","block_type":"计算规则","chapter_code":"0801","seq":32,"page":19,"print_page":6,"text":"一、变压器安装,按不同容量以“台”为计量单位。一般情况下不需要变压器干燥,如确实需要干燥,执行《通用安装工程定额》相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-033","block_type":"计算规则","chapter_code":"0801","seq":33,"page":19,"print_page":6,"text":"二、变压器油过滤,不论过滤多少次,直到过滤合格为止。以“t”为计量单位,变压器油的过滤量,可按制造厂提供的油量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-034","block_type":"计算规则","chapter_code":"0801","seq":34,"page":19,"print_page":6,"text":"三、高压成套配电柜和组合箱式变电站安装,以“台”为计量单位,均未包括基础槽钢、母线及引下线的安装。","tables":null,"tables_fixed":null},{"section_id":"JR-035","block_type":"计算规则","chapter_code":"0801","seq":35,"page":19,"print_page":6,"text":"四、各种配电箱、柜安装均按不同半周长以“套”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-036","block_type":"计算规则","chapter_code":"0801","seq":36,"page":19,"print_page":6,"text":"五、铁构件制作安装按施工图示以“100kg”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-037","block_type":"计算规则","chapter_code":"0801","seq":37,"page":19,"print_page":6,"text":"六、盘柜配线按不同截面、长度按下表计算:","tables":null,"tables_fixed":null},{"section_id":"ZS-038","block_type":"章说明","chapter_code":"0802","seq":38,"page":72,"print_page":59,"text":"一、本章定额包括电杆组立,横担安装,导线架设,底盘、卡盘、拉盘安装及电杆焊接、防腐,引下线支架安装,拉线制作安装,绝缘子安装,基础工程,路灯设施编号等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-039","block_type":"章说明","chapter_code":"0802","seq":39,"page":72,"print_page":59,"text":"二、本章定额按平原条件编制的,如在丘陵、山地施工时,其人工和机械乘以下列地形系数:","tables":null,"tables_fixed":null},{"section_id":"JR-040","block_type":"计算规则","chapter_code":"0802","seq":40,"page":73,"print_page":60,"text":"一、底盘、卡盘、拉线盘接设计用量以“块”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-041","block_type":"计算规则","chapter_code":"0802","seq":41,"page":73,"print_page":60,"text":"二、各种电线杆组立,分材质与高度,按设计数量以“根”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-042","block_type":"计算规则","chapter_code":"0802","seq":42,"page":73,"print_page":60,"text":"三、拉线制作安装,按施工图设计规定,分不同形式以“组”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-043","block_type":"计算规则","chapter_code":"0802","seq":43,"page":73,"print_page":60,"text":"四、横担安装,按施工图设计规定,分不同线数和电压等级以“组”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-044","block_type":"计算规则","chapter_code":"0802","seq":44,"page":74,"print_page":61,"text":"五、导线架设,分导线类型与截面,按1km/ 单线计算,导线预留长度规定如下表:","tables":null,"tables_fixed":null},{"section_id":"ZS-045","block_type":"章说明","chapter_code":"0803","seq":45,"page":98,"print_page":85,"text":"一、本章定额包括电缆敷设,电缆保护管敷设,电缆终端头制作安装,电缆中间头制作安装,电缆沟铺砂盖板、揭盖板,电缆穿刺线夹安装,电缆井设置等项目。未考虑在河流和水区、水底、井下等条件的电缆敷设等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-046","block_type":"章说明","chapter_code":"0803","seq":46,"page":98,"print_page":85,"text":"二、电缆保护管钢管、塑料管执行配管配线相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-047","block_type":"章说明","chapter_code":"0803","seq":47,"page":98,"print_page":85,"text":"三、电缆敷设是按照三芯(包括三芯连地)编制的,电缆每增加一芯相应定额增加15%。单芯电力电缆敷设按照同截面电缆敷设定额乘以系数0.7,两芯电缆按照三芯电缆定额执行。截面400mm2 以上至800mm2 的单芯电力电缆敷设,按照400mm2 电力电缆敷设定额乘以系数1.35。截面800mm2 以上至1600mm2 的单芯电力电缆敷设,按照400mm2 电力电缆敷设定额乘以系数1.85。电缆终端头、中间头适用此条规定。","tables":null,"tables_fixed":null},{"section_id":"ZS-048","block_type":"章说明","chapter_code":"0803","seq":48,"page":98,"print_page":85,"text":"四、竖直通道敷设电缆定额适用于单段高度>3.6m 的布放段。在单段高度≤3.6m 的竖向敷设电缆时,应执行“水平敷设电缆”相应定额。","tables":null,"tables_fixed":null},{"section_id":"ZS-049","block_type":"章说明","chapter_code":"0803","seq":49,"page":98,"print_page":85,"text":"五、铝芯电缆执行铜芯电缆项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-050","block_type":"章说明","chapter_code":"0803","seq":50,"page":98,"print_page":85,"text":"六、电缆在山地丘陵地区直埋敷设时,人工乘以系数1.3。该地段所需的材料如固定桩、夹具等按实计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-051","block_type":"章说明","chapter_code":"0803","seq":51,"page":98,"print_page":85,"text":"七、电缆敷设中均未考虑波形增加长度及预留等富余长度,该长度应计入工程量之内。","tables":null,"tables_fixed":null},{"section_id":"ZS-052","block_type":"章说明","chapter_code":"0803","seq":52,"page":99,"print_page":86,"text":"八、本项目未包括下列工作内容:1. 隔热层,保护层的制作安装。2. 电缆的冬季施工加温工作。","tables":null,"tables_fixed":null},{"section_id":"JR-053","block_type":"计算规则","chapter_code":"0803","seq":53,"page":100,"print_page":87,"text":"一、直埋电缆的挖、填土(石)方、除特殊要求外,可按下表计算土方量:","tables":null,"tables_fixed":null},{"section_id":"ZS-054","block_type":"章说明","chapter_code":"0804","seq":54,"page":122,"print_page":109,"text":"一、本章定额包括:电线管敷设,钢管敷设,塑料管敷设,塑料波纹管敷设,管内穿线,塑料护套线明敷设,接线箱安装,接线盒安装,带形母线安装,带形母线引下线安装,钢索架设,母线拉紧装置及钢索拉紧装置制作安装等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-055","block_type":"章说明","chapter_code":"0804","seq":55,"page":122,"print_page":109,"text":"二、定额中不包括支架的制作安装,其费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-056","block_type":"章说明","chapter_code":"0804","seq":56,"page":122,"print_page":109,"text":"三、本章控制柜箱进出线管安装适用于杆上、落地等各种形式。","tables":null,"tables_fixed":null},{"section_id":"JR-057","block_type":"计算规则","chapter_code":"0804","seq":57,"page":123,"print_page":110,"text":"一、管内穿线工程量计算,应区别线路性质、导线材质、导线截面积,按单线路长度计算。线路的分支接头线的长度已综合考虑在定额中,不再计算接头长度。","tables":null,"tables_fixed":null},{"section_id":"JR-058","block_type":"计算规则","chapter_code":"0804","seq":58,"page":123,"print_page":110,"text":"二、塑料护套线明敷设工程量计算,应区别导线截面积、导线芯数,敷设位置,按单线路长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-059","block_type":"计算规则","chapter_code":"0804","seq":59,"page":123,"print_page":110,"text":"三、各种配管的工程量计算,应区别不同敷设方式、敷设位置、管材材质、规格,以“m”为计量单位。不扣除管路中间的接线箱(盒)、灯盒、开关盒所占长度。","tables":null,"tables_fixed":null},{"section_id":"JR-060","block_type":"计算规则","chapter_code":"0804","seq":60,"page":123,"print_page":110,"text":"四、钢索架设工程量计算,应区分圆钢、钢索直径,按图示设计尺寸以长度计算,不扣除拉紧装置所占长度。","tables":null,"tables_fixed":null},{"section_id":"JR-061","block_type":"计算规则","chapter_code":"0804","seq":61,"page":123,"print_page":110,"text":"五、母线拉紧装置及钢索拉紧装置制作安装工程量计算,应区别母线截面积、花篮螺栓直径以“10 套”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-062","block_type":"计算规则","chapter_code":"0804","seq":62,"page":123,"print_page":110,"text":"六、带形母线安装工程量计算,应区分母线材质、母线截面积、安装位置,按长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-063","block_type":"计算规则","chapter_code":"0804","seq":63,"page":123,"print_page":110,"text":"七、接线盒安装工程量计算,应区别安装形式,以及接线盒类型,以“10 个”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-064","block_type":"计算规则","chapter_code":"0804","seq":64,"page":123,"print_page":110,"text":"八、开关、插座、按钮等的预留线,已分别综合在相应定额内,不另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-065","block_type":"章说明","chapter_code":"0805","seq":65,"page":158,"print_page":145,"text":"一、本章定额包括单臂挑灯架安装,双臂悬挑灯架安装,广场灯架安装,高杆灯架安装,其它灯具安装,照明器件安装,太阳能电池板及蓄电池安装,杆座安装等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-066","block_type":"章说明","chapter_code":"0805","seq":66,"page":158,"print_page":145,"text":"二、各种灯柱、灯架、元器具件配线执行管内穿线相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-067","block_type":"章说明","chapter_code":"0805","seq":67,"page":158,"print_page":145,"text":"三、本章灯架安装工程中高度18m 以上为高杆灯架。","tables":null,"tables_fixed":null},{"section_id":"ZS-068","block_type":"章说明","chapter_code":"0805","seq":68,"page":158,"print_page":145,"text":"四、本章灯架安装不包括灯杆安装,灯杆安装执行第二章“10KV 以下架空线路工程” 电杆组立相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-069","block_type":"章说明","chapter_code":"0805","seq":69,"page":158,"print_page":145,"text":"五、本章定额已包括利用仪表测量绝缘及一般灯具的试亮工作。","tables":null,"tables_fixed":null},{"section_id":"ZS-070","block_type":"章说明","chapter_code":"0805","seq":70,"page":158,"print_page":145,"text":"六、本章定额未包括电缆接头的制作及导线的焊压接线端子。如实际使用时,执行相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-071","block_type":"章说明","chapter_code":"0805","seq":71,"page":158,"print_page":145,"text":"七、本章定额未包括灯光调试费用,按实际发生计算。","tables":null,"tables_fixed":null},{"section_id":"JR-072","block_type":"计算规则","chapter_code":"0805","seq":72,"page":159,"print_page":146,"text":"一、各种悬挑灯、广场灯、高杆灯灯架分别以“10 套”、“套”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-073","block_type":"计算规则","chapter_code":"0805","seq":73,"page":159,"print_page":146,"text":"二、各种灯具、照明器件安装分别以“10 套”、“套”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-074","block_type":"计算规则","chapter_code":"0805","seq":74,"page":159,"print_page":146,"text":"三、灯杆座安装以“10 只”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-075","block_type":"章说明","chapter_code":"0806","seq":75,"page":184,"print_page":171,"text":"一、本章定额包括接地极(板)制作安装,接地母线敷设,避雷引下线敷设,避雷针安装,接地跨接线安装等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-076","block_type":"章说明","chapter_code":"0806","seq":76,"page":184,"print_page":171,"text":"二、本章定额适用于高杆灯杆防雷接地,变配电系统接地及避雷针接地装置。","tables":null,"tables_fixed":null},{"section_id":"ZS-077","block_type":"章说明","chapter_code":"0806","seq":77,"page":184,"print_page":171,"text":"三、接地母线敷设项目按自然地坪和一般土质考虑的,包括地沟的挖填土和夯实工作,执行本项目不应再计算土方量。如遇有石方、矿渣、积水、障碍物等情况执行第一册《土石方工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-078","block_type":"章说明","chapter_code":"0806","seq":78,"page":184,"print_page":171,"text":"四、本章定额不适用于采用爆破法施工敷设接地线、安装接地 const REVIEW = (() => {
  const it = c => DATA.items.find(x=>x.item_code===c);
  const fail = [], unmatched = [], units = [], mids = [];
  (DATA.h3_review||[]).forEach(h=>{
    const d = JSON.parse(h.detail||"{}");
    if(h.status==="fail")
      fail.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:`书印材料费 ${num2(d.declared)} ≠ 价格库反推 ${num2(d.calc)}（差 ${num2(d.diff)}）`, act:"需人工对价"});
    else if(h.status==="skip_unmatched")
      unmatched.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:(d.note||"材料未匹配")+"："+(d.missing||[]).map(m=>`${m.name}(${m.unit||""})`).join("、"), act:"需补价格库"});
  });
  (DATA.issues||[]).forEach(i=>{
    if(i.review_status==="confirmed") return; // 人工已确认（out/manual_confirm.json overlay）
    const m = (i.descr||"").match(/子目\s*(\d+-\d+)/);
    const code = m && it(m[1]) ? m[1] : null;
    if(i.itype==="单位存疑")
      units.push({code, page:i.page, text:i.descr, act:"单位待确认", src:i.source, itype:i.itype});
    else if(i.severity==="mid")
      mids.push({code, page:i.page, text:(i.itype?`[${i.itype}] `:"")+(i.descr||""), act:i.source==="toc"?"目录层":(i.source+"章抽取"), src:i.source, itype:i.itype||null});
  });
  return {fail, unmatched, units, mids};
})();
const REVIEW_TOTAL = REVIEW.fail.length + REVIEW.unmatched.length + REVIEW.units.length + REVIEW.mids.length;

function refreshCounts(){
  const ds = doneStats();

    unit:REVIEW.units.length-ds.unit, mid:REVIEW.mids.length-ds.mid};

}

const CH13="0113", CH17="0117";

const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：sz08=2-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

  if(id==="mj"){ return viewSections("建设工程建筑面积计算规范", S.sectionsBy("规范")); }
  if(id==="toc"){ return viewToc(); }
  if(id==="price"){ return viewPrice(); }

function secBlock(s, open){
  const tb = S.sec(s.tables), tbf = S.sec(s.tables_fixed);
  let tbs = "";
  if(tb){
    tbs += `<table class="tbl">${tb.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>
    <div class="sec-bd">${esc(s.text)}${tbs}</div></div>`;
}

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

function viewNotes(secCh){
  const pre = itemPrefix(secChToCode(secCh));
  const rows = [];
  Object.entries(DATA.details).forEach(([code,d])=>{
    if(!code.startsWith(pre)) return;
    (d.notes||[]).forEach(n=>{
      rows.push({code, n, rules:(n.rules||[])});
    });
  });
  main().innerHTML = `<div class="panel"><h2>子目附注（${rows.length} 条 · 已解析为换算规则）</h2>
    ${rows.map(r=>`<div class="sec-item"><div class="sec-hd"><span class="sid">${r.code==="__chapter__"?"章级":esc(r.code)}</span>
      <span>${esc(r.n.text)}</span></div><div class="sec-bd">
      ${r.rules.length?`<table class="tbl"><thead><tr><th>类型</th><th>对象</th><th>系数</th><th>计价</th><th>条件</th></tr></thead><tbody>
        ${r.rules.map(x=>`<tr><td>${esc(x.type||"—")}</td><td>${esc(x.target||"—")}</td><td class="num">${x.factor??"—"}</td><td>${esc(x.pricing||"—")}</td><td>${esc(x.cond||"—")}</td></tr>`).join("")}
      </tbody></table>`:"<div class='note'>无可结构化系数（纯文字说明）</div>"}
    </div></div>`).join("")}</div>`;
  bindSecs();
}

  const d = DATA.details[code]||{};
  const v = d.validate||{};
  const hd = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent)">${esc(i.item_code)}</span>
    <b style="font-size:16px">${esc(i.name)}</b><span class="badge b-gray">${esc(i.category||"")}</span>
    <span class="badge b-blue">单位 ${esc(i.unit)}</span>
    <span class="badge b-gray">P${i.page}/印${i.print_page}</span>
    ${PAGEIMG.has(i.page)?`<span class="rbtn" id="ibimg" title="弹出原文页面图核对">🖼 原文页</span>`:""}
    <span class="badge ${v.H1&&v.H1.ok?"b-green":"b-red"}">H1 基价恒等</span>
    <span class="badge ${v.H2&&v.H2.ok?"b-green":"b-red"}">H2 人工三档</span>
    ${h3badge(i.h3_status)}
    <span class="badge ${v.H4&&v.H4.ok?"b-green":"b-gray"}">H4 ${v.H4&&v.H4.ok?"通过":"不适用"}</span>
    ${i.errata_status==="hit"?`<span class="badge b-blue" title="该子目被官方勘误覆盖，erratas 表双值留痕">勘误覆盖</span>`:""}
    <button class="x" id="mx">✕</button></div>`;
  const p4 = `<div class="price4">
    <div class="it total"><div class="k">基价</div><div class="v">${num2(i.base_price)}</div></div>
    <div class="it"><div class="k">人工费</div><div class="v">${num2(i.labor_cost)}</div></div>
    <div class="it"><div class="k">材料费</div><div class="v">${num2(i.material_cost)}</div></div>
    <div class="it"><div class="k">机械费</div><div class="v">${num2(i.machine_cost)}</div></div>
    <div class="it"><div class="k">综合费用</div><div class="v">${num2(i.combined_cost)}</div></div></div>`;
  const tbl = (title, rows, cols) => rows.length ? `<h3>${title}（${rows.length}）</h3>
    <table class="tbl"><thead><tr>${cols.map(c=>`<th${c.n?' class="num"':''}>${c.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td${c.n?' class="num"':''}>${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
  const h2d = v.H2 && v.H2.ok ? `<div class="note">H2 对账：${v.H2.days} 工日 × 三档配比 → ${num2(v.H2.calc)} 元（三档配比 ${JSON.stringify(v.H2.tiers||{})}，当期人工单价 ${v.H2.rate} 元/工日）</div>` : "";
  let h3d = "";
  if(d.h3){
    const dt = d.h3.detail||{};
    if(d.h3.status==="fail") h3d = `<div class="warn">H3 超差：书印材料费 ${num2(dt.declared)} ≠ 价格库反推 ${num2(dt.calc)}（差 ${num2(dt.diff)}）。<b>需人工对价</b>——左侧「🔍 人工核对」清单可定位同类条目。</div>`;
    if(d.h3.status==="skip_unmatched"||d.h3.status==="unmatched") h3d = `<div class="warn">H3 跳过·未匹配：${esc(dt.note||"")}。缺价材料：${(dt.missing||[]).map(m=>`${esc(m.name)}(${esc(m.unit||"")})`).join("、")||"—"}，需补价格库后自动复检转通过。</div>`;
    if(d.h3.status==="skip_nomat"||d.h3.status==="nomat") h3d = `<div class="note">H3 跳过·免核：${esc(dt.note||"")}（不含材料子目）。</div>`;
  }
  const wcBlk = i.work_content
    ? `<div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa)"><b>工作内容</b>（计价主要参考）：${esc(i.work_content)}</div>`
    : "";
  const notes = (d.notes||[]).map(n=>`<div class="note">▪ ${esc(n.text)}</div>`).join("");
  let errd = "";
  if(i.errata_status==="hit"){
    const es = (DATA.erratas||[]).filter(e=>{
      try{ return (JSON.parse(e.item_codes||"[]")||[]).includes(code); }catch(_){ return false; }
    });
    if(es.length) errd = `<div class="warn">⚠ <b>官方勘误覆盖</b>（库内保留原文值，overlay 双值留痕）：${es.map(e=>`${esc(e.errata_type||"")} ${esc(e.wrong_text||"")} → <b>${esc(e.correct_text||"")}</b>（勘误号 ${esc(e.errata_id)}，印${e.printed_page??"?"}）`).join("<br>")}</div>`;
  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("材料消耗", d.materials||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("机械消耗", d.machines||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));
}

function viewDerive(){
  const G = DATA.price_derive||[], IT = DATA.price_derive_items||[], FL = DATA.price_derive_fails||[];
  const badge = g => {
    const mine = PCONF[pk(g.material, g.unit)];
    if(g.review_status==="confirmed") return `<span class="badge b-green">✅已确认${g.build_price!=null?" "+num2(g.build_price):""}</span>`;
    if(mine) return mine.materialize
      ? `<span class="badge b-green">⚡已入库 ${num2(mine.build_price)}·${mine.source==="官方配比"?"官方配比":"反推"}</span>`
      : `<span class="badge b-green">✍已定价 ${num2(mine.build_price)}（待导出）</span>`;
    if((g.conclusion||"").includes("待人工确认")) return `<span class="badge b-amber">待人工确认</span>`;
    if((g.conclusion||"").includes("离散")) return `<span class="badge b-red">离散·须分条</span>`;
    return `<span class="badge b-blue">可直接建库</span>`;
  };
  const catOf = g => g.review_status==="confirmed" ? "confirmed"
    : (g.conclusion||"").includes("离散") ? "multi"
    : (g.conclusion||"").includes("待人工确认") ? "round" : "single";
  const stTxt = {ambiguous:"同名多价行·匹配器拒判", multi:"同子目缺价材料≥2项，差额无法唯一拆分",
    no_qty:"缺价行无消耗量", negative:"已知合计>书印材料费（疑似匹配误命中）",
    no_material_cost:"子目无书印材料费", no_missing:"无未匹配行（状态不一致，留痕）"};
  const nConf = G.filter(g=>g.review_status==="confirmed").length;
  const nPriced = G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; }).length;
  const nMat = G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize).length;
  const cats = [["all","全部",G.length],["cand","库内有近似",G.filter(g=>(g.candidates||[]).length).length],
    ["single","单一价",G.filter(g=>catOf(g)==="single").length],
    ["round","舍入级·待确认",G.filter(g=>catOf(g)==="round").length],
    ["multi","离散分条",G.filter(g=>catOf(g)==="multi").length],
    ["priced","已定价待导出",nPriced],["mat","⚡已入库反推",nMat],
    ["confirmed","已确认回库",nConf],["fails","无法反推",FL.length]];
  main().innerHTML = `<div class="panel"><h2>💰 缺价反推 · 定价工作台（${G.length} 种材料 · 子目溯源 ${IT.length} 条 · 无法反推 ${FL.length} 条）</h2>
    <div class="note"><b>未匹配为何这么多（查验结论）</b>：全书价格附表共 ${DATA.stats.mat_prices} 条，半成品混合料（水泥砂浆/胶泥/灰土/玛蹄脂…）与市场化材料（龙骨/亚克力字/窗帘…）为选择性收录——属实、非漏配；匹配器带防误伤设计（单位一致门、同名多价拒判）${DATA.manual_findings&&DATA.manual_findings.some(f=>/玛蹄脂/.test(f.subject||""))?`，如石油沥青玛蹄脂库内为 kg 与消耗 m³ 不一致而正确拒配（已立案 manual_findings）`:""}。<br>
    <b>审核通路</b>：① 每组点 <b>✍ 定价</b>（弹窗内可比对<b>库内近似候选</b>与反推溯源明细，单位错配标红）→ ② 顶部 <b>⬇ 导出核价记录</b> 下载 JSON → ③ 将 rules 数组 merge 进 <code>out/price_confirm.json</code> 重跑 build_db → 组状态转 ✅已确认、build_price 覆盖 → ④ 向 material_prices 补录该价后相关子目 H3 自动复检转 pass。</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-d="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <input id="dqq" placeholder="过滤：材料/子目编号…" style="width:200px">
      <span class="rbtn" id="export-price" title="下载 price_confirm.json 兼容格式，merge 回 out/price_confirm.json 后重跑 build_db 生效">⬇ 导出核价记录（${nPriced}）</span></div>
    <div id="dbody"></div></div>`;
  const candBadge = g => {
    const cs = g.candidates||[];
    if(!cs.length) return `<span class="badge b-gray">无近似</span>`;
    const um = cs.some(c=>c.unit_match);
    return `<span class="rbtn" data-cand="${esc(g.material)}" data-cu="${esc(g.unit||"")}" title="${esc(cs.map(c=>c.name+"("+c.unit+") "+num2(c.price)).join("； "))}">🔍近似 ${cs.length}${um?"":""}</span>`;
  };
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{d:"all"}}).dataset.d;
    const kw = $("#dqq").value.trim();
    let list = cat==="all"||cat==="fails" ? G.slice() : cat==="cand" ? G.filter(g=>(g.candidates||[]).length)
      : cat==="priced" ? G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; })
      : cat==="mat" ? G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize)
      : G.filter(g=>catOf(g)===cat);
    if(kw) list = list.filter(g => g.material.includes(kw) || (JSON.parse(g.item_codes||"[]")).some(c=>c.includes(kw)));
    const body = list.map((g,i)=>{
      const rng = g.price_min===g.price_max ? num2(g.price_min) : num2(g.price_min)+" ~ "+num2(g.price_max);
      const sug = g.review_status==="confirmed" && g.build_price!=null ? num2(g.build_price)+"（人工定价）" : num2(g.suggested_price);
      const det = IT.filter(r=>r.material===g.material && r.unit===g.unit);
      const detRows = det.map(r=>`<tr class="clickable" data-item="${esc(r.item_code)}">
        <td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
        <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc(r.item_name||"")}</td>
        <td>${esc((S.chapter(r.chapter_code)||{}).name||r.chapter_code||"—")}</td>
        <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td>
        <td class="num">${num2(r.known)}</td><td class="num">${num2(r.remain)}</td></tr>`).join("");
      const priced = PCONF[pk(g.material,g.unit)];
      const matOn = priced && priced.materialize;
      return `<tr class="clickable" data-g="${i}">
        <td><b>${esc(g.material)}</b>${priced?` <span class="badge b-green">${matOn?"⚡"+num2(priced.build_price):"✍"+num2(priced.build_price)}</span>`:""}</td><td>${esc(g.unit)}</td>
        <td class="num" style="font-weight:700;color:var(--accent)">${sug}</td>
        <td class="num">${rng}</td><td class="num">${g.n_prices}</td><td class="num">${g.n_items}</td>
        <td>${candBadge(g)}</td>

  $("#export-price").addEventListener("click",()=>{

      const i=k.lastIndexOf("|"); return {"material":k.slice(0,i), "unit":k.slice(i+1),

    document.querySelectorAll("#main .chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();

  paint();
}

      <span class="chip on" id="hdchip" title="已核销行默认隐藏，点此切换显示">隐藏已核销</span>
      <input id="rq" placeholder="过滤：编号/关键字…" style="width:200px">
      <span class="rbtn" id="expbtn" title="导出已核销记录（manual_confirm.json 兼容格式，merge 后重跑 build_db 生效 overlay）">⬇ 导出核销记录</span></div>
    <div id="rbody"></div></div>`;
  let hideDone = true;
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{c:"all"}}).dataset.c;
    const kw = $("#rq").value.trim();
    const pick = {fail:REVIEW.fail, unmatched:REVIEW.unmatched, unit:REVIEW.units, mid:REVIEW.mids};
    let list = cat==="all"
      ? [...REVIEW.fail.map(r=>["fail",r]), ...REVIEW.unmatched.map(r=>["unmatched",r]),
         ...REVIEW.units.map(r=>["unit",r]), ...REVIEW.mids.map(r=>["mid",r])]
      : pick[cat].map(r=>[cat,r]);
    if(kw) list = list.filter(([c,r]) => (r.code||"").includes(kw) || (r.text||"").includes(kw));
    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;
    const shown = list.filter(([c,r]) => !(hideDone && DONE[rkey(c,r)])).slice(0,500);
    KEY2REC_CLEAR();
    const row = (cat, r) => {
      const key = rkey(cat, r);
      KEY2REC[key] = {cat, r};
      const done = DONE[key];
      const clk = r.code ? ` data-item="${esc(r.code)}"` : "";
      const imgBtn = (r.page && PAGEIMG.has(r.page))
        ? `<span class="rbtn" data-img="${r.page}" data-code="${esc(r.code||"")}">🖼 原文</span>`
        : `<span class="note" style="font-size:11px">无图</span>`;
      const act = done
        ? `<span class="rdone-mark">✅已核销</span> <span class="rbtn" data-undo="${esc(key)}">撤销</span>`
        : `<span class="rbtn" data-done="${esc(key)}" data-cat="${cat}">核销</span>`;
      return `<tr${clk} class="${done?"rdone":""}"><td><span class="badge ${badge[cat]}">${label[cat]}</span></td>
        <td style="font-family:var(--mono)">${esc(r.code||"—")}</td>
        <td class="num">${r.page??"—"}</td><td>${esc(r.text)}</td><td>${esc(r.act||"")}</td>
        <td style="white-space:nowrap">${imgBtn}</td><td style="white-space:nowrap">${act}</td></tr>`;
    };
    $("#rbody").innerHTML = `<table class="tbl"><thead><tr><th>类别</th><th>子目</th><th class="num">物理页</th><th>详情</th><th>处置</th><th>原文</th><th>操作</th></tr></thead><tbody>
      ${shown.map(([c,r])=>row(c,r)).join("") || '<tr><td colspan="7">无匹配</td></tr>'}</tbody></table>
      <div class="note">命中 ${list.length} 条 · 待核销 ${hidden} 条${list.length>500?"（仅渲染前 500，请用过滤缩小范围）":""}。核销记录存于浏览器 localStorage（键 qtx_done_v1），「⬇ 导出核销记录」可下载 JSON 供回库。</div>`;
    document.querySelectorAll("#rbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{
        if(ev.target.closest("[data-done],[data-undo],[data-img]")) return;
        openItem(tr.dataset.item);
      });
    });
    document.querySelectorAll("#rbody [data-img]").forEach(el=>{
      el.addEventListener("click", ()=>showPageImg(+el.dataset.img, el.dataset.code||""));
    });
    document.querySelectorAll("#rbody [data-undo]").forEach(el=>{
      el.addEventListener("click", ()=>{ delete DONE[el.dataset.undo]; saveDone(); paint(); refreshCounts(); });
    });
    document.querySelectorAll("#rbody [data-done]").forEach(el=>{
      el.addEventListener("click", ()=>openDoneDialog(el.dataset.done, el.dataset.cat));
    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){
    const rec = KEY2REC[key]; if(!rec) return;
    const r = rec.r;
    const it = r.code ? DATA.items.find(x=>x.item_code===r.code) : null;
    const isUnit = cat==="unit" && it;
    $("#modal").innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:15px">核销确认</b><span class="badge ${badge[cat]}">${label[cat]}</span>
        <span style="font-family:var(--mono);color:var(--accent)">${esc(r.code||"—")}</span>
        <button class="x" id="dx">✕</button></div>
      <div class="note" style="margin-top:8px">${esc(r.text)}</div>
      ${r.page&&PAGEIMG.has(r.page)?`<div style="margin-top:10px"><span class="rbtn" id="dimg">🖼 弹出原文 P${r.page} 比对</span></div>`:""}
      <div class="done-form">
        ${isUnit?`<label>单位（核对原文后如需修正直接改，改值随核销记录导出）</label><input id="du" value="${esc(it.unit||"")}">`:""}
        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;
    $("#mask").classList.add("show");
    const close = ()=>$("#mask").classList.remove("show");
    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});

/* ---------------- 启动 ---------------- */
buildTree();
bindTree();
show("gs");
const first = document.querySelector('.tnode[data-id="gs"]');
first && first.classList.add("on");
refreshCounts();
</script>
</body>
