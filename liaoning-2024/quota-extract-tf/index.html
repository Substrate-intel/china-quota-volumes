ame":"十五、　消声静压箱安装","page":177},{"id":"TF-03-16","name":"十六、　静压箱制作、安装及其它","page":178},{"id":"TF-03-17","name":"十七、　人防排气阀门安装","page":180},{"id":"TF-03-18","name":"十八、　人防手动密闭阀门安装","page":182},{"id":"TF-03-19","name":"十九、　人防其他部件制作、安装","page":183}],"030704":[{"id":"TF-04-01","name":"一、　其他项目","page":200},{"id":"TF-04-02","name":"二、　系统调整费","page":202}]},"ch13_nodes":[],"sections":[{"section_id":"GS-001","block_type":"总说明","chapter_code":null,"seq":1,"page":6,"print_page":1,"text":"一、辽宁省建设工程计价依据《通用安装工程定额》(以下简称本定额),是依据国家《建设工程工程量清单计价规范》(GB50500-2013)、《建设工程工程量清单计算规范》(GB50855-2013)、《通用安装工程消耗量定额》(TY02-31-2021)及国家有关现行产品标准、设计规范、施工及验收规范、技术操作规程、质量评定标准、安全操作规程以及新技术、新材料、新工艺在施工中的应用编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-002","block_type":"总说明","chapter_code":null,"seq":2,"page":6,"print_page":1,"text":"二、本定额的适用范围:我省行政区域内的国有投资或国有投资为主的工业与民用建筑的新建、扩建、改建通用安装工程项目。","tables":null,"tables_fixed":null},{"section_id":"GS-003","block_type":"总说明","chapter_code":null,"seq":3,"page":6,"print_page":1,"text":"三、本定额的作用:是国有投资或国有投资为主的建设项目,编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据;是评定投标报价合理性的依据;是调解处理工程造价争议和纠纷、审计和司法鉴定的依据;是编制投资估算指标、概算指标和概算定额的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","tables":null,"tables_fixed":null},{"section_id":"GS-004","block_type":"总说明","chapter_code":null,"seq":4,"page":6,"print_page":1,"text":"四、本定额是按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-005","block_type":"总说明","chapter_code":null,"seq":5,"page":6,"print_page":1,"text":"五、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个定额项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"GS-006","block_type":"总说明","chapter_code":null,"seq":6,"page":7,"print_page":2,"text":"六、本定额消耗量和价格的确定:(一)人工工日:1. 本定额人工工日以综合工日表现,是按八小时工作制编制的,人工等级分普通工(简称普工)、技术工(简称技工)和高级技术工(简称高级工),消耗量包括基本用工、超运距用工、人工幅度差、辅助用工和生产班组组织者用工。2. 本定额人工工日单价分别为:普工110 元,技工170 元,高级工330 元。3. 定额人工费,是指本定额项目综合单价中的人工费、按章节说明规定按系数调整的人工费以及定额中规定调整人工工日数量的人工费。按人工工日数量调整的人工费除章节有规定的工种外,均按普工工资标准调整人工费。(二)材料:1. 本定额采用的建筑材料、成品、半成品均按国家质量标准和相应的设计要求的合格产品考虑的;材料消耗量包括施工中消耗的主要材料、辅助材料、周转性材料和零星材料;定额中的材料消耗量包括净用量和损耗量,损耗量包括了施工操作损耗和场内运输、堆放损耗,规范(设计文件)规定的预留量、搭接量不包括在损耗率中;用量很少、占材料比重很小的零星材料合并为其他材料费,以“元”表示。2. 本定额材料的场内搬运距离按300m 考虑的;设备场内搬运距离为150m。3. 本定额材料价格包括材料供应价(原价)、运杂费、运输损耗、采购保管费。本定额项目中的材料单价均为不含增值税的税前价格。4. 本定额中的周转性材料按不同施工方法、不同材质,计算出摊销量进入定额消耗量。(三)施工机械台班:1. 本定额施工机械台班消耗量是按正常合理的机械配备、机械施工功效确定的,并已考虑了机械幅度差因素。2. 本定额施工机械原值在2000 元以内、使用年限在一年以内的不构成固定资产的小型机械,未列入本定额机械台班消耗量,其费用包括在辽宁省《建设工程费用标准》的工具用具使用费中,其燃料动力消耗量包括在相应定额项目的材料项目内。3. 本定额加工机械、泵类机械、焊接机械及动力机械的操作人工均含在相应定额项目的人工消耗量中。4. 本定额施工机械台班单价是按现行的《施工机械台班费用标准》确定的。(四)仪器仪表1. 本定额的仪器仪表台班是按正常施工功效综合确定的。2. 单位价值在2000 元以内、使用年限在一年以内的不构成固定资产的仪器仪表,未列入本定额仪器仪表台班消耗量。","tables":null,"tables_fixed":null},{"section_id":"GS-007","block_type":"总说明","chapter_code":null,"seq":7,"page":8,"print_page":3,"text":"七、本定额未考虑施工与生产同时进行、有害身体健康的环境中施工时降效增加费,发生时按各册规定计算。","tables":null,"tables_fixed":null},{"section_id":"GS-008","block_type":"总说明","chapter_code":null,"seq":8,"page":8,"print_page":3,"text":"八、由供货商负责安装的设备,不执行本定额的相应安装项目,按供货合同税前价格增加3%的综合费用单独列项计入材料费。","tables":null,"tables_fixed":null},{"section_id":"GS-009","block_type":"总说明","chapter_code":null,"seq":9,"page":8,"print_page":3,"text":"九、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"GS-010","block_type":"总说明","chapter_code":null,"seq":10,"page":8,"print_page":3,"text":"十、本说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"CS-011","block_type":"册说明","chapter_code":null,"seq":11,"page":14,"print_page":1,"text":"一、第七册《通风空调安装工程》(以下简称本册定额)适用于通风空调设备及部件制作安装,通风管道制作安装,通风管道部件制作安装工程。","tables":null,"tables_fixed":null},{"section_id":"CS-012","block_type":"册说明","chapter_code":null,"seq":12,"page":14,"print_page":1,"text":"二、本册定额编制的主要技术依据有:1. 《民用建筑供暖通风与空气调节设计规范》GB50736-2012;2. 《工业建筑供暖通风与空气调节设计规范》GB50019-2015;3. 《通风与空调工程施工质量验收规范》GB50243-2016;4. 《通风与空调工程施工规范》GB50738-2011;5. 《通用安装工程工程量计算规范》GB50856-2013;6. 《通风管道技术规程》JGJ/ T141-2017;通风空调工程》GYD209-2000;7. 《全国统一安装工程预算定额安装工程》LD/ T74.1~4-2008 年;8. 《建设工程劳动定额9. 《风机盘管安装》01K403-2003;10. 《风阀选用与安装》07K120;11. 《金属、非金属风管支吊架(含抗震支吊架)》19K112-2019;12. 《暖通空调设计选用手册》(1999 年中国建筑标准设计研究所出版);13. 《通用安装工程消耗量》第七册《通风空调安装工程》TY02-31-2021。","tables":null,"tables_fixed":null},{"section_id":"CS-013","block_type":"册说明","chapter_code":null,"seq":13,"page":15,"print_page":2,"text":"三、执行说明:1. 通风设备、除尘设备为专供通风工程配套的各种风机及除尘设备。其它工业用风机(如热力设备用风机)及除尘设备安装执行第一册《机械设备安装工程》、第二册《热力设备与线缆安装工程》相应项目。2. 空调系统中管道配管执行第十册《给排水、采暖、燃气工程》相应项目,制冷机机房、锅炉房管道配管执行第八册《工业管道安装工程》相应项目。3. 管道及支架的除锈、油漆,管道的防腐蚀、绝热等内容,执行第十二册《刷油、防腐蚀、绝热工程》相应项目。(1)薄钢板风管刷油按其工程量执行相应项目,包含在项目中的法兰加固框、吊托支架刷油单独列项执行金属结构刷油项目。(2)薄钢板部件刷油按其工程量执行金属结构刷油项目。(3)未包括在风管工程量内而单独列项的各种支架(不锈钢吊托支架除外)的刷油按其工程量执行金属结构刷油项目。(4)薄钢板风管、部件以及单独列项的支架,其除锈不分锈蚀程度,均按其第一遍刷油的工程量,执行第十二册《刷油、防腐蚀、绝热工程》中除轻锈的项目。4. 安装在支架上的木衬垫,发生时按实计算;非金属衬垫发生时执行安装项目,非金属垫料按实计入成品材料价格。","tables":null,"tables_fixed":null},{"section_id":"CS-014","block_type":"册说明","chapter_code":null,"seq":14,"page":15,"print_page":2,"text":"四、下列费用可按系数分别计取:1. 系统调整费:按系统工程人工费7%计取,其费用中人工费占40%、材料费占10%、机械费占8%、仪器仪表费占42%。包括漏风量测试和漏光法测试费用。2. 脚手架搭拆费按定额人工费的2.8%计算,其费用中人工费占35%、材料费占53%、机械费占7%。3. 操作高度增加费:本册定额操作物高度是按距离操作基准面(楼地面)6m 以内考虑的,超过6m 时,超过部分工程量按定额人工费乘以下列系数计算操作高度增加费,其费用中人工费占70%、材料费占18%、机械费占12%。4. 建筑超高增加费:指高度在6 层或20m 以上的工业与民用建筑上进行安装时增加的费用按下表计算,其费用中人工费占36.5%、机械与仪器仪表费占63.5%。","tables":null,"tables_fixed":null},{"section_id":"CS-015","block_type":"册说明","chapter_code":null,"seq":15,"page":17,"print_page":4,"text":"五、定额中制作和安装的人工、材料、机械比例见下表:","tables":null,"tables_fixed":null},{"section_id":"ZS-016","block_type":"章说明","chapter_code":"0701","seq":16,"page":20,"print_page":7,"text":"一、本章内容包括空气加热器(冷却器),除尘设备,空调器,多联体空调机室外机,风机盘管,空气幕,VAV 变风量末端装置、分段组装式空调器,钢板密闭门,钢板挡水板,滤水器、溢水盘制作、安装,金属壳体制作、安装,过滤器安装,过滤器框架制作、安装,净化工作台、风淋室、通风机安装,设备支架制作安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-017","block_type":"章说明","chapter_code":"0701","seq":17,"page":20,"print_page":7,"text":"二、通风机安装项目内包括电动机安装,其安装形式包括A、B、C、D 等型,适用于碳钢、不锈钢、塑料通风机安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-018","block_type":"章说明","chapter_code":"0701","seq":18,"page":20,"print_page":7,"text":"三、有关说明:1. 诱导器安装执行诱导风机安装项目。2. VRV 系统的室内机按安装方式执行风机盘管项目,应扣除膨胀螺栓。3. 空气幕的支架制作安装执行设备支架项目。4. VAV 变风量末端装置适用单风道变风量末端和双风道变风量末端装置,风机动力型变风量末端装置人工乘以系数1.1。5. 洁净室安装执行分段组装式空调器安装项目。6. 玻璃钢和PVC 挡水板执行钢板挡水板安装项目。7. 低效过滤器包括:M-A 型、WL 型、LWP 型等系列。8. 中效过滤器包括:ZKL 型、YB 型、M 型、ZX-1 型等系列。9. 高效过滤器包括:GB 型、GS 型、JX-20 型等系列。10. 净化工作台包括:XHK 型、BZK 型、SXP 型、SZP 型、SZX 型、SW 型、SZ 型、SXZ 型、TJ 型、CJ 型等系列。11. 清洗槽、浸油槽、晾干架、LWP 滤尘器支架制作安装执行设备支架项目。12. 通风空调设备的电气接线执行第四册《电气设备与线缆安装工程》相应项目。13. 风机底座执行设备支架项目,但不包括减震器用量,减震器按设计图示数量计算。14. 过滤器安装项目中包括试装,如设计不要求试装,不作调整。15. 空调器和风机盘管的配管执行第十册《给排水采暖燃气工程》相应项目。16. 通风空调设备安装的地脚螺栓按设备自带考虑。设备安装项目中不包括设备费和应配备的地脚螺栓价值。","tables":null,"tables_fixed":null},{"section_id":"JR-019","block_type":"计算规则","chapter_code":"0701","seq":19,"page":22,"print_page":9,"text":"一、空气加热器(冷却器)安装按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-020","block_type":"计算规则","chapter_code":"0701","seq":20,"page":22,"print_page":9,"text":"二、除尘设备安装按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-021","block_type":"计算规则","chapter_code":"0701","seq":21,"page":22,"print_page":9,"text":"三、整体式空调机组、空调器安装(一拖一分体空调以室内机、室外机之和) 按设计图示数量计算,以“台”为计量单位。按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-022","block_type":"计算规则","chapter_code":"0701","seq":22,"page":22,"print_page":9,"text":"四、组合式空调机组安装依据设计风量,","tables":null,"tables_fixed":null},{"section_id":"JR-023","block_type":"计算规则","chapter_code":"0701","seq":23,"page":22,"print_page":9,"text":"五、多联体空调机室外机安装依据制冷量,按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-024","block_type":"计算规则","chapter_code":"0701","seq":24,"page":22,"print_page":9,"text":"六、风机盘管安装按设计图示数量计算,以“台”为计量单位。以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-025","block_type":"计算规则","chapter_code":"0701","seq":25,"page":22,"print_page":9,"text":"七、空气幕按设计图示数量计算,","tables":null,"tables_fixed":null},{"section_id":"JR-026","block_type":"计算规则","chapter_code":"0701","seq":26,"page":22,"print_page":9,"text":"八、VAV 变风量末端装置安装按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-027","block_type":"计算规则","chapter_code":"0701","seq":27,"page":22,"print_page":9,"text":"九、分段组装式空调器安装按设计图示质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-028","block_type":"计算规则","chapter_code":"0701","seq":28,"page":22,"print_page":9,"text":"十、钢板密闭门制作安装按设计图示数量计算,以“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-029","block_type":"计算规则","chapter_code":"0701","seq":29,"page":22,"print_page":9,"text":"十一、挡水板制作和安装按设计图示尺寸以空调器断面面积计算,以“m2”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-030","block_type":"计算规则","chapter_code":"0701","seq":30,"page":22,"print_page":9,"text":"十二、滤水器、溢水盘、电加热器外壳、金属空调器壳体制作安装按设计图示尺寸以质量计算,以“kg”为计量单位。非标准部件制作安装按成品质量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-031","block_type":"计算规则","chapter_code":"0701","seq":31,"page":22,"print_page":9,"text":"十三、高、中、低效过滤器安装、净化工作台、风淋室安装按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-032","block_type":"计算规则","chapter_code":"0701","seq":32,"page":23,"print_page":10,"text":"十四、过滤器框架制作按设计图示尺寸以质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-033","block_type":"计算规则","chapter_code":"0701","seq":33,"page":23,"print_page":10,"text":"十五、通风机安装依据不同形式、规格按设计图示数量计算,以“台”为计量单位。风机箱安装按设计图示数量计算,以“台”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-034","block_type":"计算规则","chapter_code":"0701","seq":34,"page":23,"print_page":10,"text":"十六、设备支架制作安装按设计图示尺寸以质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"ZS-035","block_type":"章说明","chapter_code":"0702","seq":35,"page":58,"print_page":45,"text":"一、本章内容包括镀锌薄钢板法兰风管制作安装,镀锌薄钢板共板法兰风管制作安装,薄钢板法兰风管制作安装,镀锌薄钢板矩形净化风管制作安装,不锈钢板风管制作安装,铝板风管制作安装,塑料通风管制作安装,玻璃钢风管安装,复合型风管制作安装,柔性软风管安装,弯头导流叶片、软管接口、风管检查孔、温度、风量测定孔制作安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-036","block_type":"章说明","chapter_code":"0702","seq":36,"page":58,"print_page":45,"text":"二、下列费用可按系数分别计取:圆形风管按平均直径、1. 薄钢板风管整个通风系统设计采用渐缩管均匀送风者,矩形风管按平均周长参照相应规格项目,其人工乘以系数2.5。按矩形风管平均周长执行相应风管规格项目,其人工乘以系数3,2. 如制作空气幕送风管时,其余不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-037","block_type":"章说明","chapter_code":"0702","seq":37,"page":58,"print_page":45,"text":"三、有关说明:1. 镀锌薄钢板风管项目中的板材是按镀锌薄钢板编制的,如设计要求不用镀锌薄钢板时,板材可以换算,其他不变。2. 风管导流叶片不分单叶片和香蕉形双叶片,均执行同一项目。3. 薄钢板通风管道、净化通风管道、玻璃钢通风管道、复合型风管制作安装项目中,包括弯头、三通、变径管、天圆地方等管件及法兰、加固框和吊托支架的制作安装,但不包括过跨风管落地支架,落地支架制作安装执行本册第一章\" 设备支架制作安装\" 项目。风管的加固无论采用楞筋、立筋、角钢、扁钢、加固筋和管内支撑等形式,即各种加强筋均已包括在相应风管制作定额中。4. 薄钢板风管项目中的板材,如设计要求厚度不同时可以换算,人工、机械消耗量不变。5. 净化风管、不锈钢板风管、铝板风管、塑料风管项目中的主体板材,如设计厚度不同时可以换算,人工、机械消耗量不变。6. 净化圆形风管制作安装执行本章矩形风管制作安装项目。如设计要求口缝不涂抹而只在法兰处涂抹时,7. 净化风管涂密封胶按全部口缝外表面涂抹考虑。每10m2 风管应减去密封胶1.5kg 和0.37 工日。型钢未包括镀锌费,如设计要求镀锌时,应另加镀锌费。8. 净化风管及部件制作安装项目中,9. 净化通风管道项目按空气洁净度100000 级编制。10. 不锈钢板风管咬口连接制作安装执行本章镀锌薄钢板风管法兰连接项目。11. 不锈钢板风管、铝板风管制作安装项目中包括管件,但不包括法兰和吊托支架;法兰和吊托支架应单独列项计算,执行相应项目。12. 塑料风管、复合型风管制作安装项目规格所表示的直径为内径,周长为内周长。13. 塑料风管制作安装项目中包括管件、法兰、加固框,但不包括吊托支架制作安装,吊托支架执行本册第一章\" 设备支架制作安装\" 项目。14. 塑料风管制作安装项目中的法兰垫料如与设计要求使用品种不同时可以换算,但人工消耗量不变。15. 塑料通风管道胎具材料摊销费的计算方法:塑料风管管件制作的胎具摊销材料费,未包括在内,按以下规定另行计算。(1)风管工程量在30m2 以上的,每10m2 风管的胎具摊销木材为0.06m3,按材料价格计算胎具材料摊销费。(2)风管工程量在30m2 以下的,每10m2 风管的胎具摊销木材为0.09m3,按材料价格计算胎具材料摊销费。16. 玻璃钢风管及管件按成品考虑,损耗在消耗量中。风管修补应由加工单位负责,其费用按实际发生的价格,计算在主材费用内。17. 软管(帆布)接头如使用人造革而不使用帆布时可以换算,项目中已综合考虑各种连接方式,其余不做调整。18. 项目中的法兰垫料按橡胶板编制,如与设计要求使用的材料品种不同时可以换算,但人工消耗量不变。使用泡沫塑料者每1kg 橡胶板换算为泡沫塑料0.125kg;使用闭孔乳胶海绵者每1kg 橡胶板换算为闭孔乳胶海绵0.5kg。19. 柔性软风管适用于由金属、涂塑化纤织物、聚酯、聚乙烯、聚氯乙烯薄膜、铝箔等材料制成的软风管。柔性软风管项目是按圆形风管考虑的,方、矩形风管可按周长折算,执行相应项目。","tables":null,"tables_fixed":null},{"section_id":"JR-038","block_type":"计算规则","chapter_code":"0702","seq":38,"page":61,"print_page":48,"text":"一、薄钢板风管、净化风管、不锈钢风管、铝板风管、塑料风管、玻璃钢风管、复合型风管按设计图示规格以展开面积计算,以“m2”为计量单位。不扣除检查孔、测定孔、送风口、吸风口等所占面积。风管展开面积不计算风管管口重叠部分面积。风管堵头堵板按设计图示规格以展开面积并入相应风管中。","tables":null,"tables_fixed":null},{"section_id":"JR-039","block_type":"计算规则","chapter_code":"0702","seq":39,"page":61,"print_page":48,"text":"二、薄钢板风管、净化风管、不锈钢风管、铝板风管、塑料风管、玻璃钢风管、复合型风管长度计算时均以设计图示中心线长度(主管与支管以其中心线交点划分),包括弯头、三通、变径管、天圆地方等管件的长度,不包括部件所占长度。","tables":null,"tables_fixed":null},{"section_id":"JR-040","block_type":"计算规则","chapter_code":"0702","seq":40,"page":61,"print_page":48,"text":"三、柔性软风管安装按设计图示中心线长度计算,以“m”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-041","block_type":"计算规则","chapter_code":"0702","seq":41,"page":61,"print_page":48,"text":"四、弯头导流叶片制作安装按设计图示叶片的面积计算,以“m2”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-042","block_type":"计算规则","chapter_code":"0702","seq":42,"page":61,"print_page":48,"text":"五、软管(帆布)接口制作安装按设计图示尺寸,以展开面积计算,以“m2”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-043","block_type":"计算规则","chapter_code":"0702","seq":43,"page":61,"print_page":48,"text":"六、风管检查孔制作安装按设计图示尺寸质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-044","block_type":"计算规则","chapter_code":"0702","seq":44,"page":61,"print_page":48,"text":"七、温度、风量测定孔制作安装依据其型号,按设计图示数量计算,以“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-045","block_type":"计算规则","chapter_code":"0702","seq":45,"page":62,"print_page":49,"text":"一、　镀锌薄钢板法兰风管制作、安装1. 　圆形风管(咬口)工作内容:制作:放样、下料、卷圆、轧口、咬口、制作直管、管件、法兰、吊托支架、钻孔、铆焊、上法兰、组对。安装:找标高、打支架墙洞、配合预留孔洞、埋设吊托支架、组装、风管就位、找平、找正、制垫、加垫、上螺栓、紧固。计量单位:10m2","tables":null,"tables_fixed":null},{"section_id":"ZS-046","block_type":"章说明","chapter_code":"0703","seq":46,"page":118,"print_page":105,"text":"一、本章内容包括碳钢调节阀安装,柔性软风管阀门安装,碳钢风口安装,不锈钢风口安装、法兰、吊托支架制作安装,塑料散流器安装、塑料空气分布器安装,铝制孔板口安装,碳钢风帽制作安装,塑料风帽、伸缩节制作安装,铝板风帽、法兰制作安装,玻璃钢风帽安装,罩类制作安装,塑料风罩制作安装,消声器安装,消声静压箱安装,静压箱制作安装,人防排气阀门安装,人防手动密闭阀门安装,人防其他部件制作安装。","tables":null,"tables_fixed":null},{"section_id":"ZS-047","block_type":"章说明","chapter_code":"0703","seq":47,"page":118,"print_page":105,"text":"二、下列费用按系数分别计取:1. 电动密闭阀安装执行手动密闭阀项目,人工乘以系数1.05。两副法兰螺栓及橡胶石棉垫圈。如为一侧接管时,人工乘2. 手(电)动密闭阀安装项目包括一副法兰,材料、机械乘以系数0.5。不包括吊托支架制作与安装,如发生按本册第一章\" 设备支架制作以系数0.6,安装\" 项目另行计算。3. 碳钢百叶风口安装项目适用于带调节板活动百叶风口、单层百叶风口、双层百叶风口、三层百叶风口、连动百叶风口、135 型单层百叶风口、135 型双层百叶风口、135 型带导流叶片百叶风口、活动金属百叶风口。风口的宽与长之比≤0.125 为条缝形风口,执行百叶风口项目,人工乘以系数1.1。","tables":null,"tables_fixed":null},{"section_id":"ZS-048","block_type":"章说明","chapter_code":"0703","seq":48,"page":118,"print_page":105,"text":"三、有关说明:1. 密闭式对开多叶调节阀与手动式对开多叶调节阀执行同一项目。2. 蝶阀安装项目适用于圆形保温蝶阀,方、矩形保温蝶阀,圆形蝶阀,方、矩形蝶阀,风管止回阀安装项目适用于圆形风管止回阀,方形风管止回阀。3. 铝合金或其他材料制作的调节阀安装应执行本章相应项目。4. 碳钢散流器安装项目适用于圆形直片散流器、方形直片散流器、流线形散流器。5. 碳钢送吸风口安装项目适用于单面送吸风口、双面送吸风口。金属防虫网可执行网式风口安装项目。回风口如发生过滤网,则单独计算过滤网主材,其它不变。6. 铝合金风口安装应执行碳钢风口项目,人工乘以系数0.9。电化费另行计算。7. 铝制孔板风口如需电化处理时,8. 其它材质和形式的排气罩制作安装可执行本章中相近的项目。9. 管式消声器安装适用于各类管式消声器。10. 静压箱吊托支架执行设备支架项目。11. 手摇(脚踏)电动两用风机安装,其支架按与设备配套编制,若自行制作,按本册第一章“设备支架制作安装”项目另行计算。12. 排烟风口吊托支架执行本册第一章\" 设备支架制作安装\" 项目。13. 除尘过滤器、过滤吸收器安装项目不包括支架制作安装,其支架制作安装执行本册第一章“设备支架制作安装”项目。14. 探头式含磷毒气报警器安装包括探头固定数和三角支架制作安装,报警器保护孔按建筑预留考虑。地脚螺栓(M12×200,15. γ 射线报警器探头安装孔项目按钢套管编制,6 个)按与设备配套编制。包括安装孔孔底电缆穿管,但不包括电缆敷设。如设计电缆穿管长度大于0.5m,超过部分另外执行相应项目。16. 密闭穿墙管项目填料按油麻丝、黄油封堵考虑,如填料不同,不作调整。17. 密闭穿墙管制作安装分类:Ⅰ型为薄钢板风管直接浇入混凝土墙内的密闭穿墙管;Ⅱ型为取样管用密闭穿墙管;Ⅲ型为薄钢板风管通过套管穿墙的密闭穿墙管。18. 密闭穿墙管按墙厚0.3m 编制,如与设计墙厚不同,管材可以换算,其余不变;Ⅲ型穿墙管项目不包括风管本身。","tables":null,"tables_fixed":null},{"section_id":"JR-049","block_type":"计算规则","chapter_code":"0703","seq":49,"page":120,"print_page":107,"text":"一、碳钢调节阀安装依据其类型、直径(圆形) 或周长(方形),按设计图示数量计算,以“个” 为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-050","block_type":"计算规则","chapter_code":"0703","seq":50,"page":120,"print_page":107,"text":"二、柔性软风管阀门安装按设计图示数量计算,以“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-051","block_type":"计算规则","chapter_code":"0703","seq":51,"page":120,"print_page":107,"text":"三、碳钢各种风口、散流器的安装依据类型、规格尺寸按设计图示数量计算,以“个”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-052","block_type":"计算规则","chapter_code":"0703","seq":52,"page":120,"print_page":107,"text":"四、钢百叶窗及活动金属百叶风口安装依据规格尺寸按设计图示数量计算,以“个”为计量单位。以“m2”","tables":null,"tables_fixed":null},{"section_id":"JR-053","block_type":"计算规则","chapter_code":"0703","seq":53,"page":120,"print_page":107,"text":"五、塑料通风管道柔性接口及伸缩节制作安装应依连接方式按设计图示尺寸以展开面积计算,为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-054","block_type":"计算规则","chapter_code":"0703","seq":54,"page":120,"print_page":107,"text":"六、塑料通风管道分布器、散流器的制作安装按其成品质量,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-055","block_type":"计算规则","chapter_code":"0703","seq":55,"page":120,"print_page":107,"text":"七、塑料通风管道风帽、罩类的制作均按其质量,以“kg”为计量单位;非标准罩类制作按成品质量,以“kg”为计量单位。罩类为成品安装时制作不再计算。以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-056","block_type":"计算规则","chapter_code":"0703","seq":56,"page":120,"print_page":107,"text":"八、不锈钢板风管圆形法兰制作按设计图示尺寸以质量计算,","tables":null,"tables_fixed":null},{"section_id":"JR-057","block_type":"计算规则","chapter_code":"0703","seq":57,"page":120,"print_page":107,"text":"九、不锈钢板风管吊托支架制作安装按设计图示尺寸以质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-058","block_type":"计算规则","chapter_code":"0703","seq":58,"page":121,"print_page":108,"text":"十、铝板圆伞形风帽、铝板风管圆、矩形法兰制作按设计图示尺寸以质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-059","block_type":"计算规则","chapter_code":"0703","seq":59,"page":121,"print_page":108,"text":"十一、碳钢风帽的制作安装均按其质量以“kg”为计量单位;非标准风帽制作安装按成品质量以“kg”为计量单位。风帽为成品安装时制作不再计算。","tables":null,"tables_fixed":null},{"section_id":"JR-060","block_type":"计算规则","chapter_code":"0703","seq":60,"page":121,"print_page":108,"text":"十二、碳钢风帽筝绳制作安装按设计图示规格长度以质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-061","block_type":"计算规则","chapter_code":"0703","seq":61,"page":121,"print_page":108,"text":"十三、碳钢风帽泛水制作安装按设计图示尺寸以展开面积计算,以“m2”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-062","block_type":"计算规则","chapter_code":"0703","seq":62,"page":121,"print_page":108,"text":"十四、碳钢风帽滴水盘制作安装按设计图示尺寸以质量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null},{"section_id":"JR-063","block_type":"计算规则","chapter_code":"0703","seq":63,"page":121,"print_page":108,"text":"十五、玻璃钢风帽安装依据成品质量按设计图示数量计算,以“kg”为计量单位。","tables":null,"tables_fixed":null   });

/* ---------------- 章节树 ---------------- */
const CH13="0113", CH17="0117";
const secChToCode = k => Object.keys(AMP_SEC).find(c=>AMP_SEC[c]===k);
const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：tf=2-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

/* ---------------- 内容渲染 ---------------- */
const main = () => $("#main");
function show(id){
  if(id.startsWith("item:")){ return openItem(id.slice(5)); }
  if(id==="gs"){ return viewSections(GS_TYPE, S.sectionsBy(GS_TYPE), extraGS); }
  if(id==="mj"){ return viewSections("建设工程建筑面积计算规范", S.sectionsBy("规范")); }
  if(id==="toc"){ return viewToc(); }
  if(id==="price"){ return viewPrice(); }
  if(id==="mix"){ return viewMix(); }
  if(id==="derive"){ return viewDerive(); }
  if(id==="errata"){ return viewErrata(); }
  if(id==="findings"){ return viewFindings(); }
  if(id==="issues"){ return viewIssues(); }
  if(id==="review"){ return viewReview(); }
  if(id==="fb17"){ return viewSections("第十七章 附表（样板）", S.sectionsBy("附表").filter(s=>!s.chapter_code)); }
  if(id.startsWith("ch:")){ return viewChapter(id.slice(3)); }
  if(id.startsWith("layer:")){ const p=id.split(":"); return viewLayer(p[1], p[2]); }
}

function secBlock(s, open){
  const tb = S.sec(s.tables), tbf = S.sec(s.tables_fixed);

  if(tb){
    tbs += `<table class="tbl">${tb.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>
    <div class="sec-bd">${esc(s.text)}${tbs}</div></div>`;

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

function viewNotes(secCh){
  const pre = itemPrefix(secChToCode(secCh));

    if(d.h3.status==="fail") h3d = `<div class="warn">H3 超差：书印材料费 ${num2(dt.declared)} ≠ 价格库反推 ${num2(dt.calc)}（差 ${num2(dt.diff)}）。<b>需人工对价</b>——左侧「🔍 人工核对」清单可定位同类条目。</div>`;
    if(d.h3.status==="skip_unmatched"||d.h3.status==="unmatched") h3d = `<div class="warn">H3 跳过·未匹配：${esc(dt.note||"")}。缺价材料：${(dt.missing||[]).map(m=>`${esc(m.name)}(${esc(m.unit||"")})`).join("、")||"—"}，需补价格库后自动复检转通过。</div>`;
    if(d.h3.status==="skip_nomat"||d.h3.status==="nomat") h3d = `<div class="note">H3 跳过·免核：${esc(dt.note||"")}（不含材料子目）。</div>`;
  }
  const wcBlk = i.work_content
    ? `<div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa)"><b>工作内容</b>（计价主要参考）：${esc(i.work_content)}</div>`
    : "";
  const notes = (d.notes||[]).map(n=>`<div class="note">▪ ${esc(n.text)}</div>`).join("");
  let errd = "";
  if(i.errata_status==="hit"){
    const es = (DATA.erratas||[]).filter(e=>{
      try{ return (JSON.parse(e.item_codes||"[]")||[]).includes(code); }catch(_){ return false; }
    });
    if(es.length) errd = `<div class="warn">⚠ <b>官方勘误覆盖</b>（库内保留原文值，overlay 双值留痕）：${es.map(e=>`${esc(e.errata_type||"")} ${esc(e.wrong_text||"")} → <b>${esc(e.correct_text||"")}</b>（勘误号 ${esc(e.errata_id)}，印${e.printed_page??"?"}）`).join("<br>")}</div>`;
  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("材料消耗", d.materials||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("机械消耗", d.machines||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));
}

  main().innerHTML = `<div class="panel"><h2>价格库</h2>

    <input id="pq" placeholder="名称搜索…" style="width:220px"></div>
    <div id="pbody"></div></div>`;
  let src = "all";
  const srcFn = p => src==="all" || (src==="rev" ? p.source==="反推" : src==="off" ? p.source==="官方配比" : (p.source!=="反推" && p.source!=="官方配比"));

    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">序</th><th>名称</th><th>单位</th><th class="num">单价(元)</th><th class="num">页</th><th>来源</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${p.seq}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="num">${num2(p.price)}</td><td class="num">${p.page??"—"}</td>
      <td>${p.source==="反推"?'<span class="badge b-amber">⚡反推入库</span>':p.source==="官方配比"?'<span class="badge b-green">官方配比</span>':'<span class="badge b-gray">附表</span>'}</td></tr>`).join("")}</tbody></table>
      ${kw||src!=="all"?`<div class="note">命中 ${hits.length} 条${kw?"（按名称）":""}${src!=="all"?"（按来源）":""}${hits.length>300?"，最多显示 300。":"。"}</div>`:""}`;
  };
  const renderJ = kw => {
    const rows = DATA.mach_prices.filter(p=>!kw||(p.name||"").includes(kw)).slice(0,300);
    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">编码</th><th>名称</th><th>规格</th><th class="num">台班单价(元)</th><th class="num">页</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.spec||"")}</td><td class="num">${num2(p.unit_price)}</td><td class="num">${p.page}</td></tr>`).join("")}</tbody></table>
      ${kw?`<div class="note">命中 ${DATA.mach_prices.filter(p=>(p.name||"").includes(kw)).length} 条，最多显示 300。</div>`:""}`;
  };
  let mode = "m";
  const paint = () => { const kw=$("#pq").value.trim(); mode==="m"?renderM(kw):renderJ(kw); };

    document.querySelectorAll(".chip[data-p]").forEach(x=>x.classList.remove("on")); ch.classList.add("on");

  document.querySelectorAll("#psrc .chip").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#psrc .chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
    src = ch.dataset.s; paint();
  }));
  $("#pq").addEventListener("input", paint);
  paint();
}

function viewDerive(){
  const G = DATA.price_derive||[], IT = DATA.price_derive_items||[], FL = DATA.price_derive_fails||[];
  const badge = g => {
    const mine = PCONF[pk(g.material, g.unit)];
    if(g.review_status==="confirmed") return `<span class="badge b-green">✅已确认${g.build_price!=null?" "+num2(g.build_price):""}</span>`;
    if(mine) return mine.materialize
      ? `<span class="badge b-green">⚡已入库 ${num2(mine.build_price)}·${mine.source==="官方配比"?"官方配比":"反推"}</span>`
      : `<span class="badge b-green">✍已定价 ${num2(mine.build_price)}（待导出）</span>`;
    if((g.conclusion||"").includes("待人工确认")) return `<span class="badge b-amber">待人工确认</span>`;
    if((g.conclusion||"").includes("离散")) return `<span class="badge b-red">离散·须分条</span>`;
    return `<span class="badge b-blue">可直接建库</span>`;
  };
  const catOf = g => g.review_status==="confirmed" ? "confirmed"
    : (g.conclusion||"").includes("离散") ? "multi"
    : (g.conclusion||"").includes("待人工确认") ? "round" : "single";
  const stTxt = {ambiguous:"同名多价行·匹配器拒判", multi:"同子目缺价材料≥2项，差额无法唯一拆分",
    no_qty:"缺价行无消耗量", negative:"已知合计>书印材料费（疑似匹配误命中）",
    no_material_cost:"子目无书印材料费", no_missing:"无未匹配行（状态不一致，留痕）"};
  const nConf = G.filter(g=>g.review_status==="confirmed").length;
  const nPriced = G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; }).length;
  const nMat = G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize).length;
  const cats = [["all","全部",G.length],["cand","库内有近似",G.filter(g=>(g.candidates||[]).length).length],
    ["single","单一价",G.filter(g=>catOf(g)==="single").length],
    ["round","舍入级·待确认",G.filter(g=>catOf(g)==="round").length],
    ["multi","离散分条",G.filter(g=>catOf(g)==="multi").length],
    ["priced","已定价待导出",nPriced],["mat","⚡已入库反推",nMat],
    ["confirmed","已确认回库",nConf],["fails","无法反推",FL.length]];
  main().innerHTML = `<div class="panel"><h2>💰 缺价反推 · 定价工作台（${G.length} 种材料 · 子目溯源 ${IT.length} 条 · 无法反推 ${FL.length} 条）</h2>
    <div class="note"><b>未匹配为何这么多（查验结论）</b>：全书价格附表共 ${DATA.stats.mat_prices} 条，半成品混合料（水泥砂浆/胶泥/灰土/玛蹄脂…）与市场化材料（龙骨/亚克力字/窗帘…）为选择性收录——属实、非漏配；匹配器带防误伤设计（单位一致门、同名多价拒判）${DATA.manual_findings&&DATA.manual_findings.some(f=>/玛蹄脂/.test(f.subject||""))?`，如石油沥青玛蹄脂库内为 kg 与消耗 m³ 不一致而正确拒配（已立案 manual_findings）`:""}。<br>
    <b>审核通路</b>：① 每组点 <b>✍ 定价</b>（弹窗内可比对<b>库内近似候选</b>与反推溯源明细，单位错配标红）→ ② 顶部 <b>⬇ 导出核价记录</b> 下载 JSON → ③ 将 rules 数组 merge 进 <code>out/price_confirm.json</code> 重跑 build_db → 组状态转 ✅已确认、build_price 覆盖 → ④ 向 material_prices 补录该价后相关子目 H3 自动复检转 pass。</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-d="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <input id="dqq" placeholder="过滤：材料/子目编号…" style="width:200px">
      <span class="rbtn" id="export-price" title="下载 price_confirm.json 兼容格式，merge 回 out/price_confirm.json 后重跑 build_db 生效">⬇ 导出核价记录（${nPriced}）</span></div>
    <div id="dbody"></div></div>`;
  const candBadge = g => {

    if(!cs.length) return `<span class="badge b-gray">无近似</span>`;
    const um = cs.some(c=>c.unit_match);

  const paint = () => {

      : cat==="mat" ? G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize)
      : G.filter(g=>catOf(g)===cat);

        <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td>

        <td class="num" style="font-weight:700;color:var(--accent)">${sug}</td>
        <td class="num">${rng}</td><td class="num">${g.n_prices}</td><td class="num">${g.n_items}</td>

        <tr class="d-det" data-for="${i}" style="display:none"><td colspan="9" style="background:#fbfcfe">

            <th class="num">消耗量</th><th class="num">书印材料费</th><th class="num">已匹配合计</th><th class="num">缺口额</th></tr></thead>
          <tbody>${detRows||'<tr><td colspan="8">无</td></tr>'}</tbody></table></td></tr>`;
    }).join("");
    const failRows = FL.map(f=>{
      const it = DATA.items.find(x=>x.item_code===f.item_code)||{};
      const rn = JSON.parse(f.rows_json||"[]").map(r=>`${r.name}(${r.unit||""})`).join("、")||"—";
      return `<tr class="clickable" data-item="${esc(f.item_code)}"><td style="font-family:var(--mono)">${esc(f.item_code)}</td>
        <td>${esc(it.name||"")}</td><td>${esc((S.chapter(f.chapter_code)||{}).name||f.chapter_code||"—")}</td>
        <td>${esc(stTxt[f.status]||f.status)}</td><td>${esc(rn)}</td></tr>`;
    }).join("");
    $("#dbody").innerHTML =
      (cat!=="fails" && list.length ? `<table class="tbl"><thead><tr><th>材料</th><th>单位</th><th class="num">建议建库价</th>
        <th class="num">反推价区间</th><th class="num">价种类</th><th class="num">子目数</th><th>库内近似</th><th>结论</th><th>状态/操作</th></tr></thead>
        <tbody>${body}</tbody></table>
        <div class="note">命中 ${list.length} 组材料。<b>点击材料行</b>展开子目溯源，<b>🔍近似</b>看库内候选，<b>✍定价</b>打开定价弹窗，<b>点击子目行</b>弹出完整详情。</div>` : "") +
      (cat==="fails"||cat==="all" ? (FL.length && (cat==="fails"||!kw) ?

    const candRows = cs.length ? cs.map(c=>`<tr ${c.unit_match?"":'style="color:#c62828"'}>

    const detRows = det.map(r=>`<tr><td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
      <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc((r.item_name||"").slice(0,30))}</td>

      <span class="rbtn" id="expbtn" title="导出已核销记录（manual_confirm.json 兼容格式，merge 后重跑 build_db 生效 overlay）">⬇ 导出核销记录</span></div>
    <div id="rbody"></div></div>`;
  let hideDone = true;
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{c:"all"}}).dataset.c;

    let list = cat==="all"
      ? [...REVIEW.fail.map(r=>["fail",r]), ...REVIEW.unmatched.map(r=>["unmatched",r]),
         ...REVIEW.units.map(r=>["unit",r]), ...REVIEW.mids.map(r=>["mid",r])]
      : pick[cat].map(r=>[cat,r]);
    if(kw) list = list.filter(([c,r]) => (r.code||"").includes(kw) || (r.text||"").includes(kw));
    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;
    const shown = list.filter(([c,r]) => !(hideDone && DONE[rkey(c,r)])).slice(0,500);
    KEY2REC_CLEAR();
    const row = (cat, r) => {
      const key = rkey(cat, r);
      KEY2REC[key] = {cat, r};
      const done = DONE[key];
      const clk = r.code ? ` data-item="${esc(r.code)}"` : "";
      const imgBtn = (r.page && PAGEIMG.has(r.page))

      ${shown.map(([c,r])=>row(c,r)).join("") || '<tr><td colspan="7">无匹配</td></tr>'}</tbody></table>
      <div class="note">命中 ${list.length} 条 · 待核销 ${hidden} 条${list.length>500?"（仅渲染前 500，请用过滤缩小范围）":""}。核销记录存于浏览器 localStorage（键 qtx_done_v1），「⬇ 导出核销记录」可下载 JSON 供回库。</div>`;
    document.querySelectorAll("#rbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{

        openItem(tr.dataset.item);
      });

    document.querySelectorAll("#rbody [data-img]").forEach(el=>{
      el.addEventListener("click", ()=>showPageImg(+el.dataset.img, el.dataset.code||""));
    });
    document.querySelectorAll("#rbody [data-undo]").forEach(el=>{
      el.addEventListener("click", ()=>{ delete DONE[el.dataset.undo]; saveDone(); paint(); refreshCounts(); });
    });
    document.querySelectorAll("#rbody [data-done]").forEach(el=>{
      el.addEventListener("click", ()=>openDoneDialog(el.dataset.done, el.dataset.cat));
    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){
    const rec = KEY2REC[key]; if(!rec) return;
    const r = rec.r;
    const it = r.code ? DATA.items.find(x=>x.item_code===r.code) : null;
    const isUnit = cat==="unit" && it;
    $("#modal").innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:15px">核销确认</b><span class="badge ${badge[cat]}">${label[cat]}</span>

        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;

    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});

/* ---------------- 启动 ---------------- */
buildTree();
bindTree();
show("gs");
const first = document.querySelector('.tnode[data-id="gs"]');
first && first.classList.add("on");
refreshCounts();
</script>
</body>
