"SZ08-0308-05","name":"五、　油漆","page":233},{"id":"SZ08-0308-06","name":"六、　水刷石","page":235},{"id":"SZ08-0308-07","name":"七、　拉毛","page":236},{"id":"SZ08-0308-08","name":"八、　水磨石","page":237}],"040309":[{"id":"SZ08-0309-01","name":"一、　金属栏杆","page":242},{"id":"SZ08-0309-02","name":"二、　橡胶支座","page":244},{"id":"SZ08-0309-03","name":"三、　钢支座","page":245},{"id":"SZ08-0309-04","name":"四、　盆式支座","page":246},{"id":"SZ08-0309-05","name":"五、　桥梁伸缩装置","page":248},{"id":"SZ08-0309-06","name":"六、　隔声屏障","page":250},{"id":"SZ08-0309-07","name":"七、　泄水孔和排水管","page":251},{"id":"SZ08-0309-08","name":"八、　桥面防水层","page":252},{"id":"SZ08-0309-09","name":"九、　沉降缝","page":253},{"id":"SZ08-0309-10","name":"十、　球形支座","page":254}]},"ch13_nodes":[],"sections":[{"section_id":"GS-001","block_type":"总说明","chapter_code":null,"seq":1,"page":6,"print_page":1,"text":"一、辽宁省建设工程计价依据《市政工程定额》(以下简称本定额),是依据国家《建设工程工程量清单计价规范》(GB50500-2013)、《市政工程工程量计算规范》(GB50857-2013)、《市政工程消耗量》(ZYA1-31-2021)、《辽宁省建设工程计价依据市政工程定额》(2017 年)、省市市政工程相关定额及国家有关现行产品标准、设计规范、施工及验收规范、技术操作规程、质量评定标准、安全操作规程以及新技术、新材料、新工艺在施工中的应用情况而编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-002","block_type":"总说明","chapter_code":null,"seq":2,"page":6,"print_page":1,"text":"二、本定额的适用范围:我省行政区域城镇范围内的国有投资或国有投资为主的新建、扩建、改建的市政工程项目以及厂区、庭院内的道路、园林绿化工程。","tables":null,"tables_fixed":null},{"section_id":"GS-003","block_type":"总说明","chapter_code":null,"seq":3,"page":6,"print_page":1,"text":"三、本定额的作用:是国有投资或国有投资为主的建设项目,编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据;是评定投标报价合理性的依据;是调解处理工程造价争议和纠纷、审计和司法鉴定的依据:是编制投资估算指标、概算指标等文件的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","tables":null,"tables_fixed":null},{"section_id":"GS-004","block_type":"总说明","chapter_code":null,"seq":4,"page":6,"print_page":1,"text":"四、本定额是按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-005","block_type":"总说明","chapter_code":null,"seq":5,"page":6,"print_page":1,"text":"五、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"GS-006","block_type":"总说明","chapter_code":null,"seq":6,"page":7,"print_page":2,"text":"六、本定额消耗量和价格的确定:(一)人工工日:1. 本定额人工工日以综合工日表现,是按8 小时工作制编制的,人工等级分普通工(简称普工)、技术工(简称技工)和高级技术工(简称高级工),消耗量包括基本用工、超运距用工、人工幅度差、辅助用工和生产班组组织者用工。2. 本定额人工工日单价分别为:普工110 元,技工170 元,高级工330 元。3. 定额人工费,是指本定额项目综合单价中的人工费、按章节说明规定按系数调整的人工费以及定额中规定调整人工工日数量的人工费。按人工工日数量调整的人工费除章节有规定的工种外,均按普工工资标准调整人工费。(二)材料:1. 本定额采用的建筑材料、成品、半成品均按国家质量标准和相应的设计要求的合格产品考虑的;材料消耗量包括施工中消耗的主要材料、辅助材料、周转性材料和零星材料;材料消耗量包括净用量和损耗量,损耗量包括了施工操作损耗和场内运输、堆放损耗,规范(设计文件) 规定的预留量、搭接量不包括在损耗率中;用量很少、占材料比重很小的零星材料合并为其他材料费,以“元”表示。2. 本定额材料的场内搬运距离按300m 考虑的:设备场内搬运距离为150m。3. 本定额材料价格包括材料供应价(原价)、运杂费、运输损耗、采购保管费。本定额项目中的材料单价均为不含增值税的税前价格。4. 本定额中的周转性材料按不同施工方法、不同材质,计算出摊销量进入定额消耗量。5. 本定额的砂子用量是按含水率为零的干砂计算的。(三)施工机械台班:1. 本定额施工机械台班消耗量是按正常合理的机械配备、机械施工功效确定的,并已考虑了机械幅度差因素。2. 本定额施工机械原值在2000 元以内、使用年限在一年以内的不构成固定资产的小型机械,未列入机械台班消耗量,其费用包括在辽宁省《建设工程费用标准》的工具用具使用费中,其燃料动力消耗量包括在相应定额项目的材料项目内。3. 本定额加工机械、泵类机械、焊接机械及动力机械的操作人工均含在相应定额项目的人工消耗量中。4. 本定额施工机械台班单价是按现行的《施工机械台班费用标准》确定的。","tables":null,"tables_fixed":null},{"section_id":"GS-007","block_type":"总说明","chapter_code":null,"seq":7,"page":8,"print_page":3,"text":"七、本定额砂浆、混凝土除另有规定外,均按预拌或成品编制的,如果采用现场搅拌,拌制增加费按第九册《钢筋工程》相应项目调整。","tables":null,"tables_fixed":null},{"section_id":"GS-008","block_type":"总说明","chapter_code":null,"seq":8,"page":8,"print_page":3,"text":"八、本定额未考虑施工与生产同时进行、有害身体健康的环境中施工时降效增加费,发生时按各册规定计算。","tables":null,"tables_fixed":null},{"section_id":"GS-009","block_type":"总说明","chapter_code":null,"seq":9,"page":8,"print_page":3,"text":"九、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"GS-010","block_type":"总说明","chapter_code":null,"seq":10,"page":8,"print_page":3,"text":"十、本说明未尽事宜,详见各册及章节说明。","tables":null,"tables_fixed":null},{"section_id":"CS-011","block_type":"册说明","chapter_code":null,"seq":11,"page":14,"print_page":1,"text":"一、第三册《桥涵工程》(以下简称本册定额),包括桩基、基坑与边坡防护、现浇混凝土构件、预制混凝土构件、砌筑、立交箱涵、钢结构、装饰、其他,共九章。","tables":null,"tables_fixed":null},{"section_id":"CS-012","block_type":"册说明","chapter_code":null,"seq":12,"page":14,"print_page":1,"text":"二、本册定额适用范围:1. 城镇范围内的桥梁工程。2. 单跨5m 以内的各种板涵、拱涵工程(圆管涵执行第五册《市政管网工程》相应项目,其中管道铺设及基础项目人工、机械费乘以系数1.25)。3. 穿越城市道路及铁路的立交箱涵工程。","tables":null,"tables_fixed":null},{"section_id":"CS-013","block_type":"册说明","chapter_code":null,"seq":13,"page":14,"print_page":1,"text":"三、本册定额编制依据:50857-2013;1. 《市政工程工程量计算规范》GB2. 《市政工程消耗量》ZYA1-31-2021第三册《桥梁工程》;3. 《辽宁省建设工程计价依据市政工程定额》(2017);4. 国家法律、法规,国家设计规范;5. 有代表性的工程设计施工资料,现行设计规范、施工验收规范、操作规程及标准图集;6. 国家及省、市有关的计价依据、补充定额及有关资料。","tables":null,"tables_fixed":null},{"section_id":"CS-014","block_type":"册说明","chapter_code":null,"seq":14,"page":14,"print_page":1,"text":"四、本册定额预制混凝土及钢筋混凝土构件均属现场预制。不适用于独立核算、执行产品出厂价格的构件厂所生产的构配件,采用商品构配件编制造价时,按构配件到达工地的价格计算。","tables":null,"tables_fixed":null},{"section_id":"CS-015","block_type":"册说明","chapter_code":null,"seq":15,"page":15,"print_page":2,"text":"五、本册定额混凝土、砂浆是按预拌考虑的,实际采用现场搅拌混凝土、砂浆执行第九册《钢筋工程》中混凝土、砂浆拌制调整项目。","tables":null,"tables_fixed":null},{"section_id":"CS-016","block_type":"册说明","chapter_code":null,"seq":16,"page":15,"print_page":2,"text":"六、本册定额中提升高度按原地面标高至梁底标高8m 为界,若超过8m 时,可另行计算超高费;1. 现浇混凝土模板项目按提升高度不同将全桥划分为若干段,以超高段承台顶面以上混凝土模板工程量,按下表调整相应定额中人工、起重机械台班的消耗量分段计算。2. 陆上安装梁按下表调整相应定额中的人工及起重机械台班的消耗量分段计算。","tables":null,"tables_fixed":null},{"section_id":"CS-017","block_type":"册说明","chapter_code":null,"seq":17,"page":15,"print_page":2,"text":"七、本册定额中河道水深取定为3m,若水深>3m 时,应另行计算。当超高以及水深>3m 时,超过部分增加费用按实计算。","tables":null,"tables_fixed":null},{"section_id":"CS-018","block_type":"册说明","chapter_code":null,"seq":18,"page":15,"print_page":2,"text":"八、本册定额中均未包括各类操作脚手架,发生时执行第十一册《措施工程》相关项目。","tables":null,"tables_fixed":null},{"section_id":"CS-019","block_type":"册说明","chapter_code":null,"seq":19,"page":15,"print_page":2,"text":"九、本册说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"ZS-020","block_type":"章说明","chapter_code":"0301","seq":20,"page":18,"print_page":5,"text":"一、本章内容包括钢筋混凝土方桩,钢筋混凝土管桩,钢筋混凝土板桩,钢管桩,泥浆护壁成孔灌注桩,泥浆池及泥浆制作、泥浆处理,灌注桩后注浆,截桩头,声测管等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-021","block_type":"章说明","chapter_code":"0301","seq":21,"page":18,"print_page":5,"text":"二、桩基施工前场地平整、压实地表、地下障碍处理等,定额均未考虑,发生时另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-022","block_type":"章说明","chapter_code":"0301","seq":22,"page":18,"print_page":5,"text":"三、探桩位已综合考虑在各类桩基定额内,不另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-023","block_type":"章说明","chapter_code":"0301","seq":23,"page":18,"print_page":5,"text":"四、打桩土质类别综合取定。","tables":null,"tables_fixed":null},{"section_id":"ZS-024","block_type":"章说明","chapter_code":"0301","seq":24,"page":18,"print_page":5,"text":"五、本章定额是按打直桩编制的,如打斜桩(包括俯打、仰打)斜率在1:6 以内时,人工乘以系数1.33,机械乘以系数1.43。","tables":null,"tables_fixed":null},{"section_id":"ZS-025","block_type":"章说明","chapter_code":"0301","seq":25,"page":18,"print_page":5,"text":"六、在桩间补桩或在强夯后的地基上打桩时,相应项目人工、机械乘以系数1.15。","tables":null,"tables_fixed":null},{"section_id":"ZS-026","block_type":"章说明","chapter_code":"0301","seq":26,"page":18,"print_page":5,"text":"七、船上打桩定额按两艘船只拼搭、捆绑考虑。","tables":null,"tables_fixed":null},{"section_id":"ZS-027","block_type":"章说明","chapter_code":"0301","seq":27,"page":18,"print_page":5,"text":"八、陆上、支架上、船上打桩项目均未包括运桩。","tables":null,"tables_fixed":null},{"section_id":"ZS-028","block_type":"章说明","chapter_code":"0301","seq":28,"page":18,"print_page":5,"text":"九、送桩定额按送4m 为界,如实际超过4m 时,按相应项目乘以下列调整系数:1. 送桩5m 以内乘以系数1.2;2. 送桩6m 以内乘以系数1.5;3. 送桩7m 以内乘以系数2.0;4. 送桩7m 以上,以调整后7m 为基础,每超过1m 递增系数0.75。","tables":null,"tables_fixed":null},{"section_id":"ZS-029","block_type":"章说明","chapter_code":"0301","seq":29,"page":19,"print_page":6,"text":"十、打钢管桩项目不包括接桩费用,如发生接桩,按实际接头数量套用钢管桩接桩定额;打钢管桩送桩,按相应打桩项目调整计算:不计钢管桩主材,人工、机械数量乘以系数1.9。","tables":null,"tables_fixed":null},{"section_id":"ZS-030","block_type":"章说明","chapter_code":"0301","seq":30,"page":19,"print_page":6,"text":"十一、打桩机械场外运输费可另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-031","block_type":"章说明","chapter_code":"0301","seq":31,"page":19,"print_page":6,"text":"十二、本章项目钻孔的土质分类按现行国家标准《岩土勘察规范》GB50021-2001(2009 年局部修订版)和《工程岩体分级标准》GB50218-94 划分。","tables":null,"tables_fixed":null},{"section_id":"ZS-032","block_type":"章说明","chapter_code":"0301","seq":32,"page":19,"print_page":6,"text":"十三、打、压预制钢筋混凝土桩、预应力钢筋混凝土管桩,按购入成品构件考虑,已包含桩位半径在15m范围内的移动、起吊、就位;超过15m 时的场内运输,按定额“第四章预制混凝土构件” 第七节构件运输1km 以内的相应项目计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-033","block_type":"章说明","chapter_code":"0301","seq":33,"page":19,"print_page":6,"text":"十四、成孔项目按孔径、深度和土质划分项目,若超过使用范围时,应另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-034","block_type":"章说明","chapter_code":"0301","seq":34,"page":19,"print_page":6,"text":"十五、埋设钢护筒项目钢护筒按摊销量计算,若钢护筒无法拔出时,经建设单位签证后,可按钢护筒实际用量(若不能确定实际用量可参考下表计算)一次摊销计算(同时扣除定额消耗量)。","tables":null,"tables_fixed":null},{"section_id":"JR-035","block_type":"计算规则","chapter_code":"0301","seq":35,"page":20,"print_page":7,"text":"一、打桩:1. 钢筋混凝土方桩按桩长度(包括桩尖长度)乘以桩截面面积以体积计算;2. 钢筋混凝土管桩按桩长度(包括桩尖长度)乘以桩截面面积以体积计算,空心部分体积不计;3. 钢管桩按成品桩考虑,按设计要求的桩体质量,以“吨”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-036","block_type":"计算规则","chapter_code":"0301","seq":36,"page":20,"print_page":7,"text":"二、焊接桩型钢用量可按实调整。","tables":null,"tables_fixed":null},{"section_id":"JR-037","block_type":"计算规则","chapter_code":"0301","seq":37,"page":20,"print_page":7,"text":"三、送桩:1. 陆上打桩时,以原地面平均标高增加1m 为界线,界线以下至设计桩顶标高之间的打桩实体积为送桩工程量;2. 支架上打桩时,以当地施工期间的最高潮水位增加0.5m 为界线,界线以下至设计桩顶标高之间的打桩实体积为送桩工程量;3. 船上打桩时,以当地施工期间的平均水位增加1m 为界线,界线以下至设计桩顶标高之间的打桩实体积为送桩工程量。","tables":null,"tables_fixed":null},{"section_id":"JR-038","block_type":"计算规则","chapter_code":"0301","seq":38,"page":21,"print_page":8,"text":"四、灌注桩:1. 回旋钻机钻孔、冲击式钻机钻孔、卷扬机带冲抓锥冲孔的成孔工程量按设计入土深度以米计算。项目的孔深指原地面(水上指工作平台顶面)至设计桩底的深度。成孔项目同一孔内的不同土质,不论其所在的深度如何,均执行总孔深定额。旋挖钻机钻孔按设计入土深度乘以桩截面面积以体积计算。2. 灌注桩水下混凝土工程量按设计桩长增加1.0m 乘以设计桩径截面面积计算体积计算。3. 灌注桩后注浆工程量计算按设计注浆量计算,注浆管管材费用另计,但利用声测管注浆时不得重复计算。4. 声测管工程量按设计数量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-039","block_type":"计算规则","chapter_code":"0301","seq":39,"page":21,"print_page":8,"text":"五、泥浆制作按桩成孔工程量,以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-040","block_type":"计算规则","chapter_code":"0301","seq":40,"page":21,"print_page":8,"text":"六、台与墩或墩与墩之间不能连续施工时(如不能断航、断交通或拆迁工作不能配合),每个墩、台可计一次组装、拆卸柴油打桩架及设备运输费。","tables":null,"tables_fixed":null},{"section_id":"JR-041","block_type":"计算规则","chapter_code":"0301","seq":41,"page":21,"print_page":8,"text":"七、钢管桩内切割、精割盖帽按设计要求的数量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-042","block_type":"计算规则","chapter_code":"0301","seq":42,"page":21,"print_page":8,"text":"八、钢管桩管内钻孔取土、填芯,按设计桩长(包括桩尖)乘以填芯截面积,以体积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-043","block_type":"章说明","chapter_code":"0302","seq":43,"page":82,"print_page":69,"text":"一、本章定额内容包括地下连续墙、咬合灌注桩、型钢水泥土搅拌墙、锚杆(索)、土钉、喷射混凝土、骨架护坡等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-044","block_type":"章说明","chapter_code":"0302","seq":44,"page":82,"print_page":69,"text":"二、本章适用于粘土、砂土及冲填土等软土层土质情况下桥涵工程的基坑与边坡支护项目,遇其他较硬地层时执行相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-045","block_type":"章说明","chapter_code":"0302","seq":45,"page":82,"print_page":69,"text":"三、本章均为打直桩,打斜桩(包括俯打、仰打) 斜率在1:6 以内时,人工乘以系数1.33,机械乘以系数1.43。","tables":null,"tables_fixed":null},{"section_id":"ZS-046","block_type":"章说明","chapter_code":"0302","seq":46,"page":82,"print_page":69,"text":"四、打板桩项目均已包括打、拔导向桩内容,不得重复计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-047","block_type":"章说明","chapter_code":"0302","seq":47,"page":82,"print_page":69,"text":"五、地下连续墙成槽的护壁泥浆,是按普通泥浆编制的,若需要重晶石泥浆时,可自行调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-048","block_type":"章说明","chapter_code":"0302","seq":48,"page":82,"print_page":69,"text":"六、地下连续墙项目未包括泥浆池的制作、拆除,发生时根据施工组织设计另行计算。泥浆使用后的废浆运弃,其费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-049","block_type":"章说明","chapter_code":"0302","seq":49,"page":82,"print_page":69,"text":"七、咬合灌注桩导墙执行地下连续墙导墙相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-050","block_type":"章说明","chapter_code":"0302","seq":50,"page":82,"print_page":69,"text":"八、砂浆土钉钢筋按ϕ10mm 以外编制,材料品种、规格不同时允许换算。土钉采用工程地质液压钻机钻孔置入法施工时,执行锚杆相应定额项目。","tables":null,"tables_fixed":null},{"section_id":"JR-051","block_type":"计算规则","chapter_code":"0302","seq":51,"page":83,"print_page":70,"text":"一、打桩:钢筋混凝土板桩按桩长度(包括桩尖长度)乘以桩截面面积以体积计算;","tables":null,"tables_fixed":null},{"section_id":"JR-052","block_type":"计算规则","chapter_code":"0302","seq":52,"page":83,"print_page":70,"text":"二、地下连续墙成槽土方量及浇筑混凝土工程量按连续墙设计截面面积(设计长度乘以宽度)乘以槽深(设计槽深加超深0.5m)以“m3”为单位计算;锁口管、接头箱吊拔及清底置换按设计图示连续墙的单元以“段”为单位,其中清底置换按连续墙设计段数计算,锁口管、接头箱吊拔按连续墙段数加1 段计算。入岩增加费工程量按实际入岩深度以体积计算。连续墙型钢封口制作安装按设计图示尺寸以质量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-053","block_type":"计算规则","chapter_code":"0302","seq":53,"page":83,"print_page":70,"text":"三、水泥土搅拌墙按设计截面面积乘以设计长度按体积计算,加灌高度,设计有规定时,按设计规定计算;设计无规定时,按0.5m 计算;若设计墙顶标高至原地面高差小于0.5m 时,加灌高度按实际计算。搅拌桩成孔中重复套钻工程量已在项目考虑,不另行计算。","tables":null,"tables_fixed":null},{"section_id":"JR-054","block_type":"计算规则","chapter_code":"0302","seq":54,"page":83,"print_page":70,"text":"四、咬合灌注桩按设计图示单桩尺寸以“m3”为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-055","block_type":"计算规则","chapter_code":"0302","seq":55,"page":83,"print_page":70,"text":"五、锚杆和锚索的钻孔、压浆按设计图示长度以“m”为单位计算,制作、安装按照设计图示主材(钢筋或钢绞线)重量以“t”为单位计算,不包括附件重量;砂浆土钉、钢管护坡土钉按照设计图示长度以“m”为单位计算;喷射混凝土按设计图示尺寸以“m2”为单位计算,挂网按设计用钢量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-056","block_type":"计算规则","chapter_code":"0302","seq":56,"page":83,"print_page":70,"text":"六、骨架护坡按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-057","block_type":"章说明","chapter_code":"0303","seq":57,"page":102,"print_page":89,"text":"一、本章定额包括垫层、基础、承台、墩(台)帽、墩(台) 身、支撑梁及横梁、墩(台) 盖梁、拱桥、梁、板、挡墙、桥面铺装、桥头搭板等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-058","block_type":"章说明","chapter_code":"0303","seq":58,"page":102,"print_page":89,"text":"二、本章定额适用于桥涵工程现浇各种混凝土构筑物。","tables":null,"tables_fixed":null},{"section_id":"ZS-059","block_type":"章说明","chapter_code":"0303","seq":59,"page":102,"print_page":89,"text":"三、本章项目均未包括预埋铁件,如设计要求预埋铁件时,执行其他分册相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-060","block_type":"章说明","chapter_code":"0303","seq":60,"page":102,"print_page":89,"text":"四、本章项目毛石混凝土的块石含量为15%,如与设计不同时可以换算,但人工、机械不作调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-061","block_type":"章说明","chapter_code":"0303","seq":61,"page":102,"print_page":89,"text":"五、混凝土按常用强度等级列出,如设计要求不同时可以换算。","tables":null,"tables_fixed":null},{"section_id":"ZS-062","block_type":"章说明","chapter_code":"0303","seq":62,"page":102,"print_page":89,"text":"六、钢纤维混凝土中的钢纤维含量,如设计含量不同时可以相应调整。","tables":null,"tables_fixed":null},{"section_id":"JR-063","block_type":"计算规则","chapter_code":"0303","seq":63,"page":103,"print_page":90,"text":"一、混凝土工程量按设计尺寸以实体积计算(不包括空心板、梁的空心体积),不扣除钢筋、铁丝、铁件、预留压浆孔道、单个面积在0.3m2 以内孔洞和螺栓所占的体积。","tables":null,"tables_fixed":null},{"section_id":"ZS-064","block_type":"章说明","chapter_code":"0304","seq":64,"page":130,"print_page":117,"text":"一、本章定额包括预制梁、柱、板、拱桥构件、小型构件、混凝土灌缝与接头及构件运输等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-065","block_type":"章说明","chapter_code":"0304","seq":65,"page":130,"print_page":117,"text":"二、预制构件定额适用于现场制作的预制构件。","tables":null,"tables_fixed":null},{"section_id":"ZS-066","block_type":"章说明","chapter_code":"0304","seq":66,"page":130,"print_page":117,"text":"三、本章项目均未包括预埋铁件,可按设计用量执行相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-067","block_type":"章说明","chapter_code":"0304","seq":67,"page":130,"print_page":117,"text":"四、安装预制构件,应根据施工现场具体情况采用合理的施工方法,执行相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-068","block_type":"章说明","chapter_code":"0304","seq":68,"page":130,"print_page":117,"text":"五、除安装梁分陆上、水上安装外,其他构件安装均未考虑船上吊装,发生时可增计船只费用。","tables":null,"tables_fixed":null},{"section_id":"ZS-069","block_type":"章说明","chapter_code":"0304","seq":69,"page":130,"print_page":117,"text":"六、预应力桁架梁预制套用桁架拱拱片项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-070","block_type":"章说明","chapter_code":"0304","seq":70,"page":130,"print_page":117,"text":"七、预制装配式防撞墙中不包括橡胶止水条及伸缩缝安装,发生时套用相关定额。","tables":null,"tables_fixed":null},{"section_id":"ZS-071","block_type":"章说明","chapter_code":"0304","seq":71,"page":130,"print_page":117,"text":"八、预制构件场内运输定额适用于除小型构件外的预制混凝土构件。小型构件指单件混凝土体积≤0.05m3 的构件,其场内运输已包括在项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-072","block_type":"章说明","chapter_code":"0304","seq":72,"page":130,"print_page":117,"text":"九、双导梁安装构件项目不包括导梁的安拆及使用,执行第十一册《措施项目》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-073","block_type":"章说明","chapter_code":"0304","seq":73,"page":130,"print_page":117,"text":"十、本章运输项目适用于运距在30km 以内的运输。","tables":null,"tables_fixed":null},{"section_id":"ZS-074","block_type":"章说明","chapter_code":"0304","seq":74,"page":130,"print_page":117,"text":"十一、构件运输过程中,遇路桥限载(限高) 而发生的加固、扩宽等费用及交通管理部门收取的相关费用,如发生时另外计算。","tables":null,"tables_fixed":null},{"section_id":"JR-075","block_type":"计算规则","chapter_code":"0304","seq":75,"page":131,"print_page":118,"text":"一、混凝土工程量计算:1. 预制空心构件按设计图尺寸扣除空心体积,以实体积计算。空心板梁的堵头板体积不计入工程量内,其消耗量已在项目考虑。2. 预制空心板梁,采用橡胶囊做内模时,考虑其压缩变形因素,可增加混凝土数量,当梁长在16m 以内时,可按设计计算体积增加7%,若梁长大于16m 时,则增加9%计算。如设计图注明已考虑橡胶囊变形时,不得再增加计算。3. 预应力混凝土构件的封锚混凝土数量并入构件混凝土工程量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-076","block_type":"计算规则","chapter_code":"0304","seq":76,"page":131,"print_page":118,"text":"二、安装预制构件以“m3”为计量单位的,均按构件混凝土实体积(不包括空心部分)计算,不扣除构件内钢筋、铁件及预应力钢筋预留孔洞所占的体积。","tables":null,"tables_fixed":null},{"section_id":"JR-077","block_type":"计算规则","chapter_code":"0304","seq":77,"page":131,"print_page":118,"text":"三、驳船不包括进出场费,按实计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-078","block_type":"章说明","chapter_code":"0305","seq":78,"page":182,"print_page":169,"text":"一、本章定额包括干砌片(块)石、浆砌片(块)石、浆砌预制块、砖砌体和滤层泄水孔、泄水管等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-079","block_type":"章说明","chapter_code":"0305","seq":79,"page":182,"print_page":169,"text":"二、本章定额适用于砌筑高度在8m 以内的桥涵砌筑工程。","tables":null,"tables_fixed":null},{"section_id":"ZS-080","block_type":"章说明","chapter_code":"0305","seq":80,"page":182,"print_page":169,"text":"三、砌筑项目未包括垫层、拱背和台背的填充项目,如发生上述项目,执行相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-081","block_type":"章说明","chapter_code":"0305","seq":81,"page":182,"print_page":169,"text":"四、浆砌料石参照浆砌预制块定额,调换主材计算。","tables":null,"tables_fixed":null},{"section_id":"JR-082","block_type":"计算规则","chapter_code":"0305","seq":82,"page":183,"print_page":170,"text":"一、砌筑工程量按设计砌体尺寸以立方米体积计算,嵌入砌体中的钢管、沉降缝、伸缩缝以及单孔面积0.3m2 以内的预留孔所占体积不予扣除。","tables":null,"tables_fixed":null},{"section_id":"JR-083","block_type":"计算规则","chapter_code":"0305","seq":83,"page":183,"print_page":170,"text":"二、滤层按设计尺寸以立方米体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-084","block_type":"计算规则","chapter_code":"0305","seq":84,"page":183,"print_page":170,"text":"三、泄水孔按设计图示尺寸以长度计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-085","block_type":"章说明","chapter_code":"0306","seq":85,"page":198,"print_page":185,"text":"一、本章定额包括透水管、滑板、箱涵制作、箱涵顶进、箱涵接缝等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-086","block_type":"章说明","chapter_code":"0306","seq":86,"page":198,"print_page":185,"text":"二、本章定额适用于穿越城市道路及铁路的立交箱涵顶进工程及现浇箱涵工程。","tables":null,"tables_fixed":null},{"section_id":"ZS-087","block_type":"章说明","chapter_code":"0306","seq":87,"page":198,"print_page":185,"text":"三、本章定额顶进土质按一、二类土考虑,若实际土质与定额不同时,增加费用按实计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-088","block_type":"章说明","chapter_code":"0306","seq":88,"page":198,"print_page":185,"text":"四、本章定额中未包括箱涵顶进的后靠背设施等,其费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-089","block_type":"章说明","chapter_code":"0306","seq":89,"page":198,"print_page":185,"text":"五、本章定额中未包括深基坑开挖、支撑及井点降水的工作内容,执行相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-090","block_type":"章说明","chapter_code":"0306","seq":90,"page":198,"print_page":185,"text":"六、立交桥引道的结构及路面铺筑工程,根据施工方法执行相关项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-091","block_type":"章说明","chapter_code":"0306","seq":91,"page":198,"print_page":185,"text":"七、箱涵顶进定额分空顶、无中继间实土顶和有中继间实土顶,有中继间实土顶适用于一级中继间接力顶进。","tables":null,"tables_fixed":null},{"section_id":"ZS-092","block_type":"章说明","chapter_code":"0306","seq":92,"page":198,"print_page":185,"text":"八、本章项目箱涵自重是指箱涵顶进时的总重量,应包括拖带的设备重量(按箱涵重量的5%计),采用中继间接力顶进时还应包括中继间的重量。","tables":null,"tables_fixed":null},{"section_id":"JR-093","block_type":"计算规则","chapter_code":"0306","seq":93,"page":199,"print_page":186,"text":"一、透水管工程量按设计图示长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-094","block_type":"计算规则","chapter_code":"0306","seq":94,"page":199,"print_page":186,"text":"二、箱涵滑板下的肋楞,其工作量并入滑板内计算。","tables":null,"tables_fixed":null},{"section_id":"JR-095","block_type":"计算规则","chapter_code":"0306","seq":95,"page":199,"print_page":186,"text":"三、箱涵混凝土工程量,不扣除单孔面积0.3m2 以下的预留孔洞体积。","tables":null,"tables_fixed":null},{"section_id":"JR-096","block_type":"计算规则","chapter_code":"0306","seq":96,"page":199,"print_page":186,"text":"四、顶柱、中继间护套及挖土支架均属专用周转性金属构件,项目已按摊销量计列,不得重复计算。","tables":null,"tables_fixed":null},{"section_id":"JR-097","block_type":"计算规则","chapter_code":"0306","seq":97,"page":199,"print_page":186,"text":"五、箱涵顶进工程量计算:1. 空顶工程量按空顶的单节箱涵重量乘以箱涵位移距离计算。2. 实土顶工程量按被顶箱涵的重量乘以箱涵位移距离分段累计计算。","tables":null,"tables_fixed":null},{"section_id":"JR-098","block_type":"计算规则","chapter_code":"0306","seq":98,"page":199,"print_page":186,"text":"六、气垫只考虑在预制箱涵底板上使用,按箱涵底面积计算。气垫的使用天数由施工组织设计确定,但采用气垫后在套用顶进消耗量时乘以系数0.7。","tables":null,"tables_fixed":null},{"section_id":"JR-099","block_type":"计算规则","chapter_code":"0306","seq":99,"page":199,"print_page":186,"text":"七、箱涵外壁及滑板面处理按设计图示表面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-100","block_type":"计算规则","chapter_code":"0306","seq":100,"page":199,"print_page":186,"text":"八、箱涵石棉水泥嵌缝及嵌防水膏接缝按设计图示尺寸以长度计算,箱涵沥青二度、沥青封口及嵌沥青木丝板接缝按设计图示尺寸以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-101","block_type":"计算规则","chapter_code":"0306","seq":101,"page":199,"print_page":186,"text":"九、箱涵内挖土按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-102","block_type":"章说明","chapter_code":"0307","seq":102,"page":216,"print_page":203,"text":"一、本章定额包括钢梁、钢管拱和钢立柱的安装等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-103","block_type":"章说明","chapter_code":"0307","seq":103,"page":216,"print_page":203,"text":"二、本章定额适用于工厂制作,现场吊装的钢结构。构件由制作工厂至安装现场的运输费用计入构件价格内。","tables":null,"tables_fixed":null},{"section_id":"ZS-104","block_type":"章说明","chapter_code":"0307","seq":104,"page":216,"print_page":203,"text":"三、本章定额钢结构防腐、涂装、防火涂料等执行《房屋建筑与装饰工程定额》相应项目计算。","tables":null,"tables_fixed":null},{"section_id":"JR-105","block_type":"计算规则","chapter_code":"0307","seq":105,"page":217,"print_page":204,"text":"一、钢结构工程量按设计图示尺寸以主材质量(不包括焊条、铆钉、螺栓等)计算。","tables":null,"tables_fixed":null},{"section_id":"JR-106","block_type":"计算规则","chapter_code":"0307","seq":106,"page":217,"print_page":204,"text":"二、钢梁质量为钢梁(含横隔板)、桥面板、横肋、横梁及锚筋之和。","tables":null,"tables_fixed":null},{"section_id":"JR-107","block_type":"计算规则","chapter_code":"0307","seq":107,"page":217,"print_page":204,"text":"三、钢拱肋的工程量包括拱肋钢管、横撑、腹板、拱脚处外侧钢板、拱脚接头钢板及各种加劲块。","tables":null,"tables_fixed":null},{"section_id":"JR-108","block_type":"计算规则","chapter_code":"0307","seq":108,"page":217,"print_page":204,"text":"四、钢立柱上的节点板、加强环、内衬管、牛腿等并入钢立柱工程量内。","tables":null,"tables_fixed":null},{"section_id":"JR-109","block_type":"计算规则","chapter_code":"0307","seq":109,"page":217,"print_page":204,"text":"五、高强螺栓用量如设计含量不同时可以相应调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-110","block_type":"章说明","chapter_code":"0308","seq":110,"page":226,"print_page":213,"text":"一、本章定额包括水泥砂浆抹面、剁斧石、镶贴面层、涂料、油漆、水刷石、拉毛、水磨石等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-111","block_type":"章说明","chapter_code":"0308","seq":111,"page":226,"print_page":213,"text":"二、本章定额适用于桥、涵构筑物的装饰项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-112","block_type":"章说明","chapter_code":"0308","seq":112,"page":226,"print_page":213,"text":"三、镶贴面层定额中,贴面材料与项目消耗量不同时,可以调整换算,但人工与机械台班消耗量不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-113","block_type":"章说明","chapter_code":"0308","seq":113,"page":226,"print_page":213,"text":"四、水质涂料不分面层类别,均按本项目计算,由于涂料种类繁多,如采用其他涂料时,可以调整换算,但人工与机械台班消耗量不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-114","block_type":"章说明","chapter_code":"0308","seq":114,"page":226,"print_page":213,"text":"五、水泥白石子浆抹灰均未包括颜料费用,如设计需要颜料调制时,应增加颜料费用。","tables":null,"tables_fixed":null},{"section_id":"ZS-115","block_type":"章说明","chapter_code":"0308","seq":115,"page":226,"print_page":213,"text":"六、金属面油漆执行《通用安装工程定额》第十二册《刷油、防腐蚀、绝热工程》相应项目,油漆种类与实际不同时,可以换算,其他不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-116","block_type":"章说明","chapter_code":"0308","seq":116,"page":226,"print_page":213,"text":"七、本定额中均未包括施工脚手架,发生时可按措施项目相应项目执行。","tables":null,"tables_fixed":null},{"section_id":"JR-117","block_type":"计算规则","chapter_code":"0308","seq":117,"page":227,"print_page":214,"text":"本章项目均按装饰面积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-118","block_type":"章说明","chapter_code":"0309","seq":118,"page":240,"print_page":227,"text":"一、本章定额包括金属栏杆、支座、桥梁伸缩装置、隔声屏障、泄水孔和排水管、桥面防水层、沉降缝等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-119","block_type":"章说明","chapter_code":"0309","seq":119,"page":240,"print_page":227,"text":"二、金属栏杆项目主材品种、规格与设计不符时可以换算。","tables":null,"tables_fixed":null},{"section_id":"ZS-120","block_type":"章说明","chapter_code":"0309","seq":120,"page":240,"print_page":227,"text":"三、与四氟板式橡胶支座配套的上下钢板、不锈钢板、锚固螺栓等费用摊入支座价格中计列。","tables":null,"tables_fixed":null},{"section_id":"ZS-121","block_type":"章说明","chapter_code":"0309","seq":121,"page":240,"print_page":227,"text":"四、梳型钢板、钢板、橡胶板及毛勒伸缩缝均按成品考虑。","tables":null,"tables_fixed":null},{"section_id":"ZS-122","block_type":"章说明","chapter_code":"0309","seq":122,"page":240,"print_page":227,"text":"五、安装排水管项目已包括集水斗安装工作内容,但集水斗的材料费需按实另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-123","block_type":"章说明","chapter_code":"0309","seq":123,"page":240,"print_page":227,"text":"六、金属面油漆执行《通用安装工程定额》第十二册《刷油、防腐蚀、绝热工程》相应定额项目,油漆种类与实际不同时,可以换算,其他不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-124","block_type":"章说明","chapter_code":"0309","seq":124,"page":240,"print_page":227,"text":"七、盆式支座项目已综合考虑钢板含量。","tables":null,"tables_fixed":null},{"section_id":"ZS-125","block_type":"章说明","chapter_code":"0309","seq":125,"page":240,"print_page":227,"text":"八、除球形支座外,支座安装未考虑环氧树脂,若设计有需要时,其费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-126","block_type":"章说明","chapter_code":"0309","seq":126,"page":240,"print_page":227,"text":"九、桥面防水层聚氨酯防水涂料定额是按1.5mm 编制的,如厚度与设计不同时,材料用量可按设计要求换算,但人工及其他不变。","tables":null,"tables_fixed":null},{"section_id":"JR-127","block_type":"计算规则","chapter_code":"0309","seq":127,"page":241,"print_page":228,"text":"一、金属栏杆工程量按设计图纸的主材质量,以吨为单位计算。","tables":null,"tables_fixed":null},{"section_id":"JR-128","block_type":"计算规则","chapter_code":"0309","seq":128,"page":241,"print_page":228,"text":"二、板式橡胶支座及四氟板式橡胶支座按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-129","block_type":"计算规则","chapter_code":"0309","seq":129,"page":241,"print_page":228,"text":"三、辊轴钢支座、切线支座及摆式支座按设计图示以质量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-130","block_type":"计算规则","chapter_code":"0309","seq":130,"page":241,"print_page":228,"text":"四、盆式金属橡胶组合支座及球形支座按设计图示以个数计算。","tables":null,"tables_fixed":null},{"section_id":"JR-131","block_type":"计算规则","chapter_code":"0309","seq":131,"page":241,"print_page":228,"text":"五、梳型钢板、钢板、橡胶板、毛勒及镀锌铁皮玛蹄脂桥梁伸缩装置按设计图示尺寸以长度计算;沥青麻丝桥梁伸缩装置按设计图示尺寸以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-132","block_type":"计算规则","chapter_code":"0309","seq":132,"page":241,"print_page":228,"text":"六、隔声屏障钢骨架按设计图示以质量计算;隔声屏障隔声屏障板材按设计图示尺寸以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-133","block_type":"计算规则","chapter_code":"0309","seq":133,"page":241,"print_page":228,"text":"七、泄水孔和排水管按设计图示尺寸 const REVIEW = (() => {
  const it = c => DATA.items.find(x=>x.item_code===c);
  const fail = [], unmatched = [], units = [], mids = [];
  (DATA.h3_review||[]).forEach(h=>{
    const d = JSON.parse(h.detail||"{}");
    if(h.status==="fail")
      fail.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:`书印材料费 ${num2(d.declared)} ≠ 价格库反推 ${num2(d.calc)}（差 ${num2(d.diff)}）`, act:"需人工对价"});
    else if(h.status==="skip_unmatched")
      unmatched.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:(d.note||"材料未匹配")+"："+(d.missing||[]).map(m=>`${m.name}(${m.unit||""})`).join("、"), act:"需补价格库"});
  });
  (DATA.issues||[]).forEach(i=>{
    if(i.review_status==="confirmed") return; // 人工已确认（out/manual_confirm.json overlay）
    const m = (i.descr||"").match(/子目\s*(\d+-\d+)/);
    const code = m && it(m[1]) ? m[1] : null;
    if(i.itype==="单位存疑")
      units.push({code, page:i.page, text:i.descr, act:"单位待确认", src:i.source, itype:i.itype});
    else if(i.severity==="mid")
      mids.push({code, page:i.page, text:(i.itype?`[${i.itype}] `:"")+(i.descr||""), act:i.source==="toc"?"目录层":(i.source+"章抽取"), src:i.source, itype:i.itype||null});
  });
  return {fail, unmatched, units, mids};
})();

function refreshCounts(){
  const ds = doneStats();
  const left = {fail:REVIEW.fail.length-ds.fail, unmatched:REVIEW.unmatched.length-ds.unmatched,
    unit:REVIEW.units.length-ds.unit, mid:REVIEW.mids.length-ds.mid};
  const totalLeft = left.fail+left.unmatched+left.unit+left.mid;
  const card = $("#cards").children[3];

    card.querySelector(".n").textContent = totalLeft;
    card.querySelector(".t").innerHTML = `待人工核对<br>H3超差${left.fail} · 未匹配${left.unmatched} · 单位存疑${left.unit} · 疑点${left.mid}`;

  const tn = document.querySelector('.tnode[data-id="review"] .cnt');
  if(tn) tn.textContent = totalLeft;
}

const CH13="0113", CH17="0117";
const secChToCode = k => Object.keys(AMP_SEC).find(c=>AMP_SEC[c]===k);
const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：qh=2-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

/* ---------------- 内容渲染 ---------------- */
const main = () => $("#main");
function show(id){
  if(id.startsWith("item:")){ return openItem(id.slice(5)); }
  if(id==="gs"){ return viewSections(GS_TYPE, S.sectionsBy(GS_TYPE), extraGS); }
  if(id==="mj"){ return viewSections("建设工程建筑面积计算规范", S.sectionsBy("规范")); }
  if(id==="toc"){ return viewToc(); }
  if(id==="price"){ return viewPrice(); }
  if(id==="mix"){ return viewMix(); }
  if(id==="derive"){ return viewDerive(); }
  if(id==="errata"){ return viewErrata(); }
  if(id==="findings"){ return viewFindings(); }
  if(id==="issues"){ return viewIssues(); }
  if(id==="review"){ return viewReview(); }
  if(id==="fb17"){ return viewSections("第十七章 附表（样板）", S.sectionsBy("附表").filter(s=>!s.chapter_code)); }
  if(id.startsWith("ch:")){ return viewChapter(id.slice(3)); }
  if(id.startsWith("layer:")){ const p=id.split(":"); return viewLayer(p[1], p[2]); }
}

function secBlock(s, open){
  const tb = S.sec(s.tables), tbf = S.sec(s.tables_fixed);
  let tbs = "";
  if(tb){
    tbs += `<table class="tbl">${tb.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>
    <div class="sec-bd">${esc(s.text)}${tbs}</div></div>`;
}
function bindSecs(){ document.querySelectorAll(".sec-hd").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open"))); }

function viewChapter(code){

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

function viewItems(secCh){

function openItem(code){
  const i = DATA.items.find(x=>x.item_code===code);
  const d = DATA.details[code]||{};
  const v = d.validate||{};
  const hd = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

    <b style="font-size:16px">${esc(i.name)}</b><span class="badge b-gray">${esc(i.category||"")}</span>
    <span class="badge b-blue">单位 ${esc(i.unit)}</span>
    <span class="badge b-gray">P${i.page}/印${i.print_page}</span>
    ${PAGEIMG.has(i.page)?`<span class="rbtn" id="ibimg" title="弹出原文页面图核对">🖼 原文页</span>`:""}
    <span class="badge ${v.H1&&v.H1.ok?"b-green":"b-red"}">H1 基价恒等</span>
    <span class="badge ${v.H2&&v.H2.ok?"b-green":"b-red"}">H2 人工三档</span>
    ${h3badge(i.h3_status)}
    <span class="badge ${v.H4&&v.H4.ok?"b-green":"b-gray"}">H4 ${v.H4&&v.H4.ok?"通过":"不适用"}</span>
    ${i.errata_status==="hit"?`<span class="badge b-blue" title="该子目被官方勘误覆盖，erratas 表双值留痕">勘误覆盖</span>`:""}
    <button class="x" id="mx">✕</button></div>`;
  const p4 = `<div class="price4">
    <div class="it total"><div class="k">基价</div><div class="v">${num2(i.base_price)}</div></div>
    <div class="it"><div class="k">人工费</div><div class="v">${num2(i.labor_cost)}</div></div>
    <div class="it"><div class="k">材料费</div><div class="v">${num2(i.material_cost)}</div></div>
    <div class="it"><div class="k">机械费</div><div class="v">${num2(i.machine_cost)}</div></div>
    <div class="it"><div class="k">综合费用</div><div class="v">${num2(i.combined_cost)}</div></div></div>`;
  const tbl = (title, rows, cols) => rows.length ? `<h3>${title}（${rows.length}）</h3>
    <table class="tbl"><thead><tr>${cols.map(c=>`<th${c.n?' class="num"':''}>${c.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td${c.n?' class="num"':''}>${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
  const h2d = v.H2 && v.H2.ok ? `<div class="note">H2 对账：${v.H2.days} 工日 × 三档配比 → ${num2(v.H2.calc)} 元（三档配比 ${JSON.stringify(v.H2.tiers||{})}，当期人工单价 ${v.H2.rate} 元/工日）</div>` : "";
  let h3d = "";
  if(d.h3){
    const dt = d.h3.detail||{};
    if(d.h3.status==="fail") h3d = `<div class="warn">H3 超差：书印材料费 ${num2(dt.declared)} ≠ 价格库反推 ${num2(dt.calc)}（差 ${num2(dt.diff)}）。<b>需人工对价</b>——左侧「🔍 人工核对」清单可定位同类条目。</div>`;
    if(d.h3.status==="skip_unmatched"||d.h3.status==="unmatched") h3d = `<div class="warn">H3 跳过·未匹配：${esc(dt.note||"")}。缺价材料：${(dt.missing||[]).map(m=>`${esc(m.name)}(${esc(m.unit||"")})`).join("、")||"—"}，需补价格库后自动复检转通过。</div>`;
    if(d.h3.status==="skip_nomat"||d.h3.status==="nomat") h3d = `<div class="note">H3 跳过·免核：${esc(dt.note||"")}（不含材料子目）。</div>`;
  }
  const wcBlk = i.work_content
    ? `<div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa)"><b>工作内容</b>（计价主要参考）：${esc(i.work_content)}</div>`
    : "";
  const notes = (d.notes||[]).map(n=>`<div class="note">▪ ${esc(n.text)}</div>`).join("");
  let errd = "";
  if(i.errata_status==="hit"){
    const es = (DATA.erratas||[]).filter(e=>{
      try{ return (JSON.parse(e.item_codes||"[]")||[]).includes(code); }catch(_){ return false; }
    });
    if(es.length) errd = `<div class="warn">⚠ <b>官方勘误覆盖</b>（库内保留原文值，overlay 双值留痕）：${es.map(e=>`${esc(e.errata_type||"")} ${esc(e.wrong_text||"")} → <b>${esc(e.correct_text||"")}</b>（勘误号 ${esc(e.errata_id)}，印${e.printed_page??"?"}）`).join("<br>")}</div>`;
  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("材料消耗", d.materials||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("机械消耗", d.machines||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));
}

function showPageImg(page, sub){
  if(!PAGEIMG.has(page)) return alert(`P${page} 原文图未渲染（scripts/render_page_images.py 补渲）`);
  $("#pinfo").textContent = `📄 原文页面 P${page} / 印${page-27}` + (sub?` · ${sub}`:"");
  $("#pimg").src = pageImgUrl(page);
  pFit();
  $("#pmask").classList.add("show");
}
$("#pz-out").addEventListener("click",()=>{ pZoom=Math.max(320,pZoom-200); $("#pimg").style.width=pZoom+"px"; });
$("#pz-in").addEventListener("click",()=>{ pZoom=Math.min(2400,pZoom+200); $("#pimg").style.width=pZoom+"px"; });
$("#pz-fit").addEventListener("click", pFit);
$("#pz-100").addEventListener("click",()=>{ const im=$("#pimg"); pZoom=im.naturalWidth||960; im.style.width=pZoom+"px"; });
$("#pimg").addEventListener("click", pFit);
$("#pclose").addEventListener("click",()=>$("#pmask").classList.remove("show"));
$("#pmask").addEventListener("click",e=>{ if(e.target.id==="pmask") $("#pmask").classList.remove("show"); });

function viewPrice(){
  const N_REV = DATA.mat_prices.filter(p=>p.source==="反推").length;
  const N_OFF = DATA.mat_prices.filter(p=>p.source==="官方配比").length;
  const N_ATT = DATA.stats.mat_prices - N_REV - N_OFF;
  main().innerHTML = `<div class="panel"><h2>价格库</h2>
    <div class="filter"><span class="chip on" data-p="m">材料 ${DATA.stats.mat_prices}</span><span class="chip" data-p="j">机械 ${DATA.stats.mach_prices}</span>
    <span id="psrc" class="filter"><span class="chip on" data-s="all">全部 ${DATA.stats.mat_prices}</span><span class="chip" data-s="rev">⚡反推 ${N_REV}</span><span class="chip" data-s="off">官方配比 ${N_OFF}</span><span class="chip" data-s="att">附表 ${N_ATT}</span></span>
    <input id="pq" placeholder="名称搜索…" style="width:220px"></div>
    <div id="pbody"></div></div>`;
  let src = "all";
  const srcFn = p => src==="all" || (src==="rev" ? p.source==="反推" : src==="off" ? p.source==="官方配比" : (p.source!=="反推" && p.source!=="官方配比"));
  const renderM = kw => {
    const hits = DATA.mat_prices.filter(p=>srcFn(p)&&(!kw||p.name.includes(kw)));
    const rows = hits.slice(0,300);
    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">序</th><th>名称</th><th>单位</th><th class="num">单价(元)</th><th class="num">页</th><th>来源</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${p.seq}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="num">${num2(p.price)}</td><td class="num">${p.page??"—"}</td>
      <td>${p.source==="反推"?'<span class="badge b-amber">⚡反推入库</span>':p.source==="官方配比"?'<span class="badge b-green">官方配比</span>':'<span class="badge b-gray">附表</span>'}</td></tr>`).join("")}</tbody></table>
      ${kw||src!=="all"?`<div class="note">命中 ${hits.length} 条${kw?"（按名称）":""}${src!=="all"?"（按来源）":""}${hits.length>300?"，最多显示 300。":"。"}</div>`:""}`;
  };
  const renderJ = kw => {
    const rows = DATA.mach_prices.filter(p=>!kw||(p.name||"").includes(kw)).slice(0,300);
    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">编码</th><th>名称</th><th>规格</th><th class="num">台班单价(元)</th><th class="num">页</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.spec||"")}</td><td class="num">${num2(p.unit_price)}</td><td class="num">${p.page}</td></tr>`).join("")}</tbody></table>
      ${kw?`<div class="note">命中 ${DATA.mach_prices.filter(p=>(p.name||"").includes(kw)).length} 条，最多显示 300。</div>`:""}`;
  };
  let mode = "m";
  const paint = () => { const kw=$("#pq").value.trim(); mode==="m"?renderM(kw):renderJ(kw); };
  document.querySelectorAll(".chip[data-p]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll(".chip[data-p]").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
    mode = ch.dataset.p;
    $("#psrc").style.display = mode==="m" ? "" : "none";
    paint();
  }));
  document.querySelectorAll("#psrc .chip").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#psrc .chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
    src = ch.dataset.s; paint();
  }));
  $("#pq").addEventListener("input", paint);
  paint();
}

function viewDerive(){
  const G = DATA.price_derive||[], IT = DATA.price_derive_items||[], FL = DATA.price_derive_fails||[];
  const badge = g => {
    const mine = PCONF[pk(g.material, g.unit)];
    if(g.review_status==="confirmed") return `<span class="badge b-green">✅已确认${g.build_price!=null?" "+num2(g.build_price):""}</span>`;
    if(mine) return mine.materialize
      ? `<span class="badge b-green">⚡已入库 ${num2(mine.build_price)}·${mine.source==="官方配比"?"官方配比":"反推"}</span>`
      : `<span class="badge b-green">✍已定价 ${num2(mine.build_price)}（待导出）</span>`;
    if((g.conclusion||"").includes("待人工确认")) return `<span class="badge b-amber">待人工确认</span>`;
    if((g.conclusion||"").includes("离散")) return `<span class="badge b-red">离散·须分条</span>`;
    return `<span class="badge b-blue">可直接建库</span>`;
  };
  const catOf = g => g.review_status==="confirmed" ? "confirmed"
    : (g.conclusion||"").includes("离散") ? "multi"
    : (g.conclusion||"").includes("待人工确认") ? "round" : "single";
  const stTxt = {ambiguous:"同名多价行·匹配器拒判", multi:"同子目缺价材料≥2项，差额无法唯一拆分",
    no_qty:"缺价行无消耗量", negative:"已知合计>书印材料费（疑似匹配误命中）",
    no_material_cost:"子目无书印材料费", no_missing:"无未匹配行（状态不一致，留痕）"};
  const nConf = G.filter(g=>g.review_status==="confirmed").length;
  const nPriced = G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; }).length;
  const nMat = G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize).length;
  const cats = [["all","全部",G.length],["cand","库内有近似",G.filter(g=>(g.candidates||[]).length).length],
    ["single","单一价",G.filter(g=>catOf(g)==="single").length],
    ["round","舍入级·待确认",G.filter(g=>catOf(g)==="round").length],
    ["multi","离散分条",G.filter(g=>catOf(g)==="multi").length],
    ["priced","已定价待导出",nPriced],["mat","⚡已入库反推",nMat],
    ["confirmed","已确认回库",nConf],["fails","无法反推",FL.length]];
  main().innerHTML = `<div class="panel"><h2>💰 缺价反推 · 定价工作台（${G.length} 种材料 · 子目溯源 ${IT.length} 条 · 无法反推 ${FL.length} 条）</h2>
    <div class="note"><b>未匹配为何这么多（查验结论）</b>：全书价格附表共 ${DATA.stats.mat_prices} 条，半成品混合料（水泥砂浆/胶泥/灰土/玛蹄脂…）与市场化材料（龙骨/亚克力字/窗帘…）为选择性收录——属实、非漏配；匹配器带防误伤设计（单位一致门、同名多价拒判）${DATA.manual_findings&&DATA.manual_findings.some(f=>/玛蹄脂/.test(f.subject||""))?`，如石油沥青玛蹄脂库内为 kg 与消耗 m³ 不一致而正确拒配（已立案 manual_findings）`:""}。<br>
    <b>审核通路</b>：① 每组点 <b>✍ 定价</b>（弹窗内可比对<b>库内近似候选</b>与反推溯源明细，单位错配标红）→ ② 顶部 <b>⬇ 导出核价记录</b> 下载 JSON → ③ 将 rules 数组 merge 进 <code>out/price_confirm.json</code> 重跑 build_db → 组状态转 ✅已确认、build_price 覆盖 → ④ 向 material_prices 补录该价后相关子目 H3 自动复检转 pass。</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-d="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <input id="dqq" placeholder="过滤：材料/子目编号…" style="width:200px">
      <span class="rbtn" id="export-price" title="下载 price_confirm.json 兼容格式，merge 回 out/price_confirm.json 后重跑 build_db 生效">⬇ 导出核价记录（${nPriced}）</span></div>
    <div id="dbody"></div></div>`;
  const candBadge = g => {
    const cs = g.candidates||[];
    if(!cs.length) return `<span class="badge b-gray">无近似</span>`;
    const um = cs.some(c=>c.unit_match);
    return `<span class="rbtn" data-cand="${esc(g.material)}" data-cu="${esc(g.unit||"")}" title="${esc(cs.map(c=>c.name+"("+c.unit+") "+num2(c.price)).join("； "))}">🔍近似 ${cs.length}${um?"":""}</span>`;
  };
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{d:"all"}}).dataset.d;
    const kw = $("#dqq").value.trim();
    let list = cat==="all"||cat==="fails" ? G.slice() : cat==="cand" ? G.filter(g=>(g.candidates||[]).length)
      : cat==="priced" ? G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; })
      : cat==="mat" ? G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize)
      : G.filter(g=>catOf(g)===cat);
    if(kw) list = list.filter(g => g.material.includes(kw) || (JSON.parse(g.item_codes||"[]")).some(c=>c.includes(kw)));
    const body = list.map((g,i)=>{
      const rng = g.price_min===g.price_max ? num2(g.price_min) : num2(g.price_min)+" ~ "+num2(g.price_max);
      const sug = g.review_status==="confirmed" && g.build_price!=null ? num2(g.build_price)+"（人工定价）" : num2(g.suggested_price);
      const det = IT.filter(r=>r.material===g.material && r.unit===g.unit);
      const detRows = det.map(r=>`<tr class="clickable" data-item="${esc(r.item_code)}">
        <td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
        <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc(r.item_name||"")}</td>
        <td>${esc((S.chapter(r.chapter_code)||{}).name||r.chapter_code||"—")}</td>
        <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td>
        <td class="num">${num2(r.known)}</td><td class="num">${num2(r.remain)}</td></tr>`).join("");
      const priced = PCONF[pk(g.material,g.unit)];
      const matOn = priced && priced.materialize;
      return `<tr class="clickable" data-g="${i}">
        <td><b>${esc(g.material)}</b>${priced?` <span class="badge b-green">${matOn?"⚡"+num2(priced.build_price):"✍"+num2(priced.build_price)}</span>`:""}</td><td>${esc(g.unit)}</td>
        <td class="num" style="font-weight:700;color:var(--accent)">${sug}</td>
        <td class="num">${rng}</td><td class="num">${g.n_prices}</td><td class="num">${g.n_items}</td>
        <td>${candBadge(g)}</td>
        <td>${esc(g.conclusion)}</td><td>${badge(g)}
        <span class="rbtn" data-price="${esc(g.material)}" data-pu="${esc(g.unit||"")}" data-pp="${g.suggested_price!=null?g.suggested_price:""}">✍定价</span>
        <span class="rbtn" data-mat="${esc(g.material)}" data-mu="${esc(g.unit||"")}" data-pp="${g.suggested_price!=null?g.suggested_price:""}" title="以建议反推价直接入库，标注来源=反推；导出回库后参与H3复检">${matOn?"⚡已入库":"⚡入库"}</span></td></tr>
        <tr class="d-det" data-for="${i}" style="display:none"><td colspan="9" style="background:#fbfcfe">
          <div class="note" style="margin-bottom:4px">子目溯源明细（按反推价分组；溯源=书印材料费−已匹配合计=缺口额，÷消耗量=反推价）：</div>
          <table class="tbl"><thead><tr><th class="num">反推单价</th><th>子目</th><th>名称</th><th>章</th>
            <th class="num">消耗量</th><th class="num">书印材料费</th><th class="num">已匹配合计</th><th class="num">缺口额</th></tr></thead>
          <tbody>${detRows||'<tr><td colspan="8">无</td></tr>'}</tbody></table></td></tr>`;
    }).join("");
    const failRows = FL.map(f=>{
      const it = DATA.items.find(x=>x.item_code===f.item_code)||{};
      const rn = JSON.parse(f.rows_json||"[]").map(r=>`${r.name}(${r.unit||""})`).join("、")||"—";
      return `<tr class="clickable" data-item="${esc(f.item_code)}"><td style="font-family:var(--mono)">${esc(f.item_code)}</td>
        <td>${esc(it.name||"")}</td><td>${esc((S.chapter(f.chapter_code)||{}).name||f.chapter_code||"—")}</td>
        <td>${esc(stTxt[f.status]||f.status)}</td><td>${esc(rn)}</td></tr>`;
    }).join("");
    $("#dbody").innerHTML =
      (cat!=="fails" && list.length ? `<table class="tbl"><thead><tr><th>材料</th><th>单位</th><th class="num">建议建库价</th>
        <th class="num">反推价区间</th><th class="num">价种类</th><th class="num">子目数</th><th>库内近似</th><th>结论</th><th>状态/操作</th></tr></thead>
        <tbody>${body}</tbody></table>
        <div class="note">命中 ${list.length} 组材料。<b>点击材料行</b>展开子目溯源，<b>🔍近似</b>看库内候选，<b>✍定价</b>打开定价弹窗，<b>点击子目行</b>弹出完整详情。</div>` : "") +
      (cat==="fails"||cat==="all" ? (FL.length && (cat==="fails"||!kw) ?
        `<h3>无法唯一反推的子目（须回原文补价，双缺材料差额无法拆分）</h3>
        <table class="tbl"><thead><tr><th>子目</th><th>名称</th><th>章</th><th>原因</th><th>涉及缺价行</th></tr></thead>
        <tbody>${failRows}</tbody></table>` : "") : "") +
      (!list.length && (cat!=="fails"||!FL.length) ? '<div class="note">无匹配。</div>' : "");
    document.querySelectorAll("#dbody tr[data-g]").forEach(tr=>tr.addEventListener("click",()=>{
      const det = document.querySelector(`#dbody .d-det[data-for="${tr.dataset.g}"]`);
      det.style.display = det.style.display==="none" ? "" : "none";
    }));
    document.querySelectorAll("#dbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{ ev.stopPropagation(); openItem(tr.dataset.item); });
    });
    document.querySelectorAll("#dbody [data-cand]").forEach(el=>el.addEventListener("click",ev=>{
      ev.stopPropagation(); const g=G.find(x=>x.material===el.dataset.cand && (x.unit||"")===el.dataset.cu); openPriceDialog(g);
    }));
    document.querySelectorAll("#dbody [data-price]").forEach(el=>el.addEventListener("click",ev=>{
      ev.stopPropagation(); const g=G.find(x=>x.material===el.dataset.price && (x.unit||"")===el.dataset.pu); openPriceDialog(g);
    }));
    document.querySelectorAll("#dbody [data-mat]").forEach(el=>el.addEventListener("click",ev=>{
      ev.stopPropagation();
      const g=G.find(x=>x.material===el.dataset.mat && (x.unit||"")===el.dataset.mu);
      if(!g) return;
      const p = g.suggested_price!=null ? g.suggested_price : null;
      if(p==null){ openPriceDialog(g); return; }   // 离散组无建议价 → 弹窗人工定
      PCONF[pk(g.material,g.unit)] = {"build_price":p, "materialize":true,
        "note":"一键入库·采纳反推建议价", "date":new Date().toISOString().slice(0,10)};
      savePConf(); paint(); refreshCounts();
    }));
  };
  const openPriceDialog = g => {
    if(!g) return;
    const cs = g.candidates||[];
    const mine = PCONF[pk(g.material,g.unit)]||{};
    const det = IT.filter(r=>r.material===g.material && r.unit===g.unit).slice(0,10);
    const candRows = cs.length ? cs.map(c=>`<tr ${c.unit_match?"":'style="color:#c62828"'}>
      <td>${esc(c.name)}</td><td>${esc(c.unit)}${c.unit_match?' <span class="badge b-green">单位一致</span>':' <span class="badge b-red">单位错配</span>'}</td>
      <td class="num">${num2(c.price)}</td></tr>`).join("") : '<tr><td colspan="3">价格库无近似名——真缺（半成品/市场化材料，书附表选择性收录）</td></tr>';
    const detRows = det.map(r=>`<tr><td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
      <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc((r.item_name||"").slice(0,30))}</td>
      <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td><td class="num">${num2(r.remain)}</td></tr>`).join("");
    $("#mx").innerHTML = `<h3>✍ 定价：${esc(g.material)} <span class="badge b-gray">${esc(g.unit)}</span></h3>
      <div class="note">反推口径：书印材料费 − 已匹配价量合计 = 缺口额 ÷ 消耗量。<b>建议价 ${num2(g.suggested_price)}</b> · 区间 ${g.price_min===g.price_max?num2(g.price_min):num2(g.price_min)+"~"+num2(g.price_max)} · ${g.n_prices} 价种 · ${g.n_items} 子目 · ${esc(g.conclusion||"")}</div>
      <h4 style="margin:8px 0 4px">🔍 价格库近似候选（红色=单位不一致，参考须换算或防错配）</h4>
      <table class="tbl"><thead><tr><th>库内名称</th><th>单位</th><th class="num">单价</th></tr></thead><tbody>${candRows}</tbody></table>
      <h4 style="margin:8px 0 4px">反推溯源（前 10 条，全量见列表展开）</h4>
      <table class="tbl"><thead><tr><th class="num">反推价</th><th>子目</th><th>名称</th><th class="num">消耗量</th><th class="num">书印材料费</th><th class="num">缺口额</th></tr></thead><tbody>${detRows||"<tr><td colspan=6>无</td></tr>"}</tbody></table>
      <div class="done-form">
        <label>定价（元/${esc(g.unit)}，建议 ${num2(g.suggested_price)}，可改）</label>
        <input id="pd-price" type="number" step="0.01" value="${mine.build_price!=null?mine.build_price:(g.suggested_price!=null?g.suggested_price:"")}">
        <label>定价依据（可留空）</label><input id="pd-note" value="${esc(mine.note||"")}" placeholder="如：采纳反推中位价 / 与库内 xx 换算…">
      </div>
      <div class="note">保存后存浏览器 localStorage（qtx_price_v1），经「⬇ 导出核价记录」下载 → merge 回 out/price_confirm.json → 重跑 build_db 生效回库。<b>⚡ 一键入库</b>=确认定价并 materialize：回库后写入 material_prices 表（来源标注「反推」），并参与 H3 自动复检。</div>
      <div class="done-actions"><button class="ok" id="pd-save">✅ 保存定价</button>
        <button class="ok" id="pd-mat">⚡ 一键入库</button>
        <button class="no" id="pd-clear">${mine.build_price!=null?"关闭":"取消"}</button></div>`;
    $("#mask").classList.add("show");
    const doSave = mat => {
      const v = parseFloat($("#pd-price").value);
      if(!(v>0)){ alert("请输入有效定价（>0）"); return; }
      PCONF[pk(g.material,g.unit)] = {"build_price":v, "materialize":!!mat,
        "note":$("#pd-note").value.trim() || (mat?"一键入库·反推价":""), "date":new Date().toISOString().slice(0,10)};
      savePConf(); $("#mask").classList.remove("show"); paint(); refreshCounts();
    };
    $("#pd-save").addEventListener("click",()=>doSave(false));
    $("#pd-mat").addEventListener("click",()=>doSave(true));
    $("#pd-clear").addEventListener("click",()=>{ $("#mask").classList.remove("show"); });
  };
  $("#export-price").addEventListener("click",()=>{
    const rules = Object.entries(PCONF).map(([k,v])=>{
      const i=k.lastIndexOf("|"); return {"material":k.slice(0,i), "unit":k.slice(i+1),
        "build_price":v.build_price, "materialize":!!v.materialize, "note":v.note||"",
        "confirmed_by":"爪哥（前端定价工作台）", "date":v.date||""};
    });
    if(!rules.length){ alert("尚未定价——先在各组「✍定价」录入后再导出。"); return; }
    const blob = new Blob([JSON.stringify({"rules":rules}, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);

  });

}

function viewReview(){
  const cats = [
    ["all", "全部", REVIEW_TOTAL],
    ["fail", "H3 超差", REVIEW.fail.length],
    ["unmatched", "材料未匹配", REVIEW.unmatched.length],
    ["unit", "单位存疑", REVIEW.units.length],
    ["mid", "其他中风险", REVIEW.mids.length],
  ];
  const badge = {fail:"b-red", unmatched:"b-amber", unit:"b-blue", mid:"b-gray"};
  const label = {fail:"H3超差", unmatched:"未匹配", unit:"单位存疑", mid:"疑点"};
  const nConf = (DATA.issues||[]).filter(i=>i.review_status==="confirmed").length;
  main().innerHTML = `<div class="panel"><h2>🔍 待人工核对清单（${REVIEW_TOTAL} 条）</h2>
    <div class="note"><b>H3超差</b>=材料费书印值与价格库反推不符，须人工对价；<b>材料未匹配</b>=缺价材料，补价格库后自动复检转通过；<b>单位存疑</b>=抽取单位与常规口径不符，须回看原文；<b>其他中风险</b>=抽取过程登记的中风险疑点。<b>点击行</b>弹出子目详情；<b>🖼 原文</b>弹出该页书页图直接比对；核对无误点 <b>核销</b>（单位存疑可在核销时直接改单位值）。${nConf?`<br>✅ 另有 <b>${nConf}</b> 条已人工确认（记录于 out/manual_confirm.json overlay）。`:""}</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-c="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <span class="chip on" id="hdchip" title="已核销行默认隐藏，点此切换显示">隐藏已核销</span>
      <input id="rq" placeholder="过滤：编号/关键字…" style="width:200px">
      <span class="rbtn" id="expbtn" title="导出已核销记录（manual_confirm.json 兼容格式，merge 后重跑 build_db 生效 overlay）">⬇ 导出核销记录</span></div>
    <div id="rbody"></div></div>`;
  let hideDone = true;
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{c:"all"}}).dataset.c;
    const kw = $("#rq").value.trim();
    const pick = {fail:REVIEW.fail, unmatched:REVIEW.unmatched, unit:REVIEW.units, mid:REVIEW.mids};
    let list = cat==="all"
      ? [...REVIEW.fail.map(r=>["fail",r]), ...REVIEW.unmatched.map(r=>["unmatched",r]),
         ...REVIEW.units.map(r=>["unit",r]), ...REVIEW.mids.map(r=>["mid",r])]
      : pick[cat].map(r=>[cat,r]);
    if(kw) list = list.filter(([c,r]) => (r.code||"").includes(kw) || (r.text||"").includes(kw));
    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;
    const shown = list.filter(([c,r]) => !(hideDone && DONE[rkey(c,r)])).slice(0,500);
    KEY2REC_CLEAR();
    const row = (cat, r) => {
      const key = rkey(cat, r);
      KEY2REC[key] = {cat, r};
      const done = DONE[key];
      const clk = r.code ? ` data-item="${esc(r.code)}"` : "";
      const imgBtn = (r.page && PAGEIMG.has(r.page))
        ? `<span class="rbtn" data-img="${r.page}" data-code="${esc(r.code||"")}">🖼 原文</span>`
        : `<span class="note" style="font-size:11px">无图</span>`;
      const act = done
        ? `<span class="rdone-mark">✅已核销</span> <span class="rbtn" data-undo="${esc(key)}">撤销</span>`
        : `<span class="rbtn" data-done="${esc(key)}" data-cat="${cat}">核销</span>`;
      return `<tr${clk} class="${done?"rdone":""}"><td><span class="badge ${badge[cat]}">${label[cat]}</span></td>
        <td style="font-family:var(--mono)">${esc(r.code||"—")}</td>
        <td class="num">${r.page??"—"}</td><td>${esc(r.text)}</td><td>${esc(r.act||"")}</td>
        <td style="white-space:nowrap">${imgBtn}</td><td style="white-space:nowrap">${act}</td></tr>`;
    };
    $("#rbody").innerHTML = `<table class="tbl"><thead><tr><th>类别</th><th>子目</th><th class="num">物理页</th><th>详情</th><th>处置</th><th>原文</th><th>操作</th></tr></thead><tbody>
      ${shown.map(([c,r])=>row(c,r)).join("") || '<tr><td colspan="7">无匹配</td></tr>'}</tbody></table>
      <div class="note">命中 ${list.length} 条 · 待核销 ${hidden} 条${list.length>500?"（仅渲染前 500，请用过滤缩小范围）":""}。核销记录存于浏览器 localStorage（键 qtx_done_v1），「⬇ 导出核销记录」可下载 JSON 供回库。</div>`;
    document.querySelectorAll("#rbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{
        if(ev.target.closest("[data-done],[data-undo],[data-img]")) return;
        openItem(tr.dataset.item);
      });
    });
    document.querySelectorAll("#rbody [data-img]").forEach(el=>{
      el.addEventListener("click", ()=>showPageImg(+el.dataset.img, el.dataset.code||""));
    });
    document.querySelectorAll("#rbody [data-undo]").forEach(el=>{
      el.addEventListener("click", ()=>{ delete DONE[el.dataset.undo]; saveDone(); paint(); refreshCounts(); });
    });
    document.querySelectorAll("#rbody [data-done]").forEach(el=>{
      el.addEventListener("click", ()=>openDoneDialog(el.dataset.done, el.dataset.cat));
    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){
    const rec = KEY2REC[key]; if(!rec) return;
    const r = rec.r;
    const it = r.code ? DATA.items.find(x=>x.item_code===r.code) : null;
    const isUnit = cat==="unit" && it;
    $("#modal").innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:15px">核销确认</b><span class="badge ${badge[cat]}">${label[cat]}</span>
        <span style="font-family:var(--mono);color:var(--accent)">${esc(r.code||"—")}</span>
        <button class="x" id="dx">✕</button></div>
      <div class="note" style="margin-top:8px">${esc(r.text)}</div>
      ${r.page&&PAGEIMG.has(r.page)?`<div style="margin-top:10px"><span class="rbtn" id="dimg">🖼 弹出原文 P${r.page} 比对</span></div>`:""}
      <div class="done-form">
        ${isUnit?`<label>单位（核对原文后如需修正直接改，改值随核销记录导出）</label><input id="du" value="${esc(it.unit||"")}">`:""}
        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;
    $("#mask").classList.add("show");
    const close = ()=>$("#mask").classList.remove("show");
    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});
