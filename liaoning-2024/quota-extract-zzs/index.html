[{"id":"SZ08-1902-01","name":"一、预制钢构件安装","page":48},{"id":"SZ08-1902-02","name":"二、楼层板、围护体系钢结构及其他安装","page":76}],"011903":[{"id":"SZ08-1903-01","name":"一、预制木构件安装","page":96},{"id":"SZ08-1903-02","name":"二、围护体系安装","page":105}],"011904":[{"id":"SZ08-1904-01","name":"一、单元式幕墙安装","page":112},{"id":"SZ08-1904-02","name":"二、非承重隔墙安装","page":115},{"id":"SZ08-1904-03","name":"三、预制烟道及通风道安装","page":119},{"id":"SZ08-1904-04","name":"四、预制成品护栏安装","page":121},{"id":"SZ08-1904-05","name":"五、装饰成品部件安装","page":122}],"011905":[{"id":"SZ08-1905-01","name":"一、工具式模板","page":136},{"id":"SZ08-1905-02","name":"二、后浇混凝土模板","page":141},{"id":"SZ08-1905-03","name":"三、工具式脚手架","page":142}]},"ch13_nodes":[],"sections":[{"section_id":"CS-001","block_type":"册说明","chapter_code":null,"seq":1,"page":10,"print_page":1,"text":"一、辽宁省建设工程计价依据《装配式建筑工程定额》(以下简称本定额),是依据国家《建设工程工程量清单计价规范》(GB50500-2013)、《建设工程工程量清单计算规范》(GB50855-2013)、《装配式建筑工程消耗量定额》(TY01—01(01)-2016)。","tables":null,"tables_fixed":null},{"section_id":"CS-002","block_type":"册说明","chapter_code":null,"seq":2,"page":10,"print_page":1,"text":"二、本定额的适用范围:我省行政区域内的国有投资或国有投资为主的符合装配式建筑特征的建筑工程项目。本定额是《房屋建筑与装饰工程定额》、《通用安装工程定额》、《市政工程定额》的补充,与之配套使用。本定额内容包括装配式混凝土结构、钢结构、木结构建筑工程项目。","tables":null,"tables_fixed":null},{"section_id":"CS-003","block_type":"册说明","chapter_code":null,"seq":3,"page":10,"print_page":1,"text":"三、本定额是按现行装配式建筑工程的施工验收规范、质量评定标准和安全操作规程,按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期以及新技术、新材料、新工艺在施工中的应用编制的。","tables":null,"tables_fixed":null},{"section_id":"CS-004","block_type":"册说明","chapter_code":null,"seq":4,"page":10,"print_page":1,"text":"四、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个定额项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"CS-005","block_type":"册说明","chapter_code":null,"seq":5,"page":10,"print_page":1,"text":"五、本定额的砂浆、混凝土除另有规定外,均按预拌或成品编制的,如果采用现场搅拌,拌制增加费按《房屋建筑与装饰工程定额》相应项目调整。","tables":null,"tables_fixed":null},{"section_id":"CS-006","block_type":"册说明","chapter_code":null,"seq":6,"page":10,"print_page":1,"text":"六、装配式建筑措施项目费,除本定额另有说明外,按照《房屋建筑与装饰工程定额》有关规定执行。","tables":null,"tables_fixed":null},{"section_id":"CS-007","block_type":"册说明","chapter_code":null,"seq":7,"page":11,"print_page":2,"text":"七、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"CS-008","block_type":"册说明","chapter_code":null,"seq":8,"page":11,"print_page":2,"text":"八、本说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"ZS-009","block_type":"章说明","chapter_code":"1901","seq":9,"page":14,"print_page":5,"text":"一、本章定额包括预制混凝土构件安装和后浇混凝土浇捣两节。","tables":null,"tables_fixed":null},{"section_id":"ZS-010","block_type":"章说明","chapter_code":"1901","seq":10,"page":14,"print_page":5,"text":"二、本章定额所称的装配式混凝土结构工程,指预制混凝土构件通过可靠的连接方式装配而成的混凝土结构,包括装配整体式混凝土结构、全装配混凝土结构。","tables":null,"tables_fixed":null},{"section_id":"ZS-011","block_type":"章说明","chapter_code":"1901","seq":11,"page":14,"print_page":5,"text":"三、预制构件安装1. 构件安装不分构件外形尺寸、截面类型以及是否带有保温,除另有规定者外,均按构件种类套用相应定额。2. 构件安装定额已包括构件固定所需临时支撑的搭设及拆除,支撑(含支撑用预埋铁件)种类、数量及搭设方式综合考虑。3. 柱、墙板、女儿墙等构件安装定额中,构件底部坐浆按砌筑砂浆铺筑考虑,遇设计采用灌浆料的,除灌浆材料单价换算以及扣除干混砂浆罐式搅拌机台班外,每10m3 构件安装定额另行增加人工0.7 工日,其余不变。4. 外挂墙板、女儿墙构件安装设计要求接缝处填充保温板时,相应保温板消耗量按设计要求增加计算,其余不变。5. 墙板安装定额不分是否带有门窗洞口,均按相应定额执行。凸(飘)窗安装定额适用于单独预制的凸(飘)窗安装,依附于外墙板制作的凸(飘)窗,并入外墙板内计算,相应定额人工和机械用量乘以系数1.2。6. 外挂墙板安装定额已综合考虑了不同的连接方式,按构件不同类型及厚度套用相应定额。7. 楼梯休息平台安装按平台板结构类型不同,分别套用整体楼板或叠合楼板相应定额,相应定额人工、机械,以及除预制混凝土楼板外的材料用量乘以系数1.3。8. 阳台板安装不分板式或梁式,均执行同一定额项目。空调板安装定额适用于单独预制的空调板安装,依附于阳台板制作的栏板、翻沿、空调板,并入阳台板内计算。非悬挑的阳台板安装,分别按梁、板安装有关规则计算并套用相应定额。9. 女儿墙安装按构件净高以0.6m 以内和1.4m 以内分别编制,1.4m 以上时套用外墙板安装定额。压顶安装定额适用于单独预制的压顶安装,依附于女儿墙制作的压顶,并入女儿墙计算。10. 套筒注浆不分部位、方向,按锚入套筒内的钢筋直径不同,以ϕ18 以内及ϕ18 以上分别编制。11. 外墙嵌缝、打胶定额中注胶缝的断面按20mm×15mm 编制,若设计断面与定额不同时,密封胶用量按比例调整,其余不变。定额中的密封胶按硅酮耐候胶考虑,遇设计采用的种类与定额不同时,材料单价进行换算。","tables":null,"tables_fixed":null},{"section_id":"ZS-012","block_type":"章说明","chapter_code":"1901","seq":12,"page":15,"print_page":6,"text":"四、后浇混凝土浇捣1. 后浇混凝土指装配整体式结构中,用于与预制混凝土构件连接形成整体构件的现场浇筑混凝土。2. 墙板或柱等预制垂直构件之间设计采用现浇混凝土墙连接的,当连接墙的长度在2m 以内时,执行后浇混凝土连接墙、柱定额项目,长度超过2m 的,仍按《房屋建筑与装饰工程定额》第五章“混凝土、钢筋工程”的相应项目及规定执行。3. 叠合楼板或整体楼板之间设计采用现浇混凝土板带拼缝的,板带混凝土浇捣并入后浇混凝土叠合梁、板内计算。4. 后浇混凝土钢筋制作、安装定额按钢筋品种、型号、规格结合连接方法及用途划分,相应定额内的钢筋型号以及比例已综合考虑,各类钢筋的制作成型、绑扎、安装、接头、固定以及与预制构件外露钢筋的绑扎、焊接等所用人工、材料、机械消耗已综合考虑在相应定额内。钢筋机械连接按《房屋建筑与装饰工程定额》第五章“混凝土、钢筋工程”的相应项目及规定执行。5. 后浇混凝土模板定额消耗量中已包含了伸出后浇混凝土与预制构件抱合部分模板的用量。","tables":null,"tables_fixed":null},{"section_id":"JR-013","block_type":"计算规则","chapter_code":"1901","seq":13,"page":16,"print_page":7,"text":"一、预制混凝土构件安装1. 构件安装工程量按成品构件设计图示尺寸的实体积以“m3”计算,依附于构件制作的各类保温层、饰面层的体积并入相应构件安装中计算,不扣除构件内钢筋、预埋铁件、配管、套管、线盒及单个面积≤0.3m2的孔洞、线箱等所占体积,构件外露钢筋体积亦不再增加。2. 套筒注浆按设计数量以“个”计算。3. 外墙嵌缝、打胶按构件外墙接缝的设计图示尺寸的长度以“m”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-014","block_type":"计算规则","chapter_code":"1901","seq":14,"page":16,"print_page":7,"text":"二、后浇混凝土浇捣1. 后浇混凝土浇捣工程量按设计图示尺寸以实体积计算,不扣除混凝土内钢筋、预埋铁件及单个面积≤0.3m2 的孔洞等所占体积。2. 后浇混凝土钢筋工程量按设计图示钢筋的长度、数量乘以钢筋单位理论质量计算,其中:(1)钢筋接头的数量按《房屋建筑与装饰工程定额》第五章“混凝土、钢筋工程”相应规定执行。(2)钢筋接头的搭接长度应按设计图示及规范要求计算,如设计要求钢筋接头采用机械连接、电渣压力焊及气压焊时,按数量计算,不再计算该处的钢筋搭接长度。(3)钢筋工程量应包括双层及多层钢筋的“铁马”数量,不包括预制构件外露钢筋的数量。3. 后浇混凝土模板工程量按后浇混凝土与模板接触面的面积以“m2”计算,伸出后浇混凝土与预制构件抱合部分的模板面积不增加计算。不扣除后浇混凝土墙、板上单孔面积≤0.3m2 的孔洞,洞侧壁模板亦不增加;应扣除单孔面积≥0.3m2 的孔洞,孔洞侧壁模板面积并入相应的墙、板模板工程量内计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-015","block_type":"章说明","chapter_code":"1902","seq":15,"page":42,"print_page":33,"text":"一、本章定额包括预制钢构件安装和围护体系安装两节。","tables":null,"tables_fixed":null},{"section_id":"ZS-016","block_type":"章说明","chapter_code":"1902","seq":16,"page":42,"print_page":33,"text":"二、装配式钢结构安装包括钢网架安装、厂(库)房钢结构安装、民用钢结构建筑安装及钢结构围护体系安装等内容。大卖场、物流中心等钢结构安装工程,可参照厂(库)房钢结构安装的相应定额;高层商务楼、商住楼等钢结构安装工程,可参照民用钢结构建筑安装相应定额。","tables":null,"tables_fixed":null},{"section_id":"ZS-017","block_type":"章说明","chapter_code":"1902","seq":17,"page":42,"print_page":33,"text":"三、本章定额相应项目所含油漆,仅指构件安装时节点焊接或因切割引起补漆。预制钢构件的除锈、油漆及防火涂料的费用应在成品价格内包含;若成品价格未包含油漆及防火涂料费用的,另按《房屋建筑与装饰工程定额》第十四章“油漆、涂料、裱糊工程”的相应项目及规定执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-018","block_type":"章说明","chapter_code":"1902","seq":18,"page":42,"print_page":33,"text":"四、预制钢构件安装1. 构件安装定额中预制钢构件以外购成品编制,不考虑施工损耗。2. 预制钢结构构件安装,按构件种类及重量不同套用定额。3. 本定额已包括了施工企业按照质量验收规范要求,针对安装工作自检所发生的磁粉探伤、超声波探伤等常规检测费用。4. 不锈钢螺栓球网架安装套用螺栓球节点网架安装定额,同时取消定额中油漆及稀释剂含量,人工消耗量乘以系数0.95。5. 钢支座定额适用于单独成品支座安装。6. 厂(库)房钢结构的柱间支撑、屋面支撑、系杆、撑杆、隅撑、墙梁、钢天窗架等安装套用钢支撑(钢檩条)安装定额,钢走道安装套用钢平台安装定额。7. 零星钢构件安装定额,适用于本章未列项目且单件质量在25kg 以内的小型钢构件安装。民用钢结构建筑的零星钢构件安装套用厂(库)房钢结构的零星钢构件安装定额,并扣除定额中起重机消耗量。8. 厂(库)房钢结构安装的垂直运输已包括在相应定额内,不另行计算。民用钢结构建筑安装定额内的汽车式起重机台班用量为钢构件现场转运消耗量,垂直运输按《房屋建筑与装饰工程定额》第十七章“措施项目”相应项目执行。9. 组合钢板剪力墙安装套用住宅钢结构3t 以内钢柱安装定额,相应定额人工、机械及除预制钢柱外的材料用量乘以系数1.5。10. 钢构件安装项目中已考虑现场拼装费用,但未考虑分块或整体吊装的钢网架、钢桁架地面平台拼装摊销,如发生套用现场拼装平台摊销定额项目;如采用脚手架作为钢网架高空操作平台,根据施工方案按实计算。。","tables":null,"tables_fixed":null},{"section_id":"ZS-019","block_type":"章说明","chapter_code":"1902","seq":19,"page":43,"print_page":34,"text":"五、围护体系安装1. 金属结构楼面板和墙面板按成品板编制。2. 楼面板的收边板未包括在项目内,应单独计算。3. 墙面板未包括包角、包边、窗台泛水等所需增加的用量,应单独计算。4. 硅酸钙板墙面板项目中双面隔墙定额墙体厚度按180mm 考虑,其中镀锌钢龙骨用量按15kg / m2 编制,设计与定额不同时,材料可换算,其他不变。5. 不锈钢天沟、彩钢板天沟展开宽度为600mm,若实际展开宽度与定额不同时,板材按比例调整,其他不变。","tables":null,"tables_fixed":null},{"section_id":"JR-020","block_type":"计算规则","chapter_code":"1902","seq":20,"page":44,"print_page":35,"text":"一、预制钢构件安装1. 构件安装工程量按成品构件的设计图示尺寸以质量计算,不扣除单个面积≤0.3m2 的孔洞质量,焊缝、铆钉、螺栓等不另增加质量。2. 钢网架工程量不扣除孔眼的质量,焊缝、铆钉等不另增加质量。焊接空心球网架质量包括连接钢管杆件、连接球、支托和网架支座等零件的质量,螺栓球节点网架质量包括连接钢管杆件(含高强螺栓、销子、套筒、锥头或封板)、螺栓球、支托和网架支座等零件的质量。3. 依附在钢柱上的牛腿及悬臂梁的质量等并入钢柱的质量内,钢柱上的柱脚板、加劲板、柱顶板、隔板和肋板并入钢柱工程量内。4. 钢管柱上的节点板、加强环、内衬板(管)、牛腿等并入钢管柱的质量内。5. 钢平台的工程量包括钢平台的柱、梁、板、斜撑等的质量,依附于钢平台上的钢扶梯及平台栏杆,并入钢平台工程量内。6. 钢楼梯的工程量包括楼梯平台、楼梯梁、楼梯踏步等的质量,钢楼梯上的扶手、栏杆并入钢楼梯工程量内。7. 钢构件现场拼装平台摊销工程量按实施拼装构件的工程量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-021","block_type":"计算规则","chapter_code":"1902","seq":21,"page":44,"print_page":35,"text":"一、预制钢构件安装1. 构件安装工程量按成品构件的设计图示尺寸以质量计算,不扣除单个面积≤0.3m2 的孔洞质量,焊缝、铆钉、螺栓等不另增加质量。2. 钢网架工程量不扣除孔眼的质量,焊缝、铆钉等不另增加质量。焊接空心球网架质量包括连接钢管杆件、连接球、支托和网架支座等零件的质量,螺栓球节点网架质量包括连接钢管杆件(含高强螺栓、销子、套筒、锥头或封板)、螺栓球、支托和网架支座等零件的质量。3. 依附在钢柱上的牛腿及悬臂梁的质量等并入钢柱的质量内,钢柱上的柱脚板、加劲板、柱顶板、隔板和肋板并入钢柱工程量内。4. 钢管柱上的节点板、加强环、内衬板(管)、牛腿等并入钢管柱的质量内。5. 钢平台的工程量包括钢平台的柱、梁、板、斜撑等的质量,依附于钢平台上的钢扶梯及平台栏杆,并入钢平台工程量内。6. 钢楼梯的工程量包括楼梯平台、楼梯梁、楼梯踏步等的质量,钢楼梯上的扶手、栏杆并入钢楼梯工程量内。7. 钢构件现场拼装平台摊销工程量按实施拼装构件的工程量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-022","block_type":"计算规则","chapter_code":"1902","seq":22,"page":45,"print_page":36,"text":"二、围护体系安装1. 钢楼层板、屋面板按设计图示尺寸的铺设面积计算,不扣除单个面积≤0.3m2 柱、垛及孔洞所占面积。2. 硅酸钙板墙面板按设计图示尺寸的墙体面积以“m2”计算,不扣除单个面积≤0.3m2 孔洞所占面积。3. 保温岩棉铺设、EPS 混凝土浇灌按设计图示尺寸的铺设或浇灌体积以“m3” 计算,不扣除单个面积≤0.3m2 孔洞所占体积。4. 硅酸钙板包柱、包梁,及蒸压砂加气保温块贴面工程量按钢构件设计断面尺寸以“m2”计算。5. 钢板天沟按设计图示尺寸以质量计算,依附天沟的型钢并入天沟的质量内计算;不锈钢天沟、彩钢板天沟按设计图示尺寸以长度计算。6. 金属构件安装使用的高强螺栓、花篮螺栓和剪力栓钉按设计图纸数量以“套”为单位计算。7. 槽铝檐口端面封边包角、混凝土浇捣收边板高度按150mm 考虑,工程量按设计图示尺寸以“m”计算;其他材料的封边包角、混凝土浇捣收边板按设计图示尺寸以展开面积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-023","block_type":"章说明","chapter_code":"1903","seq":23,"page":92,"print_page":83,"text":"一、本章定额包括预制木构件安装和围护体系安装两节。","tables":null,"tables_fixed":null},{"section_id":"ZS-024","block_type":"章说明","chapter_code":"1903","seq":24,"page":92,"print_page":83,"text":"二、本章定额所称的装配式木结构工程,指预制木构件通过可靠的连接方式装配而成的木结构,包括装配式轻型木结构和装配式框架木结构。","tables":null,"tables_fixed":null},{"section_id":"ZS-025","block_type":"章说明","chapter_code":"1903","seq":25,"page":92,"print_page":83,"text":"三、预制木构件安装1. 地梁板安装定额已包括底部防水卷材的内容,按墙体厚度不同套用相应定额。2. 木构件安装定额已包括构件固定所需临时支撑的搭设及拆除,支撑种类、数量及搭设方式综合考虑。3. 柱、梁安装定额不分截面形式,按材质和截面积不同套用相应定额。4. 墙体木骨架安装按墙体厚度不同套用相应定额,定额中已包括了底梁板、顶梁板和墙体龙骨安装等内容。墙体龙骨间距按400mm 编制,设计与定额不同时应进行调整。5. 楼板格栅安装按格栅跨度不同套用相应定额,其中跨度5m 以内按木格栅,5m 以上按桁架格栅进行编制。定额中楼面设计活荷载标准值为2.0kN/ m2,如遇卫生间、露台等部位设计活荷载超过2.0kN/ m2 时,定额乘以系数。6. 平撑、剪刀撑以及封头板的用量已包括在楼板格栅定额中,不另单独计算。地面格栅和平屋面格栅套用楼板格栅相应定额。7. 桁架安装不分直角形、人字形等形式,均套用桁架定额。8. 屋面板安装根据屋面形式不同,按两坡以内和两坡以上分别套用相应定额。","tables":null,"tables_fixed":null},{"section_id":"ZS-026","block_type":"章说明","chapter_code":"1903","seq":26,"page":93,"print_page":84,"text":"四、围护体系安装。1. 石膏板铺设定额按单层安装编制,设计为双层安装时,其工程量乘以2.0。2. 呼吸纸铺设定额中,对施工过程中产生的搭接、拼缝、压边等已综合考虑,不另单独计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-027","block_type":"章说明","chapter_code":"1903","seq":27,"page":93,"print_page":84,"text":"五、装配式木结构安装过程中涉及的基础梁预埋锚栓、外墙保温、屋面防水涂料等内容,按《房屋建筑与装饰工程定额》的相应项目及规定执行。","tables":null,"tables_fixed":null},{"section_id":"JR-028","block_type":"计算规则","chapter_code":"1903","seq":28,"page":93,"print_page":84,"text":"一、预制木构件安装1. 地梁板安装按设计图示尺寸以长度计算。2. 木柱、木梁按设计图示尺寸以体积计算。3. 墙体木骨架及墙面板安装按设计图示尺寸以面积计算,不扣除≤0.3m2 的孔洞所占面积,由此产生的孔洞加固板也不另增加。其中,墙体木骨架安装应扣除结构柱所占的面积。4. 楼板格栅及楼面板安装按设计图示尺寸以面积计算,不扣除≤0.3m2 的洞口所占面积,由此产生的洞口加固板也不另增加。其中,楼板格栅安装应扣除结构梁所占的面积。5. 格栅挂件按设计图示数量按套计算。6. 木楼梯安装按设计图示尺寸以水平投影面积计算,不扣除宽度≤500mm 的楼梯井,伸入墙内部分不计算。7. 屋面椽条和桁架安装按设计图示尺寸以实体积计算,不扣除切肢、切角部分占体积。屋面板安装按设计图示尺寸以展开面积计算。8. 封檐板安装按设计图示尺寸以檐口外围长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-029","block_type":"计算规则","chapter_code":"1903","seq":29,"page":94,"print_page":85,"text":"二、围护体系安装。1. 石膏板、呼吸纸铺设按设计图示尺寸以面积计算,不扣除≤0.3m2 的孔洞所占面积。2. 岩棉铺设安装定额按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-030","block_type":"章说明","chapter_code":"1904","seq":30,"page":108,"print_page":99,"text":"一、本章定额包括单元式幕墙安装、非承重隔墙安装、预制烟道及通风道安装、预制护栏安装和装饰成品部件安装等五节。","tables":null,"tables_fixed":null},{"section_id":"ZS-031","block_type":"章说明","chapter_code":"1904","seq":31,"page":108,"print_page":99,"text":"二、单元式幕墙安装1. 本章定额中的单元式幕墙是指由各种面板与支承框架在工厂制成,形成完整的幕墙结构基本单位后,运至施工现场直接安装在主体结构上的建筑幕墙。2. 单元式幕墙安装按安装高度不同,分别套用相应定额。单元式幕墙的安装高度是指室外设计地坪至幕墙顶部标高之间的垂直高度,单元式幕墙安装定额已综合考虑幕墙单元板块的规格尺寸、材质和面层材料不同等因素。同一建筑物的幕墙顶部标高不同时,应按不同高度的垂直界面计算并套用相应定额。3. 单元式幕墙设计为曲面或者斜面(倾斜角度大于30°)时,安装定额中人工消耗量乘以系数1.15。单元板块面层材料的材质不同时,可调整单元板块主材单价,其他不变。4. 如设计防火隔断中的镀锌钢板规格、含量与定额不同时,可按设计要求调整镀锌钢板主材价格,其他不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-032","block_type":"章说明","chapter_code":"1904","seq":32,"page":108,"print_page":99,"text":"三、非承重隔墙安装1. 非承重隔墙安装按板材材质,划分为钢丝网架轻质夹心隔墙板安装、轻质条板隔墙安装以及预制轻钢龙骨隔墙安装三类,各类板材按板材厚度分设定额项目。2. 非承重隔墙安装按单层墙板安装进行编制,如遇设计为双层墙板时,根据双层墙板各自的墙板厚度不同,分别套用相应单层墙板安装定额。若双层墙板中间设置保温、隔热或者隔声功能层的,发生时另行计算。3. “增加一道硅酸钙板”定额项目是指在预制轻钢龙骨隔墙板外所进行的面层补板。4. 非承重隔墙板安装定额已包括各类固定配件、补(填)缝、抗裂措施构造,以及板材遇门窗洞口所需切割改锯、孔洞加固的内容,发生时不另计算。5. 钢丝网架轻质夹心隔墙板安装定额中的板材,按聚苯乙烯泡沫夹心板编制,设计不同时可换算墙板主材,其他消耗量保持不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-033","block_type":"章说明","chapter_code":"1904","seq":33,"page":109,"print_page":100,"text":"四、预制烟道及通风道安装1. 预制烟道、通风道安装子目未包含进气口、支管、接口件的材料及安装人工消耗量。2. 预制烟道、通风道安装子目按照构件断面外包周长划分子目。如设计烟道、通风道规格与定额不同时,可按设计要求调整烟道、通风道规格及主材价格,其他不变。3. 成品风帽安装按材质不同划分为混凝土及钢制两类子目。","tables":null,"tables_fixed":null},{"section_id":"ZS-034","block_type":"章说明","chapter_code":"1904","seq":34,"page":109,"print_page":100,"text":"五、预制护栏安装预制护栏安装定额按护栏高度1.4m 以内编制,护栏高度超过1.4m 时,相应定额人工及除预制栏杆外的材料乘以系数1.1,其余不变。","tables":null,"tables_fixed":null},{"section_id":"ZS-035","block_type":"章说明","chapter_code":"1904","seq":35,"page":109,"print_page":100,"text":"六、装饰成品部件安装1. 装饰成品部件涉及基层施工的,另按《房屋建筑与装饰工程定额》的相应项目执行。2. 成品踢脚线安装定额根据踢脚线材质不同,以卡扣式直形踢脚线进行编制。遇弧形踢脚线时,相应定额人工消耗量乘以系数1.1,其余不变。3. 墙面成品木饰面面层安装以墙面形状不同划分为直形、弧形,发生时分别套用相应定额。4. 成品木门安装定额以门的开启方式、安装方法不同进行划分,相应定额均已包括相配套的门套安装;成品木质门(窗)套安装定额按门(窗)套的展开宽度不同分别进行编制,适用于单独门(窗)套的安装。成品木门(带门套)及单独安装的成品木质门(窗)套定额中,已包括了相应的贴脸及装饰线条安装人工及材料消耗量,不另单独计算。5. 成品木门安装定额中的五金件,设计规格和数量与定额不同时,应进行调整换算。6. 成品橱柜安装按上柜、下柜及台面板进行划分,分别套用相应定额。定额中不包括洁具五金、厨具电器等的安装,发生时另行计算。7. 成品橱柜台面板安装定额的主材价格中已包含材料磨边及金属面板折边费用,不包括面板用;如设计的成品台面板材质与定额不同时,可换算台面板材料价格,其他不变。","tables":null,"tables_fixed":null},{"section_id":"JR-036","block_type":"计算规则","chapter_code":"1904","seq":36,"page":110,"print_page":101,"text":"一、单元式幕墙安装1. 单元式幕墙安装工程量按单元板块组合后设计图示尺寸的外围面积以m2 计算,不扣除依附于幕墙板块制作的窗、洞口所占的面积。2. 防火隔断安装工程量按设计图示尺寸的投影面积以“m2”计算。3. 槽型预埋件及T 型转换螺栓安装的工程量按设计图示数量以“个”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-037","block_type":"计算规则","chapter_code":"1904","seq":37,"page":110,"print_page":101,"text":"二、非承重隔墙安装1. 非承重隔墙安装工程量按设计图示尺寸的墙体面积以“m2”计算,应扣除门窗、洞口、嵌入墙内的钢筋混凝土柱、梁、圈梁等所占体积,不扣除梁头、板头、檩头、垫木、木楞头、沿缘木、木砖、门窗走头、砖墙内加固钢筋、木筋、铁件、钢管及单个面积≤0.3m2 的孔洞所占的体积。2. 非承重隔墙安装遇设计为双层墙板时,其工程量按单层面积乘以2.0 计算。3. 预制轻钢龙骨隔墙中增贴硅酸钙板的工程量按设计需增贴的面积以“m2”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-038","block_type":"计算规则","chapter_code":"1904","seq":38,"page":111,"print_page":102,"text":"三、预制烟道及通风道安装1. 预制烟道、通风道安装工程量按图示长度以“m”计算。2. 成品风帽安装工程量按设计图示数量以“个”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-039","block_type":"计算规则","chapter_code":"1904","seq":39,"page":111,"print_page":102,"text":"四、预制护栏安装预制护栏安装工程量按设计图示尺寸的中心线长度以“m”计算。","tables":null,"tables_fixed":null},{"section_id":"JR-040","block_type":"计算规则","chapter_code":"1904","seq":40,"page":111,"print_page":102,"text":"五、装饰成品部件安装1. 成品踢脚线安装工程量按设计图示长度以“m”计算。2. 墙面成品木饰面安装工程量按设计图示面积以“m2”计算。3. 带门套成品木门安装工程量按设计图示数量以“樘”计算;成品门(窗)套安装工程量按设计图示洞口尺寸以“m”计算。4. 成品橱柜安装工程量按设计图示尺寸的柜体中线长度以“m”计算;成品台面板安装工程量按设计图示尺寸的板面中线长度以“m”计算;成品洗漱台柜、成品水槽安装工程量按设计图示数量以“组”计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-041","block_type":"章说明","chapter_code":"1905","seq":41,"page":132,"print_page":123,"text":"一、本章定额包括工具式模板、工具式脚手架工程二节。","tables":null,"tables_fixed":null},{"section_id":"ZS-042","block_type":"章说明","chapter_code":"1905","seq":42,"page":132,"print_page":123,"text":"二、工具式模板1. 工具式模板指组成模板的模板结构和构配件为定型化标准化产品,可多次重复利用,并按规定的程序组装和施工,本章定额中的工具式模板按铝合金模板编制。2. 铝合金模板系统是由铝模板系统、支撑系统、紧固系统和附件系统构成,本定额中铝合金模板的材料摊销次数按90 次考虑。3. 现浇混凝土柱(不含构造柱)、墙、梁(不含圈、过梁)、板是按高度(板面或地面、垫层面至上层板面的高度)3.6m 综合考虑。如遇斜板面结构时,柱分别按各柱的中心高度为准;墙按分段墙的平均高度为准;框架梁按每跨两端的支座平均高度为准;板(含梁板合计的梁)按高点与低点的平均高度为准。4. 异形柱、梁,是指柱、梁的断面形状为L 形、十字形、T 形等的柱、梁。圆形柱模板执行异形柱模板。5. 有梁板模板定额项目已综合考虑了有梁板中弧形梁的情况,梁和板应作为整体套用。弧形梁模板为独立弧形梁模板。圈梁的弧形部分模板按相应圈梁模板套用定额乘以系数1.2 计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-043","block_type":"章说明","chapter_code":"1905","seq":43,"page":132,"print_page":123,"text":"三、工具式脚手架工程1. 装配式混凝土结构建筑工程脚手架,执行《房屋建筑与装饰工程定额》第十七章“措施项目”全现浇结构综合脚手架项目。2. 钢结构建筑工程脚手架按《房屋建筑与装饰工程定额》第十七章“措施项目”相关规定执行。3. 木结构工程脚手架执行《房屋建筑与装饰工程定额》第十七章“措施项目”单项脚手架项目。4. 附着式电动整体提升架定额适用于高层建筑的外墙施工,如计取了综合脚手架,则不能计取该项费用。5. 电动作业高空吊篮定额适用于外立面施工。","tables":null,"tables_fixed":null},{"section_id":"ZS-044","block_type":"章说明","chapter_code":"1905","seq":44,"page":133,"print_page":124,"text":"四、装配式建筑垂直运输按《房屋建筑与装饰工程定额》第十七章“措施项目”相应规定及项目执行。","tables":null,"tables_fixed":null},{"section_id":"JR-045","block_type":"计算规则","chapter_code":"1905","seq":45,"page":134,"print_page":125,"text":"一、模板工程1. 铝合金模板工程量按模板与混凝土的接触面积计算。2. 现浇钢筋混凝土墙、板上单孔面积≤0.3m2 的孔洞不予扣除,洞侧壁模板亦不增加,单孔面积>0.3m2时应予扣除,洞侧壁模板面积并入墙、板模板工程量内计算。3. 柱与梁、柱与墙、梁与梁等连接重叠部分以及伸入墙内的梁头、板头与砖接触部分,均不计算模板面积。4. 楼梯模板工程量按水平投影面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-046","block_type":"计算规则","chapter_code":"1905","seq":46,"page":134,"print_page":125,"text":"二、脚手架工程1. 附着式电动整体提升架按提升范围的外墙外边线长度乘以外墙高度以面积计算,不扣除门窗、洞口所占面积。3. 电动作业高空吊篮按外墙垂直投影面积计算,不扣除门窗、洞口所占面积。","tables":null,"tables_fixed":null},{"section_id":"FB-047","block_type":"附表","chapter_code":null,"seq":47,"page":146,"print_page":137,"text":"材料预算价格取定表（附录）：序号｜材料名称｜单位｜单价(元)｜序号｜材料名称｜单位｜单价(元) ⁃ 1｜型钢综合｜kg｜3.55｜15｜镀锌铁丝ϕ0.7｜kg｜6.16 ⁃ 2｜HPB300ϕ10 以内｜kg｜3.70｜16｜镀锌铁丝ϕ4.0｜kg｜6.16 ⁃ 3｜HPB300ϕ12~ ϕ18｜kg｜3.80｜17｜钢丝绳｜kg｜5.20 ⁃ 4｜HPB300ϕ20~ ϕ25｜kg｜3.50｜18｜钢丝绳ϕ8｜m｜1.70 ⁃ 5｜钢筋HPB300ϕ10 以上｜kg｜3.75｜19｜钢丝绳ϕ12｜kg｜5.20 ⁃ 6｜HPB300ϕ25 以上｜kg｜3.70｜20｜角钢综合｜kg｜3.52 ⁃ 7｜钢筋ϕ6｜t｜3690.00｜21｜热轧薄钢板δ3.0｜m2｜57.00 ⁃ 8｜钢筋HRB400 以内ϕ10 以内｜kg｜3.57｜22｜中厚钢板综合｜kg｜3.61 ⁃ 9｜钢筋HRB400 以内ϕ12~ ϕ18｜kg｜3.52｜23｜中厚钢板δ4.0｜m2｜77.00 ⁃ 10｜钢筋HRB400 以内ϕ20~ ϕ25｜kg｜3.50｜24｜压型钢楼板δ0.9｜m2｜37.00 ⁃ 11｜钢筋HRB400 以内ϕ25 以上｜kg｜3.53｜25｜镀锌薄钢板综合｜m2｜27.70 ⁃ 12｜钢筋HRB400 以上ϕ10 以内｜kg｜3.57｜26｜镀锌钢板综合｜kg｜4.62 ⁃ 13｜钢筋HRB400 以上ϕ12~ ϕ18｜kg｜3.52｜27｜合金钢板｜kg｜5.80 ⁃ 14｜镀锌铁丝综合｜kg｜6.16｜28｜彩钢板δ0.8｜m2｜17.00 ⁃ 序号｜材料名称｜单位｜单价(元)｜序号｜材料名称｜单位｜单价(元) ⁃ 29｜压型彩钢板δ0.5｜m2｜24.20｜46｜气排钉｜盒｜4.00 ⁃ 30｜压型钢板δ0.5｜m2｜24.00｜47｜栓钉｜套｜1.28 ⁃ 31｜工字铝综合｜m｜12.50｜48｜圆钉｜kg｜4.00 ⁃ 32｜角铝25.4×1｜m｜4.00｜49｜不锈钢钉｜kg｜18.28 ⁃ 33｜槽铝75｜m｜68.00｜50｜高强螺栓｜套｜14.32 ⁃ 34｜槽铝150｜m｜10.00｜51｜花篮螺栓M6×120｜套｜1.87 ⁃ 35｜钨棒｜kg｜32.00｜52｜对拉螺栓｜kg｜6.55 ⁃ 36｜橡皮密封条20×4｜m｜6.66｜53｜六角螺栓｜kg｜4.68 ⁃ 37｜橡胶密封条｜m｜4.25｜54｜六角螺栓M6×35｜百个｜25.50 ⁃ 38｜彩钢密封圈｜只｜0.24｜55｜六角螺栓带螺母综合｜kg｜4.68 ⁃ 39｜塑料薄膜｜m2｜0.34｜56｜不锈钢螺栓M16｜套｜1.40 ⁃ 40｜聚乙烯薄膜δ0.05｜m2｜6.23｜57｜膨胀螺栓｜副｜0.21 ⁃ 41｜密封带3×20｜m｜0.72｜58｜膨胀螺栓M10｜百套｜72.25 ⁃ 42｜聚乙烯棒｜m｜10.40｜59｜单开门锁｜把｜55.00 ⁃ 43｜铝拉铆钉M5×40｜百个｜12.00｜60｜双开门锁｜把｜110.00 ⁃ 44｜螺钉｜kg｜5.00｜61｜不锈钢合页｜个｜9.60 ⁃ 45｜自攻螺钉S const REVIEW = (() => {
  const it = c => DATA.items.find(x=>x.item_code===c);
  const fail = [], unmatched = [], units = [], mids = [];
  (DATA.h3_review||[]).forEach(h=>{
    const d = JSON.parse(h.detail||"{}");
    if(h.status==="fail")
      fail.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:`书印材料费 ${num2(d.declared)} ≠ 价格库反推 ${num2(d.calc)}（差 ${num2(d.diff)}）`, act:"需人工对价"});
    else if(h.status==="skip_unmatched")
      unmatched.push({code:h.item_code, page:(it(h.item_code)||{}).page,
        text:(d.note||"材料未匹配")+"："+(d.missing||[]).map(m=>`${m.name}(${m.unit||""})`).join("、"), act:"需补价格库"});
  });
  (DATA.issues||[]).forEach(i=>{
    if(i.review_status==="confirmed") return; // 人工已确认（out/manual_confirm.json overlay）
    const m = (i.descr||"").match(/子目\s*(\d+-\d+)/);
    const code = m && it(m[1]) ? m[1] : null;
    if(i.itype==="单位存疑")
      units.push({code, page:i.page, text:i.descr, act:"单位待确认", src:i.source, itype:i.itype});
    else if(i.severity==="mid")
      mids.push({code, page:i.page, text:(i.itype?`[${i.itype}] `:"")+(i.descr||""), act:i.source==="toc"?"目录层":(i.source+"章抽取"), src:i.source, itype:i.itype||null});
  });
  return {fail, unmatched, units, mids};
})();

const CH13="0113", CH17="0117";

const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：zzs=2-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

  if(id==="mix"){ return viewMix(); }
  if(id==="derive"){ return viewDerive(); }
  if(id==="errata"){ return viewErrata(); }
  if(id==="findings"){ return viewFindings(); }
  if(id==="issues"){ return viewIssues(); }
  if(id==="review"){ return viewReview(); }
  if(id==="fb17"){ return viewSections("第十七章 附表（样板）", S.sectionsBy("附表").filter(s=>!s.chapter_code)); }

  if(id.startsWith("layer:")){ const p=id.split(":"); return viewLayer(p[1], p[2]); }
}

function secBlock(s, open){
  const tb = S.sec(s.tables), tbf = S.sec(s.tables_fixed);
  let tbs = "";
  if(tb){
    tbs += `<table class="tbl">${tb.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>
    <div class="sec-bd">${esc(s.text)}${tbs}</div></div>`;

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

    <button class="x" id="mx">✕</button></div>`;
  const p4 = `<div class="price4">

    <div class="it"><div class="k">材料费</div><div class="v">${num2(i.material_cost)}</div></div>
    <div class="it"><div class="k">机械费</div><div class="v">${num2(i.machine_cost)}</div></div>
    <div class="it"><div class="k">综合费用</div><div class="v">${num2(i.combined_cost)}</div></div></div>`;

    <table class="tbl"><thead><tr>${cols.map(c=>`<th${c.n?' class="num"':''}>${c.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td${c.n?' class="num"':''}>${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
  const h2d = v.H2 && v.H2.ok ? `<div class="note">H2 对账：${v.H2.days} 工日 × 三档配比 → ${num2(v.H2.calc)} 元（三档配比 ${JSON.stringify(v.H2.tiers||{})}，当期人工单价 ${v.H2.rate} 元/工日）</div>` : "";
  let h3d = "";

    const dt = d.h3.detail||{};

  let errd = "";

    const es = (DATA.erratas||[]).filter(e=>{

  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +

    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));

    $("#mask").classList.add("show");

      const v = parseFloat($("#pd-price").value);

      PCONF[pk(g.material,g.unit)] = {"build_price":v, "materialize":!!mat,
        "note":$("#pd-note").value.trim() || (mat?"一键入库·反推价":""), "date":new Date().toISOString().slice(0,10)};
      savePConf(); $("#mask").classList.remove("show"); paint(); refreshCounts();
    };
    $("#pd-save").addEventListener("click",()=>doSave(false));

  $("#export-price").addEventListener("click",()=>{

      const i=k.lastIndexOf("|"); return {"material":k.slice(0,i), "unit":k.slice(i+1),

        <td style="font-family:var(--mono)">${esc(e.mix_code)}</td><td style="font-size:11px">${esc((e.section||"").replace(/配合比表$/,""))}</td>

      ${kw?`<div class="note">命中 ${hits.length} 条，最多显示 300。</div>`:""}`;

          <b>${esc(e.item_name||"—")}</b>

          <span class="badge b-gray">P${e.page}/印${e.print_page??"—"}</span></div>
          <div style="font-size:12px;color:var(--muted,#888);margin:6px 0">${esc(e.section||"")}</div>
          ${tbl("材料组成（每 "+(e.unit||"m³")+" 用量）", comps, [
            {t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"单位",f:r=>esc(r.unit||"")},
            {t:"数量",n:1,f:r=>r.qty!=null?num(r.qty):"—"}])}`;
        $("#mask").classList.add("show");
        $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));

  };
  $("#mxq").addEventListener("input", paint);
  paint();
}

        <span class="badge b-gray">${esc(f.date||"")}</span></div>

        <div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa);margin:8px 0"><b>取证过程</b><br>${esc(f.finding||"")}</div>
        <div class="note">${esc(f.process||"")}</div>

        <div style="font-size:12px;color:var(--muted,#888);margin-top:6px">发现：${esc(f.found_by||"")}</div>`;

function viewReview(){
  const cats = [
    ["all", "全部", REVIEW_TOTAL],
    ["fail", "H3 超差", REVIEW.fail.length],
    ["unmatched", "材料未匹配", REVIEW.unmatched.length],
    ["unit", "单位存疑", REVIEW.units.length],
    ["mid", "其他中风险", REVIEW.mids.length],
  ];
  const badge = {fail:"b-red", unmatched:"b-amber", unit:"b-blue", mid:"b-gray"};
  const label = {fail:"H3超差", unmatched:"未匹配", unit:"单位存疑", mid:"疑点"};
  const nConf = (DATA.issues||[]).filter(i=>i.review_status==="confirmed").length;
  main().innerHTML = `<div class="panel"><h2>🔍 待人工核对清单（${REVIEW_TOTAL} 条）</h2>
    <div class="note"><b>H3超差</b>=材料费书印值与价格库反推不符，须人工对价；<b>材料未匹配</b>=缺价材料，补价格库后自动复检转通过；<b>单位存疑</b>=抽取单位与常规口径不符，须回看原文；<b>其他中风险</b>=抽取过程登记的中风险疑点。<b>点击行</b>弹出子目详情；<b>🖼 原文</b>弹出该页书页图直接比对；核对无误点 <b>核销</b>（单位存疑可在核销时直接改单位值）。${nConf?`<br>✅ 另有 <b>${nConf}</b> 条已人工确认（记录于 out/manual_confirm.json overlay）。`:""}</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-c="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <span class="chip on" id="hdchip" title="已核销行默认隐藏，点此切换显示">隐藏已核销</span>
      <input id="rq" placeholder="过滤：编号/关键字…" style="width:200px">
      <span class="rbtn" id="expbtn" title="导出已核销记录（manual_confirm.json 兼容格式，merge 后重跑 build_db 生效 overlay）">⬇ 导出核销记录</span></div>
    <div id="rbody"></div></div>`;
  let hideDone = true;
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{c:"all"}}).dataset.c;
    const kw = $("#rq").value.trim();
    const pick = {fail:REVIEW.fail, unmatched:REVIEW.unmatched, unit:REVIEW.units, mid:REVIEW.mids};
    let list = cat==="all"
      ? [...REVIEW.fail.map(r=>["fail",r]), ...REVIEW.unmatched.map(r=>["unmatched",r]),
         ...REVIEW.units.map(r=>["unit",r]), ...REVIEW.mids.map(r=>["mid",r])]
      : pick[cat].map(r=>[cat,r]);
    if(kw) list = list.filter(([c,r]) => (r.code||"").includes(kw) || (r.text||"").includes(kw));
    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;
    const shown = list.filter(([c,r]) => !(hideDone && DONE[rkey(c,r)])).slice(0,500);
    KEY2REC_CLEAR();
    const row = (cat, r) => {
      const key = rkey(cat, r);
      KEY2REC[key] = {cat, r};
      const done = DONE[key];
      const clk = r.code ? ` data-item="${esc(r.code)}"` : "";
      const imgBtn = (r.page && PAGEIMG.has(r.page))
        ? `<span class="rbtn" data-img="${r.page}" data-code="${esc(r.code||"")}">🖼 原文</span>`
        : `<span class="note" style="font-size:11px">无图</span>`;
      const act = done
        ? `<span class="rdone-mark">✅已核销</span> <span class="rbtn" data-undo="${esc(key)}">撤销</span>`
        : `<span class="rbtn" data-done="${esc(key)}" data-cat="${cat}">核销</span>`;
      return `<tr${clk} class="${done?"rdone":""}"><td><span class="badge ${badge[cat]}">${label[cat]}</span></td>
        <td style="font-family:var(--mono)">${esc(r.code||"—")}</td>
        <td class="num">${r.page??"—"}</td><td>${esc(r.text)}</td><td>${esc(r.act||"")}</td>
        <td style="white-space:nowrap">${imgBtn}</td><td style="white-space:nowrap">${act}</td></tr>`;
    };
    $("#rbody").innerHTML = `<table class="tbl"><thead><tr><th>类别</th><th>子目</th><th class="num">物理页</th><th>详情</th><th>处置</th><th>原文</th><th>操作</th></tr></thead><tbody>
      ${shown.map(([c,r])=>row(c,r)).join("") || '<tr><td colspan="7">无匹配</td></tr>'}</tbody></table>
      <div class="note">命中 ${list.length} 条 · 待核销 ${hidden} 条${list.length>500?"（仅渲染前 500，请用过滤缩小范围）":""}。核销记录存于浏览器 localStorage（键 qtx_done_v1），「⬇ 导出核销记录」可下载 JSON 供回库。</div>`;
    document.querySelectorAll("#rbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{
        if(ev.target.closest("[data-done],[data-undo],[data-img]")) return;
        openItem(tr.dataset.item);
      });
    });
    document.querySelectorAll("#rbody [data-img]").forEach(el=>{
      el.addEventListener("click", ()=>showPageImg(+el.dataset.img, el.dataset.code||""));
    });
    document.querySelectorAll("#rbody [data-undo]").forEach(el=>{
      el.addEventListener("click", ()=>{ delete DONE[el.dataset.undo]; saveDone(); paint(); refreshCounts(); });
    });
    document.querySelectorAll("#rbody [data-done]").forEach(el=>{
      el.addEventListener("click", ()=>openDoneDialog(el.dataset.done, el.dataset.cat));
    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){
    const rec = KEY2REC[key]; if(!rec) return;
    const r = rec.r;
    const it = r.code ? DATA.items.find(x=>x.item_code===r.code) : null;
    const isUnit = cat==="unit" && it;
    $("#modal").innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:15px">核销确认</b><span class="badge ${badge[cat]}">${label[cat]}</span>
        <span style="font-family:var(--mono);color:var(--accent)">${esc(r.code||"—")}</span>
        <button class="x" id="dx">✕</button></div>
      <div class="note" style="margin-top:8px">${esc(r.text)}</div>
      ${r.page&&PAGEIMG.has(r.page)?`<div style="margin-top:10px"><span class="rbtn" id="dimg">🖼 弹出原文 P${r.page} 比对</span></div>`:""}
      <div class="done-form">
        ${isUnit?`<label>单位（核对原文后如需修正直接改，改值随核销记录导出）</label><input id="du" value="${esc(it.unit||"")}">`:""}
        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;
    $("#mask").classList.add("show");
    const close = ()=>$("#mask").classList.remove("show");
    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});

buildTree();
bindTree();
show("gs");
const first = document.querySelector('.tnode[data-id="gs"]');
first && first.classList.add("on");
refreshCounts();
</script>
