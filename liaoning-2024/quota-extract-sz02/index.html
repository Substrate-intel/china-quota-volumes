九、　值警亭安装","page":228},{"id":"SZ02-0205-10","name":"十、　道路隔离护栏安装","page":229},{"id":"SZ02-0205-11","name":"十一、　架空走线安装","page":230},{"id":"SZ02-0205-12","name":"十二、　信号灯、灯架安装","page":231},{"id":"SZ02-0205-13","name":"十三、　设备控制机箱安装","page":232},{"id":"SZ02-0205-14","name":"十四、　防撞筒(墩)安装","page":233},{"id":"SZ02-0205-15","name":"十五、　警示柱","page":234},{"id":"SZ02-0205-16","name":"十六、　减速垄","page":235},{"id":"SZ02-0205-17","name":"十七、　门架安装","page":236}]},"ch13_nodes":[],"sections":[{"section_id":"GS-001","block_type":"总说明","chapter_code":null,"seq":1,"page":6,"print_page":1,"text":"一、辽宁省建设工程计价依据《市政工程定额》(以下简称本定额),是依据国家《建设工程工程量清单计价规范》(GB50500-2013)、《市政工程工程量计算规范》(GB50857-2013)、《市政工程消耗量》(ZYA1-31-2021)、《辽宁省建设工程计价依据市政工程定额》(2017 年)、省市市政工程相关定额及国家有关现行产品标准、设计规范、施工及验收规范、技术操作规程、质量评定标准、安全操作规程以及新技术、新材料、新工艺在施工中的应用情况而编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-002","block_type":"总说明","chapter_code":null,"seq":2,"page":6,"print_page":1,"text":"二、本定额的适用范围:我省行政区域城镇范围内的国有投资或国有投资为主的新建、扩建、改建的市政工程项目以及厂区、庭院内的道路、园林绿化工程。","tables":null,"tables_fixed":null},{"section_id":"GS-003","block_type":"总说明","chapter_code":null,"seq":3,"page":6,"print_page":1,"text":"三、本定额的作用:是国有投资或国有投资为主的建设项目,编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据;是评定投标报价合理性的依据;是调解处理工程造价争议和纠纷、审计和司法鉴定的依据:是编制投资估算指标、概算指标等文件的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","tables":null,"tables_fixed":null},{"section_id":"GS-004","block_type":"总说明","chapter_code":null,"seq":4,"page":6,"print_page":1,"text":"四、本定额是按正常施工条件,合理的施工机械配备、施工中常用的施工方法、施工工艺和劳动力组织以及合理的施工工期编制的。","tables":null,"tables_fixed":null},{"section_id":"GS-005","block_type":"总说明","chapter_code":null,"seq":5,"page":6,"print_page":1,"text":"五、本定额是在国家规范、消耗量定额基础上结合我省实际,对项目设置、计量单位、计算规则进行了适当的补充和完善;一个项目就是一个清单项目。本定额是以综合单价的形式表现的,内容包括人工费、材料费、机械费、管理费和利润。","tables":null,"tables_fixed":null},{"section_id":"GS-006","block_type":"总说明","chapter_code":null,"seq":6,"page":7,"print_page":2,"text":"六、本定额消耗量和价格的确定:(一)人工工日:1. 本定额人工工日以综合工日表现,是按8 小时工作制编制的,人工等级分普通工(简称普工)、技术工(简称技工)和高级技术工(简称高级工),消耗量包括基本用工、超运距用工、人工幅度差、辅助用工和生产班组组织者用工。2. 本定额人工工日单价分别为:普工110 元,技工170 元,高级工330 元。3. 定额人工费,是指本定额项目综合单价中的人工费、按章节说明规定按系数调整的人工费以及定额中规定调整人工工日数量的人工费。按人工工日数量调整的人工费除章节有规定的工种外,均按普工工资标准调整人工费。(二)材料:1. 本定额采用的建筑材料、成品、半成品均按国家质量标准和相应的设计要求的合格产品考虑的;材料消耗量包括施工中消耗的主要材料、辅助材料、周转性材料和零星材料;材料消耗量包括净用量和损耗量,损耗量包括了施工操作损耗和场内运输、堆放损耗,规范(设计文件) 规定的预留量、搭接量不包括在损耗率中;用量很少、占材料比重很小的零星材料合并为其他材料费,以“元”表示。2. 本定额材料的场内搬运距离按300m 考虑的:设备场内搬运距离为150m。3. 本定额材料价格包括材料供应价(原价)、运杂费、运输损耗、采购保管费。本定额项目中的材料单价均为不含增值税的税前价格。4. 本定额中的周转性材料按不同施工方法、不同材质,计算出摊销量进入定额消耗量。5. 本定额的砂子用量是按含水率为零的干砂计算的。(三)施工机械台班:1. 本定额施工机械台班消耗量是按正常合理的机械配备、机械施工功效确定的,并已考虑了机械幅度差因素。2. 本定额施工机械原值在2000 元以内、使用年限在一年以内的不构成固定资产的小型机械,未列入机械台班消耗量,其费用包括在辽宁省《建设工程费用标准》的工具用具使用费中,其燃料动力消耗量包括在相应定额项目的材料项目内。3. 本定额加工机械、泵类机械、焊接机械及动力机械的操作人工均含在相应定额项目的人工消耗量中。4. 本定额施工机械台班单价是按现行的《施工机械台班费用标准》确定的。","tables":null,"tables_fixed":null},{"section_id":"GS-007","block_type":"总说明","chapter_code":null,"seq":7,"page":8,"print_page":3,"text":"七、本定额砂浆、混凝土除另有规定外,均按预拌或成品编制的,如果采用现场搅拌,拌制增加费按第九册《钢筋工程》相应项目调整。","tables":null,"tables_fixed":null},{"section_id":"GS-008","block_type":"总说明","chapter_code":null,"seq":8,"page":8,"print_page":3,"text":"八、本定额未考虑施工与生产同时进行、有害身体健康的环境中施工时降效增加费,发生时按各册规定计算。","tables":null,"tables_fixed":null},{"section_id":"GS-009","block_type":"总说明","chapter_code":null,"seq":9,"page":8,"print_page":3,"text":"九、本定额中注有“×××以内”或“×××以下”者均包括×××本身,“×××以外”或“ ×××以上”者,均不包括×××本身。","tables":null,"tables_fixed":null},{"section_id":"GS-010","block_type":"总说明","chapter_code":null,"seq":10,"page":8,"print_page":3,"text":"十、本说明未尽事宜,详见各册及章节说明。","tables":null,"tables_fixed":null},{"section_id":"CS-011","block_type":"册说明","chapter_code":null,"seq":11,"page":16,"print_page":1,"text":"一、第二册《道路工程》(以下简称本册定额),包括路基处理、道路基层、道路面层、人行道及其他、交通管理设施,共五章。","tables":null,"tables_fixed":null},{"section_id":"CS-012","block_type":"册说明","chapter_code":null,"seq":12,"page":16,"print_page":1,"text":"二、本册定额适用于城镇范围内的新建、扩建、改建的市政道路工程。","tables":null,"tables_fixed":null},{"section_id":"CS-013","block_type":"册说明","chapter_code":null,"seq":13,"page":16,"print_page":1,"text":"三、本册定额编制依据:50857-2013;1. 《市政工程工程量计算规范》GB2. 《市政工程消耗量》ZYA1-31-2021第二册《道路工程》;3. 《辽宁省建设工程计价依据市政工程定额》(2017);50092-96;4. 《沥青路面施工及验收规范》GB7-2012;5. 《建筑地基处理技术规范》JGJ1-2008;6. 《城镇道路工程施工与质量验收规范》CJJ7. 国家法律、法规,国家设计规范;8. 有代表性的工程设计施工资料,现行设计规范、施工验收规范、操作规程及标准图集;9. 国家及省、市有关的计价依据、补充定额及有关资料。","tables":null,"tables_fixed":null},{"section_id":"CS-014","block_type":"册说明","chapter_code":null,"seq":14,"page":16,"print_page":1,"text":"四、本册定额中的工序、人工、机械、材料等均系综合取定,除另有规定者外,均不得调整。","tables":null,"tables_fixed":null},{"section_id":"CS-015","block_type":"册说明","chapter_code":null,"seq":15,"page":16,"print_page":1,"text":"五、石灰土垫层、粒料石灰土垫层、石灰土基层定额项目中石灰均为生石灰的消耗量,土为松方用量,土均按外购考虑,如利用现场土,应扣除定额中土的材料费。","tables":null,"tables_fixed":null},{"section_id":"CS-016","block_type":"册说明","chapter_code":null,"seq":16,"page":17,"print_page":2,"text":"六、本册定额凡使用石灰的项目,均未包括消解石灰的工作内容。","tables":null,"tables_fixed":null},{"section_id":"CS-017","block_type":"册说明","chapter_code":null,"seq":17,"page":17,"print_page":2,"text":"七、本册定额施工用水按现场有水源考虑,如现场无水源,所增加的费用按第四章相应项目计算。","tables":null,"tables_fixed":null},{"section_id":"CS-018","block_type":"册说明","chapter_code":null,"seq":18,"page":17,"print_page":2,"text":"八、本册说明未尽事宜,详见各章节说明。","tables":null,"tables_fixed":null},{"section_id":"ZS-019","block_type":"章说明","chapter_code":"0201","seq":19,"page":20,"print_page":5,"text":"一、本章定额包括预压地基、强夯地基、掺石灰、掺砂石、抛石挤淤等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-020","block_type":"章说明","chapter_code":"0201","seq":20,"page":20,"print_page":5,"text":"二、堆载预压工作内容中包括了堆载四面的放坡和修筑坡道,未包括堆载材料的运输,发生时费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-021","block_type":"章说明","chapter_code":"0201","seq":21,"page":20,"print_page":5,"text":"三、强夯地基1. 点夯定额中综合考虑了各类布点形式,不论设计采用何种布点形式均不得调整。2. 点夯项目中每单位面积夯点数,是指设计文件最终夯点布置图中规定的单位面积内点夯完成后最终的夯点数量。3. 满夯应按设计要求的满夯能级计算。4. 强夯的夯击击数,系指强夯机械就位后,夯锤在同一夯点上下起落的次数。5. 强夯工程量应区别不同夯击能量和夯点密度,按设计图示夯击范围分别计算。6. 设计要求采用强夯置换法夯实地基时,人工、机械乘以系数1.25,填充夯填料以及其运输的人工、机械不含在强夯项目中,另行计算。7. 如强夯面积小于600m2 小型工程,应按相应项目乘以系数1.25。","tables":null,"tables_fixed":null},{"section_id":"ZS-022","block_type":"章说明","chapter_code":"0201","seq":22,"page":20,"print_page":5,"text":"四、真空预压砂垫层厚度按70cm 考虑,当设计与消耗量取定的材料厚度不同时,可以调整砂子用量。","tables":null,"tables_fixed":null},{"section_id":"ZS-023","block_type":"章说明","chapter_code":"0201","seq":23,"page":20,"print_page":5,"text":"五、袋装砂井直径按7cm 编制,当设计砂井直径不同时,按砂井截面积的比例关系调整中(粗) 砂的用量,其他消耗量不作调整。袋装砂井及塑料排水板处理软弱地基,工程量为设计深度,材料消耗中已包括砂袋或塑料排水板的预留长度。","tables":null,"tables_fixed":null},{"section_id":"ZS-024","block_type":"章说明","chapter_code":"0201","seq":24,"page":21,"print_page":6,"text":"六、振冲桩(填料)定额中不包括泥浆排放处理的费用,需要时另行计算,执行第一册《土石方工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-025","block_type":"章说明","chapter_code":"0201","seq":25,"page":21,"print_page":6,"text":"七、深层水泥搅拌桩分为深层搅拌法(简称湿法)和粉体喷搅法(简称干法),空搅部分按相应项目的人工及搅拌机械乘以系数0.5。","tables":null,"tables_fixed":null},{"section_id":"ZS-026","block_type":"章说明","chapter_code":"0201","seq":26,"page":21,"print_page":6,"text":"八、水泥搅拌桩中深层搅拌法的单(双)头搅拌桩、三轴水泥搅拌桩定额按二搅二喷施工工艺考虑,设计不同时,每增(减)一搅一喷按相应项目的人工、机械乘以系数0.4 进行增(减)。SMW 工法桩(型钢水泥土搅拌墙)项目执行《房屋建筑与装饰工程定额》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-027","block_type":"章说明","chapter_code":"0201","seq":27,"page":21,"print_page":6,"text":"九、单(双)头深层搅拌桩、三轴搅拌桩水泥掺量分别按加固土质量(1800kg / m3)的13%和15%考虑,当设计与定额取定不同时,可以换算。","tables":null,"tables_fixed":null},{"section_id":"ZS-028","block_type":"章说明","chapter_code":"0201","seq":28,"page":21,"print_page":6,"text":"十、三轴水泥搅拌桩土方置换外运量按桩体积20%计量。","tables":null,"tables_fixed":null},{"section_id":"ZS-029","block_type":"章说明","chapter_code":"0201","seq":29,"page":21,"print_page":6,"text":"十一、水泥粉煤灰碎石桩(CFG)土方场外运输执行第一册《土石方工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-030","block_type":"章说明","chapter_code":"0201","seq":30,"page":21,"print_page":6,"text":"十二、高压旋喷桩设计水泥用量与定额不同时,可以换算。","tables":null,"tables_fixed":null},{"section_id":"ZS-031","block_type":"章说明","chapter_code":"0201","seq":31,"page":21,"print_page":6,"text":"十三、石灰桩是按桩径500mm 编制的,设计桩径每增加50mm,人工、机械乘以系数1.05。设计桩径小于500mm 时,人工、机械不予调整。当设计与定额取定的石灰用量不同时,可以换算。","tables":null,"tables_fixed":null},{"section_id":"ZS-032","block_type":"章说明","chapter_code":"0201","seq":32,"page":21,"print_page":6,"text":"十四、分层注浆加固的扩散半径为800mm,压密注浆加固半径为750mm。当设计与定额取定的水泥用量不同时,相关材料可以换算,人工、机械不得调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-033","block_type":"章说明","chapter_code":"0201","seq":33,"page":21,"print_page":6,"text":"十五、石灰土垫层、粒料石灰土垫层项目按路拌考虑,若在指定拌合场集中拌合,人工乘以系数0.85,所增加的运输费用应另行计算。","tables":null,"tables_fixed":null},{"section_id":"JR-034","block_type":"计算规则","chapter_code":"0201","seq":34,"page":22,"print_page":7,"text":"一、堆载预压、真空预压按设计图示尺寸以加固面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-035","block_type":"计算规则","chapter_code":"0201","seq":35,"page":22,"print_page":7,"text":"二、强夯分满夯、点夯区不同夯击能量,按设计图示尺寸的夯击范围以面积计算。设计无规定时,按每边超过基础外缘的宽度3m 计算。","tables":null,"tables_fixed":null},{"section_id":"JR-036","block_type":"计算规则","chapter_code":"0201","seq":36,"page":22,"print_page":7,"text":"三、掺石灰、掺配片石、改换炉渣、改换片石,均按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-037","block_type":"计算规则","chapter_code":"0201","seq":37,"page":22,"print_page":7,"text":"四、掺砂石按设计图示尺寸以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-038","block_type":"计算规则","chapter_code":"0201","seq":38,"page":22,"print_page":7,"text":"五、抛石挤淤按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-039","block_type":"计算规则","chapter_code":"0201","seq":39,"page":22,"print_page":7,"text":"六、袋装砂井、塑料排水板,按设计图示尺寸以长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-040","block_type":"计算规则","chapter_code":"0201","seq":40,"page":22,"print_page":7,"text":"七、振冲桩(填料)按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-041","block_type":"计算规则","chapter_code":"0201","seq":41,"page":22,"print_page":7,"text":"八、振动砂石桩按设计桩截面乘以桩长(包括桩尖)以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-042","block_type":"计算规则","chapter_code":"0201","seq":42,"page":22,"print_page":7,"text":"九、水泥粉煤灰碎石桩(CFG)按设计图示尺寸以桩长(包括桩尖)计算。取土外运按成孔体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-043","block_type":"计算规则","chapter_code":"0201","seq":43,"page":22,"print_page":7,"text":"十、水泥搅拌桩(含深层水泥搅拌法和粉体喷搅法)工程量按桩长乘以桩径截面积以体积计算,桩长按设计桩顶标高至桩底长度另增加500mm;若设计桩顶标高已达打桩前的自然地坪标高小于500mm 或已达打桩前的自然地坪标高时,另增加长度应按实际长度计算或不计。三轴搅拌桩采用套接一孔法时,套接孔重复搅拌的单圆形截面应重复计算。","tables":null,"tables_fixed":null},{"section_id":"JR-044","block_type":"计算规则","chapter_code":"0201","seq":44,"page":22,"print_page":7,"text":"十一、高压旋喷桩工程量,钻孔按原地面至设计桩底的距离以长度计算,喷浆按设计加固桩截面面积乘以设计桩长以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-045","block_type":"计算规则","chapter_code":"0201","seq":45,"page":23,"print_page":8,"text":"十二、石灰桩按设计桩长(包括桩尖)以长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-046","block_type":"计算规则","chapter_code":"0201","seq":46,"page":23,"print_page":8,"text":"十三、地基注浆加固以孔为单位的项目,按全区域加固编制,当加固深度与定额不同时可内插法计算;当采取局部区域加固,则人工和钻机台班不变,材料(注浆阀管除外)和其他机械台班按加固深度与定额深度同比例调减。","tables":null,"tables_fixed":null},{"section_id":"JR-047","block_type":"计算规则","chapter_code":"0201","seq":47,"page":23,"print_page":8,"text":"十四、注浆加固以体积为单位的项目,已按各种深度综合取定,工程量按加固土体以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-048","block_type":"计算规则","chapter_code":"0201","seq":48,"page":23,"print_page":8,"text":"十五、褥垫层、土工合成材料按设计图示尺寸以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-049","block_type":"计算规则","chapter_code":"0201","seq":49,"page":23,"print_page":8,"text":"十六、排(截)水沟按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-050","block_type":"计算规则","chapter_code":"0201","seq":50,"page":23,"print_page":8,"text":"十七、盲沟按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-051","block_type":"计算规则","chapter_code":"0201","seq":51,"page":23,"print_page":8,"text":"十八、山皮石垫层、石灰土垫层、粒料石灰土垫层按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-052","block_type":"章说明","chapter_code":"0202","seq":52,"page":78,"print_page":63,"text":"一、本章定额包括路床整形、石灰稳定土摊铺、水泥稳定土摊铺等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-053","block_type":"章说明","chapter_code":"0202","seq":53,"page":78,"print_page":63,"text":"二、路床整形已包括平均厚度10cm 以内的人工挖高填低,路床整平达到设计要求的纵、横坡度。","tables":null,"tables_fixed":null},{"section_id":"ZS-054","block_type":"章说明","chapter_code":"0202","seq":54,"page":78,"print_page":63,"text":"三、边沟成型已综合考虑了边沟挖土不同土壤类别,考虑边沟两侧边坡培整面积所需的挖土、培土、修整边坡及余土抛出沟外的全过程所需人工。","tables":null,"tables_fixed":null},{"section_id":"ZS-055","block_type":"章说明","chapter_code":"0202","seq":55,"page":78,"print_page":63,"text":"四、多合土基层中各种材料是按常用的配合比编制的,当设计配合比与定额取定的材料不同时,材料可以换算,人工、机械不调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-056","block_type":"章说明","chapter_code":"0202","seq":56,"page":78,"print_page":63,"text":"五、集中拌合水泥稳定碎(砾)石基层项目按自建拌合站考虑,不包括拌合站建站费用及混合料运输费用,发生时费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-057","block_type":"章说明","chapter_code":"0202","seq":57,"page":78,"print_page":63,"text":"六、基层的设计压实厚度与取定厚度不同时,可按“每增减1cm”项目调整厚度,当调整的厚度超过10cm以上时,该基层按照两层结构层计算,并按“每增减1cm”项目调整厚度,以此类推。调整方法:当设计压实厚度在18cm 以内时,在基层厚度15cm 的项目上进行调整;当设计压实厚度在18cm 以外时,在基层厚度20cm 的项目上进行调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-058","block_type":"章说明","chapter_code":"0202","seq":58,"page":78,"print_page":63,"text":"七、混合料分层次铺筑时,按规定应分层进行养生。养生期按7 天考虑,其用水量已综合在基层养生项目内,使用时不得重复计算用水量。","tables":null,"tables_fixed":null},{"section_id":"ZS-059","block_type":"章说明","chapter_code":"0202","seq":59,"page":78,"print_page":63,"text":"八、石灰土集中拌合法拌合执行集中消解石灰项目,石灰土路拌法拌合执行小堆沿线消解石灰项目。如环保部门禁止施工现场拌合石灰土,均执行集中消解石灰项目","tables":null,"tables_fixed":null},{"section_id":"ZS-060","block_type":"章说明","chapter_code":"0202","seq":60,"page":79,"print_page":64,"text":"九、石灰土稳定土基层按路拌考虑,若在指定拌合场集中拌合,按拖拉机拌合项目执行,人工乘以系数0.85,所增加的运输费用应另行计算。如石灰土是按成品材料采购的,执行厂拌机械摊铺石灰土基层项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-061","block_type":"章说明","chapter_code":"0202","seq":61,"page":79,"print_page":64,"text":"十、厂拌稳定土混合料基层项目不包括稳定土混合料运至摊铺作业面的运输费用,发生时按本册有关项目计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-062","block_type":"章说明","chapter_code":"0202","seq":62,"page":79,"print_page":64,"text":"十一、本章厂拌材料的压实密度按如下数值计入:厂拌石灰土1.65t/ m3、厂拌石灰土碎石(10:60:30)2.049t/ m3、厂拌粉煤灰三渣2.13t/ m3、厂拌水泥稳定砂砾( 4%) 2.195t/ m3、厂拌水泥稳定砂砾( 5%)2.216t/ m3、厂拌水泥稳定砂砾(6%)2.235t/ m3、厂拌水泥稳定碎石(4%)2.23t/ m3、厂拌水泥稳定碎石(5%)2.251t/ m3、厂拌水泥稳定碎石(6%)2.273t/ m3、厂拌级配碎石2.268t/ m3、厂拌粉煤灰水泥碎石(15:5:80)2.214t/ m3、厂拌石灰粉煤灰水泥碎石(8:50:2:40)1.947t/ m3、厂拌石灰粉煤灰土(8:80:12)1.431t/ m3。","tables":null,"tables_fixed":null},{"section_id":"JR-063","block_type":"计算规则","chapter_code":"0202","seq":63,"page":79,"print_page":64,"text":"一、道路路床碾压按设计道路路基边缘图示尺寸以面积计算,不扣除各类井所占面积,在设计中明确加宽值,按设计规定计算。","tables":null,"tables_fixed":null},{"section_id":"JR-064","block_type":"计算规则","chapter_code":"0202","seq":64,"page":79,"print_page":64,"text":"二、土边沟成形按设计图示尺寸以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-065","block_type":"计算规则","chapter_code":"0202","seq":65,"page":79,"print_page":64,"text":"三、道路基层、养生工程量均按设计摊铺层的面积之和计算,不扣除各种井位所占的面积;设计道路基层横断面是梯形时,应按其截面平均宽度计算面积。","tables":null,"tables_fixed":null},{"section_id":"ZS-066","block_type":"章说明","chapter_code":"0203","seq":66,"page":136,"print_page":121,"text":"一、本章定额包括沥青表面处治、沥青贯入式路面、透层、黏层、封层等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-067","block_type":"章说明","chapter_code":"0203","seq":67,"page":136,"print_page":121,"text":"二、重铺(整形)就地热再生路面是指再生料与新料分别摊铺一次碾压成型的工艺。加料厚度2.0cm 以内为整形再生,加料厚度2.0cm 以上为重铺再生;复拌就地热再生路面是指再生料与新料拌合后再摊铺一次碾压成型的工艺。","tables":null,"tables_fixed":null},{"section_id":"ZS-068","block_type":"章说明","chapter_code":"0203","seq":68,"page":136,"print_page":121,"text":"三、沥青混凝土厂拌冷再生项目不含沥青铣刨料铣刨费用及沥青铣刨料和沥青再生混合料的运输费用,发生时另行计算。沥青铣刨料工程量及沥青铣刨料和沥青再生混合料运输可按下表计算:沥青混凝土厂拌冷再生项目沥青铣刨料、沥青再生混合料消耗量表计量单位:100m2","tables":null,"tables_fixed":null},{"section_id":"JR-069","block_type":"计算规则","chapter_code":"0203","seq":69,"page":139,"print_page":124,"text":"一、道路工程沥青混凝土、水泥混凝土及其他类型路面工程量以设计图示面积计算,不扣除各类井所占面积,但扣除路面相连的平石、侧石、缘石所占的面积。","tables":null,"tables_fixed":null},{"section_id":"JR-070","block_type":"计算规则","chapter_code":"0203","seq":70,"page":139,"print_page":124,"text":"二、伸缝嵌缝按设计缝长乘以设计缝深以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-071","block_type":"计算规则","chapter_code":"0203","seq":71,"page":139,"print_page":124,"text":"三、锯缝机切缩缝、填灌缝按设计图示尺寸以长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-072","block_type":"计算规则","chapter_code":"0203","seq":72,"page":139,"print_page":124,"text":"四、铺玻璃纤维格栅按设计图示尺寸以面积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-073","block_type":"计算规则","chapter_code":"0203","seq":73,"page":139,"print_page":124,"text":"五、土工布贴缝按混凝土路面缝长乘以设计宽度以面积计算,其中纵横相交处面积不扣除。","tables":null,"tables_fixed":null},{"section_id":"ZS-074","block_type":"章说明","chapter_code":"0204","seq":74,"page":176,"print_page":161,"text":"一、本章定额包括人行道整形碾压、人行道块料铺设、混凝土人行道等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-075","block_type":"章说明","chapter_code":"0204","seq":75,"page":176,"print_page":161,"text":"二、本章定额采用的人行道块料、广场砖、安砌边石等砌料规格及型号与设计不同时,消耗量中的相关材料可以调整,人工、机械不调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-076","block_type":"章说明","chapter_code":"0204","seq":76,"page":176,"print_page":161,"text":"三、热熔盲道项目的玻璃珠、热熔涂料项目用量与设计不同时,材料可以调整,人工、机械不调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-077","block_type":"章说明","chapter_code":"0204","seq":77,"page":176,"print_page":161,"text":"四、人行道整形已包括平均厚度10cm 以内的人工挖高填低、整平、碾压。","tables":null,"tables_fixed":null},{"section_id":"ZS-078","block_type":"章说明","chapter_code":"0204","seq":78,"page":176,"print_page":161,"text":"五、侧平石安砌项目按直线和弧线综合考虑。","tables":null,"tables_fixed":null},{"section_id":"ZS-079","block_type":"章说明","chapter_code":"0204","seq":79,"page":176,"print_page":161,"text":"六、小型构件运输指单件体积在0.1m3以内的构件。场内运混凝土(熟料)指混凝土(熟料)场内转运。","tables":null,"tables_fixed":null},{"section_id":"ZS-080","block_type":"章说明","chapter_code":"0204","seq":80,"page":176,"print_page":161,"text":"七、检查井、窨井、雨水进水井升高降低均不包含更换井盖工作内容。发生更换井盖时,执行“更换铸铁井盖”相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-081","block_type":"章说明","chapter_code":"0204","seq":81,"page":176,"print_page":161,"text":"八、多合土运输考虑了洒水降尘措施,如实际未发生洒水降尘,应扣除洒水车台班数量。","tables":null,"tables_fixed":null},{"section_id":"ZS-082","block_type":"章说明","chapter_code":"0204","seq":82,"page":176,"print_page":161,"text":"九、混合料运输项目适用于平均运距在25km 以内的道路运输,当平均运距超过25km 时,超过部分运距按当地市场运价计算其运输费用。","tables":null,"tables_fixed":null},{"section_id":"ZS-083","block_type":"章说明","chapter_code":"0204","seq":83,"page":176,"print_page":161,"text":"十、厂拌石灰土、厂拌石灰粉煤灰土、厂拌石灰碎石(粉煤灰)土、厂拌粉煤灰三渣等半成品的运输执行多合土运输项目;厂拌水泥稳定砂砾、厂拌水泥稳定碎石、厂拌级配碎石、厂拌粉煤灰水泥碎石等半成品的运输执行水泥稳定粒料运输项目。","tables":null,"tables_fixed":null},{"section_id":"JR-084","block_type":"计算规则","chapter_code":"0204","seq":84,"page":177,"print_page":162,"text":"一、人行道整形碾压面积按设计人行道图示尺寸以面积计算,不扣除树池和各类井所占面积。","tables":null,"tables_fixed":null},{"section_id":"JR-085","block_type":"计算规则","chapter_code":"0204","seq":85,"page":177,"print_page":162,"text":"二、人行道板安砌、人行道块料铺设、混凝土人行道铺设、热熔盲道按设计图示尺寸以面积计算,不扣除各类井所占面积,但应扣除侧(平、缘)石、树池所占面积。","tables":null,"tables_fixed":null},{"section_id":"JR-086","block_type":"计算规则","chapter_code":"0204","seq":86,"page":177,"print_page":162,"text":"三、花岗岩人行道板伸缩缝按图示尺寸以长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-087","block_type":"计算规则","chapter_code":"0204","seq":87,"page":177,"print_page":162,"text":"四、侧(平、缘)石垫层区分不同材质,以体积计算。","tables":null,"tables_fixed":null},{"section_id":"JR-088","block_type":"计算规则","chapter_code":"0204","seq":88,"page":177,"print_page":162,"text":"五、侧(平、缘)石按设计图示中心线长度计算,包括各转弯处的弧形长度。","tables":null,"tables_fixed":null},{"section_id":"JR-089","block_type":"计算规则","chapter_code":"0204","seq":89,"page":177,"print_page":162,"text":"六、检查井、雨水井升降以数量计算。","tables":null,"tables_fixed":null},{"section_id":"JR-090","block_type":"计算规则","chapter_code":"0204","seq":90,"page":177,"print_page":162,"text":"七、砌筑树池侧石按设计外围尺寸以长度计算。","tables":null,"tables_fixed":null},{"section_id":"JR-091","block_type":"计算规则","chapter_code":"0204","seq":91,"page":177,"print_page":162,"text":"八、多合土运输的计量单位为压实方,按体积计算。水泥稳定粒料、沥青混凝土运输按质量计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-092","block_type":"章说明","chapter_code":"0205","seq":92,"page":214,"print_page":199,"text":"一、本章定额包括交通标志杆安装、标志牌安装、视线诱导器等项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-093","block_type":"章说明","chapter_code":"0205","seq":93,"page":214,"print_page":199,"text":"二、交通标志杆、门架杆及标志牌按成品考虑,其中标志牌成品不含反光膜。","tables":null,"tables_fixed":null},{"section_id":"ZS-094","block_type":"章说明","chapter_code":"0205","seq":94,"page":214,"print_page":199,"text":"三、标志牌安装分小型、大型标志牌,面积在1m2 以内为小型标志牌,面积1m2 以外为大型标志牌。小型标志牌按普通板,大型标志牌为挤压板。标志牌安装按地面组装,与标志杆进行连接、拼装成型考虑。","tables":null,"tables_fixed":null},{"section_id":"ZS-095","block_type":"章说明","chapter_code":"0205","seq":95,"page":214,"print_page":199,"text":"四、附着式反光轮廓标安装于波形梁护栏或其他护栏上,已综合考虑各种安装方法。路面突起路标采用粘合剂粘合于混凝土或沥青路面上,包括反光型与非反光型。","tables":null,"tables_fixed":null},{"section_id":"ZS-096","block_type":"章说明","chapter_code":"0205","seq":96,"page":214,"print_page":199,"text":"五、纵向标线包括中心线、边缘线和分道线;标记包括文字、字符及图形;横道线包括人行横道线、停止线及导流带标线等;其他标线的均按横道线相应项目执行。","tables":null,"tables_fixed":null},{"section_id":"ZS-097","block_type":"章说明","chapter_code":"0205","seq":97,"page":214,"print_page":199,"text":"六、标志牌、标志杆及门架安装的螺栓(垫圈、垫片)当设计与定额取定的材料规格及数量不同时,可以调整,人工、机械不调整。","tables":null,"tables_fixed":null},{"section_id":"ZS-098","block_type":"章说明","chapter_code":"0205","seq":98,"page":214,"print_page":199,"text":"七、塑质隔离筒(墩)内灌水(砂)费用,另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-099","block_type":"章说明","chapter_code":"0205","seq":99,"page":214,"print_page":199,"text":"八、光缆、监控摄像机、数码相机、交通智能系统调试、交通预埋管线执行《通用安装工程》第五册《建筑智能化工程》相应项目。","tables":null,"tables_fixed":null},{"section_id":"ZS-100","block_type":"章说明","chapter_code":"0205","seq":100,"page":214,"print_page":199,"text":"九、设备控制机箱安装未包括混凝土基础,其费用另行计算。","tables":null,"tables_fixed":null},{"section_id":"ZS-101","block_type":"章说明","chapter_code":"0205","seq":101,"page":214,"print_page":199,"text":"十、本章未包含项目执行《市政 /* ---------------- 章节树 ---------------- */
const CH13="0113", CH17="0117";
const secChToCode = k => Object.keys(AMP_SEC).find(c=>AMP_SEC[c]===k);
const itemPrefix = code => DATA.meta.code_prefix;   // 卷自适应：sz02=2-
const layerDefs = [
  ["章节说明","sm"], ["计算规则","js"], ["附表","fb"], ["定额子目","items"], ["子目附注","notes"]
];
function buildTree(){
  const t = [];
  t.push(node("📖 "+GS_TYPE,"gs", S.sectionsBy(GS_TYPE).length));
  t.push(node("📑 目录","toc", DATA.toc.length));
  const mj = S.sectionsBy("规范");
  if(mj.length) t.push(node("📐 建筑面积计算规范","mj", mj.length));
  DATA.chapters.forEach(c=>{
    const secCh = AMP_SEC[c.chapter_code];
    const kids = [];
    if(secCh){
      const pre = itemPrefix(c.chapter_code);
      const cnt = {
        sm: S.sectionsBy("章节说明",secCh).length,
        js: S.sectionsBy("计算规则",secCh).length,
        fb: S.sectionsBy("附表",secCh).length,
        items: DATA.items.filter(i=>i.chapter_code===c.chapter_code).length,
        notes: Object.entries(DATA.details).filter(([k,d])=>k.startsWith(pre)&&d.notes)
                 .reduce((n,x)=>n+x[1].notes.length,0),
      };
      layerDefs.forEach(([name,key])=> kids.push(node(`${name}`,"layer:"+secCh+":"+key, cnt[key])));
    }
    if(c.chapter_code===CH17){
      const fb17 = S.sectionsBy("附表").filter(s=>!s.chapter_code);
      if(fb17.length) kids.push(node("附表（样板）","fb17", fb17.length));
    }
    const stc = secCh ? "b-green" : "b-gray";
    const stTxt = secCh ? "已放大" : "待放大";
    t.push(node(`${c.chapter_no||""} ${c.name} <span class="badge ${stc}">${stTxt}</span>`,
      "ch:"+c.chapter_code, S.tocBy(c.chapter_code).length, kids));
  });
  t.push(node("🔍 人工核对","review", REVIEW_TOTAL));
  t.push(node("💰 缺价反推","derive", DATA.stats.pd_groups, null, DATA.stats.pd_confirmed?`${DATA.stats.pd_confirmed}已确认`:"待补库"));
  t.push(node("📦 价格库","price", DATA.stats.mat_prices + DATA.stats.mach_prices));
  t.push(node("🧪 官方配比","mix", DATA.stats.mix_ratios));
  t.push(node("📋 勘误表","errata", DATA.erratas.length));
  t.push(node("🧾 官方未发现错误","findings", DATA.stats.manual_findings));
  t.push(node("⚠️ 疑点清单","issues", DATA.issues.length));
  const ampNames = DATA.chapters.filter(c=>AMP_SEC[c.chapter_code]).map(c=>c.chapter_no).join("、");
  $("#tree").innerHTML = t.join("") +
    `<div class="tree-note">${ampNames}为全六层已放大（H1~H4 恒等式验收）；其余章节目录已定位，按结构地图逐章放大后自动挂载六层子节点。</div>`;
}
function node(label, id, cnt, kids, hint){
  const hasKids = kids && kids.length;
  return `<div class="tnode" data-id="${id}"><span class="ic">${hasKids?"▸":"·"}</span><span>${label}</span>` +
    (cnt!=null?`<span class="cnt">${hint?hint+" · ":""}${cnt}</span>`:"") + `</div>` +
    (hasKids?`<div class="tchild" data-for="${id}" style="display:none">${kids.join("")}</div>`:"");
}
function bindTree(){
  document.querySelectorAll(".tnode").forEach(el=>{
    el.addEventListener("click", ev=>{
      const kid = document.querySelector(`.tchild[data-for="${el.dataset.id}"]`);
      if(kid && ev.offsetX < 20){ kid.style.display = kid.style.display==="none"?"block":"none"; return; }
      document.querySelectorAll(".tnode.on").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      show(el.dataset.id);
    });
  });
}

/* ---------------- 内容渲染 ---------------- */
const main = () => $("#main");
function show(id){
  if(id.startsWith("item:")){ return openItem(id.slice(5)); }
  if(id==="gs"){ return viewSections(GS_TYPE, S.sectionsBy(GS_TYPE), extraGS); }
  if(id==="mj"){ return viewSections("建设工程建筑面积计算规范", S.sectionsBy("规范")); }
  if(id==="toc"){ return viewToc(); }
  if(id==="price"){ return viewPrice(); }
  if(id==="mix"){ return viewMix(); }
  if(id==="derive"){ return viewDerive(); }
  if(id==="errata"){ return viewErrata(); }
  if(id==="findings"){ return viewFindings(); }
  if(id==="issues"){ return viewIssues(); }
  if(id==="review"){ return viewReview(); }
  if(id==="fb17"){ return viewSections("第十七章 附表（样板）", S.sectionsBy("附表").filter(s=>!s.chapter_code)); }
  if(id.startsWith("ch:")){ return viewChapter(id.slice(3)); }
  if(id.startsWith("layer:")){ const p=id.split(":"); return viewLayer(p[1], p[2]); }
}

function secBlock(s, open){
  const tb = S.sec(s.tables), tbf = S.sec(s.tables_fixed);

  if(tb){
    tbs += `<table class="tbl">${tb.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
    if(tbf) tbs += `<div class="note">语义修正版表头（留痕衍生字段 tables_fixed）：</div>` +
      `<table class="tbl">${tbf.map(r=>`<tr>${r.map(c=>`<td>${esc(c).replace(/\n/g,"")}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  return `<div class="sec-item ${open?"open":""}">
    <div class="sec-hd"><span class="sid">${esc(s.section_id)}</span><span>${esc((s.text||"").slice(0,60))}${(s.text||"").length>60?"…":""}</span><span class="pp">${esc(s.print_page)} · P${s.page}</span></div>
    <div class="sec-bd">${esc(s.text)}${tbs}</div></div>`;

function viewLayer(secCh, key){
  const full = secChToCode(secCh);
  const chName = (S.chapter(full)||{}).chapter_no || full;
  if(key==="sm") return viewSections(`${chName} 章节说明`, S.sectionsBy("章节说明",secCh));
  if(key==="js") return viewSections(`${chName} 工程量计算规则`, S.sectionsBy("计算规则",secCh));
  if(key==="fb"){
    const fb = S.sectionsBy("附表",secCh);
    if(!fb.length){
      main().innerHTML = `<div class="panel"><h2>${chName} 附表</h2><div class="warn">本章无附表——正文探测无「附表/工日表」特征词，探测过程留痕（book_structure_scan）。</div></div>`;
      return;
    }
    return viewSections(`${chName} 附表（计算用表）`, fb);
  }
  if(key==="notes") return viewNotes(secCh);
  if(key==="items") return viewItems(secCh);
}

  const pre = itemPrefix(secChToCode(secCh));

    if(d.h3.status==="fail") h3d = `<div class="warn">H3 超差：书印材料费 ${num2(dt.declared)} ≠ 价格库反推 ${num2(dt.calc)}（差 ${num2(dt.diff)}）。<b>需人工对价</b>——左侧「🔍 人工核对」清单可定位同类条目。</div>`;
    if(d.h3.status==="skip_unmatched"||d.h3.status==="unmatched") h3d = `<div class="warn">H3 跳过·未匹配：${esc(dt.note||"")}。缺价材料：${(dt.missing||[]).map(m=>`${esc(m.name)}(${esc(m.unit||"")})`).join("、")||"—"}，需补价格库后自动复检转通过。</div>`;
    if(d.h3.status==="skip_nomat"||d.h3.status==="nomat") h3d = `<div class="note">H3 跳过·免核：${esc(dt.note||"")}（不含材料子目）。</div>`;
  }
  const wcBlk = i.work_content
    ? `<div class="note" style="border-left:3px solid var(--accent);padding:6px 10px;background:var(--panel2,#f7f8fa)"><b>工作内容</b>（计价主要参考）：${esc(i.work_content)}</div>`
    : "";
  const notes = (d.notes||[]).map(n=>`<div class="note">▪ ${esc(n.text)}</div>`).join("");
  let errd = "";
  if(i.errata_status==="hit"){
    const es = (DATA.erratas||[]).filter(e=>{
      try{ return (JSON.parse(e.item_codes||"[]")||[]).includes(code); }catch(_){ return false; }
    });
    if(es.length) errd = `<div class="warn">⚠ <b>官方勘误覆盖</b>（库内保留原文值，overlay 双值留痕）：${es.map(e=>`${esc(e.errata_type||"")} ${esc(e.wrong_text||"")} → <b>${esc(e.correct_text||"")}</b>（勘误号 ${esc(e.errata_id)}，印${e.printed_page??"?"}）`).join("<br>")}</div>`;
  }
  $("#modal").innerHTML = hd + p4 + wcBlk + errd + h2d + h3d +
    tbl("人工消耗", d.labors||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("材料消耗", d.materials||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    tbl("机械消耗", d.machines||[], [{t:"序",n:1,f:r=>r.seq},{t:"名称",f:r=>esc(r.name)},{t:"规格",f:r=>esc(r.spec||"—")},{t:"单位",f:r=>esc(r.unit)},{t:"数量",n:1,f:r=>num(r.qty)}]) +
    (notes?`<h3>附注（换算规则）</h3>${notes}`:"");
  $("#mask").classList.add("show");
  $("#mx").addEventListener("click",()=>$("#mask").classList.remove("show"));
  const ib = $("#ibimg");
  if(ib) ib.addEventListener("click", ()=>showPageImg(i.page, i.item_code));
}

  main().innerHTML = `<div class="panel"><h2>价格库</h2>

    <input id="pq" placeholder="名称搜索…" style="width:220px"></div>
    <div id="pbody"></div></div>`;
  let src = "all";
  const srcFn = p => src==="all" || (src==="rev" ? p.source==="反推" : src==="off" ? p.source==="官方配比" : (p.source!=="反推" && p.source!=="官方配比"));

    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">序</th><th>名称</th><th>单位</th><th class="num">单价(元)</th><th class="num">页</th><th>来源</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${p.seq}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="num">${num2(p.price)}</td><td class="num">${p.page??"—"}</td>
      <td>${p.source==="反推"?'<span class="badge b-amber">⚡反推入库</span>':p.source==="官方配比"?'<span class="badge b-green">官方配比</span>':'<span class="badge b-gray">附表</span>'}</td></tr>`).join("")}</tbody></table>
      ${kw||src!=="all"?`<div class="note">命中 ${hits.length} 条${kw?"（按名称）":""}${src!=="all"?"（按来源）":""}${hits.length>300?"，最多显示 300。":"。"}</div>`:""}`;
  };
  const renderJ = kw => {
    const rows = DATA.mach_prices.filter(p=>!kw||(p.name||"").includes(kw)).slice(0,300);
    $("#pbody").innerHTML = `<table class="tbl"><thead><tr><th class="num">编码</th><th>名称</th><th>规格</th><th class="num">台班单价(元)</th><th class="num">页</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td class="num">${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.spec||"")}</td><td class="num">${num2(p.unit_price)}</td><td class="num">${p.page}</td></tr>`).join("")}</tbody></table>
      ${kw?`<div class="note">命中 ${DATA.mach_prices.filter(p=>(p.name||"").includes(kw)).length} 条，最多显示 300。</div>`:""}`;
  };
  let mode = "m";
  const paint = () => { const kw=$("#pq").value.trim(); mode==="m"?renderM(kw):renderJ(kw); };

    document.querySelectorAll(".chip[data-p]").forEach(x=>x.classList.remove("on")); ch.classList.add("on");

  document.querySelectorAll("#psrc .chip").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#psrc .chip").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
    src = ch.dataset.s; paint();
  }));
  $("#pq").addEventListener("input", paint);
  paint();
}

function viewDerive(){
  const G = DATA.price_derive||[], IT = DATA.price_derive_items||[], FL = DATA.price_derive_fails||[];
  const badge = g => {
    const mine = PCONF[pk(g.material, g.unit)];
    if(g.review_status==="confirmed") return `<span class="badge b-green">✅已确认${g.build_price!=null?" "+num2(g.build_price):""}</span>`;
    if(mine) return mine.materialize
      ? `<span class="badge b-green">⚡已入库 ${num2(mine.build_price)}·${mine.source==="官方配比"?"官方配比":"反推"}</span>`
      : `<span class="badge b-green">✍已定价 ${num2(mine.build_price)}（待导出）</span>`;
    if((g.conclusion||"").includes("待人工确认")) return `<span class="badge b-amber">待人工确认</span>`;
    if((g.conclusion||"").includes("离散")) return `<span class="badge b-red">离散·须分条</span>`;
    return `<span class="badge b-blue">可直接建库</span>`;
  };
  const catOf = g => g.review_status==="confirmed" ? "confirmed"
    : (g.conclusion||"").includes("离散") ? "multi"
    : (g.conclusion||"").includes("待人工确认") ? "round" : "single";
  const stTxt = {ambiguous:"同名多价行·匹配器拒判", multi:"同子目缺价材料≥2项，差额无法唯一拆分",
    no_qty:"缺价行无消耗量", negative:"已知合计>书印材料费（疑似匹配误命中）",
    no_material_cost:"子目无书印材料费", no_missing:"无未匹配行（状态不一致，留痕）"};
  const nConf = G.filter(g=>g.review_status==="confirmed").length;
  const nPriced = G.filter(g=>{ const p=PCONF[pk(g.material,g.unit)]; return p && !p.materialize; }).length;
  const nMat = G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize).length;
  const cats = [["all","全部",G.length],["cand","库内有近似",G.filter(g=>(g.candidates||[]).length).length],
    ["single","单一价",G.filter(g=>catOf(g)==="single").length],
    ["round","舍入级·待确认",G.filter(g=>catOf(g)==="round").length],
    ["multi","离散分条",G.filter(g=>catOf(g)==="multi").length],
    ["priced","已定价待导出",nPriced],["mat","⚡已入库反推",nMat],
    ["confirmed","已确认回库",nConf],["fails","无法反推",FL.length]];
  main().innerHTML = `<div class="panel"><h2>💰 缺价反推 · 定价工作台（${G.length} 种材料 · 子目溯源 ${IT.length} 条 · 无法反推 ${FL.length} 条）</h2>
    <div class="note"><b>未匹配为何这么多（查验结论）</b>：全书价格附表共 ${DATA.stats.mat_prices} 条，半成品混合料（水泥砂浆/胶泥/灰土/玛蹄脂…）与市场化材料（龙骨/亚克力字/窗帘…）为选择性收录——属实、非漏配；匹配器带防误伤设计（单位一致门、同名多价拒判）${DATA.manual_findings&&DATA.manual_findings.some(f=>/玛蹄脂/.test(f.subject||""))?`，如石油沥青玛蹄脂库内为 kg 与消耗 m³ 不一致而正确拒配（已立案 manual_findings）`:""}。<br>
    <b>审核通路</b>：① 每组点 <b>✍ 定价</b>（弹窗内可比对<b>库内近似候选</b>与反推溯源明细，单位错配标红）→ ② 顶部 <b>⬇ 导出核价记录</b> 下载 JSON → ③ 将 rules 数组 merge 进 <code>out/price_confirm.json</code> 重跑 build_db → 组状态转 ✅已确认、build_price 覆盖 → ④ 向 material_prices 补录该价后相关子目 H3 自动复检转 pass。</div>
    <div class="filter">${cats.map((c,i)=>`<span class="chip ${i===0?"on":""}" data-d="${c[0]}">${c[1]} ${c[2]}</span>`).join("")}
      <input id="dqq" placeholder="过滤：材料/子目编号…" style="width:200px">
      <span class="rbtn" id="export-price" title="下载 price_confirm.json 兼容格式，merge 回 out/price_confirm.json 后重跑 build_db 生效">⬇ 导出核价记录（${nPriced}）</span></div>
    <div id="dbody"></div></div>`;
  const candBadge = g => {

    if(!cs.length) return `<span class="badge b-gray">无近似</span>`;
    const um = cs.some(c=>c.unit_match);

  const paint = () => {

      : cat==="mat" ? G.filter(g=>PCONF[pk(g.material,g.unit)]&&PCONF[pk(g.material,g.unit)].materialize)
      : G.filter(g=>catOf(g)===cat);

        <td class="num">${num(r.qty)}</td><td class="num">${num2(r.material_cost)}</td>

        <td class="num" style="font-weight:700;color:var(--accent)">${sug}</td>
        <td class="num">${rng}</td><td class="num">${g.n_prices}</td><td class="num">${g.n_items}</td>

        <tr class="d-det" data-for="${i}" style="display:none"><td colspan="9" style="background:#fbfcfe">

            <th class="num">消耗量</th><th class="num">书印材料费</th><th class="num">已匹配合计</th><th class="num">缺口额</th></tr></thead>
          <tbody>${detRows||'<tr><td colspan="8">无</td></tr>'}</tbody></table></td></tr>`;
    }).join("");
    const failRows = FL.map(f=>{
      const it = DATA.items.find(x=>x.item_code===f.item_code)||{};
      const rn = JSON.parse(f.rows_json||"[]").map(r=>`${r.name}(${r.unit||""})`).join("、")||"—";
      return `<tr class="clickable" data-item="${esc(f.item_code)}"><td style="font-family:var(--mono)">${esc(f.item_code)}</td>
        <td>${esc(it.name||"")}</td><td>${esc((S.chapter(f.chapter_code)||{}).name||f.chapter_code||"—")}</td>
        <td>${esc(stTxt[f.status]||f.status)}</td><td>${esc(rn)}</td></tr>`;
    }).join("");
    $("#dbody").innerHTML =
      (cat!=="fails" && list.length ? `<table class="tbl"><thead><tr><th>材料</th><th>单位</th><th class="num">建议建库价</th>
        <th class="num">反推价区间</th><th class="num">价种类</th><th class="num">子目数</th><th>库内近似</th><th>结论</th><th>状态/操作</th></tr></thead>
        <tbody>${body}</tbody></table>
        <div class="note">命中 ${list.length} 组材料。<b>点击材料行</b>展开子目溯源，<b>🔍近似</b>看库内候选，<b>✍定价</b>打开定价弹窗，<b>点击子目行</b>弹出完整详情。</div>` : "") +
      (cat==="fails"||cat==="all" ? (FL.length && (cat==="fails"||!kw) ?

    const candRows = cs.length ? cs.map(c=>`<tr ${c.unit_match?"":'style="color:#c62828"'}>

    const detRows = det.map(r=>`<tr><td class="num" style="font-weight:700">${num2(r.derived_price)}</td>
      <td style="font-family:var(--mono)">${esc(r.item_code)}</td><td>${esc((r.item_name||"").slice(0,30))}</td>

      <span class="rbtn" id="expbtn" title="导出已核销记录（manual_confirm.json 兼容格式，merge 后重跑 build_db 生效 overlay）">⬇ 导出核销记录</span></div>
    <div id="rbody"></div></div>`;
  let hideDone = true;
  const paint = () => {
    const cat = (document.querySelector("#main .chip.on")||{dataset:{c:"all"}}).dataset.c;

    let list = cat==="all"
      ? [...REVIEW.fail.map(r=>["fail",r]), ...REVIEW.unmatched.map(r=>["unmatched",r]),
         ...REVIEW.units.map(r=>["unit",r]), ...REVIEW.mids.map(r=>["mid",r])]
      : pick[cat].map(r=>[cat,r]);
    if(kw) list = list.filter(([c,r]) => (r.code||"").includes(kw) || (r.text||"").includes(kw));
    const hidden = hideDone ? list.filter(([c,r])=>!DONE[rkey(c,r)]).length : list.length;
    const shown = list.filter(([c,r]) => !(hideDone && DONE[rkey(c,r)])).slice(0,500);
    KEY2REC_CLEAR();
    const row = (cat, r) => {
      const key = rkey(cat, r);
      KEY2REC[key] = {cat, r};
      const done = DONE[key];
      const clk = r.code ? ` data-item="${esc(r.code)}"` : "";
      const imgBtn = (r.page && PAGEIMG.has(r.page))

      ${shown.map(([c,r])=>row(c,r)).join("") || '<tr><td colspan="7">无匹配</td></tr>'}</tbody></table>
      <div class="note">命中 ${list.length} 条 · 待核销 ${hidden} 条${list.length>500?"（仅渲染前 500，请用过滤缩小范围）":""}。核销记录存于浏览器 localStorage（键 qtx_done_v1），「⬇ 导出核销记录」可下载 JSON 供回库。</div>`;
    document.querySelectorAll("#rbody tr[data-item]").forEach(tr=>{
      tr.addEventListener("click", ev=>{

        openItem(tr.dataset.item);
      });

    document.querySelectorAll("#rbody [data-img]").forEach(el=>{
      el.addEventListener("click", ()=>showPageImg(+el.dataset.img, el.dataset.code||""));
    });
    document.querySelectorAll("#rbody [data-undo]").forEach(el=>{
      el.addEventListener("click", ()=>{ delete DONE[el.dataset.undo]; saveDone(); paint(); refreshCounts(); });
    });
    document.querySelectorAll("#rbody [data-done]").forEach(el=>{
      el.addEventListener("click", ()=>openDoneDialog(el.dataset.done, el.dataset.cat));
    });
  };
  function KEY2REC_CLEAR(){ for(const k in KEY2REC) delete KEY2REC[k]; }
  function openDoneDialog(key, cat){
    const rec = KEY2REC[key]; if(!rec) return;
    const r = rec.r;
    const it = r.code ? DATA.items.find(x=>x.item_code===r.code) : null;
    const isUnit = cat==="unit" && it;
    $("#modal").innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:15px">核销确认</b><span class="badge ${badge[cat]}">${label[cat]}</span>

        <label>核销备注（依据、勘误号等，可留空）</label><input id="dn" placeholder="如：与原文一致，确认无误">
      </div>
      <div class="done-actions"><button class="ok" id="dok">✅ 核销</button><button class="no" id="dno">取消</button></div>`;

    $("#dx").addEventListener("click", close);
    $("#dno").addEventListener("click", close);
    const di = $("#dimg"); if(di) di.addEventListener("click", ()=>showPageImg(r.page, r.code||""));
    $("#dok").addEventListener("click", ()=>{
      const uVal = isUnit ? (($("#du").value||"").trim()||null) : null;
      DONE[key] = {cat, code:r.code||null, page:r.page??null, src:r.src||null, itype:r.itype||null,
        unit:uVal, unit_changed:!!(isUnit&&uVal&&it&&uVal!==it.unit),
        note:($("#dn").value||"").trim(), ts:new Date().toISOString()};
      saveDone(); close(); paint(); refreshCounts();
    });
  }
  $("#expbtn").addEventListener("click", ()=>{
    const n = Object.keys(DONE).length;
    if(!n) return alert("尚无核销记录——先在清单中点击「核销」。");
    const rules = Object.entries(DONE).map(([k,v])=>{
      const it = v.code ? DATA.items.find(x=>x.item_code===v.code) : null;
      const defNote = {fail:"H3人工对价确认", unmatched:"缺价材料已确认/已补库", unit:"单位人工核对原文确认", mid:"中风险疑点人工核对确认"}[v.cat]||"人工核对确认";
      return {source:v.src||null, itypes:v.itype?[v.itype]:null,
        unit:v.cat==="unit" ? (v.unit || (it?it.unit:null)) : null,
        codes:v.code?[v.code]:null,
        confirmed_by:"爪哥（前端核销）", date:(v.ts||"").slice(0,10),
        note:(v.note||defNote)+(v.unit_changed?`（单位改为 ${v.unit}，须同步改库后 overlay 方可命中）`:"")};
    });
    const payload = {_meta:{file:"out/manual_confirm.json", purpose:"前端核销导出：merge 进 manual_confirm.json 的 rules 后重跑 build_db，命中 issue 落库 review_status='confirmed'", exported_at:new Date().toISOString(), total:rules.length}, rules};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "manual_confirm_export.json"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#hdchip").addEventListener("click", ()=>{ hideDone=!hideDone; $("#hdchip").classList.toggle("on",hideDone); paint(); });
  document.querySelectorAll("#main .chip[data-c]").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll("#main .chip[data-c]").forEach(x=>x.classList.remove("on")); ch.classList.add("on"); paint();
  }));
  $("#rq").addEventListener("input", paint);
  refreshCounts();
  paint();
}

/* ---------------- 全局搜索 ---------------- */
$("#q").addEventListener("input", e=>{
  const kw = e.target.value.trim().toLowerCase();
  if(!kw){ return; }
  const hit = (s) => String(s||"").toLowerCase().includes(kw);
  const out = [];
  DATA.items.forEach(i=>{ if(hit(i.item_code)||hit(i.name)||hit(i.category||"")) out.push(["item:"+i.item_code, `${i.item_code} ${i.name}`, "定额子目"]); });
  DATA.toc.forEach(t=>{ if(hit(t.raw_line)) out.push(["toc", t.raw_line.replace(/…+/g,"…"), "目录·"+(t.ref_print_page?("印"+t.ref_print_page):"")]); });
  DATA.sections.forEach(s=>{ if(hit(s.text)) out.push(["sec", `${s.section_id} ${(s.text||"").slice(0,50)}…`, s.block_type]); });
  main().innerHTML = `<div class="panel"><h2>搜索「${esc(kw)}」命中 ${out.length} 条</h2>` +
    out.slice(0,120).map(([id,txt,tag])=>`<div class="search-result" data-go="${esc(id)}">${esc(txt)}<span class="rt">${esc(tag)}</span></div>`).join("") +
    (out.length>120?`<div class="note">仅显示前 120 条…</div>`:"") + `</div>`;
  document.querySelectorAll(".search-result").forEach(el=>el.addEventListener("click",()=>{
    const go = el.dataset.go;
    if(go.startsWith("item:")) openItem(go.slice(5));
  }));
});

/* ---------------- 启动 ---------------- */
buildTree();
bindTree();
show("gs");
const first = document.querySelector('.tnode[data-id="gs"]');
first && first.classList.add("on");
refreshCounts();
</script>
</body>
