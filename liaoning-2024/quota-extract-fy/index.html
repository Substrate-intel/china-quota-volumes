ection":"ch00","no":null,"name":"说明","kind":"说明","content":"说明","phys_page":10,"print_page":3,"parent":null},{"id":"I002","section":"ch00","no":null,"name":"一、辽宁省建设工程计价依据《建设工程费用标准》（以下简称本费用标准）是国有投资或","kind":"说明","content":"一、辽宁省建设工程计价依据《建设工程费用标准》（以下简称本费用标准）是国有投资或国有投资为主的建设项目，编制工程量清单、招标控制价、施工图预算、工程竣工结算的依据；是评定投标报价合理性的依据；是调解处理工程造价争议和纠纷、审计和司法鉴定的依据；是编制投资估算指标、概算指标和概算定额的依据。非国有资金投资的建设工程可参照本定额相关规定执行。","phys_page":10,"print_page":3,"parent":null},{"id":"I003","section":"ch00","no":null,"name":"二、本费用标准与2024 年辽宁省《房屋建筑与装饰工程定额》、《装配式建筑工程定","kind":"说明","content":"二、本费用标准与2024 年辽宁省《房屋建筑与装饰工程定额》、《装配式建筑工程定额》、《绿色建筑工程定额》、《通用安装工程定额》、《市政工程定额》配套使用。","phys_page":10,"print_page":3,"parent":null},{"id":"I004","section":"ch00","no":null,"name":"三、2024 年辽宁省建设工程计价依据各专业工程定额的综合单价包括人工费、材料费","kind":"说明","content":"三、2024 年辽宁省建设工程计价依据各专业工程定额的综合单价包括人工费、材料费、机械费和综合费用，其中综合费用包括本费用标准中的企业管理费和利润。","phys_page":10,"print_page":3,"parent":null},{"id":"I005","section":"ch00","no":null,"name":"四、本费用标准中的各项费用均不包含增值税可抵扣进项税额。","kind":"说明","content":"四、本费用标准中的各项费用均不包含增值税可抵扣进项税额。","phys_page":10,"print_page":3,"parent":null},{"id":"I006","section":"ch00","no":null,"name":"五、本费用标准中的企业管理费、利润、文明施工和环境保护费、雨季施工费、冬季施工费","kind":"说明","content":"五、本费用标准中的企业管理费、利润、文明施工和环境保护费、雨季施工费、冬季施工费、市政工程施工干扰费均为社会平均水平的基础费率。投标人在投标报价或非招标工程在签订施工合同时，应考虑工程复杂程度、工程规模、工期要求、风险等因素确定费率。若合同中没有约定或约定不明确时，视为按本费用标准的基础费率执行。本费用标准中的企业管理费不包含检验试验费，依据《建设工程质量检测管理办法》（第57 号部令）规定，应由建设方委托检测机构开展。","phys_page":10,"print_page":3,"parent":null},{"id":"I007","section":"ch00","no":null,"name":"六、本费用标准中的安全施工费、规费为最低费率，投标人在投标报价时，或非招标工程签","kind":"说明","content":"六、本费用标准中的安全施工费、规费为最低费率，投标人在投标报价时，或非招标工程签订施工合同时，可根据工程实际和企业自身情况进行上浮，但规费不得高于国家及当地人社部门的相关规定。","phys_page":10,"print_page":3,"parent":null},{"id":"I008","section":"ch00","no":null,"name":"七、智慧工地费用分为智慧工地（安全施工部分）和智慧工地（文明施工和环境保护部分）","kind":"说明","content":"七、智慧工地费用分为智慧工地（安全施工部分）和智慧工地（文明施工和环境保护部分）,分别包含在安全施工费和文明施工和环境保护费中。","phys_page":11,"print_page":4,"parent":null},{"id":"I009","section":"ch00","no":null,"name":"八、在编制招标控制价时，按本费用标准中的招标控制价编制规定执行，但费率不得低于本","kind":"说明","content":"八、在编制招标控制价时，按本费用标准中的招标控制价编制规定执行，但费率不得低于本费用标准基础费率及最低费率。","phys_page":11,"print_page":4,"parent":null},{"id":"I010","section":"ch00","no":null,"name":"九、本费用标准不分企业级别与承包方式，均按本费用标准的相关规定计取相应费用。","kind":"说明","content":"九、本费用标准不分企业级别与承包方式，均按本费用标准的相关规定计取相应费用。","phys_page":11,"print_page":4,"parent":null},{"id":"I011","section":"ch00","no":null,"name":"十、工程量清单计价中的综合单价，是按本费用标准的“工程费用取费程序表”中的企业管","kind":"说明","content":"十、工程量清单计价中的综合单价，是按本费用标准的“工程费用取费程序表”中的企业管理费和利润计算方法并考虑风险组成的。","phys_page":11,"print_page":4,"parent":null},{"id":"I012","section":"ch00","no":null,"name":"十一、本费用标准中的“×××以上”，不包括×××本身;“×××以下”，包括×××","kind":"说明","content":"十一、本费用标准中的“×××以上”，不包括×××本身;“×××以下”，包括×××本身。","phys_page":11,"print_page":4,"parent":null},{"id":"I013","section":"p1","no":null,"name":"建设工程费用组成根据住房和城乡建设部、财政部《关于印发<建筑安装工程费用项目组成","kind":"条文","content":"建设工程费用组成根据住房和城乡建设部、财政部《关于印发<建筑安装工程费用项目组成>的通知》（建标〔2013〕44 号）、住建部《关于做好建筑业营改增建设工程计价依据调整准备工作的通知》（建办标〔2016〕4 号）、财政部和国家税务总局《关于全面推开营业税改征增值税试点的通知》（财税〔2016〕36 号）、财政部、应急部发布了《关于印发＜企业安全生产费用提取和使用管理办法＞的通知》（财资〔2022〕136 号）、《建设工程质量检测管理办法》（第57 号部令），结合我省实际情况，确定建设工程费用项目组成如下：","phys_page":12,"print_page":5,"parent":null},{"id":"I014","section":"p1","no":null,"name":"一、建设工程费用由分部分项工程费、措施项目费、其他项目费、规费、税金组成。分部分","kind":"条文","content":"一、建设工程费用由分部分项工程费、措施项目费、其他项目费、规费、税金组成。分部分项工程费、措施项目费、其他项目费包含人工费、材料费、施工机具使用费、企业管理费和利润。各项费用组成均不含可抵扣进项税额。","phys_page":12,"print_page":5,"parent":null},{"id":"I015","section":"p1","no":null,"name":"（一）分部分项工程费：是指各专业工程的分部分项工程应予列支的各项费用。","kind":"条文","content":"（一）分部分项工程费：是指各专业工程的分部分项工程应予列支的各项费用。","phys_page":12,"print_page":5,"parent":null},{"id":"I016","section":"p1","no":null,"name":"1.专业工程：是指按现行国家计量规范划分的房屋建筑与装饰工程、通用安装工程、市政","kind":"条文","content":"1.专业工程：是指按现行国家计量规范划分的房屋建筑与装饰工程、通用安装工程、市政工程等各类工程。","phys_page":12,"print_page":5,"parent":null},{"id":"I017","section":"p1","no":null,"name":"2.分部分项工程：指按现行国家计量规范对各专业工程划分的项目。如房屋建筑与装饰工","kind":"条文","content":"2.分部分项工程：指按现行国家计量规范对各专业工程划分的项目。如房屋建筑与装饰工程划分的土石方工程、地基处理与边坡支护工程、桩基工程、砌筑工程等。","phys_page":12,"print_page":5,"parent":null},{"id":"I018","section":"p1","no":null,"name":"（二）措施项目费：是指为完成建设工程施工，发生于该工程施工前和施工过程中的技术、","kind":"条文","content":"（二）措施项目费：是指为完成建设工程施工，发生于该工程施工前和施工过程中的技术、生活、安全、环境保护等方面的费用。内容包括：","phys_page":12,"print_page":5,"parent":null},{"id":"I019","section":"p1","no":null,"name":"1.技术措施费：是指工程定额中规定的，在施工过程中耗费的非工程实体可以计量的措施","kind":"条文","content":"1.技术措施费：是指工程定额中规定的，在施工过程中耗费的非工程实体可以计量的措施项目，计入分部分项工程费。内容包括：（1）大型机械设备进出场及安拆费：是指工程定额中列项的大型机械设备进出场及安拆费；（2）混凝土模板及支架费：是指混凝土施工过程中需要的各种模板、支架等的安、拆、运输、使用摊销费用；（3）脚手架费：是指施工需要的各种脚手架搭、拆、运输、使用摊销费用；（4）垂直运输费；（5）施工排水及井点降水；（6）临时设施费：是指施工企业为进行建设工程施工所必须搭设的生活和生产用的临时建筑物、构筑物和其他临时设施费用。包括地面硬覆盖、临时围挡、大门、临时建筑、临时管线安装等临时设施的搭设、维修、拆除、清理费或摊销费等；（7）其他项目。","phys_page":13,"print_page":6,"parent":null},{"id":"I020","section":"p1","no":null,"name":"2.一般措施项目：是指为完成工程项目施工，发生于该工程施工前和施工过程中的非工程","kind":"条文","content":"2.一般措施项目：是指为完成工程项目施工，发生于该工程施工前和施工过程中的非工程实体，不可计量，且不包含在工程定额所列的措施项目中的措施项目，一般工程均有发生的。内容包括：（1）安全施工费：是指施工现场安全施工所需要的各项费用。依据《关于印发＜企业安全生产费用提取和使用管理办法＞的通知》（财资〔2022〕136 号），建设工程施工企业安全费用应当按照以下范围使用：①完善、改造和维护安全防护设施设备支出（不含“三同时”要求初期投入的安全设施），包括施工现场临时用电系统、洞口或临边防护、高处作业或交叉作业防护、临时安全防护、支护及防治边坡滑坡、工程有害气体监测和通风、保障安全的机械设备、防火、防爆、防触电、防尘、防毒、防雷、防台风、防地质灾害等设施设备支出；②应急救援技术装备、设施配置及维护保养支出，事故逃生和紧急避难设施设备的配置和应急救援队伍建设、应急预案制修订与应急演练支出；③开展施工现场重大危险源检测、评估、监控支出，安全风险分级管控和事故隐患排查整改支出，工程项目安全生产信息化建设、运维和网络安全支出；④安全生产检查、评估评价（不含新建、改建、扩建项目安全评价）、咨询和标准化建设支出；⑤配备和更新现场作业人员安全防护用品支出；⑥安全生产宣传、教育、培训和从业人员发现并报告事故隐患的奖励支出；⑦安全生产适用的新技术、新标准、新工艺、新装备的推广应用支出；⑧安全设施及特种设备检测检验、检定校准支出；⑨安全生产责任保险支出；⑩与安全生产直接相关的其他支出。其中，智慧工地费用（安全施工费部分）包括：视频安全监控、AI视频安全监控、安全检查记录仪、塔机安全运行监测、吊钩安全可视化、升降机安全运行监测、卸料平台安全监测的安拆和使用费。（2）文明施工和环境保护费：是指施工现场文明施工所需要的各项费用和在施工过程中采取的环境保护措施费用。其中，智慧工地费用（文明施工和环境保护部分）包括：环境监测、喷淋联动、大型车辆冲洗平台、水电监控的安拆和使用费。（3）雨季施工费：是指在雨季施工需增加的临时设施、防滑、排除雨水，人工及施工机械效率降低等费用。","phys_page":13,"print_page":6,"parent":null},{"id":"I021","section":"p1","no":null,"name":"3.其他措施项目：是指为完成工程项目施工，发生于该工程施工前和施工过程中的非工程","kind":"条文","content":"3.其他措施项目：是指为完成工程项目施工，发生于该工程施工前和施工过程中的非工程实体，不可计量，且不包含在工程定额所列的措施项目中的措施项目，仅特定工程或特殊条件下发生。内容包括：（1）夜间施工增加费：是指因夜间施工所发生的夜班补助费、夜间施工降效、夜间施工照明设备摊销及照明用电等费用。（2）二次搬运费：是指因施工场地条件限制而发生的材料、构配件、半成品等一次运输不能到达堆放地点，必须进行二次或多次搬运所发生的费用。（3）冬季施工费：是指在冬季施工（连续5 天平均气温在5℃以下环境）需增加的临时设施（不包含暖棚法施工所采用的措施）、防滑、除雪，人工及施工机械效率降低以及水砂石加热、混凝土保温覆盖发生的费用。（4）已完工程及设备保护费：是指竣工验收前，对已完工程及设备采取的必要保护措施所发生的费用。（5）市政工程施工干扰费：市政工程施工中发生的边施工边维护交通及车辆、行人干扰等所发生的防护和保护措施费。","phys_page":15,"print_page":8,"parent":null},{"id":"I022","section":"p1-s01","no":null,"name":"1.暂列金额：是指建设单位在工程量清单中暂定并包括在工程合同价款中的一笔款项。用","kind":"条文","content":"1.暂列金额：是指建设单位在工程量清单中暂定并包括在工程合同价款中的一笔款项。用于施工合同签订时尚未确定或者不可预见的所需材料、工程设备、服务的采购，施工中可能发生的工程变更、合同约定调整因素出现时的工程价款调整以及发生的索赔、现场签证确认等的费用。","phys_page":15,"print_page":8,"parent":null},{"id":"I023","section":"p1-s01","no":null,"name":"2.计日工：是指在施工过程中，施工企业完成建设单位提出的施工图纸以外的零星项目或","kind":"条文","content":"2.计日工：是指在施工过程中，施工企业完成建设单位提出的施工图纸以外的零星项目或工作所需的费用。","phys_page":15,"print_page":8,"parent":null},{"id":"I024","section":"p1-s01","no":null,"name":"3.总承包服务费：是指总承包人为配合、协调建设单位进行的专业工程发包，对建设单位","kind":"条文","content":"3.总承包服务费：是指总承包人为配合、协调建设单位进行的专业工程发包，对建设单位自行采购的材料、工程设备等进行保管以及施工现场管理、竣工资料汇总整理等服务所需的费用。","phys_page":16,"print_page":9,"parent":null},{"id":"I025","section":"p1-s01","no":null,"name":"4.其他未列项目，如暂估价等。","kind":"条文","content":"4.其他未列项目，如暂估价等。","phys_page":16,"print_page":9,"parent":null},{"id":"I026","section":"p1-s02","no":null,"name":"是指按国家法律、法规规定，由政府和有关权力部门规定必须交纳或计取的费用。包括：","kind":"条文","content":"是指按国家法律、法规规定，由政府和有关权力部门规定必须交纳或计取的费用。包括：","phys_page":16,"print_page":9,"parent":null},{"id":"I027","section":"p1-s03","no":null,"name":"（1）养老保险费：是指企业按照规定标准为职工缴纳的基本养老保险费。（2）失业保险","kind":"条文","content":"（1）养老保险费：是指企业按照规定标准为职工缴纳的基本养老保险费。（2）失业保险费：是指企业按照规定标准为职工缴纳的失业保险费。（3）医疗保险费：是指企业按照规定标准为职工缴纳的基本医疗保险费。（4）生育保险费：是指企业按照规定标准为职工缴纳的生育保险费。（5）工伤保险费：是指企业按照规定标准为职工缴纳的工伤保险费。","phys_page":16,"print_page":9,"parent":null},{"id":"I028","section":"p1-s03","no":null,"name":"2.住房公积金：是指企业按规定标准为职工缴纳的住房公积金。","kind":"条文","content":"2.住房公积金：是指企业按规定标准为职工缴纳的住房公积金。","phys_page":16,"print_page":9,"parent":null},{"id":"I029","section":"p1-s03","no":null,"name":"3.其他应列而未列入的费用，按实际发生计取。","kind":"条文","content":"3.其他应列而未列入的费用，按实际发生计取。","phys_page":16,"print_page":9,"parent":null},{"id":"I030","section":"p1-s04","no":null,"name":"是指国家税法规定的应计入建筑安装工程造价内的增值税销项税额。","kind":"条文","content":"是指国家税法规定的应计入建筑安装工程造价内的增值税销项税额。","phys_page":16,"print_page":9,"parent":null},{"id":"I031","section":"p1-s04","no":null,"name":"二、建设工程费用中分部分项工程费、措施项目费、其他项目费包括：","kind":"条文","content":"二、建设工程费用中分部分项工程费、措施项目费、其他项目费包括：","phys_page":16,"print_page":9,"parent":null},{"id":"I032","section":"p1-s04","no":null,"name":"（一）人工费：是指按工资总额构成规定，支付给从事建筑安装工程施工的生产工人和附属","kind":"条文","content":"（一）人工费：是指按工资总额构成规定，支付给从事建筑安装工程施工的生产工人和附属生产单位工人的各项费用。内容包括：","phys_page":16,"print_page":9,"parent":null},{"id":"I033","section":"p1-s04","no":null,"name":"1.计时工资或计件工资：是指按计时工资标准和工作时间或对已做工作按计件单价支付给","kind":"条文","content":"1.计时工资或计件工资：是指按计时工资标准和工作时间或对已做工作按计件单价支付给个人的劳动报酬。","phys_page":16,"print_page":9,"parent":null},{"id":"I034","section":"p1-s04","no":null,"name":"2.奖金：是指对超额劳动和增收节支支付给个人的劳动报酬。如节约奖、劳动竞赛奖等。","kind":"条文","content":"2.奖金：是指对超额劳动和增收节支支付给个人的劳动报酬。如节约奖、劳动竞赛奖等。","phys_page":17,"print_page":10,"parent":null},{"id":"I035","section":"p1-s04","no":null,"name":"3.津贴补贴：是指为了补偿职工特殊或额外的劳动消耗和因其他特殊原因支付给个人的津","kind":"条文","content":"3.津贴补贴：是指为了补偿职工特殊或额外的劳动消耗和因其他特殊原因支付给个人的津贴，以及为了保证职工工资水平不受物价影响支付给个人的物价补贴。如流动施工津贴、特殊地区施工津贴、高温（寒）作业临时津贴、高空津贴等。","phys_page":17,"print_page":10,"parent":null},{"id":"I036","section":"p1-s04","no":null,"name":"4.加班加点工资：是指按规定支付的在法定节假日工作的加班工资和在法定日工作时间外","kind":"条文","content":"4.加班加点工资：是指按规定支付的在法定节假日工作的加班工资和在法定日工作时间外延时工作的加点工资。","phys_page":17,"print_page":10,"parent":null},{"id":"I037","section":"p1-s04","no":null,"name":"5.特殊情况下支付的工资：是指根据国家法律、法规和政策规定，因病、工伤、产假、计","kind":"条文","content":"5.特殊情况下支付的工资：是指根据国家法律、法规和政策规定，因病、工伤、产假、计划生育假、婚丧假、事假、探亲假、定期休假、停工学习、执行国家或社会义务等原因按计时工资标准或计时工资标准的一定比例支付的工资。","phys_page":17,"print_page":10,"parent":null},{"id":"I038","section":"p1-s04","no":null,"name":"（二）材料费：是指施工过程中耗费的原材料、辅助材料、构配件、零件、半成品或成品、","kind":"条文","content":"（二）材料费：是指施工过程中耗费的原材料、辅助材料、构配件、零件、半成品或成品、工程设备的费用，内容包括：","phys_page":17,"print_page":10,"parent":null},{"id":"I039","section":"p1-s04","no":null,"name":"1.材料原价：是指材料、工程设备的出厂价格或商家供应价格，不包含增值税可抵扣进项","kind":"条文","content":"1.材料原价：是指材料、工程设备的出厂价格或商家供应价格，不包含增值税可抵扣进项税额。","phys_page":17,"print_page":10,"parent":null},{"id":"I040","section":"p1-s04","no":null,"name":"2.运杂费：是指材料、工程设备自来源地运至工地仓库或指定堆放地点所发生的全部费用","kind":"条文","content":"2.运杂费：是指材料、工程设备自来源地运至工地仓库或指定堆放地点所发生的全部费用。","phys_page":17,"print_page":10,"parent":null},{"id":"I041","section":"p1-s04","no":null,"name":"3.运输损耗费：是指材料在运输装卸过程中不可避免的损耗。","kind":"条文","content":"3.运输损耗费：是指材料在运输装卸过程中不可避免的损耗。","phys_page":17,"print_page":10,"parent":null},{"id":"I042","section":"p1-s04","no":null,"name":"4.采购及保管费：是指为组织采购、供应和保管材料、工程设备的过程中所需要的各项费","kind":"条文","content":"4.采购及保管费：是指为组织采购、供应和保管材料、工程设备的过程中所需要的各项费用。包括采购费、仓储费、工地保管费、仓储损耗。工程设备是指构成或计划构成永久工程一部分的机电设备、金属结构设备、仪器装置及其他类似的设备和装置。","phys_page":17,"print_page":10,"parent":null},{"id":"I043","section":"p1-s04","no":null,"name":"（三）施工机具使用费：是指施工作业所发生的施工机械、仪器仪表使用费。","kind":"条文","content":"（三）施工机具使用费：是指施工作业所发生的施工机械、仪器仪表使用费。","phys_page":18,"print_page":11,"parent":null},{"id":"I044","section":"p1-s04","no":null,"name":"1.施工机械使用费：以施工机械台班耗用量乘以施工机械台班单价表示，施工机械台班单","kind":"条文","content":"1.施工机械使用费：以施工机械台班耗用量乘以施工机械台班单价表示，施工机械台班单价应由下列七项费用组成：（1）折旧费：指施工机械在规定的使用年限内，陆续收回其原值的费用。（2）大修理费：指施工机械按规定的大修理间隔台班进行必要的大修理，以恢复其正常功能所需的费用。（3）经常修理费：指施工机械除大修理以外的各级保养和临时故障排除所需的费用。包括为保障机械正常运转所需替换设备与随机配备工具附具的摊销和维护费用，机械运转中日常保养所需润滑与擦拭的材料费用及机械停滞期间的维护和保养费用等。（4）安拆费及场外运费：安拆费指施工机械（大型机械除外）在现场进行安装与拆卸所需的人工、材料、机械和试运转费用以及机械辅助设施的折旧、搭设、拆除等费用；场外运费指施工机械整体或分体自停放地点运至施工现场或由一施工地点运至另一施工地点的运输、装卸、辅助材料及架线等费用。（5）人工费：指机上司机（司炉）和其他操作人员的人工费。（6）燃料动力费：指施工机械在运转作业中所消耗的各种燃料及水、电等。（7）税费：指施工机械按照国家规定应缴纳的车船使用税、保险费及年检费等。","phys_page":18,"print_page":11,"parent":null},{"id":"I045","section":"p1-s04","no":null,"name":"2.仪器仪表使用费：是指工程施工所需使用的仪器仪表的摊销及维修费用。","kind":"条文","content":"2.仪器仪表使用费：是指工程施工所需使用的仪器仪表的摊销及维修费用。","phys_page":18,"print_page":11,"parent":null},{"id":"I046","section":"p1-s04","no":null,"name":"（四）企业管理费：是指建筑安装企业组织施工生产和经营管理所需的费用。内容包括：","kind":"条文","content":"（四）企业管理费：是指建筑安装企业组织施工生产和经营管理所需的费用。内容包括：","phys_page":19,"print_page":12,"parent":null},{"id":"I047","section":"p1-s04","no":null,"name":"1.管理人员工资:是指按规定支付给管理人员的计时工资、奖金、津贴补贴、加班加点工","kind":"条文","content":"1.管理人员工资:是指按规定支付给管理人员的计时工资、奖金、津贴补贴、加班加点工资及特殊情况下支付的工资等。","phys_page":19,"print_page":12,"parent":null},{"id":"I048","section":"p1-s04","no":null,"name":"2.办公费：是指企业管理办公用的文具、纸张、帐表、印刷、邮电、书报、办公软件、现","kind":"条文","content":"2.办公费：是指企业管理办公用的文具、纸张、帐表、印刷、邮电、书报、办公软件、现场监控、会议、水电（包含施工现场生活用水用电）、烧水和集体取暖降温（包括现场临时宿舍取暖降温）等费用。","phys_page":19,"print_page":12,"parent":null},{"id":"I049","section":"p1-s04","no":null,"name":"3.差旅交通费：是指职工因公出差、调动工作的差旅费、住勤补助费，市内交通费和误餐","kind":"条文","content":"3.差旅交通费：是指职工因公出差、调动工作的差旅费、住勤补助费，市内交通费和误餐补助费，职工探亲路费，劳动力招募费，职工退休、退职一次性路费，工伤人员就医路费，工地转移费以及管理部门使用的交通工具的油料、燃料等费用。","phys_page":19,"print_page":12,"parent":null},{"id":"I050","section":"p1-s04","no":null,"name":"4.固定资产使用费：是指管理和试验部门及附属生产单位使用的属于固定资产的房屋、设","kind":"条文","content":"4.固定资产使用费：是指管理和试验部门及附属生产单位使用的属于固定资产的房屋、设备、仪器等的折旧、大修、维修或租赁费。","phys_page":19,"print_page":12,"parent":null},{"id":"I051","section":"p1-s04","no":null,"name":"5.工具用具使用费：是指企业施工生产和管理使用的不属于固定资产的工具、器具、家具","kind":"条文","content":"5.工具用具使用费：是指企业施工生产和管理使用的不属于固定资产的工具、器具、家具、交通工具和检验、试验、测绘、消防用具等的购置、维修和摊销费。","phys_page":19,"print_page":12,"parent":null},{"id":"I052","section":"p1-s04","no":null,"name":"6.劳动保险和职工福利费：是指由企业支付的职工退职金、按规定支付给离休干部的经费","kind":"条文","content":"6.劳动保险和职工福利费：是指由企业支付的职工退职金、按规定支付给离休干部的经费，集体福利费、夏季防暑降温、冬季取暖补贴、上下班交通补贴等。","phys_page":19,"print_page":12,"parent":null},{"id":"I053","section":"p1-s04","no":null,"name":"7.劳动保护费：是企业按规定发放的劳动保护用品的支出。如工作服、手套、防暑降温饮","kind":"条文","content":"7.劳动保护费：是企业按规定发放的劳动保护用品的支出。如工作服、手套、防暑降温饮料以及在有碍身体健康的环境中施工的保健费用等。","phys_page":19,"print_page":12,"parent":null},{"id":"I054","section":"p1-s04","no":null,"name":"8.工会经费：是指企业按《工会法》规定的全部职工工资总额比例计提的工会经费。","kind":"条文","content":"8.工会经费：是指企业按《工会法》规定的全部职工工资总额比例计提的工会经费。","phys_page":19,"print_page":12,"parent":null},{"id":"I055","section":"p1-s04","no":null,"name":"9.职工教育经费：是指按职工工资总额的规定比例计提，企业为职工进行专业技术和职业","kind":"条文","content":"9.职工教育经费：是指按职工工资总额的规定比例计提，企业为职工进行专业技术和职业技能培训，专业技术人员继续教育、职工职业技能鉴定、职业资格认定以及根据需要对职工进行各类文化教育所发生的费用。","phys_page":19,"print_page":12,"parent":null},{"id":"I056","section":"p1-s04","no":null,"name":"10.财产保险费：是指施工管理用财产、车辆等的保险费用。","kind":"条文","content":"10.财产保险费：是指施工管理用财产、车辆等的保险费用。","phys_page":20,"print_page":13,"parent":null},{"id":"I057","section":"p1-s04","no":null,"name":"11.财务费：是指企业为施工生产筹集资金或提供预付款担保、履约担保、职工工资支付","kind":"条文","content":"11.财务费：是指企业为施工生产筹集资金或提供预付款担保、履约担保、职工工资支付担保等所发生的各种费用。","phys_page":20,"print_page":13,"parent":null},{"id":"I058","section":"p1-s04","no":null,"name":"12.税金：是指企业按规定缴纳的房产税、车船使用税、土地使用税、印花税等。","kind":"条文","content":"12.税金：是指企业按规定缴纳的房产税、车船使用税、土地使用税、印花税等。","phys_page":20,"print_page":13,"parent":null},{"id":"I059","section":"p1-s04","no":null,"name":"13.工程项目附加税费：是指国家税法规定的应计入建筑安装工程造价内的城市维护建设","kind":"条文","content":"13.工程项目附加税费：是指国家税法规定的应计入建筑安装工程造价内的城市维护建设税、教育费附加、地方教育附加。","phys_page":20,"print_page":13,"parent":null},{"id":"I060","section":"p1-s04","no":null,"name":"14.工程定位复测费：是指工程施工过程中进行全部施工测量放线和复测工作的费用。","kind":"条文","content":"14.工程定位复测费：是指工程施工过程中进行全部施工测量放线和复测工作的费用。","phys_page":20,"print_page":13,"parent":null},{"id":"I061","section":"p1-s04","no":null,"name":"15.其他：包括技术转让费、技术开发费、投标费、业务招待费、广告费、公证费、法律","kind":"条文","content":"15.其他：包括技术转让费、技术开发费、投标费、业务招待费、广告费、公证费、法律顾问费、审计费、咨询费、保险费等。","phys_page":20,"print_page":13,"parent":null},{"id":"I062","section":"p1-s04","no":null,"name":"（五）利润：是指施工企业完成所承包工程获得的盈利。","kind":"条文","content":"（五）利润：是指施工企业完成所承包工程获得的盈利。","phys_page":20,"print_page":13,"parent":null},{"id":"I063","section":"p2","no":null,"name":"各项费用费率","kind":"条文","content":"各项费用费率","phys_page":22,"print_page":15,"parent":null},{"id":"I064","section":"p2","no":null,"name":"一、费用计取规则：本费用标准各项费用（安全施工费、规费除外）费率均为社会平均水平","kind":"条文","content":"一、费用计取规则：本费用标准各项费用（安全施工费、规费除外）费率均为社会平均水平的基础费率。投标人在投标报价或承包人在非招标工程签订施工合同时，应考虑工程复杂程度、工程规模、工期要求、风险等因素确定费率。本费用标准各项费用（安全施工费除外）均以各专业工程定额分部分项工程费中的人工费与机械费之和为计费基数，其中部分专业的项目人工费与机械费之和的35%为计费基数，详见各项费用费率。","phys_page":22,"print_page":15,"parent":null},{"id":"I065","section":"p2-s02","no":null,"name":"1.安全施工费：以建筑安装工程不含本项费用的税前造价为取费基数。房屋建筑工程为3","kind":"条文","content":"1.安全施工费：以建筑安装工程不含本项费用的税前造价为取费基数。房屋建筑工程为3.27%；机电安装工程为2.18%；市政公用工程为","phys_page":22,"print_page":15,"parent":null},{"id":"I066","section":"p2-s02","no":null,"name":"1.71%。其中，智慧工地费用（安全施工费部分）区分工程规模，房屋建筑工程按不含","kind":"条文","content":"1.71%。其中，智慧工地费用（安全施工费部分）区分工程规模，房屋建筑工程按不含本项费用的税前造价为取费基数，以0.2%-0.3%计取；市政公用工程按不含本项费用的税前造价为取费基数，以0.1%-0.15%计取。","phys_page":22,"print_page":15,"parent":null},{"id":"I067","section":"p2-s02","no":null,"name":"2.文明施工和环境保护费，按下表所示取费基数和费率计算：","kind":"条文","content":"2.文明施工和环境保护费，按下表所示取费基数和费率计算：","phys_page":23,"print_page":16,"parent":null},{"id":"I068","section":"p2-s02","no":null,"name":"其中，智慧工地费用（文明施工和环境保护费部分）区分工程规模，房屋建筑工程按人工费","kind":"条文","content":"其中，智慧工地费用（文明施工和环境保护费部分）区分工程规模，房屋建筑工程按人工费与机械费之和（部分专业人工费与机械费之和的35%）为计费基数，以0.14%-0.17%计取；市政公用工程按人工费与机械费之和（部分专业人工费与机械费之和的35%）为计费基数，以0.11%-0.15%计取。","phys_page":23,"print_page":16,"parent":null},{"id":"I069","section":"p2-s02","no":null,"name":"3.雨季施工费：雨季施工费工程量为工程项目全部工程量，全年计取。按下表所示取费基","kind":"条文","content":"3.雨季施工费：雨季施工费工程量为工程项目全部工程量，全年计取。按下表所示取费基数和费率计算：","phys_page":23,"print_page":16,"parent":null},{"id":"I070","section":"p2-s03","no":null,"name":"1.夜间施工增加费和白天施工需要照明费按下表计算：单位：元/工日","kind":"条文","content":"1.夜间施工增加费和白天施工需要照明费按下表计算：单位：元/工日","phys_page":24,"print_page":17,"parent":null},{"id":"I071","section":"p2-s04","no":null,"name":"按批准的施工组织设计或签证计算。","kind":"条文","content":"按批准的施工组织设计或签证计算。","phys_page":24,"print_page":17,"parent":null},{"id":"I072","section":"p2-s05","no":null,"name":"冬季施工工程量，为达到冬季施工标准（气候学上，平均气温连续5天低于5℃）所发生的","kind":"条文","content":"冬季施工工程量，为达到冬季施工标准（气候学上，平均气温连续5天低于5℃）所发生的工程量，按下表所示取费基数和费率计算：","phys_page":25,"print_page":18,"parent":null},{"id":"I073","section":"p2-s06","no":null,"name":"按批准的施工组织设计或签证计算。","kind":"条文","content":"按批准的施工组织设计或签证计算。","phys_page":25,"print_page":18,"parent":null},{"id":"I074","section":"p2-s06","no":null,"name":"5.市政工程（含园林绿化工程）施工干扰费，仅对符合发生市政工程干扰情形的工程项目","kind":"条文","content":"5.市政工程（含园林绿化工程）施工干扰费，仅对符合发生市政工程干扰情形的工程项目或项目的一部分，按对应工程量，基础费率为4%，计取该项费用。","phys_page":25,"print_page":18,"parent":null},{"id":"I075","section":"p2-s11","no":null,"name":"企业管理费按下表所示取费基数和费率计算：","kind":"条文","content":"企业管理费按下表所示取费基数和费率计算：","phys_page":26,"print_page":19,"parent":null},{"id":"I076","section":"p2-s12","no":null,"name":"按下表所示取费基数和费率计算：","kind":"条文","content":"按下表所示取费基数和费率计算：","phys_page":27,"print_page":20,"parent":null},{"id":"I077","section":"p2-s13","no":null,"name":"本费用标准中的规费，为最低费率，投标人在投标报价时，可根据企业自身情况进行上浮，","kind":"条文","content":"本费用标准中的规费，为最低费率，投标人在投标报价时，可根据企业自身情况进行上浮，但不得高于当地人社部门和其他有权部门的规定。最低费率为1.65%，其中仅包含社会保险费，其他项目按各市规定执行。","phys_page":27,"print_page":20,"parent":null},{"id":"I078","section":"p2-s14","no":null,"name":"按《中华人民共和国税法》、财政部和国家税务总局《关于全面推开营业税改征增值税试点","kind":"条文","content":"按《中华人民共和国税法》、财政部和国家税务总局《关于全面推开营业税改征增值税试点的通知》（财税〔2016〕36 号）、财政部税务总局海关总署公告2019 年第39 号等相关规定执行。","phys_page":28,"print_page":21,"parent":null},{"id":"I079","section":"p3","no":null,"name":"招标控制价编制","kind":"条文","content":"招标控制价编制","phys_page":32,"print_page":25,"parent":null},{"id":"I080","section":"p3","no":null,"name":"一、费用计取规则：本招标控制价编制费率标准为建议费率，招标控制价编制人应根据实际","kind":"条文","content":"一、费用计取规则：本招标控制价编制费率标准为建议费率，招标控制价编制人应根据实际工程复杂程度、工程规模、工期要求、风险等因素自行确定费率，但不得低于本费用标准的基础费率及最低费率。各专业工程以工程定额分部分项工程费中的人工费与机械费之和为计费基数，其中部分专业的项目人工费与机械费之和的35%为计费基数，详见各项费用费率。","phys_page":32,"print_page":25,"parent":null},{"id":"I081","section":"p3-s02","no":null,"name":"1.安全施工费：以建筑安装工程不含本项费用的税前造价为取费基数。房屋建筑工程为3","kind":"条文","content":"1.安全施工费：以建筑安装工程不含本项费用的税前造价为取费基数。房屋建筑工程为3.27%；机电安装工程为2.18%；市政公用工程为","phys_page":32,"print_page":25,"parent":null},{"id":"I082","section":"p3-s02","no":null,"name":"1.71%。其中，智慧工地费用（安全施工费部分）区分工程规模，房屋建筑工程按不含","kind":"条文","content":"1.71%。其中，智慧工地费用（安全施工费部分）区分工程规模，房屋建筑工程按不含本项费用的税前造价为取费基数，以0.2%-0.3%计取；市政公用工程按不含本项费用的税前造价为取费基数，以0.1%-0.15%计取。","phys_page":32,"print_page":25,"parent":null},{"id":"I083","section":"p3-s02","no":null,"name":"2.文明施工和环境保护费，按下表所示取费基数和费率计算：","kind":"条文","content":"2.文明施工和环境保护费，按下表所示取费基数和费率计算：","phys_page":33,"print_page":26,"parent":null},{"id":"I084","section":"p3-s02","no":null,"name":"其中，智慧工地费用（文明施工和环境保护费部分）区分工程规模，房屋建筑工程按人工费","kind":"条文","content":"其中，智慧工地费用（文明施工和环境保护费部分）区分工程规模，房屋建筑工程按人工费与机械费之和（部分专业人工费与机械费之和的35%）为计费基数，以0.18%-0.22%计取；市政公用工程按人工费与机械费之和（部分专业人工费与机械费之和的35%）为计费基数，以0.14%-0.20%计取。","phys_page":33,"print_page":26,"parent":null},{"id":"I085","section":"p3-s02","no":null,"name":"3.雨季施工费：雨季施工费工程量为全部工程量，按下表所示取费基数和费率计算：","kind":"条文","content":"3.雨季施工费：雨季施工费工程量为全部工程量，按下表所示取费基数和费率计算：","phys_page":33,"print_page":26,"parent":null},{"id":"I086","section":"p3-s03","no":null,"name":"1.夜间施工增加费和白天施工需要照明费按下表计算：单位：元/工日","kind":"条文","content":"1.夜间施工增加费和白天施工需要照明费按下表计算：单位：元/工日","phys_page":34,"print_page":27,"parent":null},{"id":"I087","section":"p3-s04","no":null,"name":"按批准的施工组织设计或签证计算。","kind":"条文","content":"按批准的施工组织设计或签证计算。","phys_page":34,"print_page":27,"parent":null},{"id":"I088","section":"p3-s05","no":null,"name":"冬季施工工程量，为达到冬季标准（气候学上，平均气温连续5 天低于5℃）所发生的工","kind":"条文","content":"冬季施工工程量，为达到冬季标准（气候学上，平均气温连续5 天低于5℃）所发生的工程量，按下表所示取费基数和费率计算：","phys_page":35,"print_page":28,"parent":null},{"id":"I089","section":"p3-s06","no":null,"name":"按正常施工情况，由编制人自行确定。","kind":"条文","content":"按正常施工情况，由编制人自行确定。","phys_page":35,"print_page":28,"parent":null},{"id":"I090","section":"p3-s06","no":null,"name":"5.市政工程施工干扰费（仅对符合发生市政工程干扰情形的工程项目或项目的一部分，方","kind":"条文","content":"5.市政工程施工干扰费（仅对符合发生市政工程干扰情形的工程项目或项目的一部分，方可计取该项费用），按费率4%计算。","phys_page":35,"print_page":28,"parent":null},{"id":"I091","section":"p3-s11","no":null,"name":"企业管理费按下表所示取费基数和费率计算：","kind":"条文","content":"企业管理费按下表所示取费基数和费率计算：","phys_page":36,"print_page":29,"parent":null},{"id":"I092","section":"p3-s12","no":null,"name":"按下表所示取费基数和费率计算：","kind":"条文","content":"按下表所示取费基数和费率计算：","phys_page":37,"print_ <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 头部 ---------- */
$('#bk-title').textContent = D.book.title;
const ch = [];
ch.push(['卷键', D.book.volume_key]);
ch.push(['地区', D.book.region]);
ch.push(['年份', D.book.year + ' 版']);
ch.push(['页数', D.book.pages]);
ch.push(['源 PDF 指纹', D.inputs.source_sha12]);
ch.push(['解读 docx 指纹', D.inputs.docx_sha12]);
ch.push(['结构', D.sections.length + ' 节 / ' + D.items.length + ' 条目 / ' +
  D.tables.length + ' 表']);
ch.push(['TOC 对账', D.toc.filter(t=>t.ok).length + '/' + D.toc.length, 'ok']);
if (D.erratas.length) ch.push(['勘误 overlay', D.erratas.length + ' 条', 'ok']);
$('#bk-chips').innerHTML = ch.map(c =>
  `<span class="chip${c[2]==='gray'?' gray':''}${c[2]==='warn'?' warn':''}">${esc(c[0])} ${esc(c[1])}</span>`).join('');

/* ---------- 树 ---------- */
const secById = {}; D.sections.forEach(s => secById[s.id] = s);
const itemsBySec = {};
D.items.forEach(it => { (itemsBySec[it.section] = itemsBySec[it.section] || []).push(it); });
const FRONT_ORDER = [];
const CH_ORDER = ['ch01','ch01-sec1','ch01-sec2','ch02','ch03'];
const secOrder = [...FRONT_ORDER.filter(id=>secById[id]), ...CH_ORDER.filter(id=>secById[id]),
  ...D.sections.map(s=>s.id).filter(id=>!FRONT_ORDER.includes(id)&&!CH_ORDER.includes(id))];

const tree = $('#tree');
let html = '';
secOrder.forEach(sid => {
  const s = secById[sid];
  const grp = s.level === 1 ? '第' + (s.no || '') + '部分' : s.level === 2 ? (s.no || '') + s.title : s.title;
  html += `<div class="grp">${esc(grp)}${s.print_page!=null?` <span style="font-family:var(--mono);font-weight:400">P${s.print_page}</span>`:''}</div>`;
  (itemsBySec[sid]||[]).forEach(it => {
    html += `<div class="it${it.parent?' sub':''}" data-id="${it.id}">` +
      `<span class="no">${esc(it.no||'')}</span><span>${esc(it.name.slice(0,26))}</span>` +
      `<span class="pg">${it.print_page!=null?'P'+it.print_page:''}</span></div>`;
  });
});
tree.innerHTML = html || '<div class="empty">无条目</div>';

/* ---------- 视图 ---------- */
const views = { 结构: renderTree, 表格: renderTables, 注文: renderNotes,
  目录对账: renderToc, 勘误表: renderErratas, 说明: renderAbout };
let curView = '结构', curId = null;
const nav = $('#nav');
nav.innerHTML = Object.keys(views).map(k =>
  `<button data-v="${k}"${k===curView?' class="on"':''}>${k}</button>`).join('');
nav.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curView = b.dataset.v;
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  views[curView]();
});
tree.addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  curId = it.dataset.id; curView = '结构';
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === '结构'));
  renderTree();
});

function itemCard(it) {
  const atts = D.items.filter(x => x.parent === it.id);
  let h = `<div class="card" id="it-${it.id}"><h2>${esc(it.name)}` +
    `<span class="kd item">` +
    `${esc(it.kind||'条目')}</span></h2>` +
    `<div class="meta">${esc(it.id)} · 印页 P${it.print_page!=null?it.print_page:'—'} · 物理页 ${it.phys_page}` +
    (it.parent?` · 隶属 ${esc(it.parent)}`:'') + `</div>`;
  if (it.content) h += `<div class="content">${esc(it.content)}</div>`;
  atts.forEach(a => { h += `<div class="sec-h">${esc(a.name)}<span class="sub">附件 · 印页 P${a.print_page}</span></div>` +
    `<div class="content">${esc(a.content)}</div>`; });
  return h + '</div>';
}
function renderTree() {
  const pane = $('#pane');
  if (!curId) {
    const first = tree.querySelector('.it');
    if (first) curId = first.dataset.id; else { pane.innerHTML = '<div class="empty">无条目</div>'; return; }
  }
  const it = D.items.find(x => x.id === curId);
  pane.innerHTML = it ? itemCard(it) : '<div class="empty">条目不存在</div>';
  const el = pane.querySelector('.card');
  if (el) el.scrollIntoView({block:'nearest'});
  tree.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x.dataset.id === curId));
  const on = tree.querySelector('.it.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function tblHtml(t) {
  let h = `<div class="card"><h2>${esc(t.caption||'（无表题）')}` +
    `<span class="chip gray">${t.id}</span><span class="chip gray">印页 P${t.print_page}</span></h2><table class="tb"><tbody>`;
  t.rows.forEach(r => {
    h += '<tr>' + r.map(c => {
      if (c.startsWith('^')) return `<td class="merge">${esc(c.replace(/^\^+/,''))}</td>`;
      return `<td>${esc(c)}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}
function renderTables() {
  $('#pane').innerHTML = D.tables.map(tblHtml).join('') || '<div class="empty">无表格</div>';
}
function renderNotes() {
  let h = '';
  if (!D.notes.length) h = '<div class="empty">无注文</div>';
  D.notes.forEach(n => {
    h += `<div class="card"><h2>${esc(n.no||'注')}<span class="chip gray">${esc(n.id)}</span>` +
      `<span class="chip gray">印页 P${n.print_page!=null?n.print_page:'—'}</span></h2>` +
      `<div class="content">${esc(n.content)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderErratas() {
  let h = '<div class="card"><h2>官方勘误 overlay<span class="chip gray">errata_id 溯源 · 双值留痕</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:88px">errata_id</th><th>类型</th><th>目标</th>' +
    '<th>误值</th><th>正值</th><th style="width:76px">状态</th></tr></thead><tbody>';
  D.erratas.forEach(e => {
    h += `<tr><td style="font-family:var(--mono);font-size:12px">${esc(e.errata_id)}</td>` +
      `<td>${esc(e.errata_type)}</td><td>${esc(e.target_desc)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(e.wrong_text)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(e.correct_text)}</td>` +
      `<td class="${e.status==='applied'||e.status==='applied_bare'?'ok':e.status==='issue'?'bad':''}">${esc(e.status)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h || '<div class="empty">无勘误</div>';
}
function renderToc() {
  let h = '<div class="card"><h2>目录条目与正文对账<span class="chip gray">门 6b 前置</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:40px">#</th><th>层级</th><th>标题</th>' +
    '<th style="width:64px">目录页</th><th style="width:72px">正文页</th><th style="width:56px">吻合</th></tr></thead><tbody>';
  D.toc.forEach((e, i) => {
    h += `<tr><td>${i+1}</td><td>${e.level===1?'一级':'二级'}</td><td>${esc(e.title)}</td>` +
      `<td>P${e.print_page}</td><td>${e.matched_section?'P'+e.actual_page:'—'}</td>` +
      `<td class="${e.ok?'ok':'bad'}">${e.ok?'✓':'✗'}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h;
}
function renderIssues() {
  $('#pane').innerHTML = '<div class="empty">无疑点留痕（疑点一律进 issues 禁静默修正）</div>';
}
function renderAbout() {
  $('#pane').innerHTML = `
  <div class="note">忠实层铁律：本页所有文本均来自官方附件 PDF 文本层（pymupdf find_tables 坐标级重建两张费率表，正文文本流顺序错乱已按坐标归位）与官方解读 docx（python-docx body 顺序 walk）；疑点一律留痕不臆补。勘误 overlay：官方勘误 ${D.erratas.length} 条按 errata_id 溯源落入工作层，erratas 表保留「原文值→勘误后值」双值。</div>
  <div class="grid2">
    <div class="card"><h2>结构统计</h2><table class="tb"><tbody>
      <tr><th>目录条目</th><td>${D.toc.length}（页吻合 ${D.toc.filter(t=>t.ok).length}/${D.toc.length}）</td></tr>
      <tr><th>节</th><td>${D.sections.length}</td></tr>
      <tr><th>条目</th><td>${D.items.length}（说明 ${D.items.filter(i=>i.kind==='说明').length} · 解读 ${D.items.filter(i=>i.kind==='解读'||i.kind==='解读标题').length} · 解读表格 ${D.items.filter(i=>i.kind==='解读表格').length}）</td></tr>
      <tr><th>费率表</th><td>${D.tables.length}</td></tr>
      <tr><th>注文</th><td>${D.notes.length}</td></tr>
      <tr><th>勘误 overlay</th><td>${D.erratas.length} 条（官方勘误已入 DB 工作层 · erratas 表双值留痕）</td></tr>
    </tbody></table></div>
    <div class="card"><h2>指纹</h2><table class="tb"><tbody>
      <tr><th>源 PDF</th><td style="font-family:var(--mono)">${esc(D.inputs.source_sha12)}</td></tr>
      <tr><th>解读 docx</th><td style="font-family:var(--mono)">${esc(D.inputs.docx_sha12)}</td></tr>
      <tr><th>schema</th><td>${esc(D.schema)}</td></tr>
    </tbody></table></div>
  </div>`;
}
views[curView]();
</script>
</body>
</html>
