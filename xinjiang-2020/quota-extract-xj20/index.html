ch.push(['结构', D.sections.length + ' 章 / ' + D.items.length + ' 条目（7 条款 + 4 清单项）']);
ch.push(['语义分析', D.semantics.length + ' 条']);
ch.push(['TOC 对账', D.toc.filter(t=>t.ok).length + '/' + D.toc.length, 'ok']);
$('#bk-chips').innerHTML = ch.map(c =>
  `<span class="chip${c[2]==='gray'?' gray':''}${c[2]==='warn'?' warn':''}">${esc(c[0])} ${esc(c[1])}</span>`).join('');

/* ---------- 树（章 → 条款/清单项目/表） ---------- */
const itemsBySec = {};
D.items.forEach(it => { (itemsBySec[it.section] = itemsBySec[it.section] || []).push(it); });
const tblsBySec = {};
D.tables.forEach(t => { (tblsBySec[t.section] = tblsBySec[t.section] || []).push(t); });
const tree = $('#tree');
let html = '';
D.sections.forEach(s => {
  const grp = (s.no === '附件' ? '附件·' : s.no + '、') + s.title;
  html += `<div class="grp l1">${esc(grp)}</div>`;
  (itemsBySec[s.id]||[]).forEach(it => {
    html += `<div class="it" data-id="${it.id}">` +
      `<span class="no">${esc(it.no||'')}</span><span>${esc(it.name.slice(0,24))}</span></div>`;
  });
  (tblsBySec[s.id]||[]).forEach(t => {
    html += `<div class="it" data-id="${t.id}">` +
      `<span class="no">${esc(t.id)}</span><span>${esc(t.caption.slice(0,22))}</span></div>`;
  });
});
tree.innerHTML = html || '<div class="empty">无条目</div>';

/* ---------- 视图 ---------- */
const views = { 结构: renderTree, 语义分析: renderSemantics, 清单表: renderTables,
  通知全文: renderNotice, 注文: renderNotes, 目录对账: renderToc, 说明: renderAbout };
let curView = '结构', curId = null;
const nav = $('#nav');
nav.innerHTML = Object.keys(views).map(k =>
  `<button data-v="${k}"${k===curView?' class="on"':''}>${k}</button>`).join('');
nav.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curView = b.dataset.v;
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  views[curView]();
});
tree.addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  curId = it.dataset.id; curView = '结构';
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === '结构'));
  renderTree();
});

function tblRowsHtml(t) {
  return '<table class="tb"><tbody>' + t.rows.map(r =>
    '<tr>' + r.map(c => `<td>${br(c)}</td>`).join('') + '</tr>').join('') +
    '</tbody></table>';
}
function semBlock(s) {
  return `<div class="sec-h">语义分析<span class="sub">${esc(s.sem_id)} · ${esc(s.topic)} · ${esc(s.effect_type)}</span></div>` +
    `<div class="note" style="background:#e6f4ef;border-color:#bfe3d1;color:#0f5132">${esc(s.content)}</div>` +
    `<div class="meta">涉及：${esc(s.linked_volume_title||'—')}${s.linked_chapter?' · '+esc(s.linked_chapter):''}` +
    (s.linked_codes.length?` · 编码 ${esc(s.linked_codes.join('、'))}`:'') + ` · 状态 ${esc(s.apply_status)}</div>`;
}
function itemCard(it) {
  const sem = D.semantics.filter(s => s.item_id === it.id);
  const kdCls = it.kind === '清单项目' ? 'li' : 'cl';
  let h = `<div class="card" id="it-${it.id}"><h2>${esc(it.name)}` +
    `<span class="kd ${kdCls}">${esc(it.kind||'')}</span></h2>` +
    `<div class="meta">${esc(it.id)} · ${esc(it.no||'')}</div>`;
  if (it.content) h += `<div class="content">${esc(it.content)}</div>`;
  sem.forEach(s => { h += semBlock(s); });
  return h + '</div>';
}
function tblCard(t) {
  const sem = D.semantics.filter(s => s.item_id === t.id);
  let h = `<div class="card" id="it-${t.id}"><h2>${esc(t.caption||'（无表题）')}` +
    `<span class="chip gray">${t.id}</span><span class="chip gray">原表 6 列</span>` +
    `<span class="chip gray">单元格内多值保留换行</span></h2>`;
  h += tblRowsHtml(t);
  sem.forEach(s => { h += semBlock(s); });
  return h + '</div>';
}
function renderTree() {
  const pane = $('#pane');
  if (!curId) {
    const first = tree.querySelector('.it');
    if (first) curId = first.dataset.id; else { pane.innerHTML = '<div class="empty">无条目</div>'; return; }
  }
  const it = D.items.find(x => x.id === curId);
  const tb = D.tables.find(x => x.id === curId);
  pane.innerHTML = it ? itemCard(it) : (tb ? tblCard(tb) : '<div class="empty">条目不存在</div>');
  tree.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x.dataset.id === curId));
  const on = tree.querySelector('.it.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function renderTables() {
  $('#pane').innerHTML = D.tables.map(tblCard).join('') || '<div class="empty">无表格</div>';
}
function renderSemantics() {
  const stats = {};
  D.semantics.forEach(s => { stats[s.apply_status] = (stats[s.apply_status]||0)+1; });
  let h = '<div class="card"><h2>每条通知条款与清单项目的语义分析<span class="chip gray">主题 · 涉及规范 · 效力定性 · 编码指向</span></h2>' +
    `<div class="meta">共 ${D.semantics.length} 条（7 通知条款 + 4 清单项目）：` +
    Object.entries(stats).map(([k,v])=>`${esc(k)}=${v}`).join(' · ') + '</div>';
  h += '<table class="tb"><thead><tr><th style="width:88px">sem_id</th><th>条目</th><th>主题</th>' +
    '<th>效力类型</th><th>涉及规范</th><th>编码</th><th style="width:76px">状态</th></tr></thead><tbody>';
  D.semantics.forEach(s => {
    const isL = s.item_id.startsWith('L');
    h += `<tr><td style="font-family:var(--mono);font-size:12px">${esc(s.sem_id)}</td>` +
      `<td>${isL?'清单项目':'条款'} ${esc(s.item_id)}</td><td>${esc(s.topic)}</td><td>${esc(s.effect_type)}</td>` +
      `<td>${esc(s.linked_volume_title||'—')}</td>` +
      `<td class="mult">${esc(s.linked_codes.join('、')||'—')}</td>` +
      `<td class="ok">${esc(s.apply_status)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  D.semantics.forEach(s => {
    h += `<div class="card"><h2>${esc(s.topic)}<span class="chip gray">${esc(s.sem_id)}</span>` +
      `<span class="kd sem">${esc(s.effect_type)}</span></h2>` +
      `<div class="content">${esc(s.content)}</div>` +
      `<div class="meta">涉及：${esc(s.linked_volume_title||'—')}${s.linked_chapter?' · '+esc(s.linked_chapter):''}` +
      (s.linked_codes.length?` · 编码 ${esc(s.linked_codes.join('、'))}`:'') + ` · 状态 ${esc(s.apply_status)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderNotice() {
  let h = '<div class="card"><h2>关于进一步明确建筑垃圾运输及处置计价工作的通知' +
    '<span class="chip gray">自治区住房城乡建设厅 2025年11月4日</span></h2>' +
    `<div class="meta">官网发布 2025-11-05 10:21 · 文章来源：建筑业发展中心</div>` +
    `<div class="content">各地、州、市住房和城乡建设局，喀什经济开发区规划土地建设环保局、霍尔果斯经济开发区规划建设环保局，各有关单位：

为贯彻落实《国务院办公厅转发住房城乡建设部〈关于进一步加强城市建筑垃圾治理的意见〉的通知》（国办函〔2025〕57号），推进城市建筑垃圾的妥善管理与有效治理，完善相关计价体系，现就我区建筑垃圾运输及处置计价有关事项通知如下：</div></div>`;
  D.sections.filter(s => s.no !== '附件').forEach(s => {
    h += `<div class="card"><h2>${esc(s.no)}、${esc(s.title)}</h2>`;
    (itemsBySec[s.id]||[]).forEach(it => {
      h += `<div class="sec-h">${esc(it.no)}<span class="sub">${esc(it.name)}</span></div>` +
        `<div class="content">${esc(it.content)}</div>`;
    });
    h += '</div>';
  });
  const n2 = D.notes.find(n => n.id === 'N002');
  if (n2) h += `<div class="card"><h2>执行与落款</h2><div class="content">${esc(n2.content)}</div></div>`;
  $('#pane').innerHTML = h;
}
function renderNotes() {
  let h = '';
  if (!D.notes.length) h = '<div class="empty">无注文</div>';
  D.notes.forEach(n => {
    h += `<div class="card"><h2>${esc(n.no||'注')}<span class="chip gray">${esc(n.id)}</span></h2>` +
      `<div class="content">${esc(n.content)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderToc() {
  let h = '<div class="card"><h2>章节对账<span class="chip gray">三部分（附件无页码体系）</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:40px">#</th><th>层级</th><th>标题</th>' +
    '<th style="width:88px">目录页</th><th style="width:88px">正文页</th><th style="width:56px">吻合</th></tr></thead><tbody>';
  D.toc.forEach((e, i) => {
    h += `<tr><td>${i+1}</td><td>章</td><td>${esc(e.title)}</td>` +
      `<td>${e.print_page!=null?'P'+e.print_page:'—'}</td><td>${e.matched_section?'挂接':'—'}</td>` +
      `<td class="${e.ok?'ok':'bad'}">${e.ok?'✓':'✗'}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h;
}
function renderAbout() {
  $('#pane').innerHTML = `
  <div class="note">忠实层铁律：本页条款正文逐字取自官网页面原文（input/notice.html 快照，sha12=a5e1fd19c305，全角引号保留）；
  附件清单表按 xlsx 单元格级程序化实读（sha12=d14ceca37b2e，合并单元格展开、单元格内多值保留原始换行）；
  parse 内置双源闭环断言（7 条款⊆页面原文、xlsx 实读==转写定稿、4 清单项目名跨源一致），疑点一律留痕不臆补。
  语义分析：每条通知条款与增补清单项目均建语义条目（主题/效力/涉及规范/编码/状态），建表 fee_semantics 入库。</div>
  <div class="grid2">
    <div class="card"><h2>结构统计</h2><table class="tb"><tbody>
      <tr><th>章（一/二/附件）</th><td>${D.sections.length}</td></tr>
      <tr><th>通知条款</th><td>7（一(一)~(三) 分类与增补 · 二(一)~(四) 计量计价）</td></tr>
      <tr><th>增补清单项目</th><td>4（X010103003~006，双计量单位 2 项）</td></tr>
      <tr><th>语义分析条目</th><td>${D.semantics.length}（in_effect=${D.semantics.length}）</td></tr>
      <tr><th>注文</th><td>${D.notes.length}（附件注 + 执行与反馈）</td></tr>
      <tr><th>勘误</th><td>0（本卷无勘误；「余方弃置」停止执行为现行废止性条款）</td></tr>
    </tbody></table></div>
    <div class="card"><h2>指纹</h2><table class="tb"><tbody>
      <tr><th>源附件 xlsx</th><td style="font-family:var(--mono)">${esc(D.inputs.source_sha12)}（d14ceca37b2e）</td></tr>
      <tr><th>通知页面快照</th><td style="font-family:var(--mono)">${esc(D.inputs.notice_sha12)}（a5e1fd19c305）</td></tr>
      <tr><th>schema</th><td>${esc(D.schema)}</td></tr>
      <tr><th>页码口径</th><td>无页码体系（单表附件，单元格坐标为锚）</td></tr>
    </tbody></table></div>
  </div>`;
}
views[curView]();
</script>
</body>
</html>
