"1.清扫、基层打磨、机器人喷涂腻子、机器人打磨腻子、门窗等保护、机器人喷乳胶漆二遍、人工配合等。 2.机器人喷涂乳胶漆一遍及人工配合。","unit":"100㎡","phys_page":12,"print_page":11,"chapter":5,"consumptions":[{"kind":"人工","name":"三类人工","unit":"工日","qty":0.583,"unpriced":false,"raw":"0.583"},{"kind":"材料","name":"苯丙乳胶漆室内用","unit":"kg","qty":12.36,"unpriced":false,"raw":"12.360"},{"kind":"材料","name":"水","unit":"m3","qty":0.002,"unpriced":false,"raw":"0.002"},{"kind":"材料","name":"砂纸","unit":"张","qty":1.0,"unpriced":false,"raw":"1.000"},{"kind":"材料","name":"苯丙乳胶底漆（综合）","unit":"kg","qty":null,"unpriced":false,"raw":"-"},{"kind":"材料","name":"腻子粉（成品）","unit":"kg","qty":null,"unpriced":false,"raw":"-"},{"kind":"材料","name":"塑料薄膜","unit":"㎡","qty":null,"unpriced":false,"raw":"-"},{"kind":"材料","name":"电","unit":"kw·h","qty":9.758,"unpriced":false,"raw":"9.758"},{"kind":"材料","name":"其他材料费","unit":"%","qty":1.0,"unpriced":false,"raw":"1.000"},{"kind":"机械","name":"喷涂机器人7.2kw","unit":"台班","qty":0.104,"unpriced":false,"raw":"0.104"},{"kind":"机械","name":"腻子涂敷机器人7.2kw","unit":"台班","qty":null,"unpriced":false,"raw":"-"},{"kind":"机械","name":"腻子打磨机器人3kw","unit":"台班","qty":0.157,"unpriced":false,"raw":"0.157"}]}],"explain":[{"no":"一","text":"《智能建造（建筑机器人）消耗量定额项目（试行）》（以下简称“本定额”）适用于使用建筑机器人的工业与民用建筑的新建、扩建、改建房屋建筑与装饰工程，与2020 版《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》配套使用。","pno":2},{"no":"二","text":"本定额是编制地区单位估价表、投资估算、设计概算、招标控制价、施工图预算的依据，可作为投标报价、签订施工合同、工程结算、编制企业定额的参考。","pno":2},{"no":"三","text":"本定额按正常的施工环境、常规施工工艺、合理的施工组织设计、适用于机器人的施工条件进行编制。","pno":2},{"no":"四","text":"本定额包括砌筑工程、现浇混凝土工程、楼地面工程、墙面工程、涂料工程共五节。","pno":2},{"no":"五","text":"关于人工：1.本定额以两种类别的综合工日表示，包括基本用工、超运距用工、辅助用工和人工幅度差。2.本定额的人工每工日按8 小时工作制计算。3.本定额已综合考虑了人工配合。人工配合包括配合机器人盲区施工、机器人楼层之间搬运等。","pno":2},{"no":"六","text":"关于材料：1.本定额采用的材料（包括构配件、零件、半成品、成品）均为符合国家质量标准和相应设计要求的合格产品。2.本定额的材料消耗量包括净用量和损耗量。3.本定额的混凝土按预拌混凝土编制，采用现场搅拌时，执行2020 版《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》相关规定。4.本定额中所使用的砂浆按干混预拌砂浆编制，若实际使用现拌砂浆或湿拌砂浆时，执行2020 版《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》相关规定。5.对于用量少、低值易耗的零星材料，列为其他材料。","pno":2},{"no":"七","text":"关于机械：1.本定额中的建筑机器人按租赁方式编制，已包含进出场费、安装调试费和操作人员人工费。2.本定额中机械台班消耗量是按正常机械施工工效并考虑机械幅度差综合取定的。3.凡单位价值在2000 元以内，使用年限在一年以内的不构成固定资产的施工机械，不列入机械台班消耗量，作为工具用具在企业管理费中考虑，其消耗的燃料动力等列入材料中。","pno":3},{"no":"八","text":"蒸压加气混凝土墙板设计厚度与定额不同时，人工、材料可进行调整换算。","pno":3},{"no":"九","text":"设计要求的腻子遍数与定额不同时，按增减一遍子目进行调整。","pno":3},{"no":"十","text":"乳胶漆子目包括喷腻子，设计要求的乳胶漆遍数与定额不同时，按每增加一遍子目进行调整。","pno":3},{"no":"十一","text":"本定额由自治区建筑业发展中心负责管理和解释。","pno":3}],"rules":[{"ch_no":1,"title":"砌筑工程","text":"砌筑工程1.蒸压加气混凝土墙板安装，按设计墙体长度乘以设计高度，以面积计算，扣除门窗洞口及单个面积＞0.3m2 孔洞的面积。","pno":4},{"ch_no":2,"title":"现浇混凝土工程","text":"现浇混凝土工程1.垫层、筏形基础混凝土均按设计图示尺寸以体积计算，不扣除构件内钢筋、预埋件及单个面积≤0.3m2 的孔洞所占体积。2.有梁板、平板混凝土均按设计图示尺寸以体积计算，不扣除构件内钢筋、预埋件及单个面积≤0.3m2 的孔洞所占体积。有梁板包括梁与板，按梁、板体积之和计算。","pno":4},{"ch_no":3,"title":"楼地面工程","text":"楼地面工程1.找平层，按设计图示尺寸以面积计算。扣除凸出地面构筑物、设备基础、室内管道、地沟等所占面积，不扣除间壁墙及单个面积≤0.3m2 柱、垛、附墙烟囱及孔洞所占面积。门洞、空圈、暖气包槽、壁龛的开口部分不增加面积。2.环氧自流平涂料，按设计图示尺寸以面积计算。扣除凸出地面构筑物、设备基础、室内管道、地沟等所占面积，不扣除间壁墙及单个面积≤0.3m2 柱、垛、附墙烟囱及孔洞所占面积。门洞、空圈、暖气包槽、壁龛的开口部分不增加面积。","pno":4},{"ch_no":4,"title":"墙面工程","text":"墙面工程墙面一般抹灰按设计图示尺寸以面积计算，应扣除门窗洞口和单个面积＞0.3m2 的空圈所占的面积，不扣除踢脚线、挂镜线及单个面积≤0.3m2 的孔洞和墙与构件交接处的面积所占面积。且门窗洞口、空圈、孔洞的侧壁面积亦不增加，附墙柱的侧面抹灰应并入墙面、墙裙抹灰工程量内计算。","pno":4},{"ch_no":5,"title":"涂料工程","text":"涂料工程抹灰面腻子、乳胶漆按设计图示尺寸以面积计算。","pno":4}],"n_cons":178,"n_sec":8,"toc":[{"level":"h1","title":"说明","print_page":1,"vol":1,"ch":null},{"level":"h1","title":"工程量计算规则","print_page":3,"vol":1,"ch":null},{"level":"h1","title":"一、砌筑工程","print_page":5,"vol":1,"ch":1},{"level":"h2","title":"1.蒸压加气混凝土墙板","print_page":5,"vol":1,"ch":1},{"level":"h1","title":"二、现浇混凝土工程","print_page":6,"vol":1,"ch":2},{"level":"h2","title":"1.混凝土基础","print_page":6,"vol":1,"ch":2},{"level":"h2","title":"2.混凝土板","print_page":6,"vol":1,"ch":2},{"level":"h1","title":"三、楼地面工程","print_page":7,"vol":1,"ch":3},{"level":"h2","title":"1.找平层","print_page":7,"vol":1,"ch":3},{"level":"h2","title":"2.整体面层","print_page":7,"vol":1,"ch":3},{"level":"h1","title":"四、墙面工程","print_page":9,"vol":1,"ch":4},{"level":"h2","title":"1.墙面一般抹灰","print_page":9,"vol":1,"ch":4},{"level":"h1","title":"五、涂料工程","print_page":10,"vol":1,"ch":5},{"level":"h2","title":"1.抹灰面腻子","print_page":10,"vol":1,"ch":5},{"level":"h2","title":"2.抹灰面乳胶漆","print_page":10,"vol":1,"ch":5}],"toc_check":{"matched":15,"sec_total":15,"unmatched":[],"note":"源无目录页；目录按正文标题与规则页章序结构化生成"},"issues":[{"kind":"chapter_number_typo","pno":8,"note":"正文第8页章标题原文「二、楼地面工程」，与《工程量计算规则》第三章及说明「共五节」不符；DB 按规则页权威序归章（第3章），忠实层保留原文「二、楼地面工程」"},{"kind":"chapter_number_typo","pno":10,"note":"正文第10页章标题原文「三、墙面工程」，与《工程量计算规则》第四章及说明「共五节」不符；DB 按规则页权威序归章（第4章），忠实层保留原文「三、墙面工程」"},{"kind":"qty_decimal_width","pno":9,"note":"18-12 人工/三类人工 原值=1.15 非三位小数（忠实保留）"},{"kind":"qty_decimal_width","pno":11,"note":"18-17 材料/腻子粉（成品） 原值=102.06 非三位小数（忠实保留）"},{"kind":"unit_glyph_mixed","pno":null,"note":"面积/体积单位原文混用上标 m2/m3 与 ㎡（忠实保留各自写法）"}]}</script>
<script>
var D = JSON.parse(document.getElementById('payload').textContent);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function cn(n){return ['零','一','二','三','四','五','六','七','八','九','十'][n]||String(n)}

// ---- meta ----
$('h-title').textContent=D.meta.title;
document.title=D.meta.title;
$('m-items').textContent=D.items.length;
$('m-cons').textContent=D.n_cons;
$('m-sec').textContent=D.n_sec;
$('m-iss').textContent=D.issues.length;
$('m-off').textContent=D.meta.print_offset;

// ---- tabs ----
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('nav.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.p)});
});

// ---- structure tree ----
var tree=$('tree'), chMap={};
D.chapters.forEach(function(ch){chMap[ch.no]=ch});
var dv=document.createElement('div'); dv.className='vol'; dv.textContent=D.meta.region+' · '+D.meta.year; tree.appendChild(dv);
D.chapters.forEach(function(ch){
  var d=document.createElement('div'); d.className='ch'; d.dataset.k=ch.no;
  d.textContent=(ch.no===0?'总说明':('第'+cn(ch.no)+'章 '+ch.title))+'（'+ch.n_items+'子目）';
  d.onclick=function(){showCh(ch.no)};
  tree.appendChild(d);
});
function showCh(k){
  document.querySelectorAll('.tree .ch').forEach(function(x){x.classList.toggle('on',Number(x.dataset.k)===Number(k))});
  var ch=chMap[k]; if(!ch)return;
  var h='<h3>'+esc(ch.no===0?'总说明（全卷通用）':('第'+cn(ch.no)+'章 '+ch.title))+'</h3>';
  h+='<p class="kw">原文标题：'+esc(ch.raw_title||'—')+' · 印页 P'+ch.print_page+' · 节 '+ch.sections.length+' · 子目 '+ch.n_items+' · 说明 '+ch.explain.length+' 条 · 计算规则 '+ch.rules.length+' 条</p>';
  if(ch.sections.length){h+='<h3>节清单</h3>';ch.sections.forEach(function(s){h+='<p>· '+esc(s.title)+(s.pno?' <span class="kw">P'+s.pno+'</span>':'')+'</p>'})}
  if(ch.explain.length){h+='<h3>'+(ch.no===0?'总说明':'章说明')+'</h3>';ch.explain.forEach(function(x){h+='<p>'+esc(x.text)+'</p>'})}
  if(ch.rules.length){h+='<h3>工程量计算规则</h3>';ch.rules.forEach(function(x){h+='<p>'+esc(x.text)+'</p>'})}
  if(ch.items.length){h+='<h3>本章子目</h3><p>';ch.items.forEach(function(c){h+='<span class="pill" onclick="jump(\''+c+'\')">'+esc(c)+'</span>'});h+='</p>'}
  $('ch-info').innerHTML=h;
}
showCh(0);

// ---- search ----
var chSel=$('f-ch');
D.chapters.forEach(function(ch){if(ch.no===0)return;var o=document.createElement('option');o.value=ch.no;o.textContent='第'+cn(ch.no)+'章 '+ch.title;chSel.appendChild(o)});
var idx=D.items.map(function(it){
  return {it:it,hay:[it.code,it.project,it.work_content,it.unit,it.section].concat((it.consumptions||[]).map(function(c){return c.name})).join(' ')};
});
$('q').addEventListener('input',doSearch);
$('f-ch').addEventListener('change',doSearch);
$('f-kind').addEventListener('change',doSearch);
function doSearch(){
  var q=$('q').value.trim(), fc=chSel.value, fk=$('f-kind').value;
  var hits=idx.filter(function(x){
    if(fc&&String(x.it.chapter)!==fc)return false;
    if(fk&&!(x.it.consumptions||[]).some(function(c){return c.kind===fk}))return false;
    if(!q)return true;
    if(/^\d+-\d+$/.test(q))return x.it.code===q;
    return x.hay.indexOf(q)>=0;
  }).slice(0,120);
  $('q-count').textContent='命中 '+hits.length+' 条'+(hits.length===120?'（截断，最多显示 120）':'');
  var h='';
  hits.forEach(function(x){
    var it=x.it;
    h+='<div class="item-head" id="it-'+esc(it.code)+'"><b class="code">'+esc(it.code)+'</b><span>'+esc(it.project)+'</span>'
      +'<span class="kw">单位 '+esc(it.unit||'')+'</span><span class="kw">印页 P'+it.print_page+'（物页 '+it.phys_page+'）</span></div>';
    h+='<p class="kw">节：'+esc(it.section||'')+' · 工作内容：'+esc(it.work_content||'')+'</p>';
    if((it.consumptions||[]).length){
      h+='<table><tr><th>类别</th><th>名称</th><th>单位</th><th>消耗量</th></tr>';
      it.consumptions.forEach(function(c){
        h+='<tr><td>'+esc(c.kind||'')+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.unit||'')+'</td><td class="num">'
          +(c.qty==null?'—':(c.unpriced?'('+c.qty+')':c.qty))+'</td></tr>';
      });
      h+='</table>';
    }
  });
  $('q-out').innerHTML=h||'<p class="kw">无命中</p>';
}
function jump(code){
  document.querySelector('nav.tabs button[data-p="p-search"]').click();
  $('q').value=code; doSearch();
  var el=$('it-'+code); if(el&&el.scrollIntoView)el.scrollIntoView();
}
doSearch();

// ---- 总说明 / 计算规则 ----
(function(){
  var h='<div class="info sec" style="max-height:none"><h3>说明（'+D.explain.length+' 条）</h3>';
  D.explain.forEach(function(e){h+='<p><b>'+esc(e.no)+'、</b>'+esc(e.text)+' <span class="kw">[印页 P'+e.pno+']</span></p>'});
  h+='<h3>工程量计算规则（'+D.rules.length+' 章）</h3>';
  D.rules.forEach(function(r){h+='<p><b>'+esc(cn(r.ch_no))+'、'+esc(r.title)+'</b> '+esc(r.text)+'</p>'});
  h+='</div>';
  $('prose-out').innerHTML=h;
})();

// ---- 目录对账 ----
(function(){
  var tc=D.toc_check;
  $('toc-count').textContent='目录 '+D.toc.length+' 条 · 对账 '+tc.matched+'/'+tc.sec_total+' · '+esc(tc.note||'');
  var h='<tr><th>层级</th><th>标题</th><th>章</th><th>印页</th></tr>';
  D.toc.forEach(function(e){h+='<tr><td>'+esc(e.level)+'</td><td>'+esc(e.title)+'</td><td>'+(e.ch==null?'—':e.ch)+'</td><td>'+(e.print_page==null?'—':e.print_page)+'</td></tr>'});
  $('toc-tbl').innerHTML=h;
})();

// ---- 疑点留痕 ----
(function(){
  $('iss-count').textContent='留痕 '+D.issues.length+' 条（原文疑点只记录不静默修正；章序号以《工程量计算规则》为权威，原文见章节结构「原文标题」）';
  var h='<tr><th>类别</th><th>物页</th><th>说明</th></tr>';
  D.issues.forEach(function(x){h+='<tr><td><span class="tag warn">'+esc(x.kind)+'</span></td><td>'+(x.pno==null?'—':x.pno)+'</td><td>'+esc(x.note)+'</td></tr>'});
  $('iss-tbl').innerHTML=h;
})();

// ---- 源信息 ----
(function(){
  var m=D.meta, rows=[
    ['书名',m.title],['发布机关','新疆维吾尔自治区住房和城乡建设厅'],
    ['发布通知',m.notice_date+' · '+m.notice_url],
    ['源形态',m.source_kind],['页数',m.pages+' 页（印页 = 物理页 − '+m.print_offset+'）'],
    ['主源 sha12',m.source_sha12],['5月通知附件 sha12',m.alt_sha12],
    ['双源一致性',m.source_sha12===m.alt_sha12?'一致（字节级）':'不一致（见疑点）'],
    ['source.md sha12',m.source_md_sha12],['parse schema',m.parse_schema],
    ['结构计数',m.n_items+' 子目 / '+m.n_consumptions+' 消耗量 / '+m.n_tables+' 张定额表 / 5 章 8 节']
  ];
  var h='<div class="info sec" style="max-height:none"><h3>源与可复现性</h3><table><tr><th>项</th><th>值</th></tr>';
  rows.forEach(function(r){h+='<tr><td>'+esc(r[0])+'</td><td class="mono">'+esc(r[1])+'</td></tr>'});
  h+='</table><p class="kw" style="margin-top:10px">忠实层 out/parse_xj18.json 与 out/xj18_source.md 只读；DB 为工作层；全链禁运行时时间戳，门控基线指纹可复跑。</p></div>';
  $('src-out').innerHTML=h;
})();
</script>
