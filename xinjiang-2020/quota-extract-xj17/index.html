,"print_page":5,"preamble":null},{"id":"ch03-sec3","no":"三","title":"安装工程有关问题解释","level":2,"parent":"ch03","phys_page":6,"print_page":6,"preamble":null},{"id":"ch03-sec4","no":"四","title":"2014 版补充计价依据有关问题解释","level":2,"parent":"ch03","phys_page":6,"print_page":6,"preamble":null},{"id":"ch04","no":null,"title":"新疆维吾尔自治区计价依据有关问题解释（四）","level":1,"parent":null,"phys_page":1,"print_page":1,"preamble":"据官方 PDF《新疆维吾尔自治区计价依据有关问题解释（四）》结构化（6 页）"},{"id":"ch04-sec1","no":"一","title":"2020 版《新疆维吾尔自治区房屋建筑和装饰工程消耗量定额》有关问题解释","level":2,"parent":"ch04","phys_page":1,"print_page":1,"preamble":null},{"id":"ch04-sec2","no":"二","title":"2020 版《新疆维吾尔自治区建筑安装市政工程费用定额》有关问题解释","level":2,"parent":"ch04","phys_page":2,"print_page":2,"preamble":null},{"id":"ch04-sec3","no":"三","title":"安装工程有关问题解释","level":2,"parent":"ch04","phys_page":2,"print_page":2,"preamble":null}],"items":[{"id":"Q001","section":"ch01-sec1","no":"一","name":"平整场地工程量在不同情况下应该如何计算？","kind":"问答","content":"平整场地计算规则：按设计图示尺寸，以建筑物（构筑物）首层建筑面积（结构外围内包面积）计算。建筑物地下室结构外边线突出首层结构外边线时，其突出部分的建筑面积合并计算。\n1.建筑物首层外围，有需要与主体结构同时施工的构造，计算了1/2 建筑面积的（如：主体结构外的阳台、有柱混凝土雨篷等），应补齐全面积计算平整场地；不计算建筑面积的（如：装饰性阳台），应将其结构底板水平投影面积合并于首层建筑面积内，一并计算平整场地。\n2.地下室（地下车库）建筑面积大于首层建筑面积时，平整场地面积按地下室(地下车库)突出部分的建筑面积和首层面积合并计算。\n3.单独地下室(人防地下室或地下车库)建筑平整场地，按负一层建筑结构外边线围合的面积计算。","phys_page":2,"print_page":1,"parent":null},{"id":"Q002","section":"ch01-sec1","no":"二","name":"机械挖土（石）方工程中，人工配合机械挖土是否单独计算？","kind":"问答","content":"土(石）方工程按不同基础形式，分为挖掘机挖一般土方、挖掘机挖槽（坑）土方两大类型，挖掘机（含小型挖掘机）挖土方子目，已综合了挖掘机挖土和挖掘机挖土后基底和边坡遗留厚度≤0.30m 的人工基底清理和边坡修整，使用时不得调整，人工基底清理和边坡修整不另行计算。","phys_page":2,"print_page":1,"parent":null},{"id":"Q003","section":"ch01-sec1","no":"三","name":"土（石）方工程定额子目的适用范围？","kind":"问答","content":"本章定额适用于设计室外地坪以下的基础土石方工程。建设准备阶段“一平”范围的现场障碍物清除、土石方竖向调配（即，自然地坪至设计室外地坪之间的土石方挖填)等工程内容，不适用本章定额。","phys_page":3,"print_page":2,"parent":null},{"id":"Q004","section":"ch01-sec1","no":"四","name":"强夯工程量应如何计算？夯击能量、夯击密度和夯击击数如何确定？","kind":"问答","content":"强夯计算规则：按设计图示强夯处理范围以面积计算。设计无规定时，一般场地按建筑物外围轴线每边各加4m计算。液化场地按外围轴线每边各加5m 计算。\n1.强夯工程应根据不同夯击能量和夯点密度，按设计图示夯击范围，以面积计算；设计无规定时，按建筑物基础外围轴线每边各加4m，以面积计算。按技术规范规定，液化场地与一般场地的强夯范围不同，液化场地按外围轴线每边各加5m，以面积计算。\n2.强夯的定额执行和工程量计算，按下列步骤进行：（1）确定夯击能量：夯击能量(KN·m)=重锤质量(t)×重锤落差(m)×10（2）确定夯击密度：夯击密度（夯点/100m²)=设计夯击范围内的夯点个数/夯击范围（m²）×100（3）确定夯击击数：夯击击数系指强夯机械就位后，夯锤在同一夯点上下夯击的次数。","phys_page":3,"print_page":2,"parent":null},{"id":"Q005","section":"ch01-sec1","no":"五","name":"地下连续墙定额子目的适用范围？","kind":"问答","content":"地下连续墙适用于粘土、砂土及冲填土等软土层；导墙挖土方、泥浆处理及外运执行“第一章土石方工程”相应定额项目。","phys_page":4,"print_page":3,"parent":null},{"id":"Q006","section":"ch01-sec1","no":"六","name":"桩基工程施工前场地平整，压实地表，地下障碍处理等在定额中是否已综合考虑？","kind":"问答","content":"桩基工程章节中均未考虑，发生时另行计算。","phys_page":4,"print_page":3,"parent":null},{"id":"Q007","section":"ch01-sec1","no":"七","name":"综合脚手架定额的适用范围？","kind":"问答","content":"1. 凡能够按《建筑工程建筑面积计算规范》(GB/T50353-2013)计算建筑面积的工程，均按综合脚手架定额执行。\n2.执行综合脚手架定额后，建筑物密目网垂直封闭、临边防护栏杆、楼梯防护栏杆、洞口垂直防护栏杆、洞口水平防护网等均可按实际搭设情况执行单项脚手架定额。","phys_page":4,"print_page":3,"parent":null},{"id":"Q008","section":"ch01-sec1","no":"八","name":"不能计算建筑面积的建筑物屋顶装饰性钢筋混凝土部件，其脚手架如何计价？","kind":"问答","content":"可按单项脚手架相应规定计算。","phys_page":4,"print_page":3,"parent":null},{"id":"Q009","section":"ch01-sec1","no":"九","name":"有顶盖无围护结构的加油站，如何计算建筑面积？","kind":"问答","content":"有顶盖无围护结构的加油站，应按其顶盖水平投影面积的1/2 计算建筑面积；顶盖下的建筑物符合《建筑工程建筑面积计算规范》（GB/50353-2013)规定时，另行计算建筑面积。","phys_page":4,"print_page":3,"parent":null},{"id":"Q010","section":"ch01-sec1","no":"十","name":"2020 版计价依据对“大型机械检测费”是如何考虑的？","kind":"问答","content":"2020 版《新疆维吾尔自治区建筑、安装、市政工程费用定额》中安全文明施工费已考虑“大型机械检测费”，故“大型机械检测费”不再单独计算。","phys_page":5,"print_page":4,"parent":null},{"id":"Q011","section":"ch01-sec1","no":"十一","name":"2020 版《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》中第十二章定额子目“12-1一般抹灰内墙”、“12-5一般抹灰钢板网墙”、“12-6一般抹灰轻质墙（15+5mm）”分别在什么情况下使用？","kind":"问答","content":"执行墙面抹灰定额项目时，应按墙体材质套用不同定额子目，墙体为轻质条板隔墙时，执行“12-6一般抹灰轻质墙（15+5mm）”；墙体为钢板网墙时，执行“12-5一般抹灰钢板网墙”；其他材质墙体，均执行“12-1一般抹灰内墙”。","phys_page":5,"print_page":4,"parent":null},{"id":"Q012","section":"ch01-sec1","no":"十二","name":"地下室综合脚手架定额应如何套用？","kind":"问答","content":"地下室综合脚手架定额子目是按地下室层数确定的。如某建筑为地下两层，地上18 层住宅工程，其地下室综合脚手架应套用定额子目“16-38地下室综合脚手架二层”，工程量为地下一层和地下二层的建筑面积之和。","phys_page":5,"print_page":4,"parent":null},{"id":"Q013","section":"ch01-sec1","no":"十三","name":"如何区分土石方工程中的虚方、松填、天然密实、夯实？","kind":"问答","content":"土石方工程中的“虚方”是指未经填压自然形成的土石方；“松填”是指挖出的自然土石方，自然堆放未经夯实填在槽、坑中的土石方；“天然密实”是指未经扰动的自然土（天然土）石方；“夯实”是指按规范要求经过分层碾压、夯实的土石方。","phys_page":5,"print_page":4,"parent":null},{"id":"Q014","section":"ch01-sec1","no":"十四","name":"垂直运输定额子目中的人工消耗量包含的工作内容有哪些？","kind":"问答","content":"垂直运输中定额子目中的人工消耗量是指司索工和信号工的消耗量。","phys_page":6,"print_page":5,"parent":null},{"id":"Q015","section":"ch01-sec2","no":"一","name":"刚性防水套管制作和安装子目中，套管是否重复？","kind":"问答","content":"不重复，但应注意：如果制作计算刚性套管，安装只计刚性套管安装费。","phys_page":7,"print_page":6,"parent":null},{"id":"Q016","section":"ch01-sec2","no":"二","name":"安装消耗量定额中各种管道安装管径如何区分？","kind":"问答","content":"定额中管道安装项目除铜管、塑料管、复合管（除钢塑复合管外）按公称外径表示外，其他管道均按公称直径表示。","phys_page":7,"print_page":6,"parent":null},{"id":"Q017","section":"ch01-sec2","no":"三","name":"《全国统一安装工程预算定额》（GYD-205-2000）第八册给排水、采暖、燃气工程中有热空气幕子目，《通用安装工程消耗量定额》(TY02-31—2015)第十册给排水、采暖、燃气工程中没有相关子目，如发生如何计取？","kind":"问答","content":"热空气幕安装项目，发生时执行《通用安装工程消耗量定额》(TY02-31—2015)第七册通风空调工程相应项目。","phys_page":7,"print_page":6,"parent":null},{"id":"Q018","section":"ch01-sec2","no":"四","name":"铸铁管安装定额子目中，不锈钢卡箍(含胶圈)是否单独计取？","kind":"问答","content":"《通用安装工程消耗量定额》(TY02-31—2015)中铸铁管安装定额子目（10-1-233～10-1-238）消耗量中已包含不锈钢卡箍(含胶圈)，不再单独计取。","phys_page":7,"print_page":6,"parent":null},{"id":"Q019","section":"ch01-sec3","no":"一","name":"2020 版计价依据中安全文明施工费由哪些内容构成？","kind":"问答","content":"2020 版计价依据中安全文明施工费由四部分内容构成。一是在《新疆维吾尔自治区建筑、安装、市政工程费用定额》中，以费率形式计算的“安全文明施工费”；二是以经审定的施工方案中实际完成的工作量(或摊销量）计算其安拆费，单独计列，不参与取费的，如：施工现场搭设的围挡、行车道路硬化等项目的内容；三是在2020 版《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》中按定额子目计算的内容，如临边防护、洞口水平和垂直防护、密目网垂直封闭以及施工现场搭设的水平防护架、垂直防护架等；四是以暂控价形式计入，结算时按合同约定的方式据实计算，如智慧工地基础配置费。","phys_page":8,"print_page":7,"parent":null},{"id":"Q020","section":"ch01-sec3","no":"二","name":"2020 版《新疆维吾尔自治区建筑、安装、市政工程费用定额》中没有单列扬尘污染防治费，此费用如何计取?","kind":"问答","content":"扬尘污染防治费包含在安全文明施工费费率中，不再单列。","phys_page":8,"print_page":7,"parent":null},{"id":"Q021","section":"ch01-sec3","no":"三","name":"施工现场智慧工地基础配置费用计取说明（以下简称《费用》）。","kind":"问答","content":"1.本《费用》包含为满足工程质量安全监管投入的基础配置费用（含实名制管理系统、视频监控系统、塔式起重机和施工升降机监控系统），计入安全文明施工费中，为不可竞争费。智慧工地建设中为满足工程质量监管要求而配置的设备产生流量费另按合同约定计算。\n2.为保证《费用》计取的合理性，施工单位应紧密结合工地实际情况，编制智慧工地专项施工方案，并经甲方和监理单位审定确认，作为后期结算的基础资料。\n3.在招投标阶段，智慧工地基础配置费用以暂控价形式计入安全文明施工费中。结算时，如若实际布置情况与基础配置要求不同时，（如40000m²房屋建筑工程基础配置要求中，塔吊监测设备配置数量为1 台，但实际可能有多台塔吊监测设备）应以经审定的专项施工方案中的实际工作量（或摊销量）结算。\n4.材料价格按发承包双方认可的价格进行结算。设备价格按相关设备摊销规定约定。本解释涉及的相关问题已在2021 年第6 期、2022 年第1-6 期及2023 年第1 期《新疆工程造价管理》期刊发布。","phys_page":8,"print_page":7,"parent":null},{"id":"Q022","section":"ch02-sec1","no":"1","name":"第五章混凝土及钢筋混凝土工程，关于构筑物模板工程量计算规则：“大型池槽等分别按基础、墙、板、梁、柱等有关规定计算”，其中“大型池槽”如何界定？","kind":"问答","content":"外形尺寸体积在1m³以上的池槽为大型池槽，外形尺寸体积在1m³以内的池槽为小型池槽。","phys_page":1,"print_page":1,"parent":null},{"id":"Q023","section":"ch02-sec1","no":"2","name":"第十六章定额子目“16-183直流深井降水（井管深：20m）（钻孔D800）”“16-184无砂混凝土管井点”“16-185集水井”中各类泵的人工和机械消耗量是如何考虑的？","kind":"问答","content":"执行上述定额子目时，各类泵机械消耗量均按每天3 个台班，其中1/3 台班运转，2/3 台班停滞备用，停滞台班费用根据价格折算计入运转台班消耗量内，人工消耗量按每人看泵10台。","phys_page":1,"print_page":1,"parent":null},{"id":"Q024","section":"ch02-sec2","no":null,"name":"在执行2020 版《新疆维吾尔自治区市政工程消耗量定额》时，各类管道工程中的附属工程如何取费？","kind":"问答","content":"市政工程的给水、排水、燃气、热力管道等各类管道安装工程的附属工程（井类、管道基础等）按2020 版《新疆维吾尔自治区建筑安装市政工程费用定额》中“市政工程各类管道工程、场站安装、路灯与配电工程”相应费率标准计取。","phys_page":1,"print_page":1,"parent":null},{"id":"Q025","section":"ch02-sec3","no":"三","name":"《自治区关于新冠病毒感染疫情防控期间房屋建筑和市政基础设施工程计价有关问题的指导意见》中常态化防控费用如何计取？","kind":"问答","content":"常态化疫情防控费发生时计入招标控制价，不发生不计取。施工现场严格落实《自治区房屋建筑和市政基础设施工程施工现场新冠肺炎疫情常态化防控工作导则（2022 版）》防控管理要求开展疫情防控工作的，编制招标控制价时，在安全文明施工费中增列；未按《自治区房屋建筑和市政基础设施工程施工现场新冠肺炎疫情常态化防控工作导则（2022 版）》要求开展疫情防控工作的，在编制招标控制价时不计取。招标控制价编制单位应按照自治区住房城乡建设厅质量安全部门的要求，调研施工现场防疫情况，严格按规定计入。","phys_page":2,"print_page":2,"parent":null},{"id":"Q026","section":"ch03-sec1","no":"1","name":"第五章混凝土及钢筋混凝土工程，关于构筑物模板工程量计算规则：“大型池槽等分别按基础、墙、板、梁、柱等有关规定计算”，其中“大型池槽”如何界定？","kind":"问答","content":"按外形尺寸计算，体积在1m³以上的池槽为大型池槽。","phys_page":1,"print_page":1,"parent":null},{"id":"Q027","section":"ch03-sec1","no":"2","name":"第十六章定额子目“16-183直流深井降水（井管深：20m）（钻孔D800）”、“16-184无砂混凝土管井点”、“16-185集水井”中各类泵的人工和机械消耗量定额编制时如何确定的？","kind":"问答","content":"在编制上述定额子目时，各类泵机械消耗量均按每天3 个台班，其中1/3 台班运转，其余为停滞备用，停滞台班费用根据价格折算计入运转台班消耗量内，人工消耗量按每天每人看泵10 台。","phys_page":1,"print_page":1,"parent":null},{"id":"Q028","section":"ch03-sec1","no":"3","name":"抽水机降水定额子目计算单位是㎡，工程量计算规则是什么？","kind":"问答","content":"抽水机降水区别不同的降水深度，按槽底面积计算工程量，执行相应定额。","phys_page":1,"print_page":1,"parent":null},{"id":"Q029","section":"ch03-sec1","no":"4","name":"现行定额中的钢筋工程没有区分构筑物类型，小型构件和小型池槽，其人工消耗量和机械台班量是否调整？","kind":"问答","content":"经调研构筑物、小型构件、小型池槽钢筋加工的难度，增加其人工、机械调整系数。调整系数如下表：","phys_page":2,"print_page":2,"parent":null},{"id":"Q030","section":"ch03-sec1","no":"5","name":"屋面采用水泥砂浆找平层并设置分格缝，是否在套用定额时还需考虑分格缝费用？","kind":"问答","content":"《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》中第十一章楼地面装饰工程定额子目“11-1～11-3 平面砂浆找平层”“11-4～11-6 细石混凝土找平层”中未考虑分隔缝的内容，若设计要求设置分格缝时，分格缝的相关工作内容另行计算。","phys_page":2,"print_page":2,"parent":null},{"id":"Q031","section":"ch03-sec1","no":"6","name":"变形缝主要包括建筑物的伸缩缝、沉降缝及抗震缝，适用于屋面、墙面、地基等部位，缝口断面与定额取定不同时，如何调整？","kind":"问答","content":"变形缝断面尺寸已列于定额说明中，若设计断面尺寸与定额取定不同时，主材用量允许调整，人工及辅材不变。调整量可按下式计算：主材调整后用量=（设计缝口断面面积÷定额缝口断面面积）×定额用量。","phys_page":2,"print_page":2,"parent":null},{"id":"Q032","section":"ch03-sec1","no":"7","name":"第十五章其他装饰工程第九节石材、瓷砖加工中石材开孔（15-218 开孔周长≤400mm、15-219 开孔周长≤800mm、15-220 开孔周长≤1000mm）和第五节浴厕配件中（15-121大理石台面面盆开孔）的适用范围分别是什么？","kind":"问答","content":"石材开孔是按现场零星加工考虑的项目，按开孔周长分别执行15-218 开孔周长≤400mm、15-219 开孔周长≤800mm、15-220 开孔周长≤1000mm 子目；石材台面面盆开孔执行浴厕配件中15-121 大理石台面面盆开孔子目。","phys_page":3,"print_page":3,"parent":null},{"id":"Q033","section":"ch03-sec1","no":"8","name":"第十六章措施项目说明第五条垂直运输工程第3 款“层高超过3.6m 者，应另计层高超高垂直运输增加费”在计算时如何执行？","kind":"问答","content":"本定额垂直运输项目是按3.6m 层高编制考虑的，当层高>3.6m 时，应计算该层超高垂直运输增加费，每超高1m 时，该层建筑面积增加10%或定额消耗量增加10%，超高不足1m 按1m 计算。","phys_page":3,"print_page":3,"parent":null},{"id":"Q034","section":"ch03-sec1","no":"9","name":"现浇混凝土梁、板、柱、墙支撑高度超过3.6m，每增加1m 时，可以计算增加支撑工程量，如超过高度不足1m 时，如何计算增加支撑工程量？","kind":"问答","content":"现浇现浇混凝土梁、板、柱、墙的支模高度（板面或地面、垫层面至上层结构板底的高度）按3.6m 综合考虑，超过3.6m 以上部分，其超高部分在0.5m 以内时不计算增加支撑工程量，超高部分在0.5m 以上时，可以计算增加支撑工程量。例一：计算框架梁模板工程量。设框架梁长10m，断面尺寸如下图示。第一步：根据工程量计算规则，应区别模板的不同材质，按混凝土与模板接触面的面积计算其工程量，套用相关定额。框架梁模板与混凝土接触面积=（0.8+0.3+0.7）×10=18㎡。第二步：计算梁的支撑高度超过3.6m 以上部分，套用相关定额。其中：H=0.8-0.2=0.6m＞0.5m，则应计算超高增加支撑工程量，套用相应定额。0.6×10=6㎡H=0.8-0.1-0.2=0.5m≤0.5m，故不再计算超高增加支撑工程量。例二：计算框架柱模板工程量。如下图所示。第一步：同理应区分模板的不同材质，按混凝土与模板接触面积，计算工程量，套用相关定额。如框架柱Z的模板与混凝土接触面积=（1×4）×5.4-（0.3×0.8）=21.36㎡第二步：计算柱Z的支撑高度超过3.6m以上部分：\n5.4-3.6=1.8m，套用“柱支撑高度超过3.6m 每增加1m”相应定额。如图示：第一次增加支撑工程量：1m 柱模板与混凝土接触面积=（1×4）×1=4㎡，套用相应定额乘以系数1。第二次增加支撑工程量：0.8m＞0.5m，故可再计算增加支撑工程量。0.8m 柱模板与混凝土接触面积=（1×4）×0.8-（0.3×0.8）=2.96㎡，套用相应定额乘以系数2。","phys_page":3,"print_page":3,"parent":null},{"id":"Q035","section":"ch03-sec2","no":"1","name":"在执行2020 版《新疆维吾尔自治区市政工程消耗量定额》时，各类管道工程中的附属工程如何取费？","kind":"问答","content":"市政工程的给水、排水、燃气、热力管道等各类管道安装工程的附属工程（井类、管道基础等）按2020 版《新疆维吾尔自治区建筑安装市政工程费用定额》中“市政工各类管道工程、场站安装、路灯与配电工程”相应费率标准计取。","phys_page":5,"print_page":5,"parent":null},{"id":"Q036","section":"ch03-sec2","no":"2","name":"我区2020 版建筑、安装、市政工程费用定额安全文明施工费费率表中无安装工程安全文明施工费费率。如若安装工程施工过程中投入了安全措施，如何计取？","kind":"问答","content":"安装工程在施工过程中投入安全措施费的，可依据经审定的安全文明施工方案计算工作量（或摊销量），单独计列，不参与取费，只计取税金。","phys_page":6,"print_page":6,"parent":null},{"id":"Q037","section":"ch03-sec3","no":null,"name":"《全国统一安装工程预算定额》（GYD-202-2000）竖直通道电缆敷设的适用范围？","kind":"问答","content":"竖直通道电缆敷设定额适用20m 以上的高层建筑（多层建筑六层以上、单层建筑物檐高20m 以上）、高塔等建筑物的竖直通道内敷设电缆时使用。","phys_page":6,"print_page":6,"parent":null},{"id":"Q038","section":"ch03-sec4","no":null,"name":"2014 版《新疆维吾尔自治区建筑安装工程补充消耗量定额》中，80m 以上框架结构住宅和100m 以上剪力墙结构住宅垂直运输子目如何套用？","kind":"问答","content":"按照该补充定额工程量计算规则第一款，以建筑物结构及檐高按建筑面积计算，取消该定额中层数的计量，调整为下表：","phys_page":6,"print_page":6,"parent":null},{"id":"Q039","section":"ch04-sec1","no":"1","name":"土石方外运工程量按天然密实体积计算还是按虚方计算？","kind":"问答","content":"土石方的开挖、运输均按开挖前的天然密实体积计算。","phys_page":1,"print_page":1,"parent":null},{"id":"Q040","section":"ch04-sec1","no":"2","name":"《房屋建筑与装饰工程消耗量定额》混凝土按预拌混凝土编制，当施工采用现场搅拌混凝土时，应如何换算执行？","kind":"问答","content":"当采用现场搅拌混凝土时，执行第五章混凝土及钢筋混凝土工程相应的“预拌混凝土”项目，并将“预拌混凝土”项目材料中的“预拌混凝土”替换为相应标号混凝土配合比材料，现场搅拌混凝土增加的人工费、机械费等执行“现场搅拌混凝土调整费”定额子目。","phys_page":1,"print_page":1,"parent":null},{"id":"Q041","section":"ch04-sec1","no":"3","name":"在执行2020 版《房屋建筑与装饰工程消耗量定额》计算铝板幕墙工程工程量时，窗户的折边和女儿墙的翻折部分铝板没有龙骨，只有铝单板打胶，是否需要计算工程量？","kind":"问答","content":"2020 版《房屋建筑与装饰工程消耗量定额》第十二章墙、柱面柱面装饰与隔断、幕墙工程工程量计算规则四、3 已明确“幕墙与建筑物的封顶、封边按设计图示尺寸以面积计算”。所以当窗户的折边和女儿墙的翻折部分铝板有设计要求时，应予以计算面积。","phys_page":1,"print_page":1,"parent":null},{"id":"Q042","section":"ch04-sec2","no":"1","name":"《新疆维吾尔自治区建筑安装市政工程费用定额》中没有单列扬尘污染防治费，此费用如何计取?","kind":"问答","content":"2020 版《费用定额》第6 页已对安全文明施工费包括的费用内容做出具体说明，其中环境保护费是指施工现场为达到环保部门要求所需要的包括施工现场扬尘污染防治、治理在内的各项费用，其费用已包括扬尘污染防治增加费，故不再另行计取。","phys_page":2,"print_page":2,"parent":null},{"id":"Q043","section":"ch04-sec2","no":"2","name":"检验试验配合费中是否包含对构件进行破坏性试验发生的构件材料费？","kind":"问答","content":"检验试验配合费是施工企业配合检测机构按规定进行建筑材料、构配件等试样的制作、封样、送检和其它为保证工程质量进行材料检验试验工作所发生的费用。不包括对构件做破坏性试验及其他特殊要求检验试验的费用。","phys_page":2,"print_page":2,"parent":null},{"id":"Q044","section":"ch04-sec3","no":"1","name":"关于2020 版安装工程砖结构和混凝土结构的配管剔堵槽、沟定额调整说明","kind":"问答","content":"现对砖结构和混凝土结构的配管剔堵槽、沟相关定额子目进行调整，具体消耗量的调整详见定额子目B10-114、B10-115、B10-116、B10-117。调整后的定额子目为2020 版《新疆维吾尔自治区安装工程补充消耗量定额》的补充。（1）砖结构配管剔堵槽、沟工作内容：划线、剔槽、堵抹、调运砂浆、清理等。计量单位：10m（2）混凝土结构配管剔堵槽、沟工作内容：划线、剔槽、堵抹、调运砂浆、清理等。计量单位：10m原《通用安装工程消耗量定额》（TY02-31-2015）第五册砖、混凝土槽沟定额子目5-2-1、5-2-2、5-2-3、5-2-4；第十册砖结构剔堵槽、沟定额子目10-11-157、10-11-158、10-11-159、10-11-160、10-11-161，混凝土结构剔堵槽、沟定额子目10-11-162、10-11-163、10-11-164、10-11-165、10-11-166，第十一册开槽定额子目11-4-1、11-4-2，共计16 条子目停止执行。","phys_page":2,"print_page":2,"parent":null},{"id":"Q045","section":"ch04-sec3","no":"2","name":"《通用安装工程消耗量定额》（TY02-31-2015）第五册、第十册、第十一册均有楼板、墙体打孔定额子目，在实际操作中应如何执行？","kind":"问答","content":"如需在混凝土楼板、混凝土墙体钻孔的，应根据开孔孔径的不同，执行《通用安装工程消耗量定额》（TY02-31-2015） <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 头部 ---------- */
$('#bk-title').textContent = D.book.title;
const ch = [];
ch.push(['卷键', D.book.volume_key]);
ch.push(['地区', D.book.region]);
ch.push(['年份', D.book.year + ' 版']);
ch.push(['页数', D.book.pages]);
['j1','j2','j3','j4'].forEach(k => ch.push(['源 '+k+' 指纹', D.inputs['source_sha12_'+k]]));
ch.push(['结构', D.sections.length + ' 节 / ' + D.items.length + ' 问 / ' + D.tables.length + ' 表']);
ch.push(['TOC 对账', D.toc.filter(t=>t.ok).length + '/' + D.toc.length, 'ok']);
$('#bk-chips').innerHTML = ch.map(c =>
  `<span class="chip${c[2]==='gray'?' gray':''}${c[2]==='warn'?' warn':''}">${esc(c[0])} ${esc(c[1])}</span>`).join('');

/* ---------- 树（章节 → 节 → 问答） ---------- */
const secById = {}; D.sections.forEach(s => secById[s.id] = s);
const itemsBySec = {};
D.items.forEach(it => { (itemsBySec[it.section] = itemsBySec[it.section] || []).push(it); });
const tree = $('#tree');
let html = '';
D.sections.forEach(s => {
  const grp = s.level === 1 ? s.title : (s.no ? s.no + '、' : '') + s.title;
  html += `<div class="grp${s.level===1?' l1':''}">${esc(grp)}` +
    (s.print_page!=null?` <span style="font-family:var(--mono);font-weight:400">P${s.print_page}</span>`:'') +
    `</div>`;
  (itemsBySec[s.id]||[]).forEach(it => {
    html += `<div class="it${it.parent?' sub':''}" data-id="${it.id}">` +
      `<span class="no">${esc(it.no||'')}</span><span>${esc(it.name.slice(0,24))}</span>` +
      `<span class="pg">${it.print_page!=null?'P'+it.print_page:''}</span></div>`;
  });
});
tree.innerHTML = html || '<div class="empty">无条目</div>';

/* ---------- 视图 ---------- */
const views = { 结构: renderTree, 表格: renderTables, 注文: renderNotes,
  目录对账: renderToc, 勘误表: renderErratas, 说明: renderAbout };
let curView = '结构', curId = null;
const nav = $('#nav');
nav.innerHTML = Object.keys(views).map(k =>
  `<button data-v="${k}"${k===curView?' class="on"':''}>${k}</button>`).join('');
nav.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curView = b.dataset.v;
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  views[curView]();
});
tree.addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  curId = it.dataset.id; curView = '结构';
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === '结构'));
  renderTree();
});

function tblRowsHtml(t) {
  return '<table class="tb"><tbody>' + t.rows.map(r =>
    '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') +
    '</tbody></table>';
}
function itemCard(it) {
  let h = `<div class="card" id="it-${it.id}"><h2>${esc(it.name)}` +
    `<span class="kd qa">${esc(it.kind||'问答')}</span></h2>` +
    `<div class="meta">${esc(it.id)} · 印页 P${it.print_page!=null?it.print_page:'—'} · 物理页 ${it.phys_page}` +
    (it.no?` · 编号 ${esc(it.no)}`:'') + `</div>`;
  if (it.content) h += `<div class="content">${esc(it.content)}</div>`;
  D.tables.filter(t => t.item_id === it.id).forEach(t => {
    h += `<div class="sec-h">${esc(t.caption)}<span class="sub">附表 ${t.id} · 印页 P${t.print_page}</span></div>` +
      tblRowsHtml(t);
  });
  return h + '</div>';
}
function renderTree() {
  const pane = $('#pane');
  if (!curId) {
    const first = tree.querySelector('.it');
    if (first) curId = first.dataset.id; else { pane.innerHTML = '<div class="empty">无条目</div>'; return; }
  }
  const it = D.items.find(x => x.id === curId);
  pane.innerHTML = it ? itemCard(it) : '<div class="empty">条目不存在</div>';
  const el = pane.querySelector('.card');
  if (el) el.scrollIntoView({block:'nearest'});
  tree.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x.dataset.id === curId));
  const on = tree.querySelector('.it.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function tblHtml(t) {
  const it = t.item_id ? D.items.find(x => x.id === t.item_id) : null;
  let h = `<div class="card"><h2>${esc(t.caption||'（无表题）')}` +
    `<span class="chip gray">${t.id}</span><span class="chip gray">印页 P${t.print_page}</span>` +
    `<span class="chip gray">物页 ${t.phys_page}</span></h2>`;
  if (it) h += `<div class="meta">隶属问答 ${esc(it.id)} · ${esc(it.name)}</div>`;
  return h + tblRowsHtml(t) + '</div>';
}
function renderTables() {
  $('#pane').innerHTML = D.tables.map(tblHtml).join('') || '<div class="empty">无表格</div>';
}
function renderNotes() {
  let h = '';
  if (!D.notes.length) h = '<div class="empty">无注文</div>';
  D.notes.forEach(n => {
    h += `<div class="card"><h2>${esc(n.no||'注')}<span class="chip gray">${esc(n.id)}</span></h2>` +
      `<div class="content">${esc(n.content)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderErratas() {
  let h = '<div class="card"><h2>官方勘误 overlay<span class="chip gray">errata_id 溯源 · 双值留痕</span></h2>';
  if (!D.erratas.length) {
    h += `<div class="note">本卷为问题解释问答合集，无自身勘误目标：解释三第五/六部分、解释四第四/五/六部分的勘误内容，` +
      `已按勘误 overlay 纪律（三态核对、erratas 表双值留痕）应用至 xj01《房屋建筑与装饰工程消耗量定额》、xj02（下册）、` +
      `xj03《建筑安装市政工程费用定额》、xj15《安装工程补充消耗量定额》、xj16《高海拔地区施工增加费用标准》对应位置。` +
      `各卷勘误台账见其 erratas 表（errata_id 溯源），互见说明见「注文」N001。</div>`;
  }
  h += '<table class="tb"><thead><tr><th style="width:88px">errata_id</th><th>类型</th><th>目标</th>' +
    '<th>误值</th><th>正值</th><th style="width:76px">状态</th></tr></thead><tbody>';
  D.erratas.forEach(e => {
    h += `<tr><td style="font-family:var(--mono);font-size:12px">${esc(e.errata_id)}</td>` +
      `<td>${esc(e.errata_type)}</td><td>${esc(e.target_desc)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(e.wrong_text)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(e.correct_text)}</td>` +
      `<td class="${e.status==='applied'||e.status==='applied_bare'?'ok':e.status==='issue'?'bad':''}">${esc(e.status)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h;
}
function renderToc() {
  let h = '<div class="card"><h2>目录条目与正文对账<span class="chip gray">章节/节起始页</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:40px">#</th><th>层级</th><th>标题</th>' +
    '<th style="width:64px">目录页</th><th style="width:72px">正文页</th><th style="width:56px">吻合</th></tr></thead><tbody>';
  D.toc.forEach((e, i) => {
    h += `<tr><td>${i+1}</td><td>${e.level===1?'章':'节'}</td><td>${esc(e.title)}</td>` +
      `<td>P${e.print_page}</td><td>${e.matched_section?'P'+e.actual_page:'—'}</td>` +
      `<td class="${e.ok?'ok':'bad'}">${e.ok?'✓':'✗'}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h;
}
function renderAbout() {
  $('#pane').innerHTML = `
  <div class="note">忠实层铁律：本页所有文本均来自四份官方解释 PDF 文本层（pymupdf find_tables 坐标级重建四张系数/定额表，正文文本流顺序错乱已按坐标归位；小字号数字 span 按上标映射 m³/m²）；疑点一律留痕不臆补。勘误 overlay：官方勘误（解释三第五/六部分、解释四第四/五/六部分）已应用至 xj01/xj02/xj03/xj15/xj16 对应卷，本卷 erratas 恒空、互见注 N001 说明去向。</div>
  <div class="grid2">
    <div class="card"><h2>结构统计</h2><table class="tb"><tbody>
      <tr><th>目录条目</th><td>${D.toc.length}（页吻合 ${D.toc.filter(t=>t.ok).length}/${D.toc.length}）</td></tr>
      <tr><th>章（解释一~四）</th><td>${D.sections.filter(s=>s.level===1).length}</td></tr>
      <tr><th>节</th><td>${D.sections.filter(s=>s.level===2).length}</td></tr>
      <tr><th>问答</th><td>${D.items.length}（均 kind=问答）</td></tr>
      <tr><th>表格</th><td>${D.tables.length}（T001 钢筋调整系数 / T002 2014版垂直运输 / T003-T004 B10-114~117）</td></tr>
      <tr><th>注文</th><td>${D.notes.length}（互见/图示/同源）</td></tr>
      <tr><th>勘误 overlay</th><td>${D.erratas.length} 条（本卷无勘误目标，已应用至对应卷）</td></tr>
    </tbody></table></div>
    <div class="card"><h2>指纹</h2><table class="tb"><tbody>
      ${['j1','j2','j3','j4'].map(k =>
        `<tr><th>源 PDF ${k}</th><td style="font-family:var(--mono)">${esc(D.inputs['source_sha12_'+k])}</td></tr>`).join('')}
      <tr><th>schema</th><td>${esc(D.schema)}</td></tr>
    </tbody></table></div>
  </div>`;
}
views[curView]();
</script>
</body>
</html>
