混砂浆罐式搅拌机调整为200L灰浆搅拌机,台班含量不变-(2)使用湿拌预拌砂浆的,除将定额中的干混预拌砂浆调整为湿拌预拌砂浆外,另按相应定额中每立方米砂浆扣除0.2 工日,并扣除干混砂浆罐式搅拌机台班数量-6.本定额的周转材料按摊销量进行编制,已包括回库维修的消耗量-7.对于用量少、低值易耗的零星材料,列为其他材料-"},{"pno":4,"text":"八、本定额中有关机械的说明及规定-1.本定额中的机械按常用机械、合理机械配备和施工企业的机械化装备程度,并结合我区工程实际综合确定-2.本定额的机械台班消耗量是按正常机械施工工效并考虑机械幅度差综合确定,每台班按8 小时工作制计算-3.凡单位价值2000 元以内、使用年限在一年以内的不构成固定资产的施工机械,不列入机械台班消耗量,作为工具用具在建筑安装工程费中的企业管理费考虑,其消耗的燃料动力等已列入材料内-"},{"pno":4,"text":"九、本定额按建筑面积计算的综合脚手架、垂直运输等,是按一个整体工程考虑的,如遇建筑与装饰分别发包,则应根据工程具体情况确定划分比例-"},{"pno":4,"text":"十、本定额的工作内容已说明了主要的施工工序,次要工序虽未一一列出,但均已包括在内-"},{"pno":4,"text":"十一、本定额中遇有两个或两个以上系数时,按连乘法计算-"},{"pno":4,"text":"十二、本定额凡注明+××以内,或+××以下,的,均包括+××,本身; 注明+××以外,或+××以上,的,则不包括+××,本身-"},{"pno":5,"text":"十三、本定额中未注明或省略的尺寸单位,均为+mm,-"},{"pno":5,"text":"十四、本定额与' 新疆维吾尔自治区建筑、安装、市政工程费用定额( (2020 版) 配套使用-"},{"pno":5,"text":"十五、本说明未尽事宜,详见各章说明及附注-"}],"rules":[],"items":[],"n_items":0},{"vol":1,"no":1,"title":"装配式混凝土结构工程","raw_title":"第一章装配式混凝土结构工程","print_page":1,"sections":[{"title":"一、预制混凝土构件安装","pno":10},{"title":"二、后浇混凝土浇捣","pno":10}],"explain":[{"pno":11,"text":"1.构件安装不分构件外形尺寸、截面类型以及是否带有保温,除另有规定者外,均按构件种类套用相应定额-"},{"pno":11,"text":"2.构件安装定额已包括构件固定所需临时支撑的搭设及拆除,支撑(含支撑用预埋铁件)种类、数量及搭设方式已综合考虑-"},{"pno":11,"text":"3.柱、墙板、女儿墙等构件安装定额中,构件底部座浆按砌筑砂浆铺筑考虑,遇设计采用灌浆料的,除灌浆材料单价换算以及扣除干混砂浆罐式搅拌机台班外,每10m3 构件安装定额另行增加人工0.7 工日,其余不变-"},{"pno":11,"text":"4.外挂墙板、女儿墙构件安装设计要求接缝处填充保温板时,相应保温板消耗量按设计要求增加计算,其余不变-"},{"pno":11,"text":"5.墙板安装定额不分是否带有门窗洞口,均按相应定额执行- 凸(飘)窗安装定额适用于单独预制的凸(飘)窗安装;依附于外墙板制作的凸(飘)窗,并入外墙板内计算,相应定额人工和机械用量乘以系数1.2-"},{"pno":11,"text":"6.外挂墙板安装定额已综合考虑了不同的连接方式,按构件类型及厚度不同套用相应定额-"},{"pno":11,"text":"7.楼梯休息平台安装按平台板结构类型不同,分别套用整体楼板或叠合楼板相应定额,相应定额人工、机械,以及除预制混凝土楼板外的材料用量乘以系数1.3-"},{"pno":11,"text":"8.阳台板安装不分板式或梁式,均套用同一定额- 空调板安装定额适用于单独预制的空调板安装,依附于阳台板制作的栏板、翻沿、空调板,并入阳台板内计算- 非悬挑的阳台板安装,分别按梁、板安装有关规则计算并套用相应定额-"},{"pno":11,"text":"9.女儿墙安装按构件净高以0.6m以内和1.4m以内分别编制,1.4m以上时套用外墙板安装定额- 压顶安装定额适用于单独预制的压顶安装,依附于女儿墙制作的压顶,并入女儿墙计算-"},{"pno":11,"text":"10.套筒注浆不分部位、方向,按锚入套筒内的钢筋直径不同,以Φ18 以内及Φ18 以上分别编制-4新疆维吾尔自治区装配式建筑工程消耗量定额(试行)"},{"pno":11,"text":"11.嵌缝、打胶定额中注胶缝的断面按20mm×15mm编制,若设计断面与定额不同时,密封胶用量按比例调整,其余不变- 定额中的密封胶按硅酮耐候胶考虑,遇设计采用的种类与定额不同时,材料单价进行换算-"},{"pno":11,"text":"12.安装中的其他构件是指未列项目且单件体积小于等于0.3m3 的小型构件- 体积大于0.3m3 的构件,套用相应的构件定额子目-四、后浇混凝土浇捣"},{"pno":11,"text":"1.后浇混凝土指装配整体式结构中,用于与预制混凝土构件连接形成整体构件的现场浇筑混凝土-"},{"pno":11,"text":"2.叠合楼板或整体楼板之间设计采用现浇混凝土板带拼缝的,板带混凝土浇捣并入后浇混凝土叠合梁、板内计算-"},{"pno":11,"text":"3.墙板或柱等预制垂直构件之间设计采用现浇混凝土墙连接的,当连接墙的长度在2m以内时,套用后浇混凝土连接墙、柱定额,长度超过2m的,仍按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+混凝土及钢筋混凝土工程,的相应项目及规定执行-"},{"pno":11,"text":"4.后浇混凝土钢筋制作、安装定额按钢筋品种、型号、规格结合连接方法及用途划分,相应定额内的钢筋型号以及比例已综合考虑,各类钢筋的制作成型、绑扎、安装、接头、固定以及与预制构件外露钢筋的绑扎、焊接等所用人工、材料、机械消耗已综合考虑在相应定额内-钢筋机械接头按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额( (2020 版) +混凝土及钢筋混凝土工程,的相应项目及规定执行-"},{"pno":11,"text":"5.后浇混凝土模板定额消耗量中已包含了伸出后浇混凝土与预制构件抱合部分模板的用量-第一章装配式混凝土结构工程"}],"rules":[{"pno":11,"text":"1.构件安装工程量按成品构件设计图示尺寸的实体积以+m3,计算,依附于构件制作的各类保温层、饰面层的体积并入相应构件安装中计算,不扣除构件内钢筋、预埋铁件、配管、套管、线盒及单个面积≤0.3m2 的孔洞、线箱等所占体积,构件外露钢筋体积亦不再增加-"},{"pno":11,"text":"2.套筒注浆按设计数量以+个,计算-"},{"pno":11,"text":"3.外墙嵌缝、打胶按构件外墙接缝的设计图示尺寸的长度以+m,计算-二、后浇混凝土浇捣"},{"pno":11,"text":"1.后浇混凝土浇捣工程量按设计图示尺寸以实体积计算,不扣除混凝土内钢筋、预埋铁件及单个面积≤0.3m2 的孔洞等所占体积-"},{"pno":11,"text":"2.后浇混凝土钢筋工程量按设计图示钢筋的长度、数量乘以钢筋单位理论质量计算,其中$(1)钢筋接头的数量应按设计图示及规范要求计算;设计图示及规范要求未标明的,Φ10 以内的长钢筋按每12m计算一个钢筋接头,Φ10 以上的长钢筋按每9m计算一个钢筋接头-(2)钢筋接头的搭接长度应按设计图示及规范要求计算,如设计要求钢筋接头采用机械连接、电渣压力焊及气压焊时,按数量计算,不再计算该处的钢筋搭接长度-(3)钢筋工程量应包括双层及多层钢筋的+铁马, 数量,不包括预制构件外露钢筋的数量-"},{"pno":11,"text":"3.后浇混凝土模板工程量按后浇混凝土与模板接触面的面积以+m2,计算,伸出后浇混凝土与预制构件抱合部分的模板面积不增加计算- 不扣除后浇混凝土墙、板上单孔面积≤"},{"pno":11,"text":"0.3m2 的孔洞,洞侧壁模板亦不增加;应扣除单孔面积>0.3m2 的孔洞,孔洞侧壁模板面积并入相应的墙、板模板工程量内计算-"},{"pno":11,"text":"4.钢管束腔内灌注自密实混凝土,按腔内尺寸以体积计算,不扣除上下腔连接处的钢筋等所占体积-"}],"items":["1-1","1-2","1-3","1-4","1-5","1-6","1-7","1-8","1-9","1-10","1-11","1-12","1-13","1-14","1-15","1-16","1-17","1-18","1-19","1-20","1-21","1-22","1-23","1-24","1-25","1-26","1-27","1-28","1-29","1-30","1-31","1-32","1-33","1-34","1-35","1-36","1-37","1-38","1-39","1-40","1-41","1-42","1-43","1-44","1-45","1-46","1-47","1-48","1-49","1-50","1-51","1-52","1-53"],"n_items":53},{"vol":1,"no":2,"title":"装配式钢结构工程","raw_title":"第二章装配式钢结构工程","print_page":17,"sections":[{"title":"一、预制钢构件安装","pno":26},{"title":"二、围护体系安装","pno":26}],"explain":[{"pno":27,"text":"1.构件安装定额中预制钢构件以外购成品到场编制,不再考虑施工损耗和场外运输-构件安装场内转运水平距离按300m考虑-"},{"pno":27,"text":"2.预制钢构件安装,按构件种类、重量不同分别套用定额-"},{"pno":27,"text":"3.本定额已包括了施工企业按照质量验收规范要求所需的超声波探伤费用,如设计要求X光拍片、磁粉探伤等检测,执行本章相应定额子目-"},{"pno":27,"text":"4.不锈钢螺栓球网架安装套用螺栓球节点网架安装定额,同时取消定额中油漆及稀释剂含量,人工消耗量乘以系数0.95-"},{"pno":27,"text":"5.钢支座定额适用于单独成品支座安装-"},{"pno":27,"text":"6.厂(库)房钢结构的柱间支撑、屋面支撑、系杆、撑杆、隅撑、檩条、墙梁、钢天窗架、通风器支架、钢天沟支架、钢板天沟等安装套用+钢支撑等其他构件,安装定额- 钢墙架柱、钢墙架梁和配套连接杆件套用钢墙架(挡风架)安装定额-"},{"pno":27,"text":"7.零星钢构件安装定额适用于本章未列项目且单件重量在50kg以内的小型构件- 其他钢结构的钢平台、钢走道及零星钢构件安装套用厂(库)房钢结构的钢平台、钢走道及零星钢构件安装定额,同时定额中汽车式起重机消耗量乘以系数0.20-"},{"pno":27,"text":"8.其他钢结构安装定额内的汽车式起重机台班用量为钢构件现场转运消耗量,垂直运输按本定额+第五章措施项目,相应项目执行-"},{"pno":27,"text":"9.组合钢板剪力墙安装套用其他钢结构3t以内钢柱安装定额,相应定额人工、机械及除预制钢柱外的材料用量乘以系数1.50-新疆维吾尔自治区装配式建筑工程消耗量定额(试行)"},{"pno":27,"text":"10.钢网架安装按平面网格网架安装考虑,如设计为筒壳、球壳及其他曲面结构时,安装人工、机械乘以系数1.20-"},{"pno":27,"text":"11.钢桁架安装按直线型桁架安装考虑,如设计为曲线、折线型或其他非直线型桁架,安装人工、机械乘以系数1.20-"},{"pno":27,"text":"12.螺旋形楼梯安装套用踏步式楼梯安装定额,人工、机械乘以系数1.30-"},{"pno":27,"text":"13.钢构件安装项目中已考虑现场拼装费用,但未考虑分块或整体吊装的钢网架、钢桁架地面平台拼装摊销,如发生套用现场拼装平台摊销定额项目-"},{"pno":27,"text":"14.厂(库)房钢结构安装机械按常规方案综合考虑,实际发生不同时均按定额执行,不做调整,另有规定或特殊要求者除外-"},{"pno":27,"text":"15.螺栓(高强螺栓、剪力栓钉、花篮螺栓)安装,设计使用的材料强度等级、规格与定额不同时,可按设计图纸进行调整换算,用量不变-"},{"pno":27,"text":"16.钢结构构件按设计要求或经审批的施工方案需加温预热处理时,执行液化气预热、后热与整体热处理定额子目-五、围护体系安装"},{"pno":27,"text":"1.钢楼(承)板混凝土浇捣所需收边板的用量,均已包括在相应定额的消耗量中,不单独计算-"},{"pno":27,"text":"2.屋面板、墙面板安装所需要的包角、包边、窗台泛水等用量,均已包括在相应定额的消耗量中,不单独计算-"},{"pno":27,"text":"3.墙面板安装按竖装考虑,如发生横向铺设,按相应定额子目人工、机械乘以1.20-"},{"pno":27,"text":"4.屋面保温棉已考虑铺设需要的钢丝网费用,如不发生,扣除不锈钢丝含量,同时按1工日(100m2 予以扣减人工消耗量-"},{"pno":27,"text":"5.本章屋面墙面保温棉铺设按50mm列入,实际铺设厚度不同时可以换算-"},{"pno":27,"text":"6.硅酸钙板灌浆墙面板定额中施工需要的包角、包边、窗台泛水等硅酸钙板用量,均已包含在相应定额的消耗量中,不单独计算-"},{"pno":27,"text":"7.+增加一道硅酸钙板,定额项目是指在预制轻钢龙骨隔墙板外所进行的面层补板-"},{"pno":27,"text":"8.硅酸钙板墙面板项目中双面隔墙定额墙体厚度按180mm、镀锌钢龙骨按15kg(m2 编制,设计与定额不同时材料调整换算-"},{"pno":27,"text":"9.蒸压砂加气保温块贴面按60mm考虑,如发生厚度变化,相应保温块用量调整-"},{"pno":27,"text":"10.钢楼(承)板如因天棚施工需要拆除,增加拆除用工0.15 工日(m2-"},{"pno":27,"text":"11.钢楼(承)板安装需要增设的临时支撑消耗量定额中未考虑,如有发生另行计算-"},{"pno":27,"text":"12.围护体系中的屋面板子目适用于金属结构屋面工程,如为其他屋面套用'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+第九章屋面及防水工程,相应定额-"},{"pno":27,"text":"13.保温岩棉铺设仅限于硅酸钙板墙面板配套使用,蒸压砂加气保温块贴面子目仅用第二章装配式钢结构工程于组合钢板墙体配套使用,屋面墙面玻纤保温棉子目配合钢结构围护体系使用,如为其他形式保温套用'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+第十章保温、隔热、防腐工程,相应定额- 硅酸钙板包梁包柱仅用于钢结构配套使用-"},{"pno":27,"text":"14.不锈钢天沟、彩钢板天沟展开宽度为600mm,若实际展开宽度与定额不同时,板材按比例调整,其他不变-新疆维吾尔自治区装配式建筑工程消耗量定额(试行)"}],"rules":[{"pno":27,"text":"1.构件安装工程量按成品构件的设计图示尺寸质量以+t,计算,钢支座以+套,计算,不扣除单个面积≤0.3m2 的孔洞质量,焊缝、铆钉、螺栓等不另增加质量-"},{"pno":27,"text":"2.钢网架工程量不扣除孔眼的质量,焊缝、铆钉等不另增加质量- 焊接空心球网架质量包括连接钢管杆件、连接球、支托和网架支座等零件的质量- 螺栓球节点网架质量包括连接钢管杆件(含高强螺栓、销子、套筒、锥头或封板)、螺栓球、支托和网架支座等零件的质量-"},{"pno":27,"text":"3.依附在钢柱上的牛腿及悬臂梁的质量等并入钢柱的质量内,钢柱上的柱脚板、加劲板、柱顶板、隔板和肋板并入钢柱工程量内-"},{"pno":27,"text":"4.钢管柱上的节点板、加强环、内衬板(管)、牛腿等并入钢管柱的质量内-"},{"pno":27,"text":"5.钢平台的工程量包括钢平台的柱、梁、板、斜撑等的质量,依附于钢平台上的钢扶梯及平台栏杆,并入钢平台工程量内-"},{"pno":27,"text":"6.钢楼梯的工程量包括楼梯平台、楼梯梁、楼梯踏步等的质量,钢楼梯上的扶手、栏杆并入钢楼梯工程量内-"},{"pno":27,"text":"7.钢吊车梁工程量包含吊车梁、制动梁、制动板、车档等-"},{"pno":27,"text":"8.钢构件现场拼装平台摊销工程量按实施拼装构件的工程量计算-"},{"pno":27,"text":"9.高强螺栓、栓钉、花篮螺栓等安装配件工程量按设计图示节点工程量计算-"},{"pno":27,"text":"10.加热处理工程量,按板材需焊接部位焊缝加热区域长度以+m,计算-"},{"pno":27,"text":"11.磁粉探伤,按设计图示探伤焊缝长度以+m,计算,X光探伤按被探件厚度不同,以实际拍片数量以+张,计算-二、围护体系安装"},{"pno":27,"text":"1.钢楼层板、屋面板按设计图示尺寸的铺设面积计算,不扣除单个面积≤0.3m2 的柱、垛及孔洞所占面积,屋面玻纤保温棉面积同单层压型钢板屋面板面积-"},{"pno":27,"text":"2.压型钢板、彩钢夹心板、采光板墙面板、墙面玻纤保温棉按设计图示尺寸以铺挂面积计算,不扣除单个面积≤0.3m2 孔洞所占面积,墙面玻纤保温棉面积同单层压型钢板墙面板面积-"},{"pno":27,"text":"3.预制轻钢龙骨隔墙板、硅酸钙板墙面板按设计图示尺寸的墙体面积以+m2,计算,不扣除单个面积≤0.3m2 孔洞所占面积;预制轻钢龙骨隔墙中增贴硅酸钙板的工程量按设计第二章装配式钢结构工程需增贴的面积以+m2,计算-"},{"pno":27,"text":"4.保温岩棉铺设、EPS 混凝土浇灌按设计图示尺寸的铺设或浇灌体积以+m3,计算,不扣除单个面积≤0.3m2 孔洞所占体积-"},{"pno":27,"text":"5.硅酸钙板包柱、包梁及蒸压砂加气保温块贴面工程量按钢构件设计断面周长乘以构件长度,以+m2,计算-"},{"pno":27,"text":"6.钢板天沟按设计图示尺寸以质量计算,依附天沟的型钢并入天沟的质量内计算;不锈钢天沟、彩钢板天沟按设计图示尺寸以长度计算-"}],"items":["2-1","2-2","2-3","2-4","2-5","2-6","2-7","2-8","2-9","2-10","2-11","2-12","2-13","2-14","2-15","2-16","2-17","2-18","2-19","2-20","2-21","2-22","2-23","2-24","2-25","2-26","2-27","2-28","2-29","2-30","2-31","2-32","2-33","2-34","2-35","2-36","2-37","2-38","2-39","2-40","2-41","2-42","2-43","2-44","2-45","2-46","2-47","2-48","2-49","2-50","2-51","2-52","2-53","2-54","2-55","2-56","2-57","2-58","2-59","2-60","2-61","2-62","2-63","2-64","2-65","2-66","2-67","2-68","2-69","2-70","2-71","2-72","2-73","2-74","2-75","2-76","2-77","2-78","2-79","2-80","2-81","2-82","2-83","2-84","2-85","2-86","2-87"],"n_items":87},{"vol":1,"no":3,"title":"装配式木结构工程","raw_title":"第三章装配式木结构工程","print_page":45,"sections":[{"title":"一、预制木构件安装","pno":54},{"title":"二、围护体系安装","pno":54}],"explain":[{"pno":55,"text":"1.地梁板安装定额已包括底部防水卷材的内容,按墙体厚度不同套用相应定额-"},{"pno":55,"text":"2.木构件安装定额已包括构件固定所需临时支撑的搭设及拆除,支撑种类、数量及搭设方式综合考虑-"},{"pno":55,"text":"3.柱、梁安装定额不分截面形式,按材质和截面积不同套用相应定额-"},{"pno":55,"text":"4.墙体木骨架安装按墙体厚度不同套用相应定额,定额中已包括了底梁板、顶梁板和墙体龙骨安装等内容- 墙体龙骨间距按400mm编制,设计与定额不同时应进行调整-"},{"pno":55,"text":"5.楼板格栅安装按格栅跨度不同套用相应定额,其中跨度5m以内按木格栅,5m以上按桁架格栅进行编制- 定额中楼面设计活荷载标准值为2.0kN(m2,如遇卫生间、露台等部位设计活荷载超过2.0kN(m2 时,定额乘以系数-"},{"pno":55,"text":"6.平撑、剪刀撑以及封头板的用量已包括在楼板格栅定额中,不另单独计算- 地面格栅和平屋面格栅套用楼板格栅相应定额-"},{"pno":55,"text":"7.桁架安装不分直角形、人字形等形式,均套用桁架定额-"},{"pno":55,"text":"8.屋面板安装根据屋面形式不同,按两坡以内和两坡以上分别套用相应定额-"},{"pno":55,"text":"9.预制木构件的防腐、油漆等费用应在成品价格内包含;若成品价格未包含防腐、油漆等费用,另按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+油漆、涂料、裱糊工程,的相应项目及规定执行-四、围护体系安装"},{"pno":55,"text":"1.石膏板铺设定额按单层安装编制,设计为双层安装时,其工程量乘以2-"},{"pno":55,"text":"2.呼吸纸铺设定额中,对施工过程中产生的搭接、拼缝、压边等已综合考虑,不另单独计算-五、装配式木结构安装过程中涉及的基础梁预埋锚栓、外墙保温、屋面防水涂料等内容,按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)的相应项目及规定执行-新疆维吾尔自治区装配式建筑工程消耗量定额(试行)"}],"rules":[{"pno":55,"text":"1.地梁板安装按设计图示尺寸以长度计算-"},{"pno":55,"text":"2.木柱、木梁按设计图示尺寸以体积计算-"},{"pno":55,"text":"3.墙体木骨架及墙面板安装按设计图示尺寸以面积计算,不扣除≤0.3m2 的孔洞所占面积,由此产生的孔洞加固板也不另增加- 其中,墙体木骨架安装应扣除结构柱所占的面积-"},{"pno":55,"text":"4.楼板格栅及楼面板安装按设计图示尺寸以面积计算,不扣除≤0.3m2 的洞口所占面积,由此产生的洞口加固板也不另增加- 其中,楼板格栅安装应扣除结构梁所占的面积-"},{"pno":55,"text":"5.格栅挂件按设计图示数量以套计算-"},{"pno":55,"text":"6.木楼梯安装按设计图示尺寸以水平投影面积计算,不扣除宽度≤500mm的楼梯井,伸入墙内部分不计算-"},{"pno":55,"text":"7.屋面椽条和桁架安装按设计图示尺寸以实体积计算,不扣除切肢、切角部分所占体积- 屋面板安装按设计图示尺寸以展开面积计算-"},{"pno":55,"text":"8.封檐板安装按设计图示尺寸以檐口外围长度计算-二、围护体系安装"},{"pno":55,"text":"1.石膏板、呼吸纸铺设按设计图示尺寸以面积计算,不扣除≤0.3m2 的孔洞所占面积-"},{"pno":55,"text":"2.岩棉铺设安装定额按设计图示尺寸以体积计算-"}],"items":["3-1","3-2","3-3","3-4","3-5","3-6","3-7","3-8","3-9","3-10","3-11","3-12","3-13","3-14","3-15","3-16","3-17","3-18","3-19","3-20","3-21","3-22","3-23","3-24","3-25","3-26","3-27","3-28","3-29","3-30","3-31"],"n_items":31},{"vol":1,"no":4,"title":"建筑构件及部品工程","raw_title":"第四章建筑构件及部品工程","print_page":55,"sections":[{"title":"一、单元式幕墙安装","pno":64},{"title":"二、非承重隔墙安装","pno":64},{"title":"三、预制烟道及通风道安装","pno":64},{"title":"四、预制成品护栏安装","pno":64},{"title":"五、装饰成品部件安装","pno":64}],"explain":[{"pno":65,"text":"1.本章定额中的单元式幕墙是指由各种面板与支承框架在工厂制成、形成完整的幕墙结构基本单位后,运至施工现场直接安装在主体结构上的建筑幕墙-"},{"pno":65,"text":"2.单元式幕墙安装按安装高度不同,分别套用相应定额- 单元式幕墙的安装高度是指室外设计地坪至幕墙顶部标高之间的垂直高度,单元式幕墙安装定额已综合考虑幕墙单元板块的规格尺寸、材质和面层材料不同等因素- 同一建筑物的幕墙顶部标高不同时,应按不同高度的垂直界面计算并套用相应定额-"},{"pno":65,"text":"3.单元式幕墙设计为曲面或者斜面(倾斜角度大于30T)时,安装定额中人工消耗量乘以系数1.15- 单元板块面层材料的材质不同时,可调整单元板块主材单价,其他不变-"},{"pno":65,"text":"4.如设计防火隔断中的镀锌钢板规格、含量与定额不同时,可按设计要求调整钢板主材价格,其他不变-三、非承重隔墙安装"},{"pno":65,"text":"1.非承重隔墙安装按板材材质,划分为钢丝网架轻质夹心隔墙板安装、轻质条板隔墙安装以及轻质陶瓷隔墙板安装三类,各类板材按板材厚度分设定额项目-"},{"pno":65,"text":"2.非承重隔墙安装按单层墙板安装进行编制,如遇设计为双层墙板时,根据双层墙板各自的墙板厚度不同,分别套用相应单层墙板安装定额- 若双层墙板中间设置保温、隔热或者隔声功能层的,发生时另行计算-"},{"pno":65,"text":"3.非承重隔墙板安装定额已包括各类固定配件、补(填)缝、抗裂措施构造,以及板材遇门窗洞口所需切割改锯、孔洞加固的内容,发生时不另计算-"},{"pno":65,"text":"4.钢丝网架轻质夹心隔墙板安装定额中的板材,按聚苯乙烯泡沫夹心板编制,设计不同时可换算墙板主材,其他消耗量保持不变-四、预制烟道及通风道安装"},{"pno":65,"text":"1.预制烟道、通风道安装子目未包含进气口、支管、接口件的材料及安装人工消耗量-"},{"pno":65,"text":"2.预制烟道、通风道安装子目按照构件断面外包周长划分子目- 如设计烟道、通风道规格与定额不同时,可按设计要求调整烟道、通风道规格及主材价格,其他不变-"},{"pno":65,"text":"3.成品风帽安装按材质不同划分为混凝土及钢制两类子目-新疆维吾尔自治区装配式建筑工程消耗量定额(试行)五、预制成品护栏安装预制成品护栏安装定额按护栏高度1.4m以内编制,护栏高度超过1.4m时,相应定额人工及除预制栏杆外的材料乘以系数1.1,其余不变-六、装饰成品部件安装"},{"pno":65,"text":"1.装饰成品部件涉及基层施工的,另按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)相应项目执行-"},{"pno":65,"text":"2.成品踢脚线安装定额根据踢脚线材质不同,以直形踢脚线进行编制- 遇弧形踢脚线时,相应定额人工消耗量乘以系数1.1,其余不变-"},{"pno":65,"text":"3.墙面成品木饰面面层安装以墙面形状不同划分为直形、弧形,发生时分别套用相应定额-"},{"pno":65,"text":"4.成品木门安装定额以门的开启方式、安装方法不同进行划分,相应定额均已包括相配套的门套安装;成品木质门(窗)套安装定额按门(窗)套的展开宽度不同分别进行编制,适用于单独门(窗)套的安装- 成品木门(带门套)及单独安装的成品木质门(窗)套定额中,已包括了相应的贴脸及装饰线条安装人工及材料消耗量,不另单独计算-"},{"pno":65,"text":"5.成品木门安装定额中的五金件,设计规格和数量与定额不同时,应进行调整换算-"},{"pno":65,"text":"6.成品橱柜安装按上柜、下柜及台面板进行划分,分别套用相应定额- 定额中不包括洁具五金、厨具电器等的安装,发生时另行计算-"},{"pno":65,"text":"7.成品橱柜台面板安装定额中已包含材料磨边及金属面板折边,不包括面板开孔;如设计的成品台面板材质与定额不同时,可换算台面板材料,其他不变-"},{"pno":65,"text":"8.成品楼地面安装按面层与基层分别编制,其中基层分为采暖模块与非采暖模块,执行时应分别套用相应定额子目- 采暖地面基层定额子目中已包括地暖加热管安装-第四章建筑构件及部品工程"}],"rules":[{"pno":65,"text":"1.单元式幕墙安装工程量按单元板块组合后设计图示尺寸的外围面积以+m2,计算,不扣除依附于幕墙板块制作的窗、洞口所占的面积-"},{"pno":65,"text":"2.防火隔断安装工程量按设计图示尺寸的投影面积以+m2,计算-"},{"pno":65,"text":"3.槽形预埋件及T形转换螺栓安装的工程量按设计图示数量以+个,计算-二、非承重隔墙安装"},{"pno":65,"text":"1.非承重隔墙安装工程量按设计图示尺寸的墙体面积以+m2,计算,应扣除门窗、洞口、嵌入墙内的钢筋混凝土柱、梁、圈梁等所占体积,不扣除梁头、板头、檩头、垫木、木楞头、沿缘木、木砖、门窗走头、砖墙内加固钢筋、木筋、铁件、钢管及单个面积≤0.3m2 的孔洞所占的体积-"},{"pno":65,"text":"2.非承重隔墙安装遇设计为双层墙板时,其工程量按单层面积乘以2 计算-三、预制烟道及通风道安装"},{"pno":65,"text":"1.预制烟道、通风道安装工程量按图示长度以+m,计算-"},{"pno":65,"text":"2.成品风帽安装工程量按设计图示数量以+个,计算-四、预制成品护栏安装预制成品护栏安装工程量按设计图示尺寸的中心线长度以+m,计算-五、装饰成品部件安装"},{"pno":65,"text":"1.成品踢脚线安装工程量按设计图示长度以+m,计算-"},{"pno":65,"text":"2.墙面成品木饰面安装工程量按设计图示面积以+m2,计算-"},{"pno":65,"text":"3.带门套成品木门安装工程量按设计图示数量以+樘,计算,成品门(窗)套安装工程量按设计图示洞口尺寸以+m,计算"},{"pno":65,"text":"4.成品橱柜安装工程量按设计图示尺寸的柜体中线长度以+m,计算,成品台面板安装工程量按设计图示尺寸的板面中线长度以+m,计算,成品洗漱台柜、成品水槽安装工程量按设计图示数量以+组,计算-"},{"pno":65,"text":"5.成品楼地面基层及面层按设计图示尺寸以+m2,计算- 扣除凸出地面构筑物、设备基础、室内管道、地沟等所占面积,不扣除间壁墙(墙厚≤120mm)及≤0.3m2 柱、垛、附墙烟囱及孔洞所占面积- 空圈、暖气包槽、壁龛的开口部分不增加面积-新疆维吾尔自治区装配式建筑工程消耗量定额(试行)"},{"pno":65,"text":"6.卫生间成品防水底盘按设计图示尺寸以+m2,计算-"},{"pno":65,"text":"7.挡水坝按设计图示尺寸以+m,计算-"},{"pno":65,"text":"8.PE膜按设计图示尺寸以+m2,计算-"}],"items":["4-1","4-2","4-3","4-4","4-5","4-6","4-7","4-8","4-9","4-10","4-11","4-12","4-13","4-14","4-15","4-16","4-17","4-18","4-19","4-20","4-21","4-22","4-23","4-24","4-25","4-26","4-27","4-28","4-29","4-30","4-31","4-32","4-33","4-34","4-35","4-36","4-37","4-38","4-39","4-40","4-41","4-42","4-43","4-44","4-45","4-46","4-47","4-48","4-49","4-50","4-51","4-52","4-53","4-54"],"n_items":54},{"vol":1,"no":5,"title":"措施项目","raw_title":"第五章措施项目","print_page":71,"sections":[{"title":"一、工具式模板","pno":80},{"title":"二、脚手架工程","pno":80},{"title":"三、垂直运输","pno":80}],"explain":[{"pno":81,"text":"1.现浇混凝土柱(不含构造柱)、墙、梁(不含圈、过梁)、板是按高度(板面或地面、垫层面至上层板面的高度)3.6m综合考虑- 如遇斜板面结构时,柱分别按各柱的中心高度为准;墙按分段墙的平均高度为准;框架梁按每跨两端的支座平均高度为准;板(含梁板合计的梁)按高点与低点的平均高度为准- 高度超过3.6m时,超过部分增套相应3.6mN5m的超高支模增加项目- 高度超过5m时,按照批准的施工技术方案另行计算-"},{"pno":81,"text":"2.异形柱、梁,是指柱、梁的断面形状为L形、十字形、T形等的柱、梁- 圆形柱模板执行异形柱模板-"},{"pno":81,"text":"3.弧形梁指沿梁长度在水平方向成弧的梁- 弧形梁项目适用于半径≤12m的弧形梁,>12m的弧形梁执行矩形梁项目;有梁板的弧形梁及独立弧形梁按异形梁定额项目执行-"},{"pno":81,"text":"4.弧形墙模板按相应直形墙模板套用定额乘以系数1.15 计算-"},{"pno":81,"text":"5.整体楼梯模板已包含梯面的铝合金盖板-四、脚手架工程本章定额脚手架工程包括综合脚手架和工具式脚手架两部分-(一)综合脚手架综合脚手架包括外墙砌筑及外墙粉饰、3.6m以内的内墙砌筑及混凝土浇捣用脚手架以及内墙面和天棚粉饰脚手架- 对执行综合脚手架定额以外,还需另行计算单项脚手架费用的,按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额( (2020 版) +第十六章措施项目,的相应项目及规定执行-"},{"pno":81,"text":"1.装配式混凝土结构的综合脚手架按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+第十六章措施项目,相应项目乘以系数0.85 计算-新疆维吾尔自治区装配式建筑工程消耗量定额(试行)"},{"pno":81,"text":"2.装配式钢结构工程的综合脚手架按本章定额+措施项目,的相应项目及规定执行-(1)装配式钢结构单层厂房综合脚手架定额适用于檐高6m以内的钢结构建筑,若檐高超过6m,则按每增加1m定额计算-(2)装配式钢结构多层厂房综合脚手架定额适用于檐高20m以内且层高在6m以内的钢结构建筑,若檐高超过20m或层高超过6m,应分别按每增加1m定额计算-"},{"pno":81,"text":"3.装配式木结构工程的综合脚手架按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+第十六章措施项目,相应项目乘以系数0.85-"},{"pno":81,"text":"4.装配式混合结构工程的综合脚手架按'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+第十六章措施项目,相应项目乘以系数0.85 计算-"},{"pno":81,"text":"5.凡不适宜使用综合脚手架的项目,可按本章工具式脚手架及'新疆维吾尔自治区房屋建筑与装饰工程消耗量定额((2020 版)+第十六章措施项目,相应单项脚手架项目执行-(二)工具式脚手架工具式脚手架是指组成脚手架的架体结构和构配件为定型化标准化产品,可多次重复利用,按规定的程序组装和施工,包括附着式电动整体提升架和电动高空作业吊篮-"},{"pno":81,"text":"1.附着式电动整体提升架定额适用于高层建筑的外墙施工-"},{"pno":81,"text":"2.电动高空作业吊篮定额适用于外立面装饰用脚手架-五、垂直运输檐高3.6 米以内的单层建筑,不计算垂直运输机械台班-"},{"pno":81,"text":"1.装配式混凝土结构、装配式混合结构工程的垂直运输执行本章定额相应项目-"},{"pno":81,"text":"2.厂(库)房钢结构工程的垂直运输费 ,"text":"本定额是按正常施工条件和合理的劳动组织与工期安排,结合新疆维吾尔自治区内施工企业现阶段采用的施工方法、机械化程度进行编制的-","pno":4},{"no":"六","text":"本定额中有关人工的说明及规定-1.本定额的人工以综合用工考虑,分别以二类人工或三类人工表示-2.本定额的人工包括基本用工、超运距用工、辅助用工和人工幅度差-3.本定额的人工每工日按8 小时工作制计算-","pno":4},{"no":"七","text":"本定额中有关材料的说明及规定-1.本定额采用的材料(包括构配件、零件、半成品、成品)均为符合国家质量标准和相应设计要求的合格产品- 当设计材料品种及规格与本定额不同时,可进行换算-2.本定额中的材料包括施工中消耗的主要材料、辅助材料、周转材料和其他材料-3.本定额中材料消耗量包括净用量和损耗量- 损耗量包括$从工地仓库、现场集中堆放地点(或现场加工地点)至操作(或安装)地点的施工场内运输损耗、施工操作损耗、施工现场堆放损耗等,规范(设计文件)规定的预留量、搭接量不在损耗中考虑-4.定额中各类预制构配件均按成品构件现场安装进行编制-5.本定额中所使用的砂浆均按干混预拌砂浆编制,若实际使用现拌砂浆或湿拌预拌砂浆时按以下方法调整$(1)使用现拌砂浆的,除将定额中的干混预拌砂浆调整为现拌砂浆外,每立方米砂浆增加0.382 工日,同时将原定额中干混砂浆罐式搅拌机调整为200L灰浆搅拌机,台班含量不变-(2)使用湿拌预拌砂浆的,除将定额中的干混预拌砂浆调整为湿拌预拌砂浆外,另按相应定额中每立方米砂浆扣除0.2 工日,并扣除干混砂浆罐式搅拌机台班数量-6.本定额的周转材料按摊销量进行编制,已包括回库维修的消耗量-7.对于用量少、低值易耗的零星材料,列为其他材料-","pno":4},{"no":"八","text":"本定额中有关机械的说明及规定-1.本定额中的机械按常用机械、合理机械配备和施工企业的机械化装备程度,并结合我区工程实际综合确定-2.本定额的机械台班消耗量是按正常机械施工工效并考虑机械幅度差综合确定,每台班按8 小时工作制计算-3.凡单位价值2000 元以内、使用年限在一年以内的不构成固定资产的施工机械,不列入机械台班消耗量,作为工具用具在建筑安装工程费中的企业管理费考虑,其消耗的燃料动力等已列入材料内-","pno":4},{"no":"九","text":"本定额按建筑面积计算的综合脚手架、垂直运输等,是按一个整体工程考虑的,如遇建筑与装饰分别发包,则应根据工程具体情况确定划分比例-","pno":4},{"no":"十","text":"本定额的工作内容已说明了主要的施工工序,次要工序虽未一一列出,但均已包括在内-","pno":4},{"no":"十一","text":"本定额中遇有两个或两个以上系数时,按连乘法计算-","pno":4},{"no":"十二","text":"本定额凡注明+××以内,或+××以下,的,均包括+××,本身; 注明+××以外,或+××以上,的,则不包括+××,本身-","pno":4},{"no":"十三","text":"本定额中未注明或省略的尺寸单位,均为+mm,-","pno":5},{"no":"十四","text":"本定额与' 新疆维吾尔自治区建筑、安装、市政工程费用定额( (2020 版) 配套使用-","pno":5},{"no":"十五","text":"本说明未尽事宜,详见各章说明及附注-","pno":5}],"rules":[{"ch_no":1,"title":"装配式混凝土结构工程","text":"1.构件安装工程量按成品构件设计图示尺寸的实体积以+m3,计算,依附于构件制作的各类保温层、饰面层的体积并入相应构件安装中计算,不扣除构件内钢筋、预埋铁件、配管、套管、线盒及单个面积≤0.3m2 的孔洞、线箱等所占体积,构件外露钢筋体积亦不再增加-","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"2.套筒注浆按设计数量以+个,计算-","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"3.外墙嵌缝、打胶按构件外墙接缝的设计图示尺寸的长度以+m,计算-二、后浇混凝土浇捣","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"1.后浇混凝土浇捣工程量按设计图示尺寸以实体积计算,不扣除混凝土内钢筋、预埋铁件及单个面积≤0.3m2 的孔洞等所占体积-","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"2.后浇混凝土钢筋工程量按设计图示钢筋的长度、数量乘以钢筋单位理论质量计算,其中$(1)钢筋接头的数量应按设计图示及规范要求计算;设计图示及规范要求未标明的,Φ10 以内的长钢筋按每12m计算一个钢筋接头,Φ10 以上的长钢筋按每9m计算一个钢筋接头-(2)钢筋接头的搭接长度应按设计图示及规范要求计算,如设计要求钢筋接头采用机械连接、电渣压力焊及气压焊时,按数量计算,不再计算该处的钢筋搭接长度-(3)钢筋工程量应包括双层及多层钢筋的+铁马, 数量,不包括预制构件外露钢筋的数量-","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"3.后浇混凝土模板工程量按后浇混凝土与模板接触面的面积以+m2,计算,伸出后浇混凝土与预制构件抱合部分的模板面积不增加计算- 不扣除后浇混凝土墙、板上单孔面积≤","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"0.3m2 的孔洞,洞侧壁模板亦不增加;应扣除单孔面积>0.3m2 的孔洞,孔洞侧壁模板面积并入相应的墙、板模板工程量内计算-","pno":11},{"ch_no":1,"title":"装配式混凝土结构工程","text":"4.钢管束腔内灌注自密实混凝土,按腔内尺寸以体积计算,不扣除上下腔连接处的钢筋等所占体积-","pno":11},{"ch_no":2,"title":"装配式钢结构工程","text":"1.构件安装工程量按成品构件的设计图示尺寸质量以+t,计算,钢支座以+套,计算,不扣除单个面积≤0.3m2 的孔洞质量,焊缝、铆钉、螺栓等不另增加质量-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"2.钢网架工程量不扣除孔眼的质量,焊缝、铆钉等不另增加质量- 焊接空心球网架质量包括连接钢管杆件、连接球、支托和网架支座等零件的质量- 螺栓球节点网架质量包括连接钢管杆件(含高强螺栓、销子、套筒、锥头或封板)、螺栓球、支托和网架支座等零件的质量-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"3.依附在钢柱上的牛腿及悬臂梁的质量等并入钢柱的质量内,钢柱上的柱脚板、加劲板、柱顶板、隔板和肋板并入钢柱工程量内-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"4.钢管柱上的节点板、加强环、内衬板(管)、牛腿等并入钢管柱的质量内-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"5.钢平台的工程量包括钢平台的柱、梁、板、斜撑等的质量,依附于钢平台上的钢扶梯及平台栏杆,并入钢平台工程量内-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"6.钢楼梯的工程量包括楼梯平台、楼梯梁、楼梯踏步等的质量,钢楼梯上的扶手、栏杆并入钢楼梯工程量内-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"7.钢吊车梁工程量包含吊车梁、制动梁、制动板、车档等-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"8.钢构件现场拼装平台摊销工程量按实施拼装构件的工程量计算-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"9.高强螺栓、栓钉、花篮螺栓等安装配件工程量按设计图示节点工程量计算-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"10.加热处理工程量,按板材需焊接部位焊缝加热区域长度以+m,计算-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"11.磁粉探伤,按设计图示探伤焊缝长度以+m,计算,X光探伤按被探件厚度不同,以实际拍片数量以+张,计算-二、围护体系安装","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"1.钢楼层板、屋面板按设计图示尺寸的铺设面积计算,不扣除单个面积≤0.3m2 的柱、垛及孔洞所占面积,屋面玻纤保温棉面积同单层压型钢板屋面板面积-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"2.压型钢板、彩钢夹心板、采光板墙面板、墙面玻纤保温棉按设计图示尺寸以铺挂面积计算,不扣除单个面积≤0.3m2 孔洞所占面积,墙面玻纤保温棉面积同单层压型钢板墙面板面积-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"3.预制轻钢龙骨隔墙板、硅酸钙板墙面板按设计图示尺寸的墙体面积以+m2,计算,不扣除单个面积≤0.3m2 孔洞所占面积;预制轻钢龙骨隔墙中增贴硅酸钙板的工程量按设计第二章装配式钢结构工程需增贴的面积以+m2,计算-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"4.保温岩棉铺设、EPS 混凝土浇灌按设计图示尺寸的铺设或浇灌体积以+m3,计算,不扣除单个面积≤0.3m2 孔洞所占体积-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"5.硅酸钙板包柱、包梁及蒸压砂加气保温块贴面工程量按钢构件设计断面周长乘以构件长度,以+m2,计算-","pno":27},{"ch_no":2,"title":"装配式钢结构工程","text":"6.钢板天沟按设计图示尺寸以质量计算,依附天沟的型钢并入天沟的质量内计算;不锈钢天沟、彩钢板天沟按设计图示尺寸以长度计算-","pno":27},{"ch_no":3,"title":"装配式木结构工程","text":"1.地梁板安装按设计图示尺寸以长度计算-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"2.木柱、木梁按设计图示尺寸以体积计算-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"3.墙体木骨架及墙面板安装按设计图示尺寸以面积计算,不扣除≤0.3m2 的孔洞所占面积,由此产生的孔洞加固板也不另增加- 其中,墙体木骨架安装应扣除结构柱所占的面积-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"4.楼板格栅及楼面板安装按设计图示尺寸以面积计算,不扣除≤0.3m2 的洞口所占面积,由此产生的洞口加固板也不另增加- 其中,楼板格栅安装应扣除结构梁所占的面积-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"5.格栅挂件按设计图示数量以套计算-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"6.木楼梯安装按设计图示尺寸以水平投影面积计算,不扣除宽度≤500mm的楼梯井,伸入墙内部分不计算-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"7.屋面椽条和桁架安装按设计图示尺寸以实体积计算,不扣除切肢、切角部分所占体积- 屋面板安装按设计图示尺寸以展开面积计算-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"8.封檐板安装按设计图示尺寸以檐口外围长度计算-二、围护体系安装","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"1.石膏板、呼吸纸铺设按设计图示尺寸以面积计算,不扣除≤0.3m2 的孔洞所占面积-","pno":55},{"ch_no":3,"title":"装配式木结构工程","text":"2.岩棉铺设安装定额按设计图示尺寸以体积计算-","pno":55},{"ch_no":4,"title":"建筑构件及部品工程","text":"1.单元式幕墙安装工程量按单元板块组合后设计图示尺寸的外围面积以+m2,计算,不扣除依附于幕墙板块制作的窗、洞口所占的面积-","pno":65},{"ch_no":4,"title":"建筑构件及部品工程","text":"2.防火隔断安装工程量按设计图示尺寸的投影面积以+m2,计算-","pno":65},{"ch_no":4,"title":"建筑构件及部品工程","text":"3.槽形预埋件及T形转换螺栓安装的工程量按设计图示数量以+个,计算-二、非承重隔墙安装","pno":65},{"ch_no":4,"title":"建筑构件及部品工程","text":"1.非承重隔墙安装工程量按设计图示尺寸的墙体面积以+m2,计算,应扣除门窗、洞口、嵌入墙内的钢筋混凝土柱、梁、圈梁等所占体积,不扣除梁头、板头、檩头、垫木、木楞头、沿缘木、木砖、门窗走头、砖墙内加固钢筋、木筋、铁件、钢管及单个面积≤0.3m2 的孔洞所占的体积-","pno":65},{"ch_no":4,"title":"建筑构件及部品工程","text":"2.非承重隔墙安装遇设计为双层墙板时,其工程量按单层面积乘以2 计算-三、预制烟道及通风道安装","pno":65},{"ch_no":4,"title":"建筑构件及部品工程","text":"1.预制烟道 <script>
var D = JSON.parse(document.getElementById('payload').textContent);

function $(id){return document.getElementById(id)}
function cn(n){return ['零','一','二','三','四','五','六','七','八','九','十'][n]||String(n)}

// ---- meta ----
$('h-title').textContent=D.meta.title;

// ---- tabs ----
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('nav.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.p)});
});

  d.onclick=function(){showCh(ch.no)};
  tree.appendChild(d);
});
function showCh(k){
  document.querySelectorAll('.tree .ch').forEach(function(x){x.classList.toggle('on',Number(x.dataset.k)===Number(k))});

  var h='<h3>'+esc(ch.no===0?'总说明（全卷通用）':('第'+cn(ch.no)+'章 '+ch.title))+'</h3>';
  h+='<p class="kw">原文标题：'+esc(ch.raw_title||'—')+' · 印页 P'+ch.print_page+' · 节 '+ch.sections.length+' · 子目 '+ch.n_items+' · 说明 '+ch.explain.length+' 条 · 计算规则 '+ch.rules.length+' 条</p>';
  if(ch.sections.length){h+='<h3>节清单</h3>';ch.sections.forEach(function(s){h+='<p>· '+esc(s.title)+(s.pno?' <span class="kw">P'+s.pno+'</span>':'')+'</p>'})}

  if(ch.rules.length){h+='<h3>工程量计算规则</h3>';ch.rules.forEach(function(x){h+='<p>'+esc(x.text)+'</p>'})}
  if(ch.items.length){h+='<h3>本章子目</h3><p>';ch.items.forEach(function(c){h+='<span class="pill" onclick="jump(\''+c+'\')">'+esc(c)+'</span>'});h+='</p>'}
  $('ch-info').innerHTML=h;
}
showCh(0);

// ---- search ----

var idx=D.items.map(function(it){

});

$('f-ch').addEventListener('change',doSearch);
$('f-kind').addEventListener('change',doSearch);
function doSearch(){
  var q=$('q').value.trim(), fc=chSel.value, fk=$('f-kind').value;
  var hits=idx.filter(function(x){
    if(fc&&String(x.it.chapter)!==fc)return false;
    if(fk&&!(x.it.consumptions||[]).some(function(c){return c.kind===fk}))return false;
    if(!q)return true;
    if(/^\d+-\d+$/.test(q))return x.it.code===q;
    return x.hay.indexOf(q)>=0;
  }).slice(0,120);
  $('q-count').textContent='命中 '+hits.length+' 条'+(hits.length===120?'（截断，最多显示 120）':'');
  var h='';
  hits.forEach(function(x){
    var it=x.it;
    h+='<div class="item-head" id="it-'+esc(it.code)+'"><b class="code">'+esc(it.code)+'</b><span>'+esc(it.project)+'</span>'
      +'<span class="kw">单位 '+esc(it.unit||'')+'</span><span class="kw">印页 P'+it.print_page+'（物页 '+it.phys_page+'）</span></div>';
    h+='<p class="kw">节：'+esc(it.section||'')+' · 工作内容：'+esc(it.work_content||'')+'</p>';
    if((it.consumptions||[]).length){
      h+='<table><tr><th>类别</th><th>名称</th><th>单位</th><th>消耗量</th></tr>';
      it.consumptions.forEach(function(c){
        h+='<tr><td>'+esc(c.kind||'')+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.unit||'')+'</td><td class="num">'
          +(c.qty==null?'—':(c.unpriced?'('+c.qty+')':c.qty))+'</td></tr>';
      });
      h+='</table>';
    }
  });
  $('q-out').innerHTML=h||'<p class="kw">无命中</p>';
}
function jump(code){
  document.querySelector('nav.tabs button[data-p="p-search"]').click();
  $('q').value=code; doSearch();
  var el=$('it-'+code); if(el&&el.scrollIntoView)el.scrollIntoView();
}
doSearch();

// ---- 总说明 / 章说明 / 计算规则 / 附件费用标准 ----
(function(){
  var h='<div class="info sec" style="max-height:none"><h3>总说明（'+D.explain.length+' 条）</h3>';
  D.explain.forEach(function(e){h+='<p><b>'+esc(e.no)+'、</b>'+esc(e.text)+' <span class="kw">[印页 P'+e.pno+']</span></p>'});
  h+='<h3>各章说明与工程量计算规则（'+D.n_ch+' 章 / '+D.rules.length+' 条规则）</h3>';
  D.chapters.forEach(function(ch){
    if(ch.no===0)return;
    h+='<h3>第'+cn(ch.no)+'章 '+esc(ch.title)+'</h3>';
    ch.explain.forEach(function(x){h+='<p>'+esc(x.text)+'</p>'});
    ch.rules.forEach(function(x){h+='<p>· '+esc(x.text)+'</p>'});
  });
  if(D.fee_table.length>0){
    h+='<h3>附件：费用标准（'+D.n_fee+' 行）</h3>';
    h+='<table><tr><th>序号</th><th>费用名称</th><th>计费基础</th><th>一般计税</th><th>简易计税</th></tr>';
    D.fee_table.forEach(function(r){h+='<tr><td>'+esc(r.no)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.base)+'</td><td class="num">'+esc(r.general)+'</td><td class="num">'+esc(r.simple)+'</td></tr>'});
    h+='</table>';
    D.fee_notes.forEach(function(n){h+='<p class="kw">'+esc(n)+'</p>'});
  }
  h+='</div>';
  $('prose-out').innerHTML=h;
})();
