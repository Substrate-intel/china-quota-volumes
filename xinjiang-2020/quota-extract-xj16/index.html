ntent":"x=18.90%+×（4500-4000）","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J027","section":"ch03","no":null,"name":"x=25.31%","kind":"解读","content":"x=25.31%","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J028","section":"ch03","no":null,"name":"y=18.9%+×（4500-4000）","kind":"解读","content":"y=18.9%+×（4500-4000）","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J029","section":"ch03","no":null,"name":"y=30.45%","kind":"解读","content":"y=30.45%","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J030","section":"ch03","no":null,"name":"z=1.2+×（4500-4000）","kind":"解读","content":"z=1.2+×（4500-4000）","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J031","section":"ch03","no":null,"name":"z=1.25","kind":"解读","content":"z=1.25","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J032","section":"ch03","no":null,"name":"计算结果，海拔高度4500m人工降效增加费费率为25.31%，机械施工降效增加费费率为30.45%，","kind":"解读","content":"计算结果，海拔高度4500m人工降效增加费费率为25.31%，机械施工降效增加费费率为30.45%，企业管理费调整系数为1.25。则该项目的人工费调增25.31%，机械费调增30.45%，企业管理费以1.25的系数进行调整。上述所得结果，只计税金，不参与取费。","phys_page":null,"print_page":null,"parent":"（一）高海拔地区施工降效增加费"},{"id":"J033","section":"ch03","no":null,"name":"（二）其他有关说明和工作要求","kind":"解读标题","content":"","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J034","section":"ch03","no":null,"name":"1.关于《费用标准》的适用范围。本《费用标准》与2020版房屋建筑与装饰工程、安装工程、市政工程消耗","kind":"解读","content":"1.关于《费用标准》的适用范围。本《费用标准》与2020版房屋建筑与装饰工程、安装工程、市政工程消耗量定额、费用定额及各地建设主管部门发布的相应地区单位估价表同时使用，2020版费用定额高原地区施工增加费停止执行。","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J035","section":"ch03","no":null,"name":"2.关于高海拔地区冬季施工费的说明。进行冬季施工的工程，为保证工程质量，采取一般防冻保温措施所增加的","kind":"解读","content":"2.关于高海拔地区冬季施工费的说明。进行冬季施工的工程，为保证工程质量，采取一般防冻保温措施所增加的费用，包括：冬季施工增加工序，防冻保温增加的设施、材料、加热养护及临时取暖费用（包括各种养护、材料加热、覆盖材料、暖棚等），冬季施工需要提高混凝土、砂浆标号所增加的材料及化学药剂等费用。甲、乙双方可根据经审定的冬季施工方案及现场签证等计算费用，该费用单独计列，不参与取费，只计取税金。","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J036","section":"ch03","no":null,"name":"当高海拔地区施工温度低于零下20℃（含零下20℃）时，在此温度期间施工的工程内容，可同时计取高寒地区","kind":"解读","content":"当高海拔地区施工温度低于零下20℃（含零下20℃）时，在此温度期间施工的工程内容，可同时计取高寒地区施工增加费。","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J037","section":"ch03","no":null,"name":"3.关于高海拔地区材料价格的说明。建设项目发承包双方应充分考虑高海拔地区交通因素，在合同中约定因高海","kind":"解读","content":"3.关于高海拔地区材料价格的说明。建设项目发承包双方应充分考虑高海拔地区交通因素，在合同中约定因高海拔原因引起材料价格波动的调整办法。","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J038","section":"ch03","no":null,"name":"4.有关工作要求。各地、州、市住房和城乡建设行政主管部门要加强对高海拔地区不同计税方式下的建设工程人","kind":"解读","content":"4.有关工作要求。各地、州、市住房和城乡建设行政主管部门要加强对高海拔地区不同计税方式下的建设工程人工、材料、施工机械等价格信息的监控和发布，并积极开展工程价款结算争议调解工作，及时化解纠纷。","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J039","section":"ch03","no":null,"name":"执行过程中遇到的问题，请及时反馈我厅。","kind":"解读","content":"执行过程中遇到的问题，请及时反馈我厅。","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J040","section":"ch03","no":null,"name":"解读部门：自治区住房和城乡建设厅","kind":"解读","content":"解读部门：自治区住房和城乡建设厅","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J041","section":"ch03","no":null,"name":"解读人：苏镇海","kind":"解读","content":"解读人：苏镇海","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"},{"id":"J042","section":"ch03","no":null,"name":"联系方式：0991-8868667","kind":"解读","content":"联系方式：0991-8868667","phys_page":null,"print_page":null,"parent":"（二）其他有关说明和工作要求"}],"programs":[],"tables":[{"id":"T001","caption":"高海拔地区施工降效增加费费率标准","section":"ch01-sec1","phys_page":2,"print_page":2,"rows":[["序 号","计费基础","海 拔 2000～3000m","海 拔 3000～4000m","海 拔 4000～5000m","海 拔 5000～6000m"],["1","人工费","0～8.71%","8.71%～18.91%","18.91%～31.71%","31.71%～69.72%"],["2","机械费","0～8.71%","8.71%～18.91%","18.91%～42.00%","42.00%～127.00%"]]},{"id":"T002","caption":"高海拔地区企业管理费调整系数","section":"ch01-sec2","phys_page":2,"print_page":2,"rows":[["序号","海拔高度","调整系数"],["1","2000～3000m","1.0～1.10"],["2","3000～4000m","1.10～1.20"],["3","4000～5000m","1.20～1.30"],["4","5000～6000m","1.30～1.40"]]}],"notes":[{"id":"N001","section":"ch01-sec1","no":"注","content":"1.本费用标准适用于房屋建筑与装饰工程、安装工程、市政工程人工和机械降效而增加的费用，单独计列，不参与取费，只计取税金。2.本费率标准适用于海拔2000m以上的工程，当工程处在相应海拔高度区间内的，按内插法确定降效增加费费率标准。","phys_page":2,"print_page":2}],"toc":[{"title":"一、高海拔地区施工增加费","level":1,"print_page":1,"phys_page":1,"matched_section":"ch01","actual_page":1,"ok":true},{"title":"（一）高海拔地区施工降效增加费","level":2,"print_page":1,"phys_page":1,"matched_section":"ch01-sec1","actual_page":1,"ok":true},{"title":"（二）高海拔地区企业管理增加费","level":2,"print_page":2,"phys_page":2,"matched_section":"ch01-sec2","actual_page":2,"ok":true},{"title":"二、有关说明和工作要求","level":1,"print_page":3,"phys_page":3,"matched_section":"ch02","actual_page":3,"ok":true},{"title":"《…费用标准》解读（官方附件）","level":1,"print_page":null,"phys_page":null,"matched_section":"ch03","actual_page":null,"ok":true}],"issues":[],"erratas":[{"errata_id":"xj16-E01","printed_page":null,"physical_page":2,"target_desc":"高海拔地区企业管理费调整系数表·序号1（海拔2000～3000m）调整系数","errata_type":"系数修正","wrong_text":"0～1.10","correct_text":"1.0～1.10","status":"applied","item_codes":[]}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 头部 ---------- */
$('#bk-title').textContent = D.book.title;
const ch = [];
ch.push(['卷键', D.book.volume_key]);
ch.push(['地区', D.book.region]);
ch.push(['年份', D.book.year + ' 版']);
ch.push(['页数', D.book.pages]);
ch.push(['源 PDF 指纹', D.inputs.source_sha12]);
ch.push(['解读 docx 指纹', D.inputs.docx_sha12]);
ch.push(['结构', D.sections.length + ' 节 / ' + D.items.length + ' 条目 / ' +
  D.tables.length + ' 表']);
ch.push(['TOC 对账', D.toc.filter(t=>t.ok).length + '/' + D.toc.length, 'ok']);
if (D.erratas.length) ch.push(['勘误 overlay', D.erratas.length + ' 条', 'ok']);
$('#bk-chips').innerHTML = ch.map(c =>
  `<span class="chip${c[2]==='gray'?' gray':''}${c[2]==='warn'?' warn':''}">${esc(c[0])} ${esc(c[1])}</span>`).join('');

/* ---------- 树 ---------- */
const secById = {}; D.sections.forEach(s => secById[s.id] = s);
const itemsBySec = {};
D.items.forEach(it => { (itemsBySec[it.section] = itemsBySec[it.section] || []).push(it); });
const FRONT_ORDER = [];
const CH_ORDER = ['ch01','ch01-sec1','ch01-sec2','ch02','ch03'];
const secOrder = [...FRONT_ORDER.filter(id=>secById[id]), ...CH_ORDER.filter(id=>secById[id]),
  ...D.sections.map(s=>s.id).filter(id=>!FRONT_ORDER.includes(id)&&!CH_ORDER.includes(id))];

const tree = $('#tree');
let html = '';
secOrder.forEach(sid => {
  const s = secById[sid];
  const grp = s.level === 1 ? '第' + (s.no || '') + '部分' : s.level === 2 ? (s.no || '') + s.title : s.title;
  html += `<div class="grp">${esc(grp)}${s.print_page!=null?` <span style="font-family:var(--mono);font-weight:400">P${s.print_page}</span>`:''}</div>`;
  (itemsBySec[sid]||[]).forEach(it => {
    html += `<div class="it${it.parent?' sub':''}" data-id="${it.id}">` +
      `<span class="no">${esc(it.no||'')}</span><span>${esc(it.name.slice(0,26))}</span>` +
      `<span class="pg">${it.print_page!=null?'P'+it.print_page:''}</span></div>`;
  });
});
tree.innerHTML = html || '<div class="empty">无条目</div>';

/* ---------- 视图 ---------- */
const views = { 结构: renderTree, 表格: renderTables, 注文: renderNotes,
  目录对账: renderToc, 勘误表: renderErratas, 说明: renderAbout };
let curView = '结构', curId = null;
const nav = $('#nav');
nav.innerHTML = Object.keys(views).map(k =>
  `<button data-v="${k}"${k===curView?' class="on"':''}>${k}</button>`).join('');
nav.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curView = b.dataset.v;
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  views[curView]();
});
tree.addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  curId = it.dataset.id; curView = '结构';
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === '结构'));
  renderTree();
});

function itemCard(it) {
  const atts = D.items.filter(x => x.parent === it.id);
  let h = `<div class="card" id="it-${it.id}"><h2>${esc(it.name)}` +
    `<span class="kd item">` +
    `${esc(it.kind||'条目')}</span></h2>` +
    `<div class="meta">${esc(it.id)} · 印页 P${it.print_page!=null?it.print_page:'—'} · 物理页 ${it.phys_page}` +
    (it.parent?` · 隶属 ${esc(it.parent)}`:'') + `</div>`;
  if (it.content) h += `<div class="content">${esc(it.content)}</div>`;
  atts.forEach(a => { h += `<div class="sec-h">${esc(a.name)}<span class="sub">附件 · 印页 P${a.print_page}</span></div>` +
    `<div class="content">${esc(a.content)}</div>`; });
  return h + '</div>';
}
function renderTree() {
  const pane = $('#pane');
  if (!curId) {
    const first = tree.querySelector('.it');
    if (first) curId = first.dataset.id; else { pane.innerHTML = '<div class="empty">无条目</div>'; return; }
  }
  const it = D.items.find(x => x.id === curId);
  pane.innerHTML = it ? itemCard(it) : '<div class="empty">条目不存在</div>';
  const el = pane.querySelector('.card');
  if (el) el.scrollIntoView({block:'nearest'});
  tree.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x.dataset.id === curId));
  const on = tree.querySelector('.it.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function tblHtml(t) {
  let h = `<div class="card"><h2>${esc(t.caption||'（无表题）')}` +
    `<span class="chip gray">${t.id}</span><span class="chip gray">印页 P${t.print_page}</span></h2><table class="tb"><tbody>`;
  t.rows.forEach(r => {
    h += '<tr>' + r.map(c => {
      if (c.startsWith('^')) return `<td class="merge">${esc(c.replace(/^\^+/,''))}</td>`;
      return `<td>${esc(c)}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}
function renderTables() {
  $('#pane').innerHTML = D.tables.map(tblHtml).join('') || '<div class="empty">无表格</div>';
}
function renderNotes() {
  let h = '';
  if (!D.notes.length) h = '<div class="empty">无注文</div>';
  D.notes.forEach(n => {
    h += `<div class="card"><h2>${esc(n.no||'注')}<span class="chip gray">${esc(n.id)}</span>` +
      `<span class="chip gray">印页 P${n.print_page!=null?n.print_page:'—'}</span></h2>` +
      `<div class="content">${esc(n.content)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderErratas() {
  let h = '<div class="card"><h2>官方勘误 overlay<span class="chip gray">errata_id 溯源 · 双值留痕</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:88px">errata_id</th><th>类型</th><th>目标</th>' +
    '<th>误值</th><th>正值</th><th style="width:76px">状态</th></tr></thead><tbody>';
  D.erratas.forEach(e => {
    h += `<tr><td style="font-family:var(--mono);font-size:12px">${esc(e.errata_id)}</td>` +
      `<td>${esc(e.errata_type)}</td><td>${esc(e.target_desc)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(e.wrong_text)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(e.correct_text)}</td>` +
      `<td class="${e.status==='applied'||e.status==='applied_bare'?'ok':e.status==='issue'?'bad':''}">${esc(e.status)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h || '<div class="empty">无勘误</div>';
}
function renderToc() {
  let h = '<div class="card"><h2>目录条目与正文对账<span class="chip gray">门 6b 前置</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:40px">#</th><th>层级</th><th>标题</th>' +
    '<th style="width:64px">目录页</th><th style="width:72px">正文页</th><th style="width:56px">吻合</th></tr></thead><tbody>';
  D.toc.forEach((e, i) => {
    h += `<tr><td>${i+1}</td><td>${e.level===1?'一级':'二级'}</td><td>${esc(e.title)}</td>` +
      `<td>P${e.print_page}</td><td>${e.matched_section?'P'+e.actual_page:'—'}</td>` +
      `<td class="${e.ok?'ok':'bad'}">${e.ok?'✓':'✗'}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h;
}
function renderIssues() {
  $('#pane').innerHTML = '<div class="empty">无疑点留痕（疑点一律进 issues 禁静默修正）</div>';
}
function renderAbout() {
  $('#pane').innerHTML = `
  <div class="note">忠实层铁律：本页所有文本均来自官方附件 PDF 文本层（pymupdf find_tables 坐标级重建两张费率表，正文文本流顺序错乱已按坐标归位）与官方解读 docx（python-docx body 顺序 walk）；疑点一律留痕不臆补。勘误 overlay：官方勘误 ${D.erratas.length} 条按 errata_id 溯源落入工作层，erratas 表保留「原文值→勘误后值」双值。</div>
  <div class="grid2">
    <div class="card"><h2>结构统计</h2><table class="tb"><tbody>
      <tr><th>目录条目</th><td>${D.toc.length}（页吻合 ${D.toc.filter(t=>t.ok).length}/${D.toc.length}）</td></tr>
      <tr><th>节</th><td>${D.sections.length}</td></tr>
      <tr><th>条目</th><td>${D.items.length}（说明 ${D.items.filter(i=>i.kind==='说明').length} · 解读 ${D.items.filter(i=>i.kind==='解读'||i.kind==='解读标题').length} · 解读表格 ${D.items.filter(i=>i.kind==='解读表格').length}）</td></tr>
      <tr><th>费率表</th><td>${D.tables.length}</td></tr>
      <tr><th>注文</th><td>${D.notes.length}</td></tr>
      <tr><th>勘误 overlay</th><td>${D.erratas.length} 条（官方勘误已入 DB 工作层 · erratas 表双值留痕）</td></tr>
    </tbody></table></div>
    <div class="card"><h2>指纹</h2><table class="tb"><tbody>
      <tr><th>源 PDF</th><td style="font-family:var(--mono)">${esc(D.inputs.source_sha12)}</td></tr>
      <tr><th>解读 docx</th><td style="font-family:var(--mono)">${esc(D.inputs.docx_sha12)}</td></tr>
      <tr><th>schema</th><td>${esc(D.schema)}</td></tr>
    </tbody></table></div>
  </div>`;
}
views[curView]();
</script>
</body>
</html>
