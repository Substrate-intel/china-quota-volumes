公英喷头", "pno": 75}, {"title": "四、喷泉过滤设备安装(过滤网、过滤箱、过滤器、过滤池)", "pno": 75}, {"title": "五、空气能热水器", "pno": 75}, {"title": "六、塑料模块雨水及中水收集设备", "pno": 76}, {"title": "七、塑料模块蓄水水箱", "pno": 76}, {"title": "八、雨水中水处理设备", "pno": 77}, {"title": "九、燃气管道换气点火", "pno": 78}, {"title": "十、成品抗震支架安装", "pno": 78}, {"title": "十一、洁具存水弯安装", "pno": 78}, {"title": "十二、室外钢管沟槽连接", "pno": 79}, {"title": "十三、通球清管", "pno": 81}, {"title": "十四、通球清管每增一次", "pno": 81}, {"title": "十五、地板辐射采暖", "pno": 82}, {"title": "1.塑料管道敷设", "pno": 82}, {"title": "2.保温隔热层敷设", "pno": 82}, {"title": "十六、热媒集配装置安装", "pno": 83}, {"title": "1.不带箱热媒集配装置安装", "pno": 83}, {"title": "2.带箱热媒集配装置安装", "pno": 83}, {"title": "十七、地板敷设采暖管道试压", "pno": 83}, {"title": "补充定额·砖结构配管剔堵槽、沟", "pno": null}, {"title": "补充定额·混凝土结构配管剔堵槽、沟", "pno": null}], "explain": [{"pno": 65, "text": "一、本册作为《通用安装工程消耗量定额》(TY02-31-2015)的补充内容；包括法兰阀(带短管甲、乙型)胶圈接口、法兰阀(带短管甲、乙型)膨胀水泥接口、喷头、滴头、滴灌管、快速取水阀、成品阀门箱、控制器、喷灌用电磁阀、喷泉喷头(螺纹连接)、喷泉喷头(法兰连接)、蒲公英喷头、喷泉过滤设备安装(过滤网、过滤箱、过滤器、过滤池)、空气能热水器、塑料模块雨水及中水收集设备、塑料模块蓄水水箱、雨水中水处理设备、燃气管道换气点火、成品抗震支架安装、洁具存水弯安装、室外钢管沟槽连接、通球清管、通球清管每增一次、塑料管道敷设、保温隔热层敷设、不带箱热媒集配装置安装、带箱热媒集配装置安装、地板敷设采暖管道试压等内容。"}, {"pno": 65, "text": "二、有关说明"}, {"pno": 65, "text": "1.蒲公英喷头安装不含立管安装。"}, {"pno": 65, "text": "2.若竣工不安装浴盆、洗脸盆、坐(蹲)便器时，预留存水弯应另行计算工程量。如安装洁具时，定额消耗量中的存水弯不得重复计算。"}, {"pno": 65, "text": "3.地板辐射采暖塑料管道敷设项目包括了固定管道的塑料卡钉(管卡)安装、局部套管敷设及地面浇筑的配合用工。如工程要求固定管道的方式与定额不同时，固定管道的材料可按设计要求进行调整，其他不变。"}, {"pno": 65, "text": "4.鉴于目前市场以设计图示满铺或加密处局部铺设不等，钢丝网定额按实际铺设面积计算，以“10m2”为计量单位。"}, {"pno": 65, "text": "5.地板辐射采暖的隔热板项目中的塑料薄膜，是指在接触土壤或室外空气的楼板与绝热层之间所铺设的塑料薄膜防潮层。如隔热板带有保护层(铝箔),应扣除塑料薄膜材料消耗量。"}, {"pno": 65, "text": "6.成组热媒集配装置包括成品分集水器和配套供应的固定支架及与分支管连接的部件。固定支架如不随分集水器配套供应，需现场制作时，按照《通用安装工程消耗量定额》"}, {"pno": 65, "text": "TY 02-31-2015第十册相应项目另行计算。"}, {"pno": 65, "text": "7.地板辐射采暖塑料管道在跨越建筑物的伸缩缝、沉降缝时所铺设的塑料板条，应按照边界保温带安装定额计算，塑料板条材料消耗量可按设计要求的厚度、宽度进行调整。"}], "rules": [{"pno": 66, "text": "1.成品抗震支架适用于安装工程中各类成品抗震支架安装，分单管侧向支架和门型侧向支架安装。"}, {"pno": 66, "text": "侧纵向支架安装执行相应侧向支架安装定额，人工乘以系数1.05。按施工图示安装数量，以“副”为计量单位。"}, {"pno": 66, "text": "2.洁具存水弯工程量计算按施工图示数量以“组”为计量单位。"}, {"pno": 66, "text": "3.地板辐射采暖管道区分管道直径，按设计图示中心线长度计算，以“10m”为计量单位。保护层(铝箔)、隔热层按设计图示尺寸计算实际铺设面积，以“10m2”为计量单位。边界保温带按设计图示长度以“10m”为计量单位。"}, {"pno": 66, "text": "4.热媒集配装置安装区分带箱、不带箱，按分支管环路数以“组”为计量单位。"}, {"pno": 66, "text": "5.带截污过滤装置的塑料雨水井安装定额，适用于带截污沉淀装置、带弃流装置等含类似装置的塑料雨水井安装。电动弃流装置电气接线执行第四册《电气设备安装工程》相应定额。按设计图示安装数量，以“座”为计量单位。"}, {"pno": 66, "text": "6.法兰阀(带短管甲、乙型)胶圈接口工作内容包括管口除沥青、上胶圈、制垫、加垫、紧螺栓、水压试验。按照设计图示安装数量以“个”为计量单位。"}, {"pno": 66, "text": "7.法兰阀(带短管甲、乙型)膨胀水泥接口工作内容包括管口除沥青、制垫、加垫、调制接口材料、接口养护、紧螺栓、水压试验。按照设计图示安装数量以“个”为计量单位。"}, {"pno": 66, "text": "8.节水灌溉设备中喷头、滴头、快速取水阀、成品阀门箱、喷灌用电磁阀按设计图示数量，以“个”为计量单位；滴灌管按设计图示长度，以“m”为计量单位；"}, {"pno": 66, "text": "10.喷泉喷头安装按设计图示以“套”计算。"}, {"pno": 66, "text": "雨水、中水收集处理系统中土工布铺设按照塑料模块水箱水平投影面积，以“m2”为计量单位。"}, {"pno": 66, "text": "11.塑料模块水箱防渗透膜包覆按照塑料模块水箱外表面积，以“m2”为计量单位。"}, {"pno": 66, "text": "12.塑料模块蓄水水箱安装按设计图示数量，以“台”为计量单位。"}, {"pno": 66, "text": "13.燃气管道换气点火的工作内容是准备工作、管道换气、用户燃具点火、讲解点火注意事项。分民用户、食堂和工业户，以“户”为计量单位。"}, {"pno": 66, "text": "14.室外钢管沟槽连接工作内容包括调直、切管、压槽、对口、涂润滑剂、上胶圈、安装卡箍件、管道及管件安装，水压试验及水冲洗。按施工图示安装数量，以“m”为计量单位。"}, {"pno": 66, "text": "15.通球清管工作内容包括通球前准备、压风车就位、临时管路安装及拆除、清管器(球)装入、充气、更换密封件、升压通球吹扫、跟踪信号、清管器(球)回收等。按施工图示安装数量，以“km”为计量单位。"}, {"pno": 66, "text": "清管器(球)规格同主管一致。"}, {"pno": 66, "text": "16.通球清管每增一次工作内容包括更换密封件、清管器(球)填放、跟踪信号、通球吹扫、清管器(球)回收等。按施工图示安装数量，以“km”为计量单位。"}], "notes": [{"pno": 78, "content": "1.卫生所、招待所、实验室、饭店等皆按”食堂”一项计算；2.带气操作时增设的监察维护人员用工费用按实计算。"}], "n_items": 117}, {"vol": 12, "no": 0, "title": "第十二册刷油、防腐蚀、绝热工程", "sections": [{"title": "一、变冷媒流量多联空调系统制冷剂管路橡胶管套绝热及保护带包扎", "pno": 89}, {"title": "二、电火花检测", "pno": 89}], "explain": [{"pno": 87, "text": "一、本册作为《通用安装工程消耗量定额》(TY02-31-2015)的补充内容；包括变冷媒流量多联空调系统制冷剂管路橡胶管套绝热及保护带包扎、电火花检测等内容。"}, {"pno": 87, "text": "二、有关说明制冷剂管路橡胶管套绝热及保护带包扎在定额中："}, {"pno": 87, "text": "(1)闭孔橡胶管套按设计选用规格计算主材费；"}, {"pno": 87, "text": "(2)塑料保护带消耗量中已包括缠绕压边(不低于50???量，并已考虑绝热后的气、液管路与电源线、控制线共同包扎的因素；"}, {"pno": 87, "text": "(3)制冷剂管路中管件、阀件绝热所需人工、材料已综合考虑在定额内，不再单独计算。"}], "rules": [{"pno": 88, "text": "1.变冷媒流量多联空调系统制冷剂管路橡胶管套绝热及保护带包扎工作内容包括运料、下料、穿套、接口抹胶、安装、缠保护带。按施工图示安装数量，以“10m/双路”为计量单位。"}, {"pno": 88, "text": "2.电火花检测工作内容包括搬运仪器及调试、探伤检查、缺陷部位修理记录。按施工图示安装数量，以“m2”为计量单位。"}, {"pno": null, "text": "该册计算规则补充以下内容：「管道绝热层计算公式：V=π×(D+1.03δ)×1.03δ×L；式中：D—直径；1.03—调整系数；δ—绝热层厚度；L—设备筒体或管道延长米」（2020版安装工程补充消耗量定额勘误·第十二册补充内容）"}], "notes": [], "n_items": 10}, {"vol": 12, "no": 1, "title": "附录", "sections": [{"title": "附录一 平焊法兰螺栓重量表", "pno": 93}, {"title": "附录二 榫槽面平焊法兰螺栓重量表", "pno": 94}, {"title": "附录三 对焊法兰螺栓重量表", "pno": 95}, {"title": "附录四 梯形槽式对焊法兰螺栓重量表", "pno": 97}, {"title": "附录五 焊环活动法兰螺栓重量表", "pno": 98}, {"title": "附录六 管口翻边活动法兰螺栓重量表", "pno": 99}], "explain": [], "rules": [], "notes": [], "n_items": 0}], "items": [{"code": "B4-1", "vol": 4, "chapter": 0, "section": "一、小型电机干燥", "project": "小型电机干燥(功率kW以下) 3", "work_content": "接电源及干燥前的准备，安装加热装置及保温设施，加温干燥及值班，检查绝缘情况，拆除清理。", "unit": "台", "phys_page": 15, "consumptions": [{"kind": "人工", "name": "综合工日", "unit": "工日", "qty": 3.369, "unpriced": false, "raw": "3.369"}, {"kind": "", "name": "电", "unit": "kW·h", "qty": 38.4, "unpriced": false, "raw": "38.400"}, {"kind": "", "name": "红外线灯泡220V1000W", "unit": "个", "qty": 0.192, "unpriced": false, "raw": "0.192"}, {"kind": "材", "name": "黑胶布200mm×20m", "unit": "卷", "qty": 0.128, "unpriced": false, "raw": "0.128"}, {"kind": "", "name": "铜芯塑料绝缘线BV1.5", "unit": "m", "qty": 6.4, "unpriced": false, "raw": "6.400"}, {"kind": "", "name": "石棉织布δ2.5", "unit": "m2", "qty": 0.128, "unpriced": false, "raw": "0.128"}, {"kind": "", "name": "其他材料费", "unit": "元", "qty": 1.85, "unpriced": false, "raw": "1.850"}]}, {"code": "B4-2", "vol": 4, "chapter": 0, "section": "一、小型电机干燥", "project": "小型电机干燥(功率kW以下) 13", "work_content": "接电源及干燥前的准备，安装加热装置及保温设施，加温干燥及值班，检查绝缘情况，拆除清理。", "unit": "台", "phys_page": 15, "consumptions": [{"kind": "人工", "name": "综合工日", "unit": "工日", "qty": 5.467, "unpriced": false, "raw": "5.467"}, {"kind": "", "name": "电", "unit": "kW·h", "qty": 75.2, "unpriced": false, "raw": "75.200"}, {"kind": "", <script>
var D = JSON.parse(document.getElementById('payload').textContent);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}

// ---- meta ----
var tc=D.toc_check;
$('m-items').textContent=D.items.length;
$('m-cons').textContent=D.n_cons;
$('m-err').textContent=D.erratas.length;
$('m-sec').textContent=D.n_sec;
$('m-toc').textContent=tc.matched+'/'+tc.sec_total;

// ---- tabs ----
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('nav.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.p)});
});

// ---- structure tree ----
// xj15：册→大节结构无「第X章」层，虚拟章 ch_no=0/1（合成）→ 标签只显示册下
// 主体/附录名，禁渲染「第0章」（书无此层，防误导）
// 坑94（2026-10-20 爪哥实证）：虚拟章标题=册名，与树上「第N册 册名」行重复 →
// 册主体节点标签改「册主体（N节/M子目）」，禁二次渲染册名；附录虚拟章保留本名。
function chLabel(ch){
  var t=ch.title||'';
  var vt=D.volumes[String(ch.vol)];
  if(vt && normEq(t, vt.title||'')){
    return '册主体（'+ch.sections.length+'节/'+ch.n_items+'子目）';
  }
  return t+'（'+ch.sections.length+'节/'+ch.n_items+'子目）';
}
function normEq(a,b){return String(a).replace(/\s+/g,'')===String(b).replace(/\s+/g,'');}
// 坑94：区块标题随结构分流——册-节结构（虚拟章 no=0/1，书无「第X章」层）的
// 说明条文是**册说明**，禁套章层模板渲染「章说明」（术语错误，用户实证无法
// 与「册说明」对账）；rules 桶书名印「工程量计算规则」，标题如实保留。
function explainLabel(ch){
  return (ch.no===0||ch.no===1) ? '册说明' : '章说明';
}
var tree=$('tree'), chMap={};
D.chapters.forEach(function(ch){
  chMap[ch.vol+'-'+ch.no]=ch;
});
Object.keys(D.volumes).forEach(function(vn){
  var v=D.volumes[vn];
  var dv=document.createElement('div'); dv.className='vol'; dv.textContent='第'+vn+'册 '+(v.title||''); tree.appendChild(dv);
  D.chapters.filter(function(c){return String(c.vol)===vn}).forEach(function(ch){
    var d=document.createElement('div'); d.className='ch'; d.dataset.k=ch.vol+'-'+ch.no;
    d.textContent=chLabel(ch);
    d.onclick=function(){showCh(ch.vol+'-'+ch.no)};
    tree.appendChild(d);
  });
});
function showCh(k){
  document.querySelectorAll('.tree .ch').forEach(function(x){x.classList.toggle('on',x.dataset.k===k)});
  var ch=chMap[k]; if(!ch)return;
  var vt=D.volumes[String(ch.vol)];
  // 坑94：虚拟章标题已含册名 → 主标题禁「第N册 · 册名」二次重复，册主体节点
  // 直渲染册名；附录虚拟章（第十二册下）渲染「第十二册 · 附录」
  var hd=(vt && normEq(ch.title, vt.title||'')) ? esc(ch.title)
        : '第'+ch.vol+'册 · '+esc(ch.title);
  var h='<h3>'+hd+'</h3>';
  h+='<p class="kw">节 '+ch.sections.length+' · 子目 '+ch.n_items+' · 说明条文 '+ch.explain.length+' · 计算规则 '+ch.rules.length+' · 注 '+ch.notes.length+'</p>';
  h+='<h3>节清单</h3>';
  ch.sections.forEach(function(s){h+='<p>· '+esc(s.title)+(s.pno?' <span class="kw">P'+s.pno+'</span>':'')+'</p>'});
  if(ch.explain.length){h+='<h3>'+explainLabel(ch)+'</h3>'; ch.explain.forEach(function(x){h+='<p>'+(x.pno?'<span class="kw">P'+x.pno+'</span> ':'')+esc(x.text)+'</p>'})}
  if(ch.rules.length){h+='<h3>工程量计算规则</h3>'; ch.rules.forEach(function(x){h+='<p>'+(x.pno?'<span class="kw">P'+x.pno+'</span> ':'')+esc(x.text)+'</p>'})}
  if(ch.notes.length){h+='<h3>注</h3>'; ch.notes.forEach(function(x){h+='<p><span class="kw">P'+x.pno+'</span> '+esc(x.content)+'</p>'})}
  $('ch-info').innerHTML=h;
}
showCh(D.chapters[0].vol+'-'+D.chapters[0].no);

// ---- search ----
var volSel=$('f-vol');
Object.keys(D.volumes).forEach(function(vn){
  var o=document.createElement('option'); o.value=vn; o.textContent='第'+vn+'册 '+D.volumes[vn].title; volSel.appendChild(o);
});
var idx=D.items.map(function(it){
  var cons=it.consumptions||[];
  return {it:it, hay:[it.code,it.project,it.work_content,it.unit].concat(cons.map(function(c){return c.name})).join(' ')};
});
$('q').addEventListener('input',doSearch);

function kindMatch(cons,kind){
  if(!kind)return true;
  return cons.some(function(c){return c.kind===kind||(kind==='材料'&&c.kind==='材')||(kind==='人工'&&c.kind==='工')||(kind==='机械'&&c.kind==='机')});
}
function doSearch(){
  var q=$('q').value.trim(), fv=volSel.value, fk=$('f-kind').value;
  var hits=idx.filter(function(x){
    if(fv&&String(x.it.vol)!==fv)return false;
    if(fk&&!kindMatch(x.it.consumptions||[],fk))return false;
    if(!q)return true;
    if(q.toUpperCase()===q&&/^\d+-\d+-\d+$/.test(q))return x.it.code===q;
    return x.hay.indexOf(q)>=0;
  }).slice(0,120);
  $('q-count').textContent='命中 '+hits.length+' 条'+(hits.length===120?'（截断）':'');
  var h='';
  hits.forEach(function(x){
    var it=x.it;
    h+='<div class="item-head"><b class="code">'+esc(it.code)+'</b><span>'+esc(it.project)+'</span>'
      +'<span class="kw">'+esc(it.unit||'')+'</span><span class="kw">P'+it.phys_page+'</span></div>';
    if(it.work_content)h+='<p class="kw">工作内容：'+esc(it.work_content)+'</p>';
    if((it.consumptions||[]).length){
      h+='<table><tr><th>类别</th><th>名称</th><th>单位</th><th>消耗量</th></tr>';
      it.consumptions.forEach(function(c){
        h+='<tr><td>'+esc(c.kind||'')+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.unit||'')+'</td><td class="num">'
          +(c.qty==null?'—':(c.unpriced?'('+c.qty+')':c.qty))+(c.unpriced?' <span class="kw">未计价</span>':'')+'</td></tr>';
      });
      h+='</table>';
    }
  });
  $('q-out').innerHTML=h||'<p class="kw">无命中</p>';
}
doSearch();

// ---- erratas（勘误 overlay：DB 工作层已应用，erratas 表双值留痕）----
(function(){
  var from=D.erratas;
  var nApp=from.filter(function(e){return e.status==='applied'||e.status==='applied_bare';}).length;
  $('err-count').textContent='勘误 '+from.length+' 条（已应用 '+nApp+' · 已更正 '+from.filter(function(e){return e.status==='already_correct';}).length+' · 留档 '+from.filter(function(e){return e.status==='not_in_db';}).length+'）';
  var h='<tr><th>勘误号</th><th>印页</th><th>对象</th><th>类型</th><th>误 → 正</th><th>状态</th></tr>';
  from.forEach(function(e){
    h+='<tr><td style="font-family:var(--mono)">'+esc(e.errata_id)+'</td><td>'+(e.printed_page==null?'—':e.printed_page)+'</td><td>'+esc(e.target_desc)+'</td><td>'+esc(e.errata_type||'')+'</td><td>'+esc(e.wrong_text||'')+' → <b>'+esc(e.correct_text||'')+'</b></td><td>'+esc(e.status)+'</td></tr>';
  });
  $('err-tbl').innerHTML=h;
})();
