建设厅负责管理，具体解释由自治区工程造价总站负责。各地在执行过程中遇到的问题，请及时反馈自治区工程造价总站。联系人：古丽··斯坎尔得尔 联系方式：0991－8863718","kind":"item","content":"自治区住房和城乡建设厅2021年12月29日","phys_page":3,"print_page":null,"parent":null},{"id":"I005","section":"front-总说明","no":"一","name":"《2020版新疆维吾尔自治区建筑、安装、市政工程费用定额》（以下简称为《费用定额》）是根据国家标准《建设工程工程量清单计价规范》（GB50500－2013）和住建部 财政部《建筑安装工程费用项目组成》（建标〔2013〕44号）文件精神及有关规定，并结合我区建设工程实际情况进行编制的。","kind":"item","content":"","phys_page":7,"print_page":1,"parent":null},{"id":"I006","section":"front-总说明","no":"二","name":"本《费用定额》是编制建筑、安装、市政工程投资估算、设计概算、招标控制价、施工图预算的依据，可作为投标报价、签订施工合同、工程结算、编制企业定额的参考。","kind":"item","content":"","phys_page":7,"print_page":1,"parent":null},{"id":"I007","section":"front-总说明","no":"三","name":"本《费用定额》在全疆范围内统一执行，并与2020版《新疆维吾尔自治区房屋建筑与装饰工程消耗量定额》《通用安装工程消耗量定额》（TY02－31－2015）、2020版《新疆维吾尔自治区安装工程补充消耗量定额》、2020版《新疆维吾尔自治区市政工程消耗量定额》以及自治区各地建设主管部门发布的相应地区单位估价表配套使用。","kind":"item","content":"","phys_page":7,"print_page":1,"parent":null},{"id":"I008","section":"front-总说明","no":"四","name":"根据国家有关规定“费用定额与直接费定额一般应配套使用，执行什么直接费定额，就采用相应的费用定额”。","kind":"item","content":"","phys_page":7,"print_page":1,"parent":null},{"id":"I009","section":"front-总说明","no":"五","name":"自治区水利、电力、煤炭、化工、公路、铁路、有色金属等专业施工企业，承担专业工程的应执行专业工程费用定额。","kind":"item","content":"","phys_page":7,"print_page":1,"parent":null},{"id":"I010","section":"front-总说明","no":"六","name":"本《费用定额》的适用范围：","kind":"item","content":"（一）建筑工程：适用于一般新建、扩建和改建的工业与民用建筑工程中的永久性和临时性的房屋和构筑物工程。（二）安装工程：适用于一般新建、扩建和改建的工业与民用建筑工程中的安装工程，包括：工业、民用设备，电气、智能化控制设备，自动化控制仪表，通风空调，工业、消防、给排水、采暖燃气管道以及通信设备安装等。（三）市政工程：适用于自治区区域内城镇管辖范围内的新建、扩建、改建市政工程。","phys_page":7,"print_page":1,"parent":null},{"id":"I011","section":"front-总说明","no":"七","name":"本《费用定额》中凡列有区间费率标准的，在编制招标控制价时应按其上限标准计取。","kind":"item","content":"","phys_page":7,"print_page":1,"parent":null},{"id":"I012","section":"front-术语","no":"1","name":"工程造价","kind":"term","content":"工程项目在建设期预计或实际支出的建设费用。","phys_page":8,"print_page":2,"parent":null},{"id":"I013","section":"front-术语","no":"2","name":"全过程造价管理咨询","kind":"term","content":"受委托方委托，工程造价咨询企业应用工程造价管理的知识与技术，为实现建设项目决策、设计、招投标、施工、竣工等各个阶段的工程造价管理目标而提供的服务。","phys_page":8,"print_page":2,"parent":null},{"id":"I014","section":"front-术语","no":"3","name":"建设项目","kind":"term","content":"按一个总体规划或设计进行建设的，由一个或若干个互有内在联系的单项工程组成的工程总和。","phys_page":8,"print_page":2,"parent":null},{"id":"I015","section":"front-术语","no":"4","name":"单项工程","kind":"term","content":"具有独立设计文件，建成后能够独立发挥生产能力或使用功能的工程项目。","phys_page":8,"print_page":2,"parent":null},{"id":"I016","section":"front-术语","no":"5","name":"单位工程","kind":"term","content":"具有独立的设计，能够独立组织施工，但不能独立发挥生产能力或使用功能的工程项目。","phys_page":8,"print_page":2,"parent":null},{"id":"I017","section":"front-术语","no":"6","name":"分部分项工程","kind":"term","content":"分部工程是单位工程的组成部分，系按结构部位、路段长度及施工特点或施工任务将单位工程划分为若干个项目单元；分项工程是分部工程的组成部分，系按不同施工方法、材料、工序及路段长度等将分部工程划分为若干个项目单元。","phys_page":8,"print_page":2,"parent":null},{"id":"I018","section":"front-术语","no":"7","name":"措施项目","kind":"term","content":"为完成工程项目施工，发生于施工准备和施工过程中的技术、生活、安全、环境保护等方面的项目。","phys_page":8,"print_page":2,"parent":null},{"id":"I019","section":"front-术语","no":"8","name":"企业定额","kind":"term","content":"施工企业根据本企业的施工技术、机械装备和管理水平编制的人工、材料和施工机械台班等的消耗标准。","phys_page":8,"print_page":2,"parent":null},{"id":"I020","section":"front-术语","no":"9","name":"定额人工费","kind":"term","content":"按照现行消耗量定额人工消耗量乘以定额人工单价计算出的费用，是计取各项费用的基数。","phys_page":8,"print_page":2,"parent":null},{"id":"I021","section":"front-术语","no":"10","name":"综合单价","kind":"term","content":"完成一个规定工程量清单项目所需的人工费、材料和工程设备费、施工机具使用费、企业管理费、利润，以及一定范围内的风险费用。","phys_page":8,"print_page":2,"parent":null},{"id":"I022","section":"front-术语","no":"11","name":"现场签证","kind":"term","content":"发包人现场代表（或其授权的监理人、工程造价咨询人）与承包人现场代表就施工过程中涉及的责任事件所做的签认证明。","phys_page":9,"print_page":3,"parent":null},{"id":"I023","section":"front-术语","no":"12","name":"工程造价指数","kind":"term","content":"反映一定时期的工程造价相对于某一固定时期或上一时期的工程造价变化方向、趋势和程度的比值或比率。","phys_page":9,"print_page":3,"parent":null},{"id":"I024","section":"front-术语","no":"13","name":"工程建设其他费用","kind":"term","content":"建设期发生的与土地使用权取得、整个工程项目建设以及未来生产经营有关的构成建设投资但不包括在工程费用中的费用。","phys_page":9,"print_page":3,"parent":null},{"id":"I025","section":"front-术语","no":"14","name":"投资估算指标","kind":"term","content":"以建设项目、单项工程、单位工程为对象，反映其建设总投资及其各项费用构成的经济指标。","phys_page":9,"print_page":3,"parent":null},{"id":"I026","section":"front-术语","no":"15","name":"单项工程估算指标","kind":"term","content":"以工程项目中单项工程为对象编制的反映单项工程建设投资费用的经济指标。","phys_page":9,"print_page":3,"parent":null},{"id":"I027","section":"front-术语","no":"16","name":"单位工程估算指标","kind":"term","content":"以单项工程中各个单位工程为对象编制的反映单位工程建设投资费用的经济指标。","phys_page":9,"print_page":3,"parent":null},{"id":"I028","section":"front-术语","no":"17","name":"招标控制价","kind":"term","content":"招标人根据国家或省级建设行政主管部门颁发的有关计价依据和办法，依据拟订的招标文件和招标工程量清单，结合工程具体情况发布的招标工程的最高投标限价。","phys_page":9,"print_page":3,"parent":null},{"id":"I029","section":"front-术语","no":"18","name":"投标价","kind":"term","content":"投标人投标时响应招标文件要求所报出的，在已标价工程量清单中标明的总价。","phys_page":9,"print_page":3,"parent":null},{"id":"I030","section":"front-术语","no":"19","name":"工程变更","kind":"term","content":"合同工程实施过程中由发包人提出或由承包人提出，经发包人批准的合同工程的工作内容、工程数量、质量要求、施工顺序与时间、施工条件、施工工艺或其他特征及合同条件等的改变。","phys_page":9,"print_page":3,"parent":null},{"id":"I031","section":"front-术语","no":"20","name":"工程设备","kind":"term","content":"指构成或计划构成永久工程一部分的机电设备、金属结构设备、仪器装置及其他类似的设备和装置。","phys_page":9,"print_page":3,"parent":null},{"id":"I032","section":"ch01-sec1","no":"一","name":"人工费：是指按工资总额构成规定，支付给从事建筑安装工程施工的生产工人和附属生产单位工人的各项费用。内容包括：","kind":"item","content":"1.计时工资或计件工资：是指按计时工资标准和工作时间或对已做工作按计件单价支付给个人的劳动报酬。2.奖金：是指对超额劳动和增收节支支付给个人的劳动报酬。如节约奖、劳动竞赛奖等。3.津贴补贴：是指为了补偿职工特殊或额外的劳动消耗和因其他特殊原因支付给个人的津贴，以及为了保证职工工资水平不受物价影响支付给个人的物价补贴。如流动施工津贴、特殊地区施工津贴、高温（寒）作业临时津贴、高空津贴等。4.加班加点工资：是指按规定支付的在法定节假日工作的加班工资和在法定日工作时间外延时工作的加点工资。5.特殊情况下支付的工资：是指根据国家法律、法规和政策规定，因病、工伤、产假、计划生育假、婚丧假、事假、探亲假、定期休假、停工学习、执行国家或社会义务等原因按计时工资标准或计时工资标准的一定比例支付的工资。6.生产工人个人缴纳的养老保险、失业保险、医疗保险和住房公积金。","phys_page":12,"print_page":2,"parent":null},{"id":"I033","section":"ch01-sec1","no":"二","name":"材料费：是指施工过程中耗费的原材料、辅助材料、构配件、零件、半成品或成品、工程设备的费用。内容包括：","kind":"item","content":"1.材料原价：是指材料、工程设备的出厂价格或商家供应价格。2.运杂费：是指材料、工程设备自来源地运至工地仓库或指定堆放地点所发生的全部费用。3.运输损耗费：是指材料在运输装卸过程中不可避免的损耗。4.采购及保管费：是指为组织采购、供应和保管材料、工程设备的过程中所需要的各项费用。包括采购费、仓储费、工地保管费、仓储损耗。","phys_page":12,"print_page":2,"parent":null},{"id":"I034","section":"ch01-sec1","no":"三","name":"施工机具使用费：是指施工作业所发生的施工机械使用费、仪器仪表使用费。","kind":"item","content":"1.施工机械使用费：以施工机械台班耗用量乘以施工机械台班单价表示，施工机械台班单价应由下列七项费用组成：（1）折旧费：指施工机械在规定的耐用总台班内，陆续收回其原值的费用。（2）检修费：指施工机械在规定的耐用总台班内，按规定的检修间隔进行必要的检修，以恢复其正常功能所需的费用。（3）维护费：指施工机械在规定的耐用总台班内，按规定的维护间隔进行各级维护和临时故障排除所需的费用。保障机械正常运转所需替换的设备与随机配备工具附具的摊销费用、机械运转及日常维护所需润滑与擦拭的材料费用及机械停滞期间的维护费用等。（4）安拆费及场外运费：安拆费指施工机械（大型机械除外）在现场进行安装与拆卸所需的人工、材料、机械和试运转费用以及机械辅助设施的折旧、搭设、拆除等费用；场外运费指施工机械整体或分体自停放地点运至施工现场或由一施工地点运至另一施工地点的运输、装卸、辅助材料等费用。（5）人工费：指机上司机（司炉）和其他操作人员的人工费。（6）燃料动力费：指施工机械在运转作业中所耗用的燃料及水、电等费用。（7）其他费：指施工机械按照国家规定应缴纳的车船税、保险费及检测费等。2.仪器仪表使用费：是指工程施工所需使用的仪器仪表的摊销及维修费用，其台班单价由折旧费、维护费、校验费和动力费四项费用组成。（1）折旧费：指施工仪器仪表在耐用总台班内，陆续收回其原值的费用。（2）维护费：指施工仪器仪表各级维护、临时故障排除所需的费用及为保证仪器仪表正常使用所需要备件（备品）的维护费用。（3）校验费：是指国家与地方政府规定的标定与检验的费用。（4）动力费：指施工仪器仪表在使用过程中所耗用的电费。施工仪器仪表台班单价中的费用组成未包括检测软件的相关费用。","phys_page":12,"print_page":2,"parent":null},{"id":"I035","section":"ch01-sec1","no":"四","name":"企业管理费：是指建筑安装企业组织施工生产和经营管理所需的费用。内容包括：","kind":"item","content":"1.管理人员工资：是指按规定支付给管理人员的计时工资、奖金、津贴补贴、加班加点工资及特殊情况下支付的工资等。2.办公费：是指企业管理办公用的文具、纸张、帐表、印刷、邮电、书报、办公软件、会议、水电、烧水和集体取暖降温（包括现场临时宿舍取暖降温）等费用。3.差旅交通费：是指职工因公出差、调动工作的差旅费、住勤补助费，市内交通费和误餐补助费，职工探亲路费，劳动力招募费，职工退休、退职一次性路费，工伤人员就医路费，工地转移费以及管理部门使用的交通工具的油料、燃料等费用。4.固定资产使用费：是指管理和试验部门及附属生产单位使用的属于固定资产的房屋、设备、仪器等的折旧、大修、维修或租赁费。5.工具用具使用费：是指企业施工生产和管理使用的不属于固定资产的工具、器具、家具、交通工具和检验、试验、测绘、消防用具等的购置、维修和摊销费。6.劳动保险和职工福利费：是指由企业支付的职工退职金、按规定支付给离休干部的经费，集体福利费、夏季防暑降温、冬季取暖补贴、上下班交通补贴等。7.劳动保护费：是企业按规定发放的劳动保护用品的支出。如工作服、手套、防暑降温饮料以及在有碍身体健康的环境中施工的保健费用等。8.工会经费：是指企业按《工会法》规定的全部职工工资总额比例计提的工会经费。9.职工教育经费：是指按职工工资总额的规定比例计提，企业为职工进行专业技术和职业技能培训，专业技术人员继续教育、职工职业技能鉴定、职业资格认定以及根据需要对职工进行各类文化教育所发生的费用。10.财产保险费：是指施工管理用财产、车辆等的保险费用。11.财务费：是指企业为施工生产筹集资金或提供预付款担保、履约担保、职工工资支付担保等所发生的各种费用。12.税金：是指根据国家税法规定应计入建筑安装工程造价内的城市建设维护税、教育税附加及地方教育税附加，以及企业按规定缴纳的房产税、车船使用税、土地使用税、印花税、环保税等。13.其他：包括技术转让费、技术开发费、投标费、业务招待费、绿化费、广告费、公证费、法律顾问费、审计费、咨询费、保险费等。","phys_page":13,"print_page":3,"parent":null},{"id":"I036","section":"ch01-sec1","no":"五","name":"利润：是指施工企业完成所承包工程获得的盈利。","kind":"item","content":"","phys_page":14,"print_page":4,"parent":null},{"id":"I037","section":"ch01-sec1","no":"六","name":"规费：是指按国家法律、法规规定，由省级政府和省级有关权力部门规定必须缴纳或计取的费用，本费用为不可竞争费。包括：","kind":"item","content":"1.社会保险费（1）养老保险费：是指企业按照规定标准为职工缴纳的基本养老保险费。（2）失业保险费：是指企业按照规定标准为职工缴纳的失业保险费。（3）医疗保险费：是指企业按照规定标准为职工缴纳的基本医疗保险费和生育保险费。（根据《关于印发全面推进生育保险和职工基本医疗保险合并实施方案的通知（新政办发〔2019〕85号）》要求，生育保险费并入医疗保险费中）（4）工伤保险费：是指企业按照规定标准为职工缴纳的工伤保险费。2.住房公积金：是指企业按规定标准为职工缴纳的住房公积金。其他应列而未列入的规费，按相关规定计取。","phys_page":14,"print_page":4,"parent":null},{"id":"I038","section":"ch01-sec1","no":"七","name":"税金：是指国家税法规定的应计入建筑安装工程造价内的建筑服务增值税。","kind":"item","content":"","phys_page":14,"print_page":4,"parent":null},{"id":"I039","section":"ch01-sec2","no":"一","name":"分部分项工程费：是指各专业工程的分部分项工程应予列支的各项费用。","kind":"item","content":"（一）专业工程：是指按现行国家计量规范划分的房屋建筑与装饰工程、仿古建筑工程、通用安装工程、市政工程、园林绿化工程、矿山工程、构筑物工程、城市轨道交通工程、爆破工程等各类工程。（二）分部分项工程：指按现行国家计量规范对各专业工程划分的项目。如房屋建筑与装饰工程划分的土石方工程、地基处理及基坑支护工程、桩基工程、砌筑工程、钢筋及钢筋混凝土工程等。各类专业工程的分部分项工程划分见现行国家或行业计量规范。","phys_page":16,"print_page":6,"parent":null},{"id":"I040","section":"ch01-sec2","no":"二","name":"措施项目费：是指为完成建设工程施工，发生于该工程施工前和施工过程中的技术、生活、安全、环境保护等方面的费用，由单价措施项目费和总价措施项目费构成。","kind":"item","content":"（一）单价措施项目费包括：1.大型机械设备进出场及安拆费：是指机械整体或分体自停放场地运至施工现场或由一个施工地点运至另一个施工地点，所发生的机械进出场运输及转移费用及机械在施工现场进行安装、拆卸所需的人工费、材料费、机械费、试运转费和安装所需的辅助设施的费用。2.脚手架工程费：是指施工需要的各种脚手架搭、拆、运输费用以及脚手架购置费的摊销费用。3.混凝土模板及支架费：是指混凝土施工过程中需要的各种模板和支架等的支、拆、运输费用以及模板、支架的摊销或租赁费用。4.施工降排水费：是指为确保工程在正常条件下施工，采取各种排水、降水措施所发生的各种费用。5.施工技术专项措施费：是根据设计或建设主管部门的规定，需由承包人提出专项方案并经论证、批准后方能实施的施工技术措施项目，如深基坑支护、高支模支撑架等。6.其他单价措施项目费：是指除上述措施项目外，各专业工程根据工程特征所采用的措施项目费用。其包含的内容详见国家工程量计算规范。（二）总价措施项目费包括：1.安全文明施工费：是指按照国家、自治区现行的建筑施工安全、施工现场环境与卫生标准、大气环境污染防治及智慧工地中安全管理等有关规定，满足施工现场安全、文明施工以及环境保护、职工生活和生产所需要的各项费用。该费用中环境保护费、文明施工费、安全施工费为不可竞争费，不得作为发包或承揽施工任务的优惠条件。安全文明施工费内容包括：环境保护费、文明施工费、安全施工费、临时设施费。（1）环境保护费：是指施工现场为达到环保部门要求所需要的包括施工现场扬尘污染防治、治理在内的各项费用。（2）文明施工费：是指施工现场文明施工所需要的各项费用，一般包括施工现场的标牌设置、现场安全保卫及保持场貌、场容整整等发生的费用。（3）安全施工费：是指施工现场安全施工所需要的各项费用，一般包括安全防护用具和服装，施工现场的智慧工地基础配置、安全警示、消防设施和灭火器材、安全教育培训、安全检查及编制安全措施方案等所发生的费用。（4）临时设施费：是指施工企业为进行建设工程施工所必须搭设的生活和生产用的临时建筑物、构筑物和其他临时设施费用。包括临时设施的搭设、维修、拆除、清理或摊销费等。临时设施包括：临时宿舍、文化福利及公用事业房屋与构筑物，仓库、办公室、加工厂（场）以及在规定范围内道路、水、电、管线等临时设施和小型临时设施。2.检验试验费：根据检验试验工作开展配合情况，分为自检试验费和检验试验配合费。（1）自检试验费：是指施工企业按照有关标准规定，自设试验室并对建筑以及材料、构件和建筑安装物进行一般鉴定、检查所发生的费用（包括试验所耗用的材料费）。自检试验费发生时以经审定的方案及合同约定的结算方式进行结算。（2）检验试验配合费：是指施工企业配合检测机构按规定进行建筑材料、构配件等试样的制作、封样、送检和其它为保证工程质量进行的材料检验试验工作所发生的费用。此费用不包括由建设单位委托检测机构进行检测的费用，对此类检测发生的费用，由建设单位在工程建设其他费用中列支。但对施工企业提供的具有合格证明的材料进行检测不合格的，该检测费用由施工企业支付。3.工程定位复测、点交清理费：是指工程施工前测量、定位、钉龙门板桩及经规划部门派员复测的费用；办理竣工验收，进行工程点交的费用；竣工后室内外垃圾等场地清理所发生的费用。4.已完工程及设备保护费：是指竣工验收前，对已完工程及工程设备采取的必要保护措施所发生的费用。5.夜间施工增加费：是指因夜间施工所发生的夜班补助费、夜间施工降效、夜间施工照明设备摊销及照明用电等费用。6.二次搬运费：是指因施工场地条件限制而发生的材料、构配件、半成品等一次运输不能到达堆放地点，必须进行二次或多次搬运所发生的费用。若确属场地狭小不能一次堆放，发生了部分材料、成品、半成品的二次搬运，且不是施工单位施工组织设计深度不够、布置不合理而自行造成的，甲、乙双方可根据施工现场的实际情况，办理经济签证手续，据此结算。7.冬雨季施工增加费：是指按照施工及验收规范所规定的冬季施工要求和雨季施工期间，为保证工程质量和安全生产所发生的费用。冬雨季施工费包括内容：因冬雨季施工增加工序，从而增加的人工工资及劳动效率降低的因素；防冻保温增加的设施、材料、加热养护及临时取暖费用（包括各种养护、材料加热、覆盖材料、暖棚等）；冬季施工需要提高混凝土、砂浆标号所增加的材料及附加化学药品等费用。冬雨季施工费不发生不计取，在编制施工招标文件时拟定施工方案，依据工程实际情况，结合市场编制费用清单。8.施工因素增加费：是指具有市政工程特点，又不属于临时设施范围，并在施工前可预见的因素所发生的费用。包括地下管道的勾头、交叉处理与恢复措施，边施工、边维持交通的措施费用等，但不包括全封闭状态下的行车影响因素。此费用仅适用于市政工程。9.竣工档案编制费：是指施工企业根据建设工程档案管理的有关规定，在建设工程施工过程中收集、整理、制作、装订、归档具有保存价值的文字、图纸、图表、声像、电子文件等各种建设工程档案资料所发生的费用。10.特殊地区施工增加费：是指工程在沙漠腹地或其边缘地区、高原、高寒等特殊地区施工增加的费用。沙漠腹地及边缘地区施工增加费，指在沙漠腹地或其边缘地区施工，由于高温、风沙使人工和机械降效所发生的费用。高原、高寒地区施工增加费，指在海拔高度2000m以上、气温－20℃以下地区施工，由于受气候、气压的影响致使人工、机械效率降低所发生的费用。11.其他总价措施费：是指根据各专业工程特点补充的总价措施项目的费用。","phys_page":16,"print_page":6,"parent":null},{"id":"I041","section":"ch01-sec2","no":"三","name":"其他项目费","kind":"item","content":"1.暂列金额：是指招标人在工程量清单中暂定并包括在工程合同价款中的一笔款项。用于施工合同签订时尚未确定或者不可预见的所需材料、工程设备、服务的采购，施工中可能发生的工程变更、合同约定调整因素出现时的合同价款调整以及发生的索赔、现场签证确认等的费用。暂列金额由建设单位根据工程特点，按有关计价规定估算，施工过程中由建设单位掌握使用、扣除合同价款调整后如有余额，归建设单位。2.暂估价：是指招标人在工程量清单中提供用于支付必然发生但不能确定价格的材料、工程设备的单价以及专业工程的金额。其中：（1）材料及工程设备暂估价：是指发包阶段已经确认发生的材料、工程设备，由于设计标准未明确等原因造成无法当时确定准确价格，或者设计标准虽已明确，但一时无法取得合理询价，由招标人在工程量清单中给定的若干暂估单价。材料及工程设备暂估价在清单综合单价中考虑，不计入暂估价汇总。（2）专业工程暂估价：是指发包阶段已经确认发生的专业工程，由于设计未详尽、标准未明确或者需要由专业承包人完成等原因造成无法当时确定价格，由招标人在工程量清单中给定的一个暂估总价。3.计日工：是指在施工过程中，承包人完成发包人提出的工程合同范围以外的零星项目或工作所需的费用。4.总承包服务费：是指总承包人为配合、协调发包人进行的专业工程发包，对发包人自行采购的材料、工程设备等进行保管以及施工现场管理、竣工资料汇总整理等服务所需的费用。","phys_page":18,"print_page":8,"parent":null},{"id":"I042","section":"ch01-sec2","no":"四","name":"规费：定义同第一章第一节（六、规费）。","kind":"item","content":"","phys_page":18,"print_page":8,"parent":null},{"id":"I043","section":"ch01-sec2","no":"五","name":"税金：定义同第一章第一节（七、税金）。","kind":"item","content":"","phys_page":18,"print_page":8,"parent":null},{"id":"I044","section":"ch02-sec1","no":"一","name":"安全文明施工费","kind":"item","content":"1.以上费率中不包括施工现场搭设的围挡、行车道路硬化等项目的内容，如发生，以经审定的施工方案中的施工现场平面布置和施工过程中实际完成的工作量（或摊销量）计算其安拆费，单独计列，不参与取费，只计取税金。2.市政工程各单位工程中的土石方工程，不管工程量大小，均执行市政土石方工程取费。（下同）3.道路工程适用于城市地面快速干道、主干道、次干道、支路、街道以及园林景区、公园、居民区（厂区、校区）等区域内按市政标准设计的道路、广场、停车场、运动场、操场等，并包括交通标志标线等相应的附属工程。4.桥涵工程适用于城市水域桥梁、城市地面桥梁（含立交桥、高架路、人行天桥等）、车行（或人行）箱涵、综合管廊等工程，并包括相应的附属工程。（下同）5.隧道工程适用于城镇范围内的各种车行隧道、人行隧道、给排水隧道及电缆（公用事业）隧道。（下同）6.场站土建、安装工程是指给水厂、污水处理工程；给水、污水泵站、雨水泵站；城市生活垃圾处理工程，并包括相应的附属工程。（下同）","phys_page":23,"print_page":13,"parent":null},{"id":"I045","section":"ch02-sec5","no":"一","name":"暂列金额：应根据拟建工程特点、工程复杂程度、设计深度、工程环境条件（包括地质、水文、气候条件等），按照国家及自治区有关专业规定进行估算，也可以按拟建工程的分部分项工程费的5%~10%作为参考。","kind":"item","content":"","phys_page":28,"print_page":18,"parent":null},{"id":"I046","section":"ch02-sec5","no":"二","name":"总承包服务费招标人依法将专业工程进行分包的，总承包单位应收取总承包服务费。费用视服务内容的多少，由双方在合同中约定，也可参照下列标准计算。","kind":"item","content":"1.招标人仅要求对分包的专业工程进行总承包管理和协调时，按分包的专业工程造价（不含设备费）的1.5%计算。2.招标人要求对分包的专业工程进行总承包管理和协调，并同时要求提供配合服务时，根据招标文件中列出的配合服务内容和提出的要求，按分包的专业工程造价（不含设备费）的3%~5%计算。3.招标人自行供应材料、工程设备的，按招标人供应材料、工程设备价值的1%计算。","phys_page":28,"print_page":18,"parent":null},{"id":"I047","section":"ch03","no":"一","name":"下列情况不在临时设施范围内应由建设单位负责：","kind":"item","content":"1.由场外水源、电源、热源敷设到按施工组织设计确定的地点、场内活动半径超过50m以外的管线。2.施工现场必须临时设置的水塔、水井、锅炉房、变电所、铁路专用线等设施和所需要的锅炉、水泵、变压器等设备以及高层建筑临时消防管线等设施。3.大中型工业建筑安装工程，工程地址远离城市或在偏僻地区施工，无原有房屋可利用，又确属需要设置临时构件加工厂的，可按经审定的施工方案及合同约定的结算方式进行计算。","phys_page":30,"print_page":20,"parent":null},{"id":"I048","section":"ch03","no":"二","name":"施工企业计取了临时设施费，又住用了建设单位的房屋设施，应向建设单位交付使用租金。","kind":"item","content":"","phys_page":30,"print_page":20,"parent":null},{"id":"I049","section":"ch03","no":"三","name":"施工现场与城市道路之间的连接道路硬化（或路面保护），是发包人向承包人提供正常施工所需的交通条件，如由承包人负责实施，其费用应经现场签证后另行计算。","kind":"item","content":"","phys_page":30,"print_page":20,"parent":null},{"id":"I050","section":"ch03","no":"四","name":"施工技术专项措施项目暂估价：是指发包阶段已经确认发生的施工技术措施项目，由于需要在签约后由承包人提出专项方案并经论证、批准方能实施等原因，造成无法当时准确计价，由招标人在工程量清单中给定一个暂估总价。","kind":"item","content":"","phys_page":30,"print_page":20,"parent":null},{"id":"D001","section":"appendix","no":"","name":"建筑工程施工发包与承包计价管理办法（住房和城乡建设部令第16号）","kind":"appendix_doc","content":"住房和城乡建设部令 第16号第一条 为了规范建筑工程施工发包与承包计价行为，维护建筑工程发包与承包双方的合法权益，促进建筑市场的健康发展，根据有关法律、法规，制定本办法。第二条 在中华人民共和国境内的建筑工程施工发包与承包计价（以下简称工程发承包计价）管理，适用本办法。本办法所称建筑工程是指房屋建筑和市政基础设施工程。本办法所称工程发承包计价包括编制工程量清单、最高投标限价、招标标底、投标报价，进行工程结算，以及签订和调整合同价款等活动。第三条 建筑工程施工发包与承包价在政府宏观调控下，由市场竞争形成。工程发承包计价应当遵循公平、合法和诚实信用的原则。第四条 国务院住房城乡建设主管部门负责全国工程发承包计价工作的管理。县级以上地方人民政府住房城乡建设主管部门负责本行政区域内工程发承包计价工作的管理。其具体工作可以委托工程造价管理机构负责。第五条 国家推广工程造价咨询制度，对建筑工程项目实行全过程造价管理。第六条 全部使用国有资金投资或者以国有资金投资为主的建筑工程（以下简称国有资金投资的建筑工程），应当采用工程量清单计价；非国有资金投资的建筑工程，鼓励采用工程量清单计价。国有资金投资的建筑工程招标的，应当设有最高投标限价；非国有资金投资的建筑工程招标的，可以设有最高投标限价或者招标标底。最高投标限价及其成果文件，应当由招标人报工程所在地县级以上地方人民政府住房城乡建设主管部门备案。第七条 工程量清单应当依据国家制定的工程量清单计价规范、工程量计算规范等编制。工程量清单应当作为招标文件的组成部分。第八条 最高投标限价应当依据工程量清单、工程计价有关规定和市场价格信息等编制。招标人设有最高投标限价的，应当在招标时公布最高投标限价的总价，以及各单位工程的分部分项工程费、措施项目费、其他项目费、规费和税金。第九条 招标标底应当依据工程计价有关规定和市场价格信息等编制。第十条 投标报价不得低于工程成本，不得高于最高投标限价。投标报价应当依据工程量清单、工程计价有关规定、企业定额和市场价格信息等编制。第十一条 投标报价低于工程成本或者高于最高投标限价总价的，评标委员会应当否决投标人的投标。对是否低于工程成本报价的异议，评标委员会可以参照国务院住房城乡建设主管部门和省、自治区、直辖市人民政府住房城乡建设主管部门发布的有关规定进行评审。第十二条 招标人与中标人应当根据中标价订立合同。不实行招标投标的工程由发承包双方协商订立合同。合同价款的有关事项由发承包双方约定，一般包括合同价款约定方式，预付工程款、工程进度款、工程竣工价款的支付和结算方式，以及合同价款的调整情形等。第十三条 发承包双方在确定合同价款时，应当考虑市场环境和生产要素价格变化对合同价款的影响。实行工程量清单计价的建筑工程，鼓励发承包双方采用单价方式确定合同价款。建设规模较小、技术难度较低、工期较短的建筑工程，发承包双方可以采用总价方式确定合同价款。紧急抢险、救灾以及施工技术特别复杂的建筑工程，发承包双方可以采用成本加酬金方式确定合同价款。第十四条 发承包双方应当在合同中约定，发生下列情形时合同价款的调整方法：（一）法律、法规、规章或者国家有关政策变化影响合同价款的；（二）工程造价管理机构发布价格调整信息的；（三）经批准变更设计的；（四）发包方更改经审定批准的施工组织设计造成费用增加的；（五）双方约定的其他因素。第十五条 发承包双方应当根据国务院住房城乡建设主管部门和省、自治区、直辖市人民政府住房城乡建设主管部门的规定，结合工程款、建设工期等情况在合同中约定预付工程款的具体事宜。预付工程款按照合同价款或者年度工程计划额度的一定比例确定和支付，并在工程进度款中予以抵扣。第十六条 承包方应当按照合同约定向发包方提交已完成工程量报告。发包方收到工程量报告后，应当按照合同约定及时核对并确认。第十七条 发承包双方应当按照合同约定，定期或者按照工程进度分段进行工程款结算和支付。第十八条 工程完工后，应当按照下列规定进行竣工结算：（一）承包方应当在工程完工后的约定期限内提交竣工结算文件。（二）国有资金投资建筑工程的发包方，应当委托具有相应资质的工程造价咨询企业对竣工结算文件进行审核，并在收到竣工结算文件后的约定期限内向承包方提出由工程造价咨询企业出具的竣工结算文件审核意见；逾期未答复的，按照合同约定处理，合同没有约定的，竣工结算文件视为已被认可。非国有资金投资的建筑工程发包方，应当在收到竣工结算文件后的约定期限内予以答复，逾期未答复的，按照合同约定处理，合同没有约定的，竣工结算文件视为已被认可；发包方对竣工结算文件有异议的，应当在答复期内向承包方提出，并可以在提出异议之日起的约定期限内与承包方协商；发包方在协商期内未与承包方协商或者经协商未能与承包方达成协议的，应当委托工程造价咨询企业进行竣工结算审核，并在协商期满后的约定期限内向承包方提出由工程造价咨询企业出具的竣工结算文件审核意见。（三）承包方对发包方提出的工程造价咨询企业竣工结算审核意见有异议的，在接到该审核意见后一个月内，可以向有关工程造价管理机构或者有关行业组织申请调解，调解不成的，可以依法申请仲裁或者向人民法院提起诉讼。发承包双方在合同中对本条第（一）项、第（二）项的期限没有明确约定的，应当按照国家有关规定执行；国家没有规定的，可认为其约定期限均为28日。第十九条 工程竣工结算文件经发承包双方签字确认的，应当作为工程决算的依据，未经对方同意，另一方不得就已生效的竣工结算文件委托工程造价咨询企业重复审核。发包方应当按照竣工结算文件及时支付竣工结算款。竣工结算文件应当由发包方报工程所在地县级以上地方人民政府住房城乡建设主管部门备案。第二十条 造价工程师编制工程量清单、最高投标限价、招标标底、投标报价、工程结算审核和工程造价鉴定文件，应当签字并加盖造价工程师执业专用章。第二十一条 县级以上地方人民政府住房城乡建设主管部门应当依照有关法律、法规和本办法规定，加强对建筑工程发承包计价活动的监督检查和投诉举报的核查，并有权采取下列措施：（一）要求被检查单位提供有关文件和资料；（二）就有关问题询问签署文件的人员；（三）要求改正违反有关法律、法规、本办法或者工程建设强制性标准的行为。县级以上地方人民政府住房城乡建设主管部门应当将监督检查的处理结果向社会公开。第二十二条 造价工程师在最高投标限价、招标标底或者投标报价编制、工程结算审核和工程造价鉴定中，签署有虚假记载、误导性陈述的工程造价成果文件的，记入造价工程师信用档案，依照《注册造价工程师管理办法》进行查处；构成犯罪的，依法追究刑事责任。第二十三条 工程造价咨询企业在建筑工程计价活动中，出具有虚假记载、误导性陈述的工程造价成果文件的，记入工程造价咨询企业信用档案，由县级以上地方人民政府住房城乡建设主管部门责令改正，处1万元以上3万元以下的罚款，并予以通报。第二十四条 国家机关工作人员在建筑工程计价监督管理工作中忽职职守、伺私舞彝、滥用职权的，由有关机关给予行政处分；构成犯罪的，依法追究刑事责任。第二十五条 建筑工程以外的工程施工发包与承包计价管理可以参照本办法执行。第二十六条 省、自治区、直辖市人民政府住房城乡建设主管部门可以根据本办法制定实施细则。第二十七条 本办法自2014年2月1日起施行。原建设部2001年11月5日发布的《建筑工程施工发包与承包计价管理办法》（建设部令第107号）同时废止。","phys_page":33,"print_page":21,"parent":null},{"id":"D002","section":"appendix","no":"","name":"关于印发《建设工程定额管理办法》的通知（建标〔2015〕230号）","kind":"appendix_doc","content":"建标〔2015〕230号各省、自治区住房和城乡建设厅，直辖市建委，国务院有关部门：为提高建设工程定额科学性，规范定额编制和日常管理工作，按照有关法律、法规，我部制定了《建设工程定额管理办法》。现印发给你们，请贯彻执行。","phys_page":37,"print_page":25,"parent":null},{"id":"D003","section":"appendix","no":"","name":"附件：建设工程定额管理办法","kind":"appendix_attachment","content":"中华人民共和国住房和城乡建设部2015年12月25日","phys_page":37,"print_page":27,"parent":"D002"},{"id":"D004","section":"appendix","no":"","name":"附件：建设工程定额管理办法","kind":"appendix_attachment","content":"第一章 总 则第一条 为规范建设工程定额（以下简称定额）管理，合理确定和有效控制工程造价，更好地为工程建设服务，依据相关法律法规，制定本办法。第二条 国务院住房城乡建设行政主管部门、各省级住房城乡建设行政主管部门和行业主管部门（以下简称各主管部门）发布的各类定额，适用本办法。第三条 本办法所称定额是指在正常施工条件下完成规定计量单位的合格建筑安装工程所消耗的人工、材料、施工机具台班、工期天数及相关费率等的数量基准。定额是国有资金投资工程编制投资估算、设计概算和最高投标限价的依据，对其他工程仅供参考。第四条 定额管理包括定额的体系与计划、制定与修订、发布与日常管理。第五条 定额管理应遵循统一规划、分工负责、科学编制、动态管理的原则。第六条 国务院住房城乡建设行政主管部门负责全国统一定额管理工作，指导监督全国各类定额的实施；行业主管部门负责本行业的定额管理工作；省级住房城乡建设行政主管部门负责本行政区域内的定额管理工作。定额管理具体工作由各主管部门所属建设工程造价管理机构负责。第二章 体系与计划第七条 各主管部门应编制和完善相应的定额体系表，并适时调整。国务院住房城乡建设行政主管部门负责制定定额体系编制的统一要求。各行业主管部门、省级住房城乡建设行政主管部门按统一要求编制完善本行业和地区的定额体系表，并报国务院住房城乡建设行政主管部门。国务院住房城乡建设行政主管部门根据各行业主管部门、省级住房城乡建设行政主管部门报送的定额体系表编制发布全国定额体系表。第八条 各主管部门应根据工程建设发展的需要，按照定额体系相关要求，组织工程造价管理机构编制定额年度工作计划，明确工作任务、工作重点、主要措施、进度安排、工作经费等。第三章 制定与修订第九条 定额的制定与修订包括制定、全面修订、局部修订、补充。（一）对新型工程以及建筑产业现代化、绿色建筑、建筑节能等工程建设新要求，应及时制定新定额。（二）对相关技术规程和技术规范已全面更新且不能满足工程计价需要的定额，发布实施已满五年的定额，应全面修订。（三）对相关技术规程和技术规范发生局部调整且不能满足工程计价需要的定额，部分子目已不适应工程计价需要的定额，应及时局部修订。（四）对定额发布后工程建设中出现的新技术、新工艺、新材料、新设备等情况，应根据工程建设需求及时编制补充定额。第十条 定额应按统一的规则进行编制，术语、符号、计量单位等严格执行国家相关标准和规范，做到格式规范、语言严谨、数据准确。第十一条 定额应合理反映工程建设的实际情况，体现工程建设的社会平均水平，积极引导新技术、新工艺、新材料、新设备的应用。第十二条 各主管部门可通过购服服务等多种方式，充分发挥企业、科研单位、社团组织等社会力量在工程定额编制中的基础作用，提高定额编制科学性、及时性。鼓励企业编制企业定额。第十三条 定额的制定、全面修订和局部修订工作均应按准备、编制初稿、征求意见、审查、批准发布五个步骤进行。（一）准备：建设工程造价管理机构根据定额工作计划，组织具有一定工程实践经验和专业技术水平的人员成立编制组。编制组负责拟定工作大纲，建设工程造价管理机构负责对工作大纲进行审查。工作大纲主要内容应包括：任务依据、编制目的、编制原则、编制依据、主要内容、需要解决的主要问题、编制组人员与分工、进度安排、编制经费来源等。（二）编制初稿：编制组根据工作大纲开展调查研究工作，深入定额使用单位了解情况、广泛收集数据，对编制中的重大问题或技术问题，应进行测算验证或召开专题会议论证，并形成相应报告，在此基础上经过项目划分和水平测算后编制完成定额初稿。（三）征求意见：建设工程造价管理机构组织专家对定额初稿进行初审。编制组根据定额初审意见修改完成定额征求意见稿。征求意见稿由各主管部门或其授权的建设工程造价管理机构公开征求意见。征求意见的期限一般为一个月。征求意见稿包括正文和编制说明。（四）审查：建设工程造价管理机构组织编制组根据征求意见进行修改后形成定额送审文件。送审文件应包括正文、编制说明、征求意见处理汇总表等。定额送审文件的审查一般采取审查会议的形式。审查会议应由各主管部门组织召开，参加会议的人员应由有经验的专家代表、编制组人员等组成，审查会议应形成会议纪要。（五）批准发布：建设工程造价管理机构组织编制组根据定额送审文件审查意见进行修改后形成报批文件，报送各主管部门批准。报批文件包括正文、编制报告、审查会议纪要、审查意见处理汇总表等。第十四条 定额制定与修订工作完成后，编制组应将计算底稿等基础资料和成果提交建设工程造价管理机构存档。第四章 发布与日常管理第十五条 定额应按国务院住房城乡建设主管部门制定的规则统一命名与编号。第十六条 各省、自治区、直辖市和行业的定额发布后应由其主管部门报国务院住房城乡建设行政主管部门备案。第十七条 建设工程造价管理机构负责定额日常管理，主要任务是：（一）每年应面向社会公开征求意见，深入市场调查，收集公众、工程建设各方主体对定额的意见和新要求，并提出处理意见；（二）组织开展定额的宣传贯彻；（三）负责收集整理有关定额解释和定额实施情况的资料；（四）组织开展定额实施情况的指导监督；（五）负责组建定额编制专家库，加强定额管理队伍建设。第五章 经费第十八条 各主管部门应按照《财政部国家发展改革委关于公布取消和停止征收100项行政事业性收费项目的通知》（财综〔2008〕78号）要求，积极协调同级财政部门在财政预算中保障定额相关经费。第十九条 定额经费的使用应符合国家、行业或地方财务管理制度，实行专款专用，接受有关部门的监督与检查。第六章 附 则第二十条 本办法由国务院住房城乡建设行政主管部门负责解释。第二十一条 各省级住房城乡建设行政主管部门和行业主管部门可以根据本办法制定实施细则。第二十二条 本办法自发布之日起施行。","phys_page":37,"print_page":27,"parent":"D002"},{"id":"D005","section":"appendix","no":"","name":"关于加强和改善工程造价监管的意见（建标〔2017〕209号）","kind":"appendix_doc","content":"建标（2017）209号各省、自治区住房城乡建设厅，直辖市建委，国务院有关部门：工程造价监管是建设市场监管的重要内容，加强和改善工程造价监管是维护市场公平竞争、规范市场秩序的重要保障。近年来，工程造价监管在推进建筑业“放管服”改革，坚持市场决定工程造价，完善工程计价制度，维护建设市场各方合法权益等方面取得明显成效，但也存在工程造价咨询服务信用体系不健全、计价体系不完善、计价行为不规范、计价监督机制不完善等问题。为贯彻落实《国务院关于印发“十三五”市场监管规划的通知》（国发〔2017〕6号）和《国务院办公厅关于促进建筑业持续健康发展的意见》（国办发〔2017〕19号），完善工程造价监管机制，全面提升工程造价监管水平，更好服务建筑业持续健康发展，现提出以下意见：一、深化工程造价咨询业监管改革，营造良好市场环境（一）优化资质资格管理。进一步简化工程造价咨询企业资质管理，全面实行行政许可事项网上办理，提高行政审批效率，逐步取消工程造价咨询企业异地执业备案，减轻企业负担。完善造价工程师执业资格制度，发挥个人执业在工程造价咨询中的作用。推进造价工程师执业资格国际互认，为“一带一路”国家战略和工程造价咨询企业“走出去”提供人才支撑。（二）建立以信用为核心的新型市场监管机制。各级住房城乡建设主管部门、有关行业主管部门要按照“谁审批、谁监管，谁主管、谁监管”和信用信息“谁产生、谁负责、谁归集、谁解释”的原则，加快推进工程造价咨询信用体系建设。积极推进工程造价咨询企业年报公示和信用承诺制度，加快信用档案建设，增强企业责任意识、信用意识。加快政府部门之间工程造价信用信息共建共享，强化行业协会自律和社会监督作用，应用投诉举报方式，建立工程造价咨询企业和造价工程师守信联合激励和失信联合惩戒机制，重点监管失信企业和执业人员，积极推进信用信息和信用产品应用。（三）营造良好的工程造价咨询业发展环境。充分发挥工程造价在工程建设全过程管理中的引导作用，积极培育具有全过程工程咨询能力的工程造价咨询企业，鼓励工程造价咨询企业融合投资咨询、勘察、设计、监理、招标代理等业务开展联合经营，开展全过程工程咨询，设立合伙制工程造价咨询企业。促进企业创新发展，强化工程造价咨询成果质量终身责任制，逐步建立执业人员保险制度。（四）完善工程造价咨询企业退出机制。对长期未履行年报义务，长期无咨询业务，以及违反相关政策法规、计价规则等不正当竞争行为的工程造价咨询企业和造价工程师记入信用档案，情节严重的，依法强制退出市场。严肃查处工程造价咨询企业资质“挂靠”、造价工程师违规“挂证”行为。二、共编共享计价依据，搭建公平市场平台（一）完善工程建设全过程计价依据体系。完善工程前期投资估算、设计概算等计价依据，清除妨碍形成全国统一市场的不合理地区计价依据，统一消耗量定额编制规则，推动形成统一开放的建设市场。加快编制工程总承包计价规范，规范工程总承包计量和计价活动。统一工程造价综合指标指数和人工、材料价格信息发布标准。（二）大力推进共享计价依据编制。整合各地、各有关部门计价依据编制力量，共编共享计价依据，并及时修订，提高其时效性。各级工程造价管理机构要完善本地区、本行业人工、材料、机械价格信息发布机制，探索区域价格信息统一测算、统一管理、统一发布模式，提高信息发布的及时性和准确性，为工程项目全过程投资控制和工程造价监管提供支撑。（三）突出服务重点领域的造价指标编制。为推进工程科学决策和造价控制提供依据，围绕政府投资工程，编制对本行业、本地区具有重大影响的工程造价指标。加快住房城乡建设领域装配式建筑、绿色建筑、城市轨道交通、海绵城市、城市地下综合管廊等工程造价指标编制。（四）完善建设工程人工单价市场形成机制。改革计价依据中人工单价的计算方法，使其更加贴近市场，满足市场实际需要。扩大人工单价计算口径，将单价构成调整为工资、津贴、职工福利费、劳动保护费、社会保险费、住房公积金、工会经费、职工教育经费以及特殊情况下工资性费用，并依据新材料、新技术的发展，及时调整人工消耗量。各省级建设主管部门、有关行业主管部门工程造价管理机构要深入市场调查，按上述口径建立人工单价信息动态发布机制，引导企业将工资分配向关键技术技能岗位斜，，定期集中发布人工单价信息。三、明确工程质量安全措施费用，突出服务市场关键环节（一）落实安全文明施工、绿色施工等措施费。各级住房城乡建设主管部门要以保障工程质量安全、创建绿色环保施工环境为目标，不断完善工程计价依据中绿色建筑、装配式建筑、环境保护、安全文明施工等有关措施费用，并加强对费用落实情况的监督。（二）合理确定建设工程工期。合理确定、有效控制建设工程工期是确保工程质量安全的重要内容。各级住房城乡建设主管部门要指导和监督工程建设各方主体认真贯彻落实《建筑安装工程工期定额》，在可行性研究、初步设计、招标投标及签订合同阶段应结合施工现场实际情况，科学合理确定工期。加大工期定额实施力度，杜绝任意压缩合同工期行为，确保工期管理的各项规定和要求落实到位。四、强化工程价款结算纠纷调解，营造竞争有序的市场环境（一）规范工程价款结算。强化合同对工程价款的约定与调整，推行工程价款施工过程结算制度，规范工程预付款、工程进度款支付。研究建立工程价款结算文件备案与产权登记联动的信息共享机制。鼓励采取工程款支付担保等手段，约束建设单位履约行为，确保工程价款支付。（二）强化工程价款结算过程中农民工工资的支付管理。为保障农民工合法权益，落实人工费用与其他工程款分账管理制度，完善农民工工资（劳务费）专用账户管理，避免总承包人将经营风险转嫁给农民工，克扣或拖欠农民工工资。（三）建立工程造价纠纷调解机制。制定工程造价鉴定标准，规范工程造价咨询企业、造价工程师参与工程造价经济纠纷鉴定和仲裁咨询行为，重点加强工程价款结算纠纷和合同纠纷的调解。积极搭建工程造价纠纷调解平台，充分发挥经验丰富的造价工程师调解纠纷的专业优势，提高纠纷解决效率，维护建设市场稳定。五、加强工程造价制度有效实施，完善市场监管手段（一）加强政府投资工程造价服务。各级工程造价管理机构要不断提高政府投资工程和重大工程项目工程造价服务能力，建立工程造价全过程信息服务平台，完善招标控制价、合同价、结算价电子化备案管理，确保资金投资效益。（二）开展工程造价信息监测。各级造价管理机构要加强工程造价咨询服务监督，指导工程造价咨询企业对工程造价成果数据归集、监测，利用信息化手段逐步实现对工程造价的监测，形成监测大数据，为各方主体计价提供服务。（三）建立工程造价监测指数指标。各级工程造价管理机构要通过工程造价监测，形成国家、省、市工程造价监测指数指标，定期发布造价指标指数，引导建设市场主体对价格变化进行研判，为工程建设市场的预测预判等宏观决策提供支持。（四）规范计价软件市场管理。建立计价软件监督检查机制。各级造价管理机构要定期开展计价软件评估检查，加强计价依据和相关标准规范执行监管，鼓励计价软件编制企业加大技术投入和创新，更好地服务工程计价。中华人民共和国住房和城乡建设部2017年9月14日","phys_page":41,"print_page":29,"parent":null},{"id":"D006","section":"appendix","no":"","name":"关于印发《建筑工程安全防护、文明施工措施费用及使用管理规定》的通知（建办〔2005〕89号）","kind":"appendix_doc","content":"建办〔2005〕89号各省、自治区建设厅，直辖市建委，江苏省、山东省建管局，新疆生产建设兵团建设局：现将《建筑工程安全防护、文明施工措施费用及使用管理规定》印发给你们，请结合本地区实际，认真贯彻执行。贯彻执行中的有关问题和情况及时反馈建设部。中华人民共和国建设部二零零五年六月七日","phys_page":44,"print_page":32,"parent":null},{"id":"D007","section":"appendix","no":"","name":"附件1：建筑工程安全防护、文明施工措施费用及使用管理规定","kind":"appendix_attachment","content":"第一条 为加强建筑工程安全生产、文明施工管理，保障施工从业人员的作业条件和生活环境，防止施工安全事故发生，根据《中华人民共和国安全生产法》、《中华人民共和国建筑法》、《建设工程安全生产管理条例》、《安全生产许可证条例》等法律法规，制定本规定。第二条 本规定适用于各类新建、扩建、改建的房屋建筑工程（包括与其配套的线路管道和设备安装工程、装饰工程）、市政基础设施工程和拆除工程。第三条 本规定所称安全防护、文明施工措施费用，是指按照国家现行的建筑施工安全、施工现场环境与卫生标准和有关规定，购置和更新施工安全防护用具及设施、改善安全生产条件和作业环境所需要的费用。安全防护、文明施工措施项目清单详见附表。建设单位对建筑工程安全防护、文明施工措施有其他要求的，所发生费用一并计入安全防护、文明施工措施费。第四条 建筑工程安全防护、文明施工措施费用是由《建筑安装工程费用项目组成》（建标〔2003〕206号）中措施费所含的文明施工费，环境保护费，临时设施费，安全施工费组成。其中安全施工费由临边、洞口、交叉、高处作业安全防护费，危险性较大工程安全措施费及其他费用组成。危险性较大工程安全措施费及其他费用项目组成由各地建设行政主管部门结合本地区实际自行确定。第五条 建设单位、设计单位在编制工程概（预）算时，应当依据工程所在地工程造价管理机构测定的相应费率，合理确定工程安全防护、文明施工措施费。第六条 依法进行工程招投标的项目，招标方或具有资质的中介机构编制招标文件时，应当按照有关规定并结合工程实际单独列出安全防护、文明施工措施项目清单。投标方应当根据现行标准规范，结合工程特点、工期进度和作业环境要求，在施工组织设计文件中制定相应的安全防护、文明施工措施，并按照招标文件要求结合自身的施工技术水平、管理水平对工程安全防护、文明施工措施项目单独报价。投标方安全防护、文明施工措施的报价，不得低于依据工程所在地工程造价管理机构测定费率计算所需费用总额的90%。第七条 建设单位与施工单位应当在施工合同中明确安全防护、文明施工措施项目总费用，以及费用预付、支付计划，使用要求、调整方式等条款。建设单位与施工单位在施工合同中对安全防护、文明施工措施费用预付、支付计划未作约定或约定不明的，合同工期在一年以内的，建设单位预付安全防护、文明施工措施项目费用不得低于该费用总额的50%；合同工期在一年以上的（含一年），预付安全防护、文明施工措施费用不得低于该费用总额的30%，其余费用应当按照施工进度支付。实行工程总承包的，总承包单位依法将建筑工程分包给其他单位的，总承包单位与分包单位应当在分包合同中明确安全防护、文明施工措施费用由总承包单位统一管理。安全防护、文明施工措施由分包单位实施的，由分包单位提出专项安全防护措施及施工方案，经总承包单位批准后及时支付所需费用。第八条 建设单位申请领取建筑工程施工许可证时，应当将施工合同中约定的安全防护、文明施工措施费用支付计划作为保证工程安全的具体措施提交建设行政主管部门。未提交的，建设行政主管部门不予核发施工许可证。第九条 建设单位应当按照本规定及合同约定及时向施工单位支付安全防护、文明施工措施费，并督促施工企业落实安全防护、文明施工措施。第十条 工程监理单位应当对施工单位落实安全防护、文明施工措施情况进行现场监理。对施工单位已经落实的安全防护、文明施工措施，总监理工程师或者造价工程师应当及时审查并签认所发生的费用。监理单位发现施工单位未落实施工组织设计及专项施工方案中安全防护和文明施工措施的，有权责令其立即整改；对施工单位拒不整改或未按期限要求完成整改的，工程监理单位应当及时向建设单位和建设行政主管部门报告，必要时责令其暂停施工。第十一条 施工单位应当确保安全防护、文明施工措施费专款专用，在财务管理中单独列出安全防护、文明施工措施项目费用清单备查。施工单位安全生产管理机构和专职安全生产管理人员负责对建筑工程安全防护、文明施工措施的组织实施进行现场监督检查，并有权向建设主管部门反映情况。工程总承包单位对建筑工程安全防护、文明施工措施费用的使用负总责。总承包单位应当按照本规定及合同约定及时向分包单位支付安全防护、文明施工措施费用。总承包单位不按本规定和合同约定支付费用，造成分包单位不能及时落实安全防护措施导致发生事故的，由总承包单位负主要责任。第十二条 建设行政主管部门应当按照现行标准规范对施工现场安全防护、文明施工措施落实情况进行监督检查，并对建设单位支付及施工单位使用安全防护、文明施工措施费用情况进行监督。第十三条 建设单位未按本规定支付安全防护、文明施工措施费用的，由县级以上建设行政主管部门依据《建设工程安全生产管理条例》第五十四条规定，责令限期整改；逾期未改正的，责令该建设工程停止施工。第十四条 施工单位挪用安全防护、文明施工措施费用的，由县级以上建设主管部门依据《建设工程安全生产管理条例》第六十三条规定，责令限期整改，处挪用费用20%以上50%以下的罚款；造成损失的，依法承担赔偿责任。第十五条 建设行政主管部门的工作人员有下列行为之一的，由其所在单位或者上级主管机关给予行政处分；构成犯罪的，依照刑法有关规定追究刑事责任：（一）对没有提交安全防护、文明施工措施费用支付计划的工程颁发施工许可证的；（二）发现违法行为不予查处的；（三）不依法履行监督管理职责的其他行为。第十六条 建筑工程以外的工程项目安全防护、文明施工措施费用及使用管理可以参照本规定执行。第十七条 各地可依照本规定，结合本地区实际制定实施细则。第十八条 本规定由国务院建设行政主管部门负责解释。第十九条 本规定自2005年9月1日起施行。","phys_page":44,"print_page":34,"parent":"D006"},{"id":"D008","section":"appendix","no":"","name":"附件2：建设工程安全防护、文明施工措施项目清单","kind":"appendix_attachment","content":"注：本表所列建筑工程安全防护、文明施工措施项目，是依据现行法律法规及标准规范确定。如修订法律法规和标准规范，本表所列项目应按照修订后的法律法规和标准规范进行调整。","phys_page":48,"print_page":38,"parent":"D006"},{"id":"D009","section":"appendix","no":"","name":"关于停征排污费等行政事业性收费有关事项的通知（财税〔2018〕4号）","kind":"appendix_doc","content":"财税〔2018〕4号各省、自治区、直辖市、计划单列市财政厅（局）、发展改革委、物价局、环境保护厅（局）、海洋与渔业厅（局），新疆生产建设兵团财务局：为做好排污费改税政策衔接工作，根据《中华人民共和国环境保护税法》、《行政事业性收费项目审批管理暂行办法》（财综〔2004〕100号）、《关于印发〈政府非税收入管理办法〉的通知》（财税〔2016〕33号）等有关规定，现就停征排污费等行政事业性收费有关事项通知如下：一、自2018年1月1日起，在全国范围内统一停征排污费和海洋工程污水排污费。其中，排污费包括：污水排污费、废气排污费、固体废物及危险废物排污费、噪声超标排污费和挥发性有机物排污收费；海洋工程污水排污费包括：生产污水与机舱污水排污费、钻井泥浆与钻屑排污费、生活污水排污费和生活垃圾排污费。二、各执收部门要继续做好2018年1月1日前排污费和海洋工程污水排污费征收工作，抓紧开展相关清算、追缴，确保应收尽收。排污费和海洋工程污水排污费的清欠收入，按照财政部门规定的渠道全额上缴中央和地方国库。三、各执收部门要按规定到财政部门办理财政票据缴销手续。四、自停征排污费和海洋工程污水排污费之日起，《财政部国家发展改革委国家环境保护总局关于减免及缓缴排污费等有关问题的通知》（财综〔2003〕38号）、《财政部国家发展改革委环境保护部关于印发〈挥发性有机物排污收费试点办法〉的通知》（财税〔2015〕71号）、《财政部国家计委关于批准收取海洋工程污水排污费的复函》（财综〔2003〕2号）等有关文件同时废止。财政部国家发展改革委环境保护部国家海洋局2018年1月7日","phys_page":49,"print_page":37,"parent":null},{"id":"D010","section":"appendix","no":"","name":"关于全面推进生育保险和职工基本医疗保险合并实施的意见（国办发〔2019〕10号）","kind":"appendix_doc","content":"国办发〔2019〕10号各省、自治区、直辖市人民政府，国务院各部委、各直属机构：全面推进生育保险和职工基本医疗保险（以下统称两项保险）合并实施，是保障职工社会保险待遇、增强基金共济能力、提升经办服务水平的重要举措。根据《中华人民共和国社会保险法》有关规定，经国务院同意，现就两项保险合并实施提出以下意见。一、指导思想以习近平新时代中国特色社会主义思想为指导，全面贯彻党的十九大和十九届二中、三中全会精神，认真落实党中央、国务院决策部署，统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局，坚持以人民为中心，牢固树立新发展理念，遵循保留险种、保障待遇、统一管理、降低成本的总体思路，推进两项保险合并实施，实现参保同步登记、基金合并运行、征缴管理一致、监督管理统一、经办服务一体化。通过整合两项保险基金及管理资源，强化基金共济能力，提升管理综合效能，降低管理运行成本，建立适应我国经济发展水平、优化保险管理资源、实现两项保险长期稳定可持续发展的制度体系和运行机制。二、主要政策（一）统一参保登记。参加职工基本医疗保险的在职职工同步参加生育保险。实施过程中要完善参保范围，结合全民参保登记计划摸清底数，促进实现应保尽保。（二）统一基金征缴和管理。生育保险基金并入职工基本医疗保险基金，统一征缴，统筹层次一致。按照用人单位参加生育保险和职工基本医疗保险的缴费比例之和确定新的用人单位职工基本医疗保险费率，个人不缴纳生育保险费。同时，根据职工基本医疗保险基金支出情况和生育待遇的需求，按照收支平衡的原则，建立费率确定和调整机制。职工基本医疗保险基金严格执行社会保险基金财务制度，不再单列生育保险基金收入，在职工基本医疗保险统筹基金待遇支出中设置生育待遇支出项目。探索建立健全基金风险预警机制，坚持基金运行情况公开，加强内部控制，强化基金行政监督和社会监督，确保基金安全运行。（三）统一医疗服务管理。两项保险合并实施后实行统一定点医疗服务管理。医疗保险经办机构与定点医疗机构签订相关医疗服务协议时，要将生育医疗服务有关要求和指标增加到协议内容中，并充分利用协议管理，强化对生育医疗服务的监控。执行基本医疗保险、工伤保险、生育保险药品目录以及基本医疗保险诊疗项目和医疗服务设施范围。促进生育医疗服务行为规范。将生育医疗费用纳入医保支付方式改革范围，推动住院分娩等医疗费用按病种、产前检查按人头等方式付费。生育医疗费用原则上实行医疗保险经办机构与定点医疗机构直接结算。充分利用医保智能监控系统，强化监控和审核，控制生育医疗费用不合理增长。（四）统一经办和信息服务。两项保险合并实施后，要统一经办管理，规范经办流程。经办管理统一由基本医疗保险经办机构负责，经费列入同级财政预算。充分利用医疗保险信息系统平台，实行信息系统一体化运行。原有生育保险医疗费用结算平台可暂时保留，待条件成熟后并入医疗保险结算平台。完善统计信息系统，确保及时全面准确反映生育保险基金运行、待遇享受人员、待遇支付等方面情况。（五）确保职工生育期间的生育保险待遇不变。生育保险待遇包括《中华人民共和国社会保险法》规定的生育医疗费用和生育津贴，所需资金从职工基本医疗保险基金中支付。生育津贴支付期限按照《女职工劳动保护特别规定》等法律法规规定的产假期限执行。（六）确保制度可持续。各地要通过整合两项保险基金增强基金统筹共济能力；研判当前和今后人口形势对生育保险支出的影响，增强风险防范意识和制度保障能力；按照“尽力而为、量力而行”的原则，坚持从实际出发，从保障基本权益做起，合理引导预期；跟踪分析合并实施后基金运行情况和支出结构，完善生育保险监测指标；根据生育保险支出需求，建立费率动态调整机制，防范风险转嫁，实现制度可持续发展。三、保障措施（一）加强组织领导。两项保险合并实施是党中央、国务院作出的一项重要部署，也是推动建立更加公平更可持续社会保障制度的重要内容。各省（自治区、直辖市）要高度重视，加强领导，有序推进相关工作。国家医保局、财政部、国家卫生健康委要会同有关方面加强工作指导，及时研究解决工作中遇到的困难和问题，重要情况及时报告国务院。（二）精心组织实施。各地要高度重视两项保险合并实施工作，按照本意见要求，根据当地生育保险和职工基本医疗保险参保人群差异、基金支付能力、待遇保障水平等因素进行综合分析和研究，周密组织实施，确保参保人员相关待遇不降低、基金收支平衡，保证平稳过渡。各省（自治区、直辖市）要加强工作部署，督促指导各统筹地区加快落实，2019年底前实现两项保险合并实施。（三）加强政策宣传。各统筹地区要坚持正确的舆论导向，准确解读相关政策，大力宣传两项保险合并实施的重要意义，让社会公众充分了解合并实施不会影响参保人员享受相关待遇，且有利于提高基金共济能力、减轻用人单位事务性负担、提高管理效率，为推动两项保险合并实施创造良好的社会氛围。国务院办公厅2019年3月6日","phys_page":50,"print_page":38,"parent":null},{"id":"D011","section":"appendix","no":"","name":"关于印发《造价工程师职业资格制度规定》《造价工程师职业资格考试实施办法》的通知（建人〔2018〕67号）","kind":"appendix_doc","content":"建人〔2018〕67号各省、自治区、直辖市及新疆生产建设兵团住房城乡建设、交通运输、水利（水务）、人力资源社会保障厅（委、局），国务院有关专业部门建设工程造价管理机构，各有关单位：根据《国家职业资格目录》，为统一和规范造价工程师职业资格设置和管理，提高工程造价专业人员素质，提升建设工程造价管理水平，现将《造价工程师职业资格制度规定》《造价工程师职业资格考试实施办法》印发给你们，请遵照执行。住房城乡建设部交通运输部水利部人力资源社会保障部2018年7月20日","phys_page":52,"print_page":40,"parent":null},{"id":"D012","section":"appendix","no":"","name":"造价工程师职业资格制度规定","kind":"appendix_attachment","content":"第一章 总 则第一条 为提高固定资产投资效益，维护国家、社会和公共利益，充分发挥造价工程师在工程建设经济活动中合理确定和有效控制工程造价的作用，根据《中华人民共和国建筑法》和国家职业资格制度有关规定，制定本规定。第二条 本规定所称造价工程师，是指通过职业资格考试取得中华人民共和国造价工程师职业资格证书，并经注册后从事建设工程造价工作的专业技术人员。第三条 国家设置造价工程师准入类职业资格，纳入国家职业资格目录。工程造价咨询企业应配备造价工程师；工程建设活动中有关工程造价管理岗位按需要配备造价工程师。第四条 造价工程师分为一级造价工程师和二级造价工程师。一级造价工程师英文译为Class1CostEngineer，二级造价工程师英文译为Class2CostEngineer。第五条 住房城乡建设部、交通运输部、水利部、人力资源社会保障部共同制定造价工程师职业资格制度，并按照职责分工负责造价工程师职业资格制度的实施与监管。各省、自治区、直辖市住房城乡建设、交通运输、水利、人力资源社会保障行政主管部门，按照职责分工负责本行政区域内造价工程师职业资格制度的实施与监管。第二章 考 试第六条 一级造价工程师职业资格考试全国统一大纲、统一命题、统一组织。二级造价工程师职业资格考试全国统一大纲，各省、自治区、直辖市自主命题并组织实施。第七条 一级和二级造价工程师职业资格考试均设置基础科目和专业科目。第八条 住房城乡建设部组织拟定一级造价工程师和二级造价工程师职业资格考试基础科目的考试大纲，组织一级造价工程师基础科目命审题工作。住房城乡建设部、交通运输部、水利部按照职责分别负责拟定一级造价工程师和二级造价工程师职业资格考试专业科目的考试大纲，组织一级造价工程师专业科目命审题工作。第九条 人力资源社会保障部负责审定一级造价工程师和二级造价工程师职业资格考试科目和考试大纲，负责一级造价工程师职业资格考试考务工作，并会同住房城乡建设部、交通运输部、水利部对造价工程师职业资格考试工作进行指导、监督、检查。第十条 各省、自治区、直辖市住房城乡建设、交通运输、水利行政主管部门会同人力资源社会保障行政主管部门，按照全国统一的考试大纲和相关规定组织实施二级造价工程师职业资格考试。第十一条 人力资源社会保障部会同住房城乡建设部、交通运输部、水利部确定一级造价工程师职业资格考试合格标准。各省、自治区、直辖市人力资源社会保障行政主管部门会同住房城乡建设、交通运输、水利行政主管部门确定二级造价工程师职业资格考试合格标准。第十二条 凡遵守中华人民共和国法法、法律、法规，具有良好的业务素质和道和品行，具备下列条件之一者，可以申请参加一级造价工程师职业资格考试：（一）具有工程造价专业大学专科（或高等职业教育）学历，从事工程造价业务工作满5年；具有土木建筑、水利、装备制造、交通运输、电子信息、财经商贸大类大学专科（或高等职业教育）学历，从事工程造价业务工作满6年。（二）具有通过工程教育专业评估（认证）的工程管理、工程造价专业大学本科学历或学位，从事工程造价业务工作满4年；具有工学、管理学、经济学门类大学本科学历或学位，从事工程造价业务工作满5年。（三）具有工学、管理学、经济学门类是士学位或者第二学士学位，从事工程造价业务工作满3年。（四）具有工学、管理学、经济学门类博士学位，从事工程造价业务工作满1年。（五）具有其他专业相应学历或者学位的人员，从事工程造价业务工作年限相应增加1年。第十三条 凡遵守中华人民共和国法法、法律、法规，具有良好的业务素质和道和品行，具备下列条件之一者，可以申请参加二级造价工程师职业资格考试：（一）具有工程造价专业大学专科（或高等职业教育）学历，从事工程造价业务工作满2年；具有土木建筑、水利、装备制造、交通运输、电子信息、财经商贸大类大学专科（或高等职业教育）学历，从事工程造价业务工作满3年。（二）具有工程管理、工程造价专业大学本科及以上学历或学位，从事工程造价业务工作满1年；具有工学、管理学、经济学门类大学本科及以上学历或学位，从事工程造价业务工作满2年。（三）具有其他专业相应学历或学位的人员，从事工程造价业务工作年限相应增加1年。第十四条 一级造价工程师职业资格考试合格者，由各省、自治区、直辖市人力资源社会保障行政主管部门颁发中华人民共和国一级造价工程师职业资格证书。该证书由人力资源社会保障部统一印制，住房城乡建设部、交通运输部、水利部按专业类别分别与人力资源社会保障部用印，在全国范围内有效。第十五条 二级造价工程师职业资格考试合格者，由各省、自治区、直辖市人力资源社会保障行政主管部门颁发中华人民共和国二级造价工程师职业资格证书。该证书由各省、自治区、直辖市住房城乡建设、交通运输、水利行政主管部门按专业类别分别与人力资源社会保障行政主管部门用印，原则上在所在行政区域内有效。各地可根据实际情况制定跨区域认可办法。第十六条 各省、自治区、直辖市人力资源社会保障行政主管部门会同住房城乡建设、交通运输、水利行政主管部门应加强学历、从业经历等造价工程师职业资格考试资格条件的审核。对以不正当手段取得造价工程师职业资格证书的，按照国家专业技术人员资格考试有关规定进行处理。第三章 注 册第十七条 国家对造价工程师职业资格实行执业注册管理制度。取得造价工程师职业资格证书且从事工程造价相关工作的人员，经注册方可以造价工程师名义执业。第十八条 住房城乡建设部、交通运输部、水利部按照职责分工，制定相应注册造价工程师管理办法并监督执行。住房城乡建设部、交通运输部、水利部分别负责一级造价工程师注册及相关工作。各省、自治区、直辖市住房城乡建设、交通运输、水利行政主管部门按专业类别分别负责二级造价工程师注册及相关工作。第十九条 经批准注册的申请人，由住房城乡建设部、交通运输部、水利部核发《中华人民共和国一级造价工程师注册证》（或电子证书）；或由各省、自治区、直辖市住房城乡建设、交通运输、水利行政主管部门核发《中华人民共和国二级造价工程师注册证》（或电子证书）。第二十条 造价工程师执业时应持注册证书和执业印章。注册证书、执业印章样式以及注册证书编号规则由住房城乡建设部会同交通运输部、水利部统一制定。执业印章由注册造价工程师按照统一规定自行制作。第二十一条 住房城乡建设部、交通运输部、水利部按照职责分工建立造价工程师注册管理信息平台，保持通用数据标准统一。住房城乡建设部负责归集全国造价工程师注册信息，促进造价工程师注册、执业和信用信息互通共享。第二十二条 住房城乡建设部、交通运输部、水利部负责建立完善造价工程师的注册和退出机制，对以不正当手段取得注册证书等违法违规行为，依照注册管理的有关规定撤销其注册证书。第四章 执 业第二十三条 造价工程师在工作中，必须遵纪守法，守守职业道和和从业规范，诚信执业，主动接受有关主管部门的监督检查，加强行业自律。第二十四条 住房城乡建设部、交通运输部、水利部共同建立健全造价工程师执业诚信体系，制定相关规章制度或从业标准规范，并指导监督信用评价工作。第二十五条 造价工程师不得同时受聘于两个或两个以上单位执业，不得允许他人以本人名义执业，严禁“证书挂靠”。出租出借注册证书的，依据相关法律法规进行处罚；构成犯罪的，依法追究刑事责任。第二十六条 一级造价工程师的执业范围包括建设项目全过程的工程造价管理与咨询等，具体工作内容：（一）项目建议书、可行性研究投资估算与审核，项目评价造价分析；（二）建设工程设计概算、施工预算编制和审核；（三）建设工程招标投标文件工程量和造价的编制与审核；（四）建设工程合同价款、结算价款、竣工决算价款的编制与管理；（五）建设工程审计、仲裁、诉讼、保险中的造价鉴定，工程造价纠纷调解；（六）建设工程计价依据、造价指标的编制与管理；（七）与工程造价管理有关的其他事项。第二十七条 二级造价工程师主要协助一级造价工程师开展相关工作，可独立开展以下具体工作：（一）建设工程工料分析、计划、组织与成本管理，施工图预算、设计概算编制；（二）建设工程量清单、最高投标限价、投标报价编制；（三）建设工程合同价款、结算价款和竣工决算价款的编制。第二十八条 造价工程师应在本人工程造价咨询成果文件上签章，并承担相应责任。工程造价咨询成果文件应由一级造价工程师审核并加盖执业印章。对出具虚假工程造价咨询成果文件或者有重大工作过失的造价工程师，不再予以注册，造成损失的依法追究其责任。第二十九条 取得造价工程师注册证书的人员，应当按照国家专业技术人员继续教育的有关规定接受继续教育，更新专业知识，提高业务水平。第五章 附 则第三十条 本规定印发之前取得的全国建设工程造价员资格证书、公路水运工程造价人员资格证书以及水利工程造价工程师资格证书，效用不变。第三十一条 专业技术人员取得一级造价工程师、二级造价工程师职业资格，可认定其具备工程师、助理工程师职称，并可作为申报高一级职称的条件。第三十二条 本规定自印发之日起施行。原人事部、原建设部发布的《造价工程师执业资格制度暂行规定》（人发〔1996〕77号）同时废止。根据该暂行规定取得的造价工程师执业资格证书与本规定中一级造价工程师职业资格证书效用等同。","phys_page":52,"print_page":42,"parent":"D011"},{"id":"D013","section":"appendix","no":"","name":"造价工程师职业资格考试实施办法","kind":"appendix_attachment","content":"第一条 住房城乡建设部、交通运输部、水利部、人力资源社会保障部共同委托人力资源社会保障部人事考试中心承担一级造价工程师职业资格考试的具体考务工作。住房城乡建设部、交通运输部、水利部可分别委托具备相应能力的单位承担一级造价工程师职业资格考试工作的命题、审题和主观试题阅卷等具体工作。各省、自治区、直辖市住房城乡建设、交通运输、水利、人力资源社会保障行政主管部门共同负责本地区一级造价工程师职业资格考试组织工作，具体职责分工由各地协商确定。第二条 各省、自治区、直辖市住房城乡建设、交通运输、水利行政主管部门会同人力资源社会保障行政主管部门组织实施二级造价工程师职业资格考试。第三条 一级造价工程师职业资格考试设《建设工程造价管理》、《建设工程计价》、《建设工程技术与计量》、《建设工程造价案例分析》4个科目。其中，《建设工程造价管理》和《建设工程计价》为基础科目，《建设工程技术与计量》和《建设工程造价案例分析》为专业科目。二级造价工程师职业资格考试设《建设工程造价管理基础知识》、《建设工程计量与计价实务》2个科目。其中，《建设工程造价管理基础知识》为基础科目，《建设工程计量与计价实务》为专业科目。第四条 造价工程师职业资格考试专业科目分为土木建筑工程、交通运输工程、水利工程和安装工程4个专业类别，考生在报名时可根据实际工作需要选择其一。其中，土木建筑工程、安装工程专业由住房城乡建设部负责；交通运输工程专业由交通运输部负责；水利工程专业由水利部负责。第五条 一级造价工程师职业资格考试分4个半天进行。《建设工程造价管理》、《建设工程技术与计量》、《建设工程计价》科目的考试时间均为2.5小时；《建设工程造价案例分析》科目的考试时间为4小时。二级造价工程师职业资格考试分2个半天。《建设工程造价管理基础知识》科目的考试时间为2.5小时，《建设工程计量与计价实务》为3小时。第六条 一级造价工程师职业资格考试成绩实行4年为一个周期的滚动管理办法，在连续的4个考试年度内通过全部考试科目，方可取得一级造价工程师职业资格证书。二级造价工程师职业资格考试成绩实行2年为一个周期的滚动管理办法，参加全部2个科目考试的人员必须在连续的2个考试年度内通过全部科目，方可取得二级造价工程师职业资格证书。第七条 已取得造价工程师一种专业职业资格证书的人员，报名参加其他专业科目考试的，可免考基础科目。考试合格后，核发人力资源社会保障部门统一印制的相应专业考试合格证明。该证明作为注册时增加执业专业类别的依据。第八条 具有以下条件之一的，参加一级造价工程师考试可免考基础科目：（一）已取得公路工程造价人员资格证书（甲级）；（二）已取得水运工程造价工程师资格证书；（三）已取得水利工程造价工程师资格证书。申请免考部分科目的人员在报名时应提供相应材料。第九条 具有以下条件之一的，参加二级造价工程师考试可免考基础科目：（一）已取得全国建设工程造价员资格证书；（二）已取得公路工程造价人员资格证书（乙级）；（三）具有经专业教育评估（认证）的工程管理、工程造价专业学士学位的大学本科）业生。申请免考部分科目的人员在报名时应提供相应材料。第十条 符合造价工程师职业资格考试报名条件的报考人员，按规定携带相关证件和材料到指定地点进行报名资格审查。报名时，各地人力资源社会保障部门会同相关行业主管部门对报名人员的资格条件进行审核。审核合格后，核发准考证。参加考试人员凭准考证和有效证件在指定的日期、时间和地点参加考试。中央和国务院各部门及所属单位、中央管理企业的人员按属地原则报名参加考试。第十一条 考点原则上设在直辖市、自治区首府和省会城市的大、中专院校或者高考定点学校。一级造价工程师职业资格考试每年1次。二级造价工程师职业资格考试每年不少于1次，具体考试日期由各地确定。第十二条 坚持考试与培训分开的原则。凡参与考试工作（包括命题、审题与组织管理等）的人员，不得参加考试，也不得参加或者举办与考试内容相关的培训工作。应考人员参加培训坚持自愿原则。第十三条 考试实施机构及其工作人员，应当严格执行国家人事考试工作人员纪律规定和考试工作的各项规章制度，遵守考试工作纪律，切实做好从考试试题的命制到使用等各环节的安全保密工作，严防泄密。第十四条 对违反考试工作纪律和有关规定的人员，按照国家专业技术人员资格考试违纪违规行为处理规定处理。","phys_page":57,"print_page":47,"parent":"D011"},{"id":"D014","section":"appendix","no":"","name":"关于建筑业营业税改增值税调整新疆建设工程计价依据的实施意见（新建标〔2016〕2号）","kind":"appendix_doc","content":"新建标〔2016〕2号伊犁哈萨克自治州住房和城乡建设局，各地、州、市住房和城乡建设局（建委）、兵团建设局、自治区各委、办、厅、局，各有关单位：为适应国家税制改革要求，满足我区建筑业营业税改增值税（以下简称“营改增”）后建设工程计价需要，切实保障建筑业“营改增”顺利实施，根据财政部、国家税务总局《关于全面推开营业税改征增值税试点的通知》（财税〔2016〕36号）、住房和城乡建设部《关于做好建筑业“营改增”后计价依据调整准备工作的通知》（建办标〔2016〕4号）等文件规定，结合我区实际，按照“价税分离”的原则，对我区现行建设工程计价依据进行测算调整的基础上，制定本实施意见，请遵照执行。一、调整范围2016年5月1日起，执行2010年新疆维吾尔自治区建筑、装饰、安装及抗震加固工程计价依据、2012年新疆维吾尔自治区市政工程计价依据、2013年新疆维吾尔自治区城市轨道交通工程计价依据、2015年新疆维吾尔自治区园林工程计价依据、新疆维吾尔自治区房屋修缮工程计价依据的建设工程项目。二、工程造价构成及计算方法建筑业营改增后，工程造价由税前工程造价、增值税销项税额构成，按下列公式计算：工程造价=税前工程造价×（1+11%）。其中，11%为建筑业增值税税率，税前工程造价为人工费、材料费、施工机具使用费、企业管理费、利润和规费之和，各费用项目均以不包括增值税可抵扣进项税额的价格计算。三、实施时间（一）2016年5月1日后进行招投标的建设工程以及2016年4月30日前发布了招标文件但尚未开标的建设工程，招标文件及招标控制价编制均应按本实施意见规定执行。（二）《建筑工程施工许可证》注明的合同开工日期在2016年4月30日前的建筑工程项目；未取得《建筑工程施工许可证》，建筑工程承包合同注明的开工日期在2016年4月30日前的建筑工程项目，符合《关于全面推开营业税改征增值税试点的通知》（财税〔2016〕36号）等规定，可按原合同价或营改增前的计价依据执行。四、调整方法（一）人工单价人工单价的组成内容是工资，不含进项税额，不做调整。（二）材料价格材料价格的组成内容包括材料原价、运杂费、运输损耗费、采购及保管费等，其中材料原价、运杂费、采购保管费均按增值税下不含进项税额的价格或费用确定，定额中以“元”为单位的其他材料费、摊销材料费等按乘以系数0.89扣减进项税额。各专业定额基价中材料价格按上述方法扣除进项税额后，由住房和城乡建设厅工程造价管理总站发布乌鲁木齐地区除税材料预算价格（详见附件2），各地州、市建设行政主管部门发布本地区除税材料预算价格。（三）施工机械台班单价施工机械台班组成内容包括台班折旧费、大修理费、经常修理费、安拆费及场外运费、人工费、燃料动力费及其他费用等，其中台班折旧费、大修理费、经常修理费、燃料动力费等按增值税下不含进项税额的价格或费用确定。定额中以“元”为单位的其他机械费、零星机械费等按乘以系数0.91扣减进项税额。各专业定额基价中施工机械台班价格按上述方法扣除进项税额后，由住房和城乡建设厅工程造价管理总站发布乌鲁木齐地区施工机械台班除税预算价格（详见附件3），各地州、市建设行政主管部门发布本地区施工机械台班除税预算价格。（四）费用组成及标准。企业管理费、安全文明施工费等均按增值税下不含进项税额的价格或费用确定，企业管理费内容中增加城市建设维护税、教育费附加及地方教育费附加。税金是指国家税法规定应计入建筑安装工程造价内的增值税销项税额。因进项税额扣减的费率调整，按调整费率标准执行（详见附件1），其他执行现行各专业费用定额。（五）工程量清单编制时，其他项目清单中的材料暂估单价、工程设备暂估单价应为除税单价，专业工程暂估价应为不含进项税额的税前工程造价。（六）风险幅度的确定原则：风险幅度均以材料（设备）、施工机械台班等除税单价为依据计算。五、有关要求（一）建筑业“营改增”后，各地州、市建设行政主管部门工程造价管理机构应及时采集、测算、发布满足“营改增”计价需要的价格信息。（二）本《实施意见》中的计价调整方法适用于采用一般计税方法的建设工程。符合财税〔2016〕36号文件规定，采用简易计税方法的工程项目，可按原合同约定或“营改增”前计价依据执行，并执行财税部门的相关规定。（三）本《实施意见》自发布之日起施行，现行工程造价管理文件中，与本《实施意见》内容不一致的，以本《实施意见》为准。（四）全区各级住房和城乡建设行政主管部门及其工程造价管理机构要在全区建筑行业实施“营改增”后，加强对工程造价和企业税收变化情况的动态跟踪及服务工作，及时发现和解决出现的问题。各地、各部门在实施过程中遇到的问题和意见建议，请及时反馈自治区工程造价管理总站。本《实施意见》及附件电子版请登录新疆建设网（www.xjjs.gov.cn）或新疆工程造价信息网（www.xjzj.com）下载。联系人：唐亚丽；联系电话：0991－8862961；邮箱：573744204qq.com。新疆自治区住房和城乡建设厅2016年4月28日","phys_page":59,"print_page":47,"parent":null},{"id":"D015","section":"appendix","no":"","name":"《关于进一步加强自治区建设工程质量检测管理的通知》（新建质函〔2018〕5号）","kind":"appendix_doc","content":"新建质函〔2018〕5号伊犁哈萨克自治州住房和城乡建设局，各地、州、市住房和城乡建设局（建委），兵团建设局为进一步加强全区建设工程质量检测管理，规范工程质量检测市场秩序，提高工程质量检测水平，保障工程质量安全，依据《建设工程质量检测管理办法》（建设部令141号）等有关规定，现结合实际，提出以下工作要求请各地认真贯彻落实。各地要严格执行《建设工程质量检测管理办法》《住房城乡建设部财政部关于印发〈建筑安装工程费用项目组成〉的通知》（建标〔2013〕44号）和《建设项目投资估算编审规程》（CECA/GC1－2015）等规定要求，加强工程质量检测全过程监管管理。严肃查处工程质量检测业务违规委托行为，必须由建设单位委托具有相应资质的检测机进行检测并支付相应检测试验费用，建设单位以外的其他单位均无权委托检测机构进行检测，违规委托检测并出具检测报告的视为无效检测，一律不得作为工程质量验收的依据。督促指导检测机构认真落实《房屋建筑和市政基础设施工程质量检测技术管理规范》（GB50618－2011）等标准规范，加强机构自身建设，提高检测技术能力，进步规范检测行为。各地要认真总结分析本地工程质量检测市场情况，依法依规加强检测机构市场行为、检测人员从业行为监督检查，实施检测机构差别化动态监管，推动落实涉及工程质量检测活动的建设、施工、监理单位履职尽责。要加大施工现场质量检测报告检查频次和执法力度，严厉打击弄虚作假、伪造检测报告等违法违规行为，尤其要加强工程实体质量不合格检测报告结果报送的监管，严禁检测机构隐瞒不报发现的不合格情况和其他责任主体违法违规行为。三、各地要依托新疆工程建设云平台，加快录入检测机构和检测人员信息，在自治区建设工程质量检测机构信用行为登记平台及时准确上传检测机构相关信用行为记录，信息录入和相关信用行为记录将作为检测机构申请各项检测业务资质的重要审核标准。自治区开展工程质量检测机构执法检查，针对发现问题下达的整改通知书、执法建议书，各地要高度重视，指定专人负责，及时督促整改，涉嫌违法违规的按规定程序予以查处，并将书面材料及时报送我厅；凡未按要求整改或未依法依规查处的，我厅将暂停办理该地区检测机构各类资质业务，并对有关住房城乡建设部门进行问责和督办，并在全区范围内予以通报。各地在工作过程中，遇到的问题或有好的意见建议，请及时与自治区建设工程质量监督总站联系。联系人：张雨晗联系电话：0991－8868367（传真）电子邮箱：328727440@acom自治区住房和城乡建设厅2018年2月28日","phys_page":62,"print_page":50,"parent":null},{"id":"D016","section":"appendix","no":"","name":"关于应对新冠肺炎疫情影响做好我区建设工程计价有关工作的通知（新建标〔2020〕1号）","kind":"appendix_doc","content":"新建标〔2020〕1号伊犁哈萨克自治州住房和城乡建设局，各地、州、市住房和城乡建设局（建设局），各有关单位：根据自治区新冠肺炎疫情工作指挥部全面恢复正常生产生活秩序，全力以赴把疫情造成的损失补回来的部署要求，为进一步稳定我区建筑市场秩序，及时化解工程造价纠纷，维护建设各方合法权益。现结合我区实际，对新冠肺炎疫情影响下我区建设工程计价有关工作通知如下：一、工期调整发承包双方应按照《建设工程工程量清单计价规范》（GB50500－2013）中关于不可抗力的规定，妥善处理因疫情影响产生的工期延误问题，根据实际情况协商合理顺延工期。二、费用调整1.疫情防控期间，在建项目已施工或准备施工的，应严格按照工程所在地疫情防控有关规定，加强防护措施，保证人员安全，防止疫情传播，因此导致工程费用变化的，发承包双方应根据合同约定及有关规定，本着实事求是的原则协商解决，有关疫情防控费用、人工及材料价格变化等，可按以下原则另行签订补充协议。（1）因疫情防控增加的防疫物资费用（包括口罩、酒精、消毒水、手套、体温检测器、电动喷雾器等物品费用）、防护人员费用等，由发承包双方按实签证，在税前工程造价中单独计列。发包方应确保及时支付。（2）因疫情影响人工、材料等价格变化导致工程价款变化的，合同中有约定调整方法的，按照合同约定执行，合同中未约定调整方法的，发承包双方应本着客观公正、实事求是的原则，及时做好市场调查测算，合理确定调整办法。2.因疫情影响引起工期顺延，发包人要求赶工的项目，在确保工程质量和安全的前提下，发承包双方应提前约定赶工措施费计算原则和方法。相应的赶工费由发包人承担。3、因疫情影响停工的项目，应在落实停工期间质量安全保障措施的前提下，依据合同约定及法律法规关于不可抗力的相关规定，合理分担损失费用。三、发承包双方应在复工工程开工前，详细记录并确认复工前已完工程的详细形象进度（工程量）及复工日期，并经监理单位签字确认，共同做好相关技术资料和必要的影像资料等收集留存，减少工程结算纠纷。四、已发出招标文件但尚未开标的工程，招标人应充分考虑疫情对工程项目可能产生的影响，及时对招标文件修改、补遗、完善，明确工程价款确定、支付、调整等相关招标文件条款；已发出中标通知书但尚未签订合同的工程、签订合同但尚未实施的工程，应充分考虑疫情对工程造价的影响，签订补充协议。五、各地、州、市住房和建设主管部门要对照上述内容及时做好建设工程计价管理各项工作，同时加大疫情防控期间人工、材料价格的采集、测算和调整频率，及时发布建设工程价格信息，为合理确定和调整工程造价提供参考依据。执行中如遇问题，请及时反馈我厅。联系人：潘多娇；联系方式：0991－8863718；邮箱：461582396@qq.com。自治区住房和城乡建设厅2020年3月9日（公开方式：主动公开）","phys_page":64,"print_page":52,"parent":null}],"programs":[{"id":"P001","stage":"招投标阶段建筑、安装、市政工程费用计算程序","seq":"一","fee_name":"分部分项工程（工程费","formula":"∑分部分项工程数量×综合单价","phys_page":19,"print_page":9},{"id":"P002","stage":"招投标阶段建筑、安装、市政工程费用计算程序","seq":"","fee_name":"1.人工费","formula":"∑分部分项工程（人工费）","phys_page":19,"print_page":9},{"id":"P003","stage":"招投标阶段建筑、安装、市政工程费用计算程序","seq":"","fee_name":"2.材料费","formula":"∑分部分项工程（材料费）","phys_page":19,"print_page":9},{"id":"P004","stage":"招投标阶段建筑、安装、市政工程费用计算程序","seq":"","fee_name":"3.机械费","formula":"∑分部分项工程（机械费）","phys_page":19,"print_page":9},{" ":"appendix","phys_page":47,"print_page":37,"rows":[["类别","项目名称","","具体要求",""],["---","---","---","---","---"],["","安全警示标志牌","","在易发伤亡事故（或危险）处设置明显的、符合国家标准要求的安全警示标志牌",""],["","现场围挡","","（1）现场采用封闭围挡，高度不小于1.8m；（2）围挡材料可采用彩色、定型钢板，砖、砼砌块等墙体。",""],["","五板一图","","在进门处悬挂工程概况、管理人员名单及监督电话、安全生产、文明施工、消防保卫五板；施工现场总平面图。",""],["文","企业标志","","现场出入的大门应设有本企业标识或企业标识",""],["明施工与环境","场容场貌","","（1）道路畅通；（2）排水沟、排水设施通畅；（3）工地地面硬化处理；（4）绿化。",""],["保护","材料堆放","","（1）材料、构件、料具等堆放时，悬挂有名称、品种、规格等标牌；（2）水泥和其他易飞扬细颗粒建筑材料应密闭存放或采取覆盖等措施；（3）易燃、易爆和有毒有害物品分类存放。",""],["^保护","现场防火","","消防器材配置合理，符合消防要求。",""],["^^保护","垃圾清运","","施工现场应设置密闭式垃圾站，施工垃圾、生活垃圾应分类存放。施工垃圾必须采用相应容器或管道运输。",""],["","现场办公生活设施","","（1）施工现场办公、生活区与作业区分开设置，保持安全距离。（2）工地办公室、现场宿舍、食堂、厕所、饮水、休息场所符合卫生和安全要求。",""],["临时设施","","配电线路","（1）按照TN－S系统要求配备五芯电缆、四芯电缆和三芯电缆；（2）按要求架设临时用电线路的电杆、横担、瓷夹、瓷瓶等，或电缆埋地的地沟。（3）对靠近施工现场的外电线路，设置木质、塑料等绝缘体的防护设施。",""],["^临时设施","施工现场临时用电","配电箱开关箱","（1）按三级配电要求，配备总配电箱、分配电箱、开关箱三类标准电箱。开关箱应符合一机、一箱、一闸、一漏。三类电箱中的各类电器应是合格品；（2）按两级保护的要求，选取符合容量要求和质量合格的总配电箱和开关箱中的漏电保护器。",""],["^^临时设施","^施工现场临时用电","接地保护装置","施工现场保护零钱的重复接地应不少于三处。",""]]},{"id":"T014","caption":"","section":"appendix","phys_page":48,"print_page":38,"rows":[["类别","项目名称","","具体要求"],["---","---","---","---"],["","","楼板、屋面、阳台等临边防护","用密目式安全立网全封闭，作业层另加两边防护栏杆和18c高的踢脚板。"],["","","通道口防护","设防护棚，防护棚应为不小于5cm的木板或两道相距50c的的竹。两侧应沿栏杆架用密目式安全网封闭。"],["","","预留洞口防护","用木板全封闭；短边超过1.5m长的洞口，除封闭外四周还应设有防护栏杆。"],["安全施工","临边洞口交叉高处作业防护","电梯井口防护","设置定型化、工具化、标准化的防护门；在电梯井内每隔两层（不大于10m）设置一道安全平网。"],["^安全施工","^临边洞口交叉高处作业防护","楼梯边防护","设1.2m高的定型化、工具化、标准化的防护栏杆，18c高的踢脚板。"],["^^安全施工","^^临边洞口交叉高处作业防护","垂直方向交叉作业防护","设置防护隔离棚或其他设施。"],["^^^安全施工","^^^临边洞口交叉高处作业防护","高空作业防护","有悬挂安全带的悬索或其他设施；有操作平台；有上下的梯子或其他形式的通道"],["其他","","",""],["（由各地","","",""],["自定）","","",""],["^自定）","","",""]]}],"notes":[{"id":"N001","section":"ch01-sec3","no":"注","content":"1.本计算程序适用于单位工程的招标控制价和投标报价编制。 2.分部分项工程费、单价措施项目费所列“人工费、机械费”，编制招标控制价时取费基数为定额人工费、定额机械费。 3.对于区间费率，编制设计概算、招标控制价时应按上限计取；投标报价时，投标人应根据工程项目的复杂难易程度，结合自身情况自主报价，亦可参考区间费率自主确定。 4.编制招标控制价和投标报价时，可按规定选择增值税一般计税或简易计税，招标控制价与投标报价的计税方法应当一致。","phys_page":20,"print_page":10},{"id":"N002","section":"ch01-sec3","no":"注","content":"1.本计算程序适用于单位工程的竣工结算编制。 2.分部分项工程费、单价措施项目费所列“人工费、机械费”仅指竣工结算时依据已标价清单综合单价确定的用于取费基数部分的人工费、机械费。 3.分部分项工程费、单价措施项目费所列“工料机价差”是指竣工时按照合同约定计算的因价格波动所引起的人工费、材料费、机械费价差。 4.其他项目费的构成内容按照施工总承包工程计价要求设置，专业发包及未实行施工总承包的工程应根据实际情况做相应调整。 5.专业工程结算价仅按专业发包工程结算价列项计算，凡经过二次招标属于施工总承包人自行承包的专业工程结算时，将其直接列入总包工程的分部分项工程费、措施项目费及相关费用中。 6.计日工、甲供材料设备保管费、索赔与现场签证费仅限于施工总承包人自行发生部分内容的计算。专业发包工程分包人所发生的计日工、甲供材料设备保管费、索赔与现场签证费，应分别计入专业发包工程相应结算金额内。 7.编制竣工结算时，计税方法应与招标控制价、投标报价保持一致。","phys_page":22,"print_page":12},{"id":"N003","section":"ch02-sec1","no":"注","content":"1.依据《关于印发自治区智慧工地一体化服务平台推广使用工作方案（试行）的通知》（新建质函〔2021〕20号）中智慧工地基础配置要求，本费用包括人员实名制管理系统、塔式起重机监测管理系统、施工升降机监测管理系统、视频监控管理系统的设备购置费（摊销费）、安拆费、系统调试费等在内的各项费用，在招投标时，智慧工地基础配置费，按《智慧工地基础配置费用招投标暂控价表》中相应的暂控价计入，工程结算时，发承包双方应依据审定的实施方案及合同约定的结算方式进行结算。2.以上暂控价均为不含税价格。","phys_page":24,"print_page":14},{"id":"N004","section":"ch02-sec1-s2","no":"注","content":"1.夜间施工增加费按实际发生计取，不发生不计取。其计算方法：按实际参加夜间施工的人员（包括管理人员）人数，每人每夜20.70元计算（照明费及设施摊销费1.00元，降低工效费1.20元，夜餐补助费18.5元），夜间施工不足4h按半个工日计算，超过4h按一个工日计算。白天施工需要照明的地下室，无窗厂房、坑道、洞库、隧道等工程，亦视同夜间施工。其计算方法同夜间施工费，但应扣减夜餐补助费，每工日按2.20元计算。2.冬雨季施工费：不发生不计取，在编制施工招标文件时依据工程实际情况，结合市场编制费用清单。","phys_page":25,"print_page":15},{"id":"N005","section":"ch02-sec2","no":"注","content":"对于区间费率，编制设计概算、招标控制价时应按上限计取；投标人应根据工程项目的复杂难易程度，结合自身情况自主报价，亦可参考区间费率自主确定。","phys_page":27,"print_page":17},{"id":"N006","section":"ch02-sec3","no":"注","content":"对于区间费率，编制设计概算、招标控制价时应按上限计取；投标人应根据工程项目的复杂难易程度，结合自身情况自主报价，亦可参考区间费率自主确定。","phys_page":27,"print_page":17},{"id":"N007","section":"ch02-sec4","no":"注","content":"生育保险费并入医疗保险费中","phys_page":28,"print_page":18},{"id":"N008","section":"ch02-sec6","no":"注","content":"采用一般计税方法计税时，税前工程造价中的各费用项目均不含增值税进项税额；采用简易计税方法计税时，税前工程造价中的各费用项目均应包含增值税进项税额。","phys_page":29,"print_page":19}],"toc":[{"title":"总说明","level":1,"print_page":1,"phys_page":5,"matched_section":"front-总说明","actual_page":1,"ok":true},{"title":"术 语","level":1,"print_page":2,"phys_page":5,"matched_se <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 头部 ---------- */
$('#bk-title').textContent = D.book.title;
const ch = [];
ch.push(['卷键', D.book.volume_key]);
ch.push(['地区', D.book.region]);
ch.push(['年份', D.book.year + ' 版']);
ch.push(['页数', D.book.pages]);
ch.push(['正文偏移', '物−' + D.book.page_offset_body]);
ch.push(['前介质偏移', '物−' + D.book.page_offset_front]);
ch.push(['源指纹', D.inputs.source_sha12]);
ch.push(['字图指纹', D.inputs.charmap_sha12]);
ch.push(['结构', D.check.sections + ' 节 / ' + D.check.items + ' 条目 / ' +
  D.check.tables + ' 表 / ' + D.check.programs + ' 程序行']);
ch.push(['TOC 对账', D.check.toc_page_ok + '/' + D.check.toc_matched, 'ok']);
if (D.issues.length) ch.push(['疑点留痕', D.issues.length + ' 条', 'warn']);
$('#bk-chips').innerHTML = ch.map(c =>
  `<span class="chip${c[2]==='gray'?' gray':''}${c[2]==='warn'?' warn':''}">${esc(c[0])} ${esc(c[1])}</span>`).join('');

/* ---------- 树 ---------- */
const secById = {}; D.sections.forEach(s => secById[s.id] = s);
const itemsBySec = {};
D.items.forEach(it => { (itemsBySec[it.section] = itemsBySec[it.section] || []).push(it); });
const FRONT_ORDER = ['front-notice','front-总说明','front-术语'];
const CH_ORDER = ['ch01','ch01-sec1','ch01-sec2','ch01-sec3','ch02','ch02-sec1',
  'ch02-sec1-s2','ch02-sec2','ch02-sec3','ch02-sec4','ch02-sec5','ch02-sec6','ch03','appendix'];
const secOrder = [...FRONT_ORDER.filter(id=>secById[id]), ...CH_ORDER.filter(id=>secById[id]),
  ...D.sections.map(s=>s.id).filter(id=>!FRONT_ORDER.includes(id)&&!CH_ORDER.includes(id))];

const tree = $('#tree');
let html = '';
secOrder.forEach(sid => {
  const s = secById[sid];
  const grp = s.level === 0 ? '前介质' : s.id === 'appendix' ? '附录' :
    s.level === 1 ? '第' + s.no + '章' : s.level === 2 ? '第' + s.no + '节' : s.title;
  html += `<div class="grp">${esc(grp)}${s.print_page!=null?` <span style="font-family:var(--mono);font-weight:400">P${s.print_page}</span>`:''}</div>`;
  (itemsBySec[sid]||[]).forEach(it => {
    html += `<div class="it${it.parent?' sub':''}" data-id="${it.id}">` +
      `<span class="no">${esc(it.no||'')}</span><span>${esc(it.name.slice(0,26))}</span>` +
      `<span class="pg">${it.print_page!=null?'P'+it.print_page:''}</span></div>`;
  });
});
tree.innerHTML = html || '<div class="empty">无条目</div>';

/* ---------- 视图 ---------- */
const views = { 结构: renderTree, 表格: renderTables, 计算程序: renderPrograms,
  目录对账: renderToc, 疑点留痕: renderIssues, 说明: renderAbout };
let curView = '结构', curId = null;
const nav = $('#nav');
nav.innerHTML = Object.keys(views).map(k =>
  `<button data-v="${k}"${k===curView?' class="on"':''}>${k}</button>`).join('');
nav.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curView = b.dataset.v;
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  views[curView]();
});
tree.addEventListener('click', e => {
  const it = e.target.closest('.it'); if (!it) return;
  curId = it.dataset.id; curView = '结构';
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === '结构'));
  renderTree();
});

function itemCard(it) {
  const atts = D.items.filter(x => x.parent === it.id);
  let h = `<div class="card" id="it-${it.id}"><h2>${esc(it.name)}` +
    `<span class="kd ${it.kind==='term'?'term':it.kind==='appendix_doc'?'doc':it.kind==='appendix_attachment'?'att':'item'}">` +
    `${it.kind==='term'?'术语':it.kind==='appendix_doc'?'法规文件':it.kind==='appendix_attachment'?'附件':'条目'}</span></h2>` +
    `<div class="meta">${esc(it.id)} · 印页 P${it.print_page!=null?it.print_page:'—'} · 物理页 ${it.phys_page}` +
    (it.parent?` · 隶属 ${esc(it.parent)}`:'') + `</div>`;
  if (it.content) h += `<div class="content">${esc(it.content)}</div>`;
  atts.forEach(a => { h += `<div class="sec-h">${esc(a.name)}<span class="sub">附件 · 印页 P${a.print_page}</span></div>` +
    `<div class="content">${esc(a.content)}</div>`; });
  return h + '</div>';
}
function renderTree() {
  const pane = $('#pane');
  if (!curId) {
    const first = tree.querySelector('.it');
    if (first) curId = first.dataset.id; else { pane.innerHTML = '<div class="empty">无条目</div>'; return; }
  }
  const it = D.items.find(x => x.id === curId);
  pane.innerHTML = it ? itemCard(it) : '<div class="empty">条目不存在</div>';
  const el = pane.querySelector('.card');
  if (el) el.scrollIntoView({block:'nearest'});
  tree.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x.dataset.id === curId));
  const on = tree.querySelector('.it.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function tblHtml(t) {
  let h = `<div class="card"><h2>${esc(t.caption||'（无表题）')}` +
    `<span class="chip gray">${t.id}</span><span class="chip gray">印页 P${t.print_page}</span></h2><table class="tb"><tbody>`;
  t.rows.forEach(r => {
    h += '<tr>' + r.map(c => {
      if (c.startsWith('^')) return `<td class="merge">${esc(c.replace(/^\^+/,''))}</td>`;
      return `<td>${esc(c)}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}
function renderTables() {
  $('#pane').innerHTML = D.tables.map(tblHtml).join('') || '<div class="empty">无表格</div>';
}
function renderPrograms() {
  const byStage = {};
  D.programs.forEach(p => { (byStage[p.stage||'费用计算程序'] = byStage[p.stage||'费用计算程序'] || []).push(p); });
  let h = '';
  Object.entries(byStage).forEach(([st, ps]) => {
    h += `<div class="card"><h2>${esc(st)}<span class="chip gray">${ps.length} 行</span></h2>` +
      `<table class="tb"><thead><tr><th style="width:52px">序号</th><th>费用项目</th><th>计算方法（公式）</th><th style="width:64px">印页</th></tr></thead><tbody>`;
    ps.forEach(p => { h += `<tr><td>${esc(p.seq)}</td><td>${esc(p.fee_name)}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(p.formula)}</td><td>P${p.print_page}</td></tr>`; });
    h += '</tbody></table></div>';
  });
  $('#pane').innerHTML = h || '<div class="empty">无程序行</div>';
}
function renderToc() {
  let h = '<div class="card"><h2>目录条目与正文对账<span class="chip gray">门 6b 前置</span></h2>' +
    '<table class="tb"><thead><tr><th style="width:40px">#</th><th>层级</th><th>标题</th>' +
    '<th style="width:64px">目录页</th><th style="width:72px">正文页</th><th style="width:56px">吻合</th></tr></thead><tbody>';
  D.toc.forEach((e, i) => {
    h += `<tr><td>${i+1}</td><td>${e.level===1?'一级':'二级'}</td><td>${esc(e.title)}</td>` +
      `<td>P${e.print_page}</td><td>${e.matched_section?'P'+e.actual_page:'—'}</td>` +
      `<td class="${e.ok?'ok':'bad'}">${e.ok?'✓':'✗'}</td></tr>`;
  });
  h += '</tbody></table></div>';
  $('#pane').innerHTML = h;
}
function renderIssues() {
  let h = '';
  if (!D.issues.length) h = '<div class="empty">无疑点留痕</div>';
  D.issues.forEach(x => {
    h += `<div class="card"><h2><span class="chip warn">${esc(x.kind)}</span>${esc(x.match)}</h2>` +
      `<div class="meta">${esc(x.ctx)}</div><div class="content" style="font-size:13px;color:#6b3a00">${esc(x.note)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderAbout() {
  const c = D.check;
  $('#pane').innerHTML = `
  <div class="note">忠实层铁律：本页所有文本均来自原书 PDF 文本层（字形映射反解，覆盖率 100%）与 OCR 盒对齐；
  疑点一律留痕不臆补（见「疑点留痕」页）。勘误 overlay：官方勘误 ${D.erratas.length} 条按 errata_id 溯源落入工作层，erratas 表保留「原文值→勘误后值」双值。页码口径：前介质 P7-9 印=物−${D.book.page_offset_front}，正文 P11+ 印=物−${D.book.page_offset_body}（页眉实证零 mismatch）。</div>
  <div class="grid2">
    <div class="card"><h2>结构统计</h2><table class="tb"><tbody>
      <tr><th>目录条目</th><td>${c.toc_entries}（页吻合 ${c.toc_page_ok}/${c.toc_matched}）</td></tr>
      <tr><th>节</th><td>${c.sections}</td></tr>
      <tr><th>条目</th><td>${c.items}（术语 ${D.items.filter(i=>i.kind==='term').length} · 法规文件 ${D.items.filter(i=>i.kind==='appendix_doc').length} · 附件 ${D.items.filter(i=>i.kind==='appendix_attachment').length}）</td></tr>
      <tr><th>费率/程序表</th><td>${c.tables}</td></tr>
      <tr><th>计算程序行</th><td>${c.programs}</td></tr>
      <tr><th>注文</th><td>${c.notes}</td></tr>
      <tr><th>勘误 overlay</th><td>${D.erratas.length} 条（官方勘误已入 DB 工作层 · erratas 表双值留痕）</td></tr>
      <tr><th>文本层缺字</th><td>${c.text_miss_chars}</td></tr>
      <tr><th>页眉 mismatch</th><td>${Object.keys(c.hdr_mismatch||{}).length}</td></tr>
    </tbody></table></div>
    <div class="card"><h2>指纹</h2><table class="tb"><tbody>
      <tr><th>源 PDF</th><td style="font-family:var(--mono)">${esc(D.inputs.source_sha12)}</td></tr>
      <tr><th>字形映射</th><td style="font-family:var(--mono)">${esc(D.inputs.charmap_sha12)}</td></tr>
      <tr><th>schema</th><td>${esc(D.schema)}</td></tr>
      <tr><th>字形覆盖</th><td>${D.charmap_stats ? esc(D.charmap_stats.keys_resolved + '/' + D.charmap_stats.keys_total + ' 键（盒对齐 ' + (D.charmap_stats.box_align_rate*100).toFixed(1) + '%）') : '—'}</td></tr>
    </tbody></table></div>
  </div>`;
}
views[curView]();
</script>
