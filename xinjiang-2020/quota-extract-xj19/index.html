    (it.no?` · 编号 ${esc(it.no)}`:'') + `</div>`;
  if (it.content) h += `<div class="content">${esc(it.content)}</div>`;
  sem.forEach(s => {
    h += `<div class="sec-h">语义分析<span class="sub">${esc(s.sem_id)} · ${esc(s.topic)} · ${esc(s.effect_type)}</span></div>` +
      `<div class="note" style="background:#e6f4ef;border-color:#bfe3d1;color:#0f5132">${esc(s.content)}</div>` +
      `<div class="meta">涉及：${esc(s.linked_volume_title||'—')}${s.linked_chapter?' · '+esc(s.linked_chapter):''}` +
      (s.linked_codes.length?` · 子目 ${esc(s.linked_codes.join('、'))}`:'') + ` · 状态 ${esc(s.apply_status)}</div>`;
  });
  return h + '</div>';
}
function tblCard(t) {
  const sem = D.semantics.filter(s => s.item_id === t.id);
  let h = `<div class="card" id="it-${t.id}"><h2>${esc(t.caption||'（无表题）')}` +
    `<span class="chip gray">${t.id}</span><span class="chip gray">印页 P${t.print_page}</span>` +
    `<span class="chip gray">物页 ${t.phys_page}</span></h2>`;
  h += tblRowsHtml(t);
  sem.forEach(s => {
    h += `<div class="sec-h">语义分析<span class="sub">${esc(s.sem_id)} · ${esc(s.topic)} · ${esc(s.effect_type)}</span></div>` +
      `<div class="note" style="background:#e6f4ef;border-color:#bfe3d1;color:#0f5132">${esc(s.content)}</div>` +
      `<div class="meta">涉及：${esc(s.linked_volume_title||'—')}` +
      (s.linked_codes.length?` · 子目 ${esc(s.linked_codes.join('、'))}`:'') + ` · 状态 ${esc(s.apply_status)}</div>`;
  });
  return h + '</div>';
}
function renderTree() {
  const pane = $('#pane');
  if (!curId) {
    const first = tree.querySelector('.it');
    if (first) curId = first.dataset.id; else { pane.innerHTML = '<div class="empty">无条目</div>'; return; }
  }
  const it = D.items.find(x => x.id === curId);
  const tb = D.tables.find(x => x.id === curId);
  pane.innerHTML = it ? itemCard(it) : (tb ? tblCard(tb) : '<div class="empty">条目不存在</div>');
  tree.querySelectorAll('.it').forEach(x => x.classList.toggle('on', x.dataset.id === curId));
  const on = tree.querySelector('.it.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function renderTables() {
  $('#pane').innerHTML = D.tables.map(tblCard).join('') || '<div class="empty">无表格</div>';
}

    `<div class="meta">共 ${D.semantics.length} 条（3 问答 + 4 勘误表）：` +

  h += '<table class="tb"><thead><tr><th style="width:86px">sem_id</th><th>条目</th><th>主题</th>' +
    '<th>效力类型</th><th>涉及定额</th><th>子目</th><th style="width:76px">状态</th></tr></thead><tbody>';
  D.semantics.forEach(s => {
    const ref = s.item_id.startsWith('Q') ? '问答' : '勘误表';
    h += `<tr><td style="font-family:var(--mono);font-size:12px">${esc(s.sem_id)}</td>` +
      `<td>${ref} ${esc(s.item_id)}</td><td>${esc(s.topic)}</td><td>${esc(s.effect_type)}</td>` +
      `<td>${esc(s.linked_volume_title||'—')}</td>` +
      `<td style="font-family:var(--mono);font-size:12px">${esc(s.linked_codes.join('、')||'—')}</td>` +
      `<td class="${s.apply_status==='applied'?'ok':s.apply_status==='not_in_db'?'bad':''}">${esc(s.apply_status)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  D.semantics.forEach(s => {
    h += `<div class="card"><h2>${esc(s.topic)}<span class="chip gray">${esc(s.sem_id)}</span>` +
      `<span class="kd sem">${esc(s.effect_type)}</span></h2>` +
      `<div class="content">${esc(s.content)}</div>` +
      `<div class="meta">涉及：${esc(s.linked_volume_title||'—')}${s.linked_chapter?' · '+esc(s.linked_chapter):''}` +
      (s.linked_codes.length?` · 子目 ${esc(s.linked_codes.join('、'))}`:'') + ` · 状态 ${esc(s.apply_status)}</div></div>`;
  });
  $('#pane').innerHTML = h;
}
function renderNotes() {
  let h = '';
  if (!D.notes.length) h = '<div class="empty">无注文</div>';
  D.notes.forEach(n => {
    h += `<div class="card"><h2>${esc(n.no||'注')}<span class="chip gray">${esc(n.id)}</span></h2>` +
      `<div class="content">${esc(n.content)}</div></div>`;

}

    `（errata_id xj15-E38）；三（园林 1-253、2-47）目标 2015 版园林绿化定额暂未建卷，本表留档 not_in_db，建卷后按同一纪律应用。</div>`;

function renderToc() {

}
